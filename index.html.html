intenance", "Analysis, planning, design, implementation, maintenance", "Design, planning, analysis, implementation, maintenance "], "a": 0, "e": "", "s": false, "n": 1}, {"t": "mcq", "q": "In the ______ phase of the SDLC, system requirements are studied and structured.", "o": ["Planning", "Design", "Analysis", "Implementation "], "a": 2, "e": "", "s": false, "n": 2}, {"t": "mcq", "q": "Which of the following is NOT an approach to software reuse?", "o": ["Ad hoc reuse", "Managed reuse", "Analyzed reuse", "Designed reuse "], "a": 2, "e": "", "s": false, "n": 3}, {"t": "mcq", "q": "The part of the design phase in which the logical specifications are transformed into technology-specific details is ________.", "o": ["Logical design", "Physical design", "Analysis design", "Maintenance "], "a": 1, "e": "", "s": false, "n": 4}, {"t": "mcq", "q": "________ is the traditional methodology used to develop, maintain, and replace information systems.", "o": ["System development life cycle ", "Physical", "System development methodology", "Object-oriented analysis and design "], "a": 0, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "________ is the second phase of the SDLC, in which system requirements are studied and structured.", "o": ["Implementation", "Analysis", "Planning", "Design "], "a": 1, "e": "", "s": false, "n": 6}, {"t": "mcq", "q": "________ is the final phase of the SDLC, in which an information system is systematically repaired and improved.", "o": ["Maintenance", "Analysis", "Planning", "Design "], "a": 0, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "Who has the primary responsibility for the analysis and design of information systems?", "o": ["Maintenance team", "Systems analyst", "User", "Programmer "], "a": 1, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "________ is the part of the design phase in which the logical specifications are transformed into technology-specific details from which all programming and system construction can be accomplished.", "o": ["Physical design", "Logical design", "Analysis design", "Maintenance design "], "a": 0, "e": "", "s": false, "n": 9}, {"t": "mcq", "q": "________ represents the first step of the SDLC.", "o": ["Analysis", "Planning", "Maintenance", "Implementation "], "a": 1, "e": "", "s": false, "n": 10}, {"t": "mcq", "q": "In the logical design ________.", "o": ["Coding and testing are conducted.", "Technology-specific details are specified from which all programming and system construction can be accomplished.", "The requirements of the system are structured.", "All functional features of the system chosen for development in analysis are described independently of any computer platform. "], "a": 3, "e": "", "s": false, "n": 11}, {"t": "mcq", "q": "The description of the recommended solution is converted into logical and then physical system specifications in the ________ phase of the SDLC.", "o": ["Maintenance", "Analysis", "Planning", "Design "], "a": 3, "e": "", "s": false, "n": 12}, {"t": "mcq", "q": "In which methodology of systems development does one phase begin when another completes, with little backtracking and looping?", "o": ["Traditional Waterfall", "eXtreme Programming", "Planning "], "a": 0, "e": "", "s": false, "n": 13}, {"t": "mcq", "q": "When an organization needs a customized information system but does not have the required expertise, and no off-the-shelf system is available, it is better to request ________.", "o": ["IT services firms", "In-house developers", "Cloud computing", "Packaged software producers "], "a": 0, "e": "", "s": false, "n": 14}, {"t": "mcq", "q": "In the ________ phase of the SDLC, an organization's total information system needs are identified, analyzed, prioritized, and arranged.", "o": ["Implementation", "Planning", "Analysis", "Design "], "a": 1, "e": "", "s": false, "n": 15}, {"t": "mcq", "q": "The phase of the project management process in which activities are performed to assess the size, scope, and complexity of the project is called ________.", "o": ["Project planning", "Project executing ", "Project determination", "Project initiation "], "a": 3, "e": "", "s": false, "n": 16}, {"t": "mcq", "q": "When an organization needs to develop a special system and has its own infrastructure, sufficient system development expertise, and no budget constraints, it is better to use ________.", "o": ["Cloud computing", "In-house developers", "Packaged software producers", "IT services firms "], "a": 1, "e": "", "s": false, "n": 17}, {"t": "mcq", "q": "________ refers to the tasks the software can perform and the mandatory, essential, and desired system features.", "o": ["Functionality", "Reuse "], "a": 0, "e": "", "s": false, "n": 18}, {"t": "mcq", "q": "________ is the software reuse step that involves the design of a reusable piece of software, starting from existing software assets or from scratch.", "o": ["Designed reuse", "Storage", "Abstraction", "Facilitated reuse "], "a": 2, "e": "", "s": false, "n": 19}, {"t": "mcq", "q": "What is the practice of a company running a computer application for another organization?", "o": ["Outsourcing", "Information technology development", "In-house payroll system", "Reusing "], "a": 0, "e": "", "s": false, "n": 20}, {"t": "mcq", "q": "If an organization is using applications rented from a third-party vendor running in a remote location, which type of software system are they most likely using?", "o": ["Pre-packaged software", "Nearshoring", "Cloud computing "], "a": 2, "e": "", "s": false, "n": 21}, {"t": "mcq", "q": "Intuit's QuickBooks is an example of what type of software?", "o": ["Pre-packaged software", "Nearshoring ", "Cloud computing "], "a": 0, "e": "", "s": false, "n": 22}, {"t": "mcq", "q": "Which phase contains the determination of the requirements that the users want from a proposed system?", "o": ["Planning", "Implementation", "Analysis", "Maintenance "], "a": 2, "e": "", "s": false, "n": 23}, {"t": "mcq", "q": "________ is an agile method in which coding is conducted in teams of two people.", "o": ["Evolutionary model", "Scrum", "Rational Unified Process (RUP)", "eXtreme Programming "], "a": 3, "e": "", "s": false, "n": 24}, {"t": "mcq", "q": "When the task requires custom support and internal staff is not available, it is recommended to use ________.", "o": ["Open-source software", "Enterprise-wide solution", "IT services firms", "In-house developers "], "a": 2, "e": "", "s": false, "n": 25}, {"t": "mcq", "q": "Which of the following is a reason why a company may outsource certain operations?", "o": ["Keep the IT staff from being bored", "Decrease process efficiencies", "Increase time to market", "Outsource noncore activities "], "a": 3, "e": "", "s": false, "n": 26}, {"t": "mcq", "q": "A document provided to vendors that asks them to propose hardware and system software that will meet the requirements of a new system is called a ________.", "o": ["ERP", "Reuse", "Request for proposal "], "a": 2, "e": "", "s": false, "n": 27}, {"t": "mcq", "q": "Which of the following activities happens during the SDLC planning phase?", "o": ["System requirements are studied and structured.", "A presentation of why the system should or should not be developed by the organization is given. "], "a": 1, "e": "", "s": false, "n": 28}, {"t": "mcq", "q": "Which of the following is NOT a basic software reuse step?", "o": ["Recontextualization", "Storage", "Testing "], "a": 2, "e": "", "s": false, "n": 29}, {"t": "mcq", "q": "Which of the following is NOT a major category of sources of software?", "o": ["Packaged software", "Offshore", "Cloud computing vendors", "In-house developers "], "a": 1, "e": "", "s": false, "n": 30}, {"t": "mcq", "q": "________ is/are the process(es) that an analyst will follow to help ensure that his work is complete, well done, and understood by project team members.", "o": ["Result", "Role", "Techniques "], "a": 2, "e": "", "s": false, "n": 31}, {"t": "mcq", "q": "________ is the practice of turning over responsibility for some or all of an organization's information systems applications and operations to an outside firm.", "o": ["Time to market", "Outsourcing", "Reuse", "Nearshoring "], "a": 1, "e": "", "s": false, "n": 32}, {"t": "mcq", "q": "________ solutions integrate individual traditional business functions into a series of modules so that a single transaction occurs seamlessly within a single information system rather than several separate systems.", "o": ["Reuse", "ERP", "Request for proposal "], "a": 1, "e": "", "s": false, "n": 33}, {"t": "mcq", "q": "________ is designed to support organizational functions or processes.", "o": ["Systems analyst", "Information systems analysis and design", "Application software "], "a": 2, "e": "", "s": false, "n": 34}, {"t": "mcq", "q": "________ is the software reuse step that involves making software assets available for others to use.", "o": ["Storage", "Abstraction ", "Component-based development "], "a": 0, "e": "", "s": false, "n": 35}, {"t": "mcq", "q": "________ is/are off-the-shelf software systems that cannot be modified to meet the specific, individual needs of a particular organization.", "o": ["Reuse", "Turnkey systems", "Functionality "], "a": 1, "e": "", "s": false, "n": 36}, {"t": "mcq", "q": "________ is the software reuse step that involves making the reusable asset understandable to developers who want to use it in their systems.", "o": ["Storage", "Recontextualization", "Component reuse library", "Object class "], "a": 1, "e": "", "s": false, "n": 37}, {"t": "mcq", "q": "Because computers were so expensive, computer memory was also at a premium, so system developers conserved as much memory as possible for ________.", "o": ["Implementation", "Logical design", "Physical design", "Data storage "], "a": 3, "e": "", "s": false, "n": 38}, {"t": "mcq", "q": "Which of the following is a drawback of the traditional waterfall SDLC approach?", "o": ["Users are locked into requirements", "Physical design "], "a": 0, "e": "", "s": false, "n": 39}, {"t": "mcq", "q": "________ refers to the use of previously written software resources, especially objects and components, in new applications.", "o": ["Functionality", "Reuse "], "a": 1, "e": "", "s": false, "n": 40}, {"t": "mcq", "q": "Which of the following is a reason why an organization might get rid of its entire information processing unit?", "o": ["Because of political reasons", "To hire better IT staff", "Because management does not like the IT department", "Because the old system does not work anymore "], "a": 0, "e": "The textbook says an organization may outsource and dissolve its entire information processing unit for political reasons (e.g. to overcome operating problems in the IS unit). The earlier answer key (D) was wrong. Verified in the textbook (Valacich, Modern Systems Analysis and Design).", "s": false, "n": 41}, {"t": "mcq", "q": "Abstraction, storage, and recontextualization are three steps of ________.", "o": ["Cloud computing ", "In-house development", "Software reuse", "Packaged software "], "a": 2, "e": "", "s": false, "n": 42}, {"t": "mcq", "q": "Which of the following SDLC phases is the most expensive and time-consuming?", "o": ["Implementation", "Planning", "Design", "Analysis "], "a": 0, "e": "", "s": false, "n": 43}, {"t": "mcq", "q": "Documentation is the deliverable from the ________ phase.", "o": ["Planning", "Analysis", "Design", "Implementation "], "a": 3, "e": "", "s": false, "n": 44}, {"t": "mcq", "q": "________ is a cloud computing model in which a service provider offers an application via a cloud infrastructure.", "o": ["Software as a service (SaaS)", "Platform as a service (PaaS)", "Infrastructure as a service (IaaS)", "Work as a service (WaaS) "], "a": 0, "e": "", "s": false, "n": 45}, {"t": "mcq", "q": "The requirements structuring is part of which phase?", "o": ["Implementation", "Analysis", "Planning", "Design "], "a": 1, "e": "", "s": false, "n": 46}, {"t": "mcq", "q": "________ is a software implementation activity where the physical design specifications created by the analysis team are turned into working computer code by the programming team.", "o": ["Installation", "Training", "Coding "], "a": 2, "e": "", "s": false, "n": 47}, {"t": "open", "q": "What are the 5 phases of the SDLC?", "a": "Planning, Analysis, Design, Implementation, and Maintenance.", "s": false, "n": 48}, {"t": "open", "q": "What is the SDLC?", "a": "The traditional methodology used to develop, maintain, and replace information systems (systems development life cycle).", "s": false, "n": 49}, {"t": "open", "q": "What is a systems development methodology?", "a": "A standard process followed in an organization to conduct all the steps necessary to analyze, design, implement, and maintain information systems.", "s": false, "n": 50}, {"t": "open", "q": "Describe the Planning phase of the SDLC.", "a": "The first phase of the SDLC, in which an organization's total information system needs are identified, analyzed, prioritized, and arranged.", "s": false, "n": 51}, {"t": "open", "q": "Describe the Analysis phase of the SDLC.", "a": "The second phase of the SDLC, in which system requirements are studied and structured.", "s": false, "n": 52}, {"t": "open", "q": "Describe the Design phase of the SDLC.", "a": "The third phase of the SDLC, in which the description of the recommended solution is converted into logical and then physical system specifications.", "s": false, "n": 53}, {"t": "open", "q": "Describe the Implementation phase of the SDLC.", "a": "The fourth phase of the SDLC, in which the information system is coded, tested, installed, and supported in the organization.", "s": false, "n": 54}, {"t": "open", "q": "Describe the Maintenance phase of the SDLC.", "a": "The final phase of the SDLC, in which an information system is systematically repaired and improved.", "s": false, "n": 55}, {"t": "open", "q": "What is the logical design?", "a": "The part of the design phase in which all functional features of the system chosen for development in analysis are described independently of any computer platform.", "s": false, "n": 56}, {"t": "open", "q": "What is the physical design?", "a": "The part of the design phase in which the logical specifications of the system are transformed into technology-specific details from which all programming and system construction can be accomplished.", "s": false, "n": 57}, {"t": "open", "q": "What is the difference between logical and physical design?", "a": "Logical design describes the functional features of the system independently of any computer platform. Physical design transforms those logical specifications into technology-specific details (programming language, database system, hardware platform) from which programming and system construction can be done.", "s": false, "n": 58}, {"t": "open", "q": "Define information systems analysis and design.", "a": "The complex organizational process whereby computer-based information systems are developed and maintained.", "s": false, "n": 59}, {"t": "open", "q": "Define application software.", "a": "Computer software designed to support organizational functions or processes. It is an important (but not the only) result of systems analysis and design.", "s": false, "n": 60}, {"t": "open", "q": "Who can be designated as a systems analyst? What is the role of a systems analyst?", "a": "The systems analyst is the organizational role most responsible for the analysis and design of information systems. The primary role is to study the problems and needs of an organization in order to determine how people, methods, and information technology can best be combined to bring about improvements in the organization.", "s": false, "n": 61}, {"t": "open", "q": "What is a deliverable?", "a": "An end product of an SDLC phase.", "s": false, "n": 62}, {"t": "open", "q": "Name some of the criticisms of the traditional waterfall SDLC.", "a": "The focus on milestone deadlines, instead of on obtaining and interpreting feedback from the development process, leads to too little focus on good analysis and design. The focus on deadlines results in systems that do not match users' needs and that require extensive maintenance, unnecessarily increasing development costs. Finding and fixing a problem after delivery is often 100 times more expensive than fixing it during analysis and design.", "s": false, "n": 63}, {"t": "open", "q": "What are some of the problems with the traditional waterfall SDLC?", "a": "Once a milestone has been reached and the new phase started, it becomes difficult to go back. The enormous effort and time needed to implement a design means changes are very expensive once the system is developed.", "s": false, "n": 64}, {"t": "open", "q": "What are examples of agile methodologies?", "a": "eXtreme Programming and Scrum.", "s": false, "n": 65}, {"t": "open", "q": "What are the principles of agile methodologies?", "a": "(1) A focus on adaptive rather than predictive methodologies. (2) A focus on people rather than roles. (3) A focus on self-adaptive processes.", "s": false, "n": 66}, {"t": "open", "q": "When is it a good time to use agile methods?", "a": "If a project is high risk, highly complex, and has a development team of hundreds of people, more traditional methods apply. Less risky, smaller, and simpler development efforts lend themselves more to agile methods.", "s": false, "n": 67}, {"t": "open", "q": "What is eXtreme Programming?", "a": "An approach to software development put together by Beck and Andres, with short incremental development cycles, automated tests, two-person programming teams, and coding and testing operating together. All phases converge into coding, testing, listening, and designing.", "s": false, "n": 68}, {"t": "open", "q": "What is Scrum?", "a": "The most common framework for agile development. Work is broken down into sprints (typically two weeks to a month), with daily meetings. A Scrum team has three roles: product owner, development team, and Scrum master.", "s": false, "n": 69}, {"t": "open", "q": "What is the Rational Unified Process (RUP)?", "a": "An object-oriented systems development methodology. RUP establishes four phases of development: inception, elaboration, construction, and transition. Each phase is organized into a number of separate iterations.", "s": false, "n": 70}, {"t": "open", "q": "What is object-oriented analysis and design (OOAD)?", "a": "Systems development methodologies and techniques based on objects rather than data or processes.", "s": false, "n": 71}, {"t": "open", "q": "Define object, object class, and inheritance.", "a": "Object: a structure that encapsulates (packages) attributes and methods that operate on those attributes. Object class: a logical grouping of objects that have the same or similar attributes and behaviors. Inheritance: the property that occurs when object classes are arranged in a hierarchy and each class assumes the attributes and methods of its ancestors.", "s": false, "n": 72}, {"t": "open", "q": "What is the purpose of using CASE tools?", "a": "CASE (computer-aided software engineering) tools are software tools that provide automated support for some portion of the systems development process. They make developers' work easier and more consistent.", "s": false, "n": 73}, {"t": "open", "q": "What are code generators used for in CASE tools?", "a": "They enable automatic generation of program and database definition code directly from the design documents, diagrams, forms, and reports.", "s": false, "n": 74}, {"t": "open", "q": "What are computer display and report generators?", "a": "CASE tools that help prototype how systems look and feel. They make it easier for the analyst to identify data requirements and relationships.", "s": false, "n": 75}, {"t": "open", "q": "What are diagramming tools?", "a": "Tools that enable system process, data, and control structures to be represented graphically.", "s": false, "n": 76}, {"t": "open", "q": "What are documentation generators for?", "a": "They help produce technical and user documentation in standard formats.", "s": false, "n": 77}, {"t": "open", "q": "What do analysis tools do?", "a": "They automatically check for incomplete, inconsistent, or incorrect specifications in diagrams, forms, and reports.", "s": false, "n": 78}, {"t": "open", "q": "What is a central repository for?", "a": "It enables the integrated storage of specifications, diagrams, reports, and project management information. Part C", "s": false, "n": 79}, {"t": "open", "q": "What are the six sources of software?", "a": "IT services firms, packaged software producers, enterprise-wide solution (ERP) vendors, cloud computing, open-source software, and in-house development.", "s": false, "n": 80}, {"t": "open", "q": "In which scenario do you prefer in-house development and open-source software, respectively?", "a": "Open-source software: when the supported task is generic but cost is an issue. In- house developers: when resources and staff are available and the system must be built from scratch.", "s": false, "n": 81}, {"t": "open", "q": "What is outsourcing?", "a": "The practice of turning over responsibility for some or all of an organization's information systems applications and operations to an outside firm.", "s": false, "n": 82}, {"t": "open", "q": "Why choose outsourcing?", "a": "Freeing up internal resources, increasing the revenue potential of the organization, reducing time to market, increasing process efficiencies, and outsourcing noncore activities.", "s": false, "n": 83}, {"t": "open", "q": "What is a turnkey system?", "a": "An off-the-shelf software system that cannot be modified to meet the specific, individual needs of a particular organization.", "s": false, "n": 84}, {"t": "open", "q": "What is a request for proposal (RFP)?", "a": "A document provided to vendors that asks them to propose hardware and system software that will meet the requirements of a new system.", "s": false, "n": 85}, {"t": "open", "q": "What is cloud computing and why do we need it?", "a": "The provision of applications or related services over the Internet, where customers do not have to invest in the hardware and software resources needed to run and maintain them. It covers SaaS, PaaS, and IaaS.", "s": false, "n": 86}, {"t": "open", "q": "What is an ERP system?", "a": "A system that integrates individual traditional business functions into a series of modules so that a single transaction occurs seamlessly within a single information system rather than several separate systems.", "s": false, "n": 87}, {"t": "open", "q": "What is the idea behind Service Oriented Architecture (SOA)?", "a": "An approach to systems development based on building complete systems by assembling software components, each of which models a generic business function.", "s": false, "n": 88}, {"t": "open", "q": "How do you choose off-the-shelf software (what criteria are used)?", "a": "Cost, functionality, vendor support, viability of vendor, flexibility, documentation, response time, and ease of installation.", "s": false, "n": 89}, {"t": "open", "q": "How do you determine cost for off-the-shelf software?", "a": "Compare the cost of developing the same system in-house with the cost of purchasing or licensing the software package.", "s": false, "n": 90}, {"t": "open", "q": "How do you define functionality?", "a": "The tasks the software can perform and the mandatory, essential, and desired features.", "s": false, "n": 91}, {"t": "open", "q": "How do you define vendor support?", "a": "Whether and how much support the vendor can provide: help installing the software, training user and systems staff, and helping with problems after installation.", "s": false, "n": 92}, {"t": "open", "q": "What is vendor viability?", "a": "You do not want to get stuck with software from a vendor that might go out of business soon.", "s": false, "n": 93}, {"t": "open", "q": "What is flexibility?", "a": "How easy it is for you or the vendor to customize the software.", "s": false, "n": 94}, {"t": "open", "q": "What does documentation refer to for off-the-shelf software?", "a": "The user's manual and technical documentation: how understandable and up to date it is, and the cost of multiple copies.", "s": false, "n": 95}, {"t": "open", "q": "How do you define response time?", "a": "How long the software package takes to respond to a user's request in an interactive session, or how long it takes to complete running a job.", "s": false, "n": 96}, {"t": "open", "q": "What is ease of installation?", "a": "A measure of the difficulty of loading the software and making it operational.", "s": false, "n": 97}, {"t": "open", "q": "What is reuse?", "a": "The use of previously written software resources, especially objects and components, in new applications.", "s": false, "n": 98}, {"t": "open", "q": "What is the purpose of reusing software?", "a": "It increases programmer productivity (more work in the same time), decreases development time and schedule overruns because existing software is already tested, and results in higher-quality software with lower defect rates, decreasing maintenance costs.", "s": false, "n": 99}, {"t": "open", "q": "What are the three steps of software reuse?", "a": "Abstraction (design of a reusable piece of software), storage (making assets available and properly cataloged for others), and recontextualization (making the asset understandable to developers who want to use it).", "s": false, "n": 100}, {"t": "open", "q": "What are the four approaches to reuse? The source file listed these as multiple-choice questions but printed only the correct answer, so they are written here as open questions.", "a": "Ad hoc, facilitated, managed, and designed. Part D", "s": false, "n": 101}, {"t": "open", "q": "What is delivered after the completion of the implementation phase?", "a": "Code, documentation, training procedures, and support capabilities.", "s": false, "n": 102}, {"t": "open", "q": "Which element is NOT a part of the Evolutionary model of the SDLC process?", "a": "Procedure.", "s": false, "n": 103}, {"t": "open", "q": "What is one of the three key principles shared by the Agile methodologies?", "a": "A focus on self-adaptive processes (the three principles are: adaptive rather than predictive methodologies, people rather than roles, and self-adaptive processes).", "s": false, "n": 104}, {"t": "open", "q": "In the agile-vs-traditional comparison, what does the critical factor \"Dynamism\" refer to?", "a": "Simple design and continuous refactoring are excellent for highly dynamic environments but a source of potentially expensive rework for highly stable environments.", "s": false, "n": 105}, {"t": "open", "q": "In the agile-vs-traditional comparison, what is the critical factor \"Personnel\" related to?", "a": "It requires the continuous presence of a critical mass of scarce experts.", "s": false, "n": 106}, {"t": "mcq", "q": "Under eXtreme Programming, ________ and ________ are intimately related parts of the same process.", "o": ["Design; coding", "Coding; testing", "Planning; testing", "Analysis; design "], "a": 1, "e": "", "s": false, "n": 107}, {"t": "open", "q": "Which is the fourth phase in an SDLC cycle?", "a": "Implementation.", "s": false, "n": 108}, {"t": "open", "q": "What is delivered after the completion of the analysis phase?", "a": "A description of the current system and where problems and opportunities are, with a general recommendation on how to fix, enhance, or replace the current system.", "s": false, "n": 109}, {"t": "open", "q": "How does an organization rank criteria for choosing off-the-shelf software?", "a": "Their importance depends on the organization's requirements.", "s": false, "n": 110}, {"t": "open", "q": "What is the practice of US firms contracting with countries in Latin America called?", "a": "Nearshoring.", "s": false, "n": 111}, {"t": "open", "q": "What is the primary concern of IT managers as it relates to cloud computing?", "a": "Security.", "s": false, "n": 112}, {"t": "open", "q": "When considering off-the-shelf software, which choice is one of the most important criteria?", "a": "Vendor support.", "s": false, "n": 113}, {"t": "open", "q": "When resources and staff are available and the system must be built from scratch, which source should a company consider?", "a": "In-house developers.", "s": false, "n": 114}, {"t": "open", "q": "What is a function of an IT service firm?", "a": "Run applications for customers.", "s": false, "n": 115}, {"t": "open", "q": "What do you call an organization that hosts and runs computer applications for other companies, typically on a per-use or license basis?", "a": "A cloud computing application provider.", "s": false, "n": 116}, {"t": "open", "q": "Which step is NOT part of securing applications that an organization is migrating to the cloud?", "a": "Conducting a security background check of the cloud computing organization.", "s": false, "n": 117}, {"t": "open", "q": "Which issue should be addressed when considering reuse?", "a": "The analyst's ability in using objects.", "s": false, "n": 118}, {"t": "open", "q": "Which software evaluation criterion refers to the ease with which you or the vendor can customize the software?", "a": "Flexibility.", "s": false, "n": 119}, {"t": "open", "q": "Which solution enables a firm to integrate all parts of a business process into a unified information system?", "a": "Enterprise software solutions (ERP).", "s": false, "n": 120}, {"t": "open", "q": "Why is open-source software different from the other types of software?", "a": "The source code is free. Answer key – Part E (added from the main file) 122–131: 122-A · 123-D · 124-B · 125-D · 126-A · 127-B · 128-A · 129-A · 130-A · 131-B 132–141: 132-B · 133-B · 134-C · 135-A · 136-C · 137-B (False) · 138-A (True) · 139-A · 140-B · 141-B 142–151: 142-A · 143-C · 144-A · 145-B · 146-A · 147-B · 148-A · 149-A · 150-A · 151-B Questions 124 and 125 test the same idea (the SDLC is a structured approach to building information systems) in different words; both appeared in the final exam.", "s": false, "n": 121}, {"t": "mcq", "q": "________ were developed to make systems developers' work easier and more consistent.", "o": ["Computer-aided software engineering (CASE) tools", "Turnkey systems", "Request for proposal", "Application software "], "a": 0, "e": "", "s": false, "n": 122}, {"t": "mcq", "q": "In which phase of the SDLC is the information system coded, tested, installed, and supported in the organization?", "o": ["Planning", "Analysis", "Design", "Implementation "], "a": 3, "e": "", "s": false, "n": 123}, {"t": "mcq", "q": "The SDLC provides a framework for:", "o": ["Marketing software products", "Structuring the development of information systems", "Training end users", "Repairing hardware "], "a": 1, "e": "", "s": false, "n": 124}, {"t": "mcq", "q": "Which of the following best describes the purpose of the SDLC?", "o": ["To replace programmers", "To reduce hardware costs", "To eliminate the need for maintenance", "To offer a structured approach for building information systems "], "a": 3, "e": "", "s": false, "n": 125}, {"t": "mcq", "q": "Why is the implementation phase considered expensive?", "o": ["Due to the many people involved in the process", "Because requirements are costly to collect", "Because planning takes a long time ", "Because hardware is rare "], "a": 0, "e": "", "s": false, "n": 126}, {"t": "mcq", "q": "Which of the following best describes Extreme Programming?", "o": ["A sequential method with long, separate phases", "An agile method using short, incremental cycles, pair programming, and continuous testing", "A cloud service model", "A document-driven waterfall approach "], "a": 1, "e": "", "s": false, "n": 127}, {"t": "mcq", "q": "________ is a model that enables users to access applications and services over the Internet without needing to invest in the underlying hardware and software infrastructure.", "o": ["Cloud computing", "Local hosting", "On-premises solutions", "Virtual private network "], "a": 0, "e": "", "s": false, "n": 128}, {"t": "mcq", "q": "What is the main focus of systems analysis and design?", "o": ["Developing computer-based information systems", "Marketing software products", "Training IT personnel", "Enhancing the physical components of computers "], "a": 0, "e": "", "s": false, "n": 129}, {"t": "mcq", "q": "Systems analysis and design is concerned with:", "o": ["Developing and maintaining information systems", "Selling software", "Network security only", "Hardware repair "], "a": 0, "e": "", "s": false, "n": 130}, {"t": "mcq", "q": "Which approach focuses on systems development methodologies based on objects rather than data or processes?", "o": ["Traditional Waterfall Method", "Object-Oriented Analysis and Design", "Prototyping", "Structured Analysis "], "a": 1, "e": "", "s": false, "n": 131}, {"t": "mcq", "q": "The implementation phase includes:", "o": ["Budget planning", "Coding and testing ", "Requirement gathering", "Feasibility study "], "a": 1, "e": "", "s": false, "n": 132}, {"t": "mcq", "q": "The maintenance phase includes:", "o": ["Project approval", "Correcting errors and updating the system", "Writing the feasibility report", "Designing hardware "], "a": 1, "e": "", "s": false, "n": 133}, {"t": "mcq", "q": "Which of the following is NOT an activity of software implementation?", "o": ["Coding", "Testing", "Requirements gathering", "Installation "], "a": 2, "e": "", "s": false, "n": 134}, {"t": "mcq", "q": "Outsourcing refers to:", "o": ["Hiring an external firm to manage the system", "Cloud storage", "Using open-source software", "Internal development "], "a": 0, "e": "", "s": false, "n": 135}, {"t": "mcq", "q": "Open-source software is characterized by:", "o": ["Paid license only", "Hidden code", "Freely available source code", "No updates allowed "], "a": 2, "e": "", "s": false, "n": 136}, {"t": "mcq", "q": "Packaged software is selected when the organization has experts in software development.", "o": ["True", "False "], "a": 1, "e": "", "s": false, "n": 137}, {"t": "mcq", "q": "The systems development life cycle (SDLC) is the common methodology used to develop, maintain, and replace information systems.", "o": ["True", "False "], "a": 0, "e": "", "s": false, "n": 138}, {"t": "mcq", "q": "A family of development methodologies characterized by short iterative cycles, extensive testing, active user involvement, and small teams of talented, experienced programmers is called ________.", "o": ["Agile methodologies", "Rational Unified Process", "Traditional waterfall", "Prototyping "], "a": 0, "e": "", "s": false, "n": 139}, {"t": "mcq", "q": "The property that occurs when object classes are arranged in a hierarchy and each class assumes the attributes and methods of its ancestors is ________.", "o": ["Encapsulation", "Inheritance", "Abstraction", "Normalization "], "a": 1, "e": "", "s": false, "n": 140}, {"t": "mcq", "q": "A structure that encapsulates (packages) attributes and methods that operate on those attributes is called a(n) ________.", "o": ["Object class", "Object", "Component", "Entity "], "a": 1, "e": "", "s": false, "n": 141}, {"t": "mcq", "q": "A logical grouping of objects that have the same or similar attributes and behaviors is called a(n) ________.", "o": ["Object class", "Object", "Inheritance", "Method "], "a": 0, "e": "", "s": false, "n": 142}, {"t": "mcq", "q": "The object-oriented systems development methodology that establishes four phases (inception, elaboration, construction, and transition) is ________.", "o": ["Scrum", "eXtreme Programming", "Rational Unified Process (RUP)", "Traditional waterfall "], "a": 2, "e": "", "s": false, "n": 143}, {"t": "mcq", "q": "The most common framework for agile development, in which work is broken down into sprints with daily meetings, is ________.", "o": ["Scrum", "eXtreme Programming", "Rational Unified Process ", "Prototyping "], "a": 0, "e": "", "s": false, "n": 144}, {"t": "mcq", "q": "A standard process followed in an organization to conduct all the steps necessary to analyze, design, implement, and maintain information systems is a ________.", "o": ["System development life cycle", "Systems development methodology", "CASE tool", "Request for proposal "], "a": 1, "e": "", "s": false, "n": 145}, {"t": "mcq", "q": "Software that is freely available, including its source code, and is developed by a community of interested people is called ________.", "o": ["Open-source software", "Turnkey systems", "Packaged software", "ERP "], "a": 0, "e": "", "s": false, "n": 146}, {"t": "mcq", "q": "If sufficient expertise exists, some or all of the system can be developed by the organization's own staff. This is ________.", "o": ["Outsourcing", "In-house development", "Cloud computing", "Reuse "], "a": 1, "e": "", "s": false, "n": 147}, {"t": "mcq", "q": "Components that can be single objects or functional groupings of objects are the basis of ________.", "o": ["Component-based development", "Object-oriented development", "Software reuse", "Open-source software "], "a": 0, "e": "", "s": false, "n": 148}, {"t": "mcq", "q": "Which SDLC approach has each phase begin when the previous one completes, with little backtracking and looping?", "o": ["Traditional waterfall SDLC", "eXtreme Programming", "Scrum", "Rational Unified Process "], "a": 0, "e": "", "s": false, "n": 149}, {"t": "mcq", "q": "The provision of applications or related services over the Internet, where customers do not have to invest in the hardware and software needed to run and maintain them, is ________.", "o": ["Cloud computing", "Outsourcing", "Turnkey systems", "ERP "], "a": 0, "e": "", "s": false, "n": 150}, {"t": "mcq", "q": "The complex organizational process whereby computer-based information systems are developed and maintained is ________.", "o": ["System development life cycle", "Information systems analysis and design", "Systems development methodology", "CASE "], "a": 1, "e": "", "s": false, "n": 151}], "2": [{"t": "mcq", "q": "The amount of time that an activity can be delayed without delaying the project is known as ________.", "o": ["Slack time", "Critical path", "Estimated time", "Expected time "], "a": 0, "e": "", "s": false, "n": 1}, {"t": "mcq", "q": "________ is an important aspect of development. Its focus is to ensure that systems development projects meet customer expectations and are delivered within budget and time constraints.", "o": ["Project analyst", "Feasibility study", "Project charter", "Project management "], "a": 3, "e": "", "s": false, "n": 2}, {"t": "mcq", "q": "________ is a standard form for requesting or proposing systems development work within an organization.", "o": ["System Service Request", "System Request Development", "Date Development Document", "Standard System Document "], "a": 0, "e": "", "s": false, "n": 3}, {"t": "mcq", "q": "To calculate the expected time for the completion of a task, you can use PERT: ET = (o + 4r + p) / 6. If o = 2 and r = 5, p can be ________.", "o": ["7", "5", "3", "1 "], "a": 0, "e": "p must be at least as large as r (pessimistic ≥ realistic), so only 7 fits among the options (ET = (2+20+7)/6).", "s": false, "n": 4}, {"t": "mcq", "q": "The network diagram shows estimated times to complete each activity (Task A = 3 days, Task D = 3 days, Task E = 3 days on the top path; Task B = 2 days, Task C = 4 days on the bottom path; critical path = 9 days). Activities A, D and E are on the critical path. What is the slack time in activity D if activity A is completed in three days?", "o": ["9 days", "6 days", "Zero", "3 days "], "a": 2, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "Unlike Gantt charts, network diagrams ________.", "o": ["help calculate the economic feasibility", "do NOT show which tasks could be done in parallel", "show the sequence dependencies between tasks", "visually show the time overlap of tasks "], "a": 2, "e": "", "s": false, "n": 6}, {"t": "mcq", "q": "The first project planning activity is ________.", "o": ["Creation of the Gantt chart and network diagram", "Developing the project charter", "Describing project scope, alternatives, and feasibility", "Establishing the project management environment and project workbook "], "a": 2, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "Which one of the following represents one of the project execution activities?", "o": ["Developing the project charter", "Monitoring project progress against the Baseline Project Plan", "Estimating resources and creating a resource plan", "Conducting post-project reviews "], "a": 1, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "________ is a planned undertaking of related activities to reach an objective that has a beginning and an end.", "o": ["Project", "Conflict management", "Project management", "Project manager "], "a": 0, "e": "", "s": false, "n": 9}, {"t": "mcq", "q": "________ is a graphical representation of a project that shows each task as a horizontal bar.", "o": ["PERT", "Gantt chart ", "Network diagram", "Work breakdown structure "], "a": 1, "e": "", "s": false, "n": 10}, {"t": "mcq", "q": "________ is an end product of an SDLC phase.", "o": ["Deliverable", "Planning", "Project management", "Project manager "], "a": 0, "e": "", "s": false, "n": 11}, {"t": "mcq", "q": "In critical path scheduling, if an activity is on the critical path ________.", "o": ["It has slack time", "It has no effect on the total project completion time", "It consumes fewer resources", "Once it is delayed in completion, the entire project is delayed "], "a": 3, "e": "", "s": false, "n": 12}, {"t": "mcq", "q": "Which of the following is NOT related to the project initiation tasks and activities?", "o": ["Relationship with customers", "Develop communication plan", "Project workbook", "Initiation team "], "a": 1, "e": "", "s": false, "n": 13}, {"t": "mcq", "q": "The shortest time in which a project can be completed is called ________.", "o": ["PERT", "Critical path", "Slack time", "Work breakdown "], "a": 1, "e": "", "s": false, "n": 14}, {"t": "mcq", "q": "What determines the tasks and requirements within a project?", "o": ["Schedule", "Communication", "Risks", "Scope "], "a": 3, "e": "", "s": false, "n": 15}, {"t": "mcq", "q": "Projects can conclude with a natural or unnatural termination. This happens in ________.", "o": ["Executing the project", "Planning the project", "Closing the project "], "a": 2, "e": "", "s": false, "n": 16}, {"t": "mcq", "q": "In which phase do you describe project scope, alternatives, and feasibility?", "o": ["Planning phase", "Initiation phase", "Closedown", "Execution phase "], "a": 0, "e": "", "s": false, "n": 17}, {"t": "mcq", "q": "You use the information on tasks and resource availability to assign time estimates to each activity in the work breakdown structure. This is ________.", "o": ["Developing a preliminary schedule", "Determining project standards and procedures", "Developing a communication plan "], "a": 0, "e": "", "s": false, "n": 18}, {"t": "mcq", "q": "A scheduling technique whose order and duration of a sequence of task activities directly affects the completion date of a project.", "o": ["Slack time", "Critical path scheduling", "Critical path "], "a": 1, "e": "", "s": false, "n": 19}, {"t": "mcq", "q": "The goal of this activity is to identify sources of project risk and to estimate the consequences of those risks.", "o": ["Identifying and assessing risk", "Creating a preliminary budget", "Determining project standards and procedures "], "a": 0, "e": "", "s": false, "n": 20}, {"t": "mcq", "q": "A thorough understanding of your customer builds stronger partnerships and higher levels of trust.", "o": ["Establishing the project initiation team", "Establishing a relationship with the customer", "Establishing the project initiation plan "], "a": 1, "e": "", "s": false, "n": 21}, {"t": "mcq", "q": "Specify how various deliverables are produced and tested by you and your project team.", "o": ["Determining project standards and procedures", "Developing a preliminary schedule", "Developing a communication plan "], "a": 0, "e": "", "s": false, "n": 22}, {"t": "mcq", "q": "Dividing the project into manageable tasks and logically ordering them to ensure a smooth evolution between tasks.", "o": ["Work breakdown structure ", "Project scope", "Project workbook "], "a": 0, "e": "", "s": false, "n": 23}, {"t": "mcq", "q": "A systems analyst with a diverse set of skills: management, leadership, technical, conflict management, and customer relationship.", "o": ["System Service Request", "Deliverable", "Project manager "], "a": 2, "e": "", "s": false, "n": 24}, {"t": "mcq", "q": "The phase in which the plans created in the prior phases are put into action.", "o": ["Initiation phase", "Execution phase", "Closedown phase", "Planning phase "], "a": 1, "e": "", "s": false, "n": 25}, {"t": "mcq", "q": "________ involves organizing an initial core of project team members to assist in accomplishing the project initiation activities.", "o": ["Establishing management procedures", "Establishing a relationship with the customer", "Establishing the project initiation plan", "Establishing the project initiation team "], "a": 3, "e": "", "s": false, "n": 26}, {"t": "mcq", "q": "________ does not show time overlap but does show which tasks could be done in parallel.", "o": ["Network diagram", "Gantt charts "], "a": 0, "e": "", "s": false, "n": 27}, {"t": "mcq", "q": "________ show the duration of tasks.", "o": ["Network diagram", "Gantt charts "], "a": 1, "e": "", "s": false, "n": 28}, {"t": "mcq", "q": "The team must decide which tools to use, how the standard SDLC might be modified, which SDLC methods will be used.", "o": ["Developing a preliminary schedule", "Determining project standards and procedures", "Identifying and assessing risk "], " ollect and organize the tools that you will use while managing the project and to construct the project workbook.", "o": ["Establishing the project initiation plan", "Establishing the project management environment and project workbook", "Establishing a relationship with the customer "], "a": 1, "e": "", "s": false, "n": 47}, {"t": "mcq", "q": "Once all of the prior project planning activities have been completed, you will be able to develop a ________.", "o": ["Baseline Project Plan", "Project Scope Statement "], "a": 0, "e": "", "s": false, "n": 48}, {"t": "mcq", "q": "A project governed by a contractual agreement is typically not completed until agreed to by both parties, often in writing.", "o": ["Conducting post-project reviews", "Closing down the project", "Closing the customer contract "], "a": 2, "e": "", "s": false, "n": 49}, {"t": "mcq", "q": "To ensure that all contractual terms of the project have been met.", "o": ["Conducting post-project reviews", "Closing down the project", "Closing the customer contract "], "a": 2, "e": "", "s": false, "n": 50}, {"t": "mcq", "q": "Defining clear, discrete activities and the work needed to complete each activity within a single project.", "o": ["Project initiation", "Executing the project", "Closing the project", "Planning the project "], "a": 3, "e": "", "s": false, "n": 51}, {"t": "mcq", "q": "________ is a controlled process of initiating, planning, executing, and closing down a project.", "o": ["Project management", "Project scope ", "Work breakdown structure", "Critical path scheduling "], "a": 0, "e": "", "s": false, "n": 52}, {"t": "mcq", "q": "________ is the process of dividing the project into manageable tasks and logically ordering them to ensure a smooth evolution between tasks.", "o": ["Project charter", "Work breakdown structure", "Gantt chart", "Project workbook "], "a": 1, "e": "", "s": false, "n": 53}, {"t": "mcq", "q": "________ is the third phase of the project management process in which the plans created in the prior phases (project initiation and planning) are put into action.", "o": ["Project initiation", "Project planning", "Project execution", "Project closedown "], "a": 2, "e": "", "s": false, "n": 54}, {"t": "mcq", "q": "________ refers to the amount of time a task can be delayed without delaying the completion of the project.", "o": ["Critical path", "Expected time", "Total slack", "Lead time "], "a": 2, "e": "", "s": false, "n": 55}, {"t": "mcq", "q": "A ________ is a planned undertaking of a series of related activities to reach an objective that has a beginning and an end.", "o": ["Deliverable", "Feasibility study", "Process", "Project "], "a": 3, "e": "", "s": false, "n": 56}, {"t": "mcq", "q": "A ________, conducted by the project manager, involves determining if the information system makes sense for the organization from an economic and operational standpoint.", "o": ["System Service Request", "Project charter", "Post-project review", "Feasibility study "], "a": 3, "e": "", "s": false, "n": 57}, {"t": "mcq", "q": "A critical path refers to a sequence of task activities whose ________ and ________ directly affect the completion date of a project.", "o": ["Cost; quality", "Scope; budget", "Order; duration", "Priority; resources "], "a": 2, "e": "", "s": false, "n": 58}, {"t": "mcq", "q": "A Gantt chart is the graphical representation of a project that shows each task as a ________ bar whose length is proportional to its time for completion.", "o": ["Vertical", "Diagonal", "Circular", "Horizontal "], "a": 3, "e": "", "s": false, "n": 59}, {"t": "mcq", "q": "Defining tasks in too much detail will make the management of the project ________.", "o": ["Easier", "Unnecessarily complex", "More accurate", "Faster "], "a": 1, "e": "", "s": false, "n": 60}, {"t": "mcq", "q": "During ________, the project manager performs several activities to assess the size, scope, and complexity of the project and to establish procedures to support subsequent activities.", "o": ["Project planning", "Project initiation", "Project execution", "Project closedown "], "a": 1, "e": "", "s": false, "n": 61}, {"t": "mcq", "q": "Identifying, assessing, and managing the risks and day-to-day changes that occur during a project is attributed to ________.", "o": ["Customer relations", "Team management", "Risk and change management", "Conflict management "], "a": 2, "e": "", "s": false, "n": 62}, {"t": "mcq", "q": "Influencing the activities of others toward the attainment of a common goal through the use of intelligence, personality, and abilities refers to the ________ activity of a project manager.", "o": ["Leadership", "Management", "Conflict management", "Technical problem solving "], "a": 0, "e": "", "s": false, "n": 63}, {"t": "mcq", "q": "Nodes not on the critical path contain ________ time and allow the project manager some flexibility in scheduling.", "o": ["Critical", "Idle", "Lead", "Slack "], "a": 3, "e": "", "s": false, "n": 64}, {"t": "mcq", "q": "Resource estimates may need to be revised based upon the skills of the actual person (or people) assigned to a particular ________.", "o": ["Project", "Phase", "Activity", "Deliverable "], "a": 2, "e": "", "s": false, "n": 65}, {"t": "mcq", "q": "The ________ is a systems analyst with a diverse set of skills (management, leadership, technical, conflict management, and customer relationship) who is responsible for initiating, planning, executing, and closing down a project.", "o": ["Systems analyst", "Project sponsor", "Team lead", "Project manager "], "a": 3, "e": "", "s": false, "n": 66}, {"t": "mcq", "q": "The critical path represents the ________ time in which a project can be completed.", "o": ["Longest", "Average", "Shortest", "Expected "], "a": 2, "e": "", "s": false, "n": 67}, {"t": "mcq", "q": "Working closely with customers to ensure that project deliverables meet expectations is a ________ activity of a project manager.", "o": ["Leadership", "Customer relations", "Team management ", "Risk and change management "], "a": 1, "e": "", "s": false, "n": 68}, {"t": "mcq", "q": "Which of the project management process phases involves ensuring quality deliverables?", "o": ["Initiation", "Planning", "Closedown", "Execution "], "a": 3, "e": "", "s": false, "n": 69}, {"t": "mcq", "q": "A project charter is typically ________.", "o": ["A detailed technical design document", "A final test report", "A budget spreadsheet", "A short, high-level document describing project objectives and stakeholders "], "a": 3, "e": "", "s": false, "n": 70}, {"t": "open", "q": "The project charter will never include which of the following?", "a": "Project budget.", "s": false, "n": 71}, {"t": "open", "q": "What is the next step taken after project initiation?", "a": "Project planning.", "s": false, "n": 72}, {"t": "open", "q": "Which is the first activity in the project planning phase?", "a": "Describing project scope, alternatives, and feasibility.", "s": false, "n": 73}, {"t": "open", "q": "Which statement about the project workbook is FALSE?", "a": "The false statement is: \"It is not useful for project audits.\" (The workbook is used for project audits.)", "s": false, "n": 74}, {"t": "open", "q": "Which statement about the resource estimation activity is FALSE?", "a": "The false statement is: \"Resource estimates need not be revised based upon the skills of the actual person (or people) assigned to a particular activity.\" (They may need to be revised.)", "s": false, "n": 75}, {"t": "open", "q": "Which statement about the Gantt chart and the network diagram is FALSE?", "a": "The false statement is that a network diagram shows time overlap. Gantt charts visually show the time overlap of tasks; a network diagram does not show time overlap but does show which tasks could be done in parallel.", "s": false, "n": 76}, {"t": "open", "q": "Which is the first activity in the project execution phase?", "a": "Executing the Baseline Project Plan. Part E", "s": false, "n": 77}, {"t": "open", "q": "What are the four phases of the project management process?", "a": "Initiating the project, planning the project, executing the project, and closing down the project.", "s": false, "n": 78}, {"t": "open", "q": "What is project initiation?", "a": "The first phase of the project management process, in which activities are performed to assess the size, scope, and complexity of the project and to establish procedures to support later project activities.", "s": false, "n": 79}, {"t": "open", "q": "What does planning the project involve?", "a": "The second phase of the project management process, which focuses on defining clear, discrete activities and the work needed to complete each activity within a single project.", "s": false, "n": 80}, {"t": "open", "q": "Define executing the project.", "a": "The third phase of the project management process, in which the plans created in the prior phases are put into action.", "s": false, "n": 81}, {"t": "open", "q": "What does project execution put into action?", "a": "The Baseline Project Plan.", "s": false, "n": 82}, {"t": "open", "q": "What does closing down the project include?", "a": "Closing down the project, conducting post-project reviews, and closing the customer contract.", "s": false, "n": 83}, {"t": "open", "q": "What is the focus of project management?", "a": "To ensure that systems development projects meet customer expectations and are delivered within budget and time constraints.", "s": false, "n": 84}, {"t": "open", "q": "What is a project manager?", "a": "A systems analyst with a diverse set of skills (management, leadership, technical, conflict management, and customer relationship) who is responsible for initiating, planning, executing, and closing down a project.", "s": false, "n": 85}, {"t": "open", "q": "Who can be designated as a project manager?", "a": "In some organizations the project manager is a very experienced systems analyst, whereas in others both junior and senior analysts are expected to take on this role.", "s": false, "n": 86}, {"t": "open", "q": "What is a project workbook?", "a": "An online or hard-copy repository for all project correspondence, inputs, outputs, deliverables, procedures, and standards, used for project audits, orienting new team members, communicating with management and customers, identifying future projects, and performing post-project reviews.", "s": false, "n": 87}, {"t": "open", "q": "What is a work breakdown structure?", "a": "The process of dividing the project into manageable tasks and logically ordering them to ensure a smooth evolution between tasks.", "s": false, "n": 88}, {"t": "open", "q": "What is a Gantt chart?", "a": "A graphical representation of a project that shows each task as a horizontal bar whose length is proportional to its time for completion.", "s": false, "n": 89}, {"t": "open", "q": "What is a network diagram?", "a": "A diagram that depicts project tasks and their interrelationships.", "s": false, "n": 90}, {"t": "open", "q": "What is a distinguishing feature of a network diagram?", "a": "The ordering of tasks is shown by connecting tasks, depicted as rectangles or ovals, with their predecessor and successor tasks.", "s": false, "n": 91}, {"t": "open", "q": "What is PERT, and what is its formula?", "a": "Program Evaluation Review Technique: it uses optimistic (o), realistic (r), and pessimistic (p) time estimates to determine the expected task duration. ET = (o + 4r + p) /", "s": false, "n": 92}, {"t": "open", "q": "What is the critical path, and what is slack time?", "a": "Critical path: the shortest time in which a project can be completed. Slack time: the time an activity can be delayed without delaying the project.", "s": false, "n": 93}, {"t": "open", "q": "What is critical path scheduling?", "a": "A scheduling technique whose order and duration of a sequence of task activities directly affect the completion date of a project.", "s": false, "n": 94}, {"t": "open", "q": "What is a deliverable?", "a": "An end product of an SDLC phase.", "s": false, "n": 95}, {"t": "open", "q": "What is a System Service Request (SSR)?", "a": "A standard form for requesting or proposing systems development work within an organization.", "s": false, "n": 96}, {"t": "open", "q": "What is a feasibility study?", "a": "A study that determines whether a requested system makes economic and operational sense for an organization.", "s": false, "n": 97}, {"t": "open", "q": "What does a natural termination mean?", "a": "It occurs when the requirements of the project have been met: the project has been completed and is a success.", "s": false, "n": 98}, {"t": "open", "q": "Describe the project manager skills.", "a": "Leadership: communication; liaison between management, users and developers; assigning activities; monitoring progress. Management: defining and sequencing activities; communicating expectations; assigning resources to activities; monitoring outcomes. Conflict management: problem solving; smoothing out personality differences; compromising; goal setting. Customer relations: interpreting system requests and specifications; site preparation and user training; contact point for customers. Technical problem solving: interpreting system requests and specifications; defining activities and their sequence; making trade-offs between alternative solutions; designing solutions to problems. Risk and change management: environmental scanning; risk and opportunity identification and assessment; forecasting; resource redeployment. Team management: communication within and between teams; peer evaluations; conflict resolution; team building; self-management. Part F", "s": false, "n": 99}, {"t": "open", "q": "What is a critical path? Can a project have more than one critical path? Explain why.", "a": "A critical path is the shortest time in which a project can be completed: the sequence of tasks whose order and duration directly affect the completion date. Yes, a project can have more than one critical path, because of: Multiple dependencies between tasks. Separate sequences that run for the same duration. One critical path may not contain all the tasks necessary for project success. More than one critical path may be required to account for other teams and their projects.", "s": false, "n": 100}, {"t": "open", "q": "Gantt charts and network diagrams are techniques for depicting and documenting project plans. Describe the differences between them.", "a": "Gantt chart: horizontal bars represent task durations; shows task durations; shows the time overlap of tasks; shows slack time within an earliest start and latest finish duration. Network diagram: boxes and links represent task dependencies; shows task dependencies (sequence); does not show time overlap but shows which tasks can run in parallel; shows slack time as data within the activity rectangles or boxes. Answer key – Part G (added from the main file) 102–111: 102-A · 103-D · 104-D · 105-D · 106-D · 107-C · 108-D · 109-A (True) · 110-A (True) · 111-B (False) 112–120: 112-B · 113-C · 114-B · 115-C · 116-C · 117-B · 118-D · 119-A · 120-A Q111: the source marked this answer as uncertain. A project can have more than one critical path (see Q100), so the statement is false.", "s": false, "n": 101}, {"t": "mcq", "q": "What does a Gantt chart primarily represent?", "o": ["Duration of tasks as horizontal bars", "Project risks", "Task dependencies", "Resource allocation "], "a": 0, "e": "", "s": false, "n": 102}, {"t": "mcq", "q": "A network diagram is mainly used to show:", "o": ["Task durations", "Project costs", "Stakeholder communication", "Task dependencies and sequencing "], "a": 3, "e": "", "s": false, "n": 103}, {"t": "mcq", "q": "The formula for estimating task duration in PERT is:", "o": ["(o + 4p + r) / 6", "(r + p − o) / 6", "(o + r) / 6", "(o + 4r + p) / 6 "], "a": 3, "e": "", "s": false, "n": 104}, {"t": "mcq", "q": "Monitoring project progress occurs during:", "o": ["Initiation", "Closedown", "Planning", "Execution "], "a": 3, "e": "", "s": false, "n": 105}, {"t": "mcq", "q": "The Work Breakdown Structure (WBS) is used to:", "o": ["Test software", "Write code", "Calculate the budget", "Divide the project into manageable tasks "], "a": 3, "e": "", "s": false, "n": 106}, {"t": "mcq", "q": "Dividing the project into manageable tasks is known as:", "o": ["Resource planning", "Baseline scheduling", "Work breakdown structure", "Critical path analysis "], "a": 2, "e": "", "s": false, "n": 107}, {"t": "mcq", "q": "Which chart shows each task as a horizontal bar proportional to its completion time?", "o": ["Flowchart", "PERT chart", "Network diagram", "Gantt chart "], "a": 3, "e": "", "s": false, "n": 108}, {"t": "mcq", "q": "A Gantt chart is a graphical representation of a project that shows each task as a horizontal bar whose length is proportional to its time for completion.", "o": ["True ", "False "], "a": 0, "e": "", "s": false, "n": 109}, {"t": "mcq", "q": "A project manager should have the skills to manage conflict, risk, and change.", "o": ["True", "False "], "a": 0, "e": "", "s": false, "n": 110}, {"t": "mcq", "q": "A critical path is unique (a project can have only one critical path).", "o": ["True", "False "], "a": 1, "e": "", "s": false, "n": 111}, {"t": "mcq", "q": "The amount of time that an activity can be delayed without delaying the project is called ________.", "o": ["Critical path", "Slack time", "PERT", "Work breakdown structure "], "a": 1, "e": "", "s": false, "n": 112}, {"t": "mcq", "q": "The shortest time in which a project can be completed is the ________.", "o": ["Slack time", "Gantt chart", "Critical path", "Network diagram "], "a": 2, "e": "", "s": false, "n": 113}, {"t": "mcq", "q": "A scheduling technique whose order and duration of a sequence of task activities directly affect the completion date of a project is ________.", "o": ["Critical path", "Critical path scheduling", "Work breakdown structure", "PERT "], "a": 1, "e": "", "s": false, "n": 114}, {"t": "mcq", "q": "A technique that uses optimistic, pessimistic, and realistic time estimates to calculate the expected time for a task is ________.", "o": ["Gantt chart", "Network diagram", "PERT", "Critical path "], "a": 2, "e": "", "s": false, "n": 115}, {"t": "mcq", "q": "A diagram that depicts project tasks and their interrelationships is a ________.", "o": ["Gantt chart ", "Work breakdown structure", "Network diagram", "PERT "], "a": 2, "e": "", "s": false, "n": 116}, {"t": "mcq", "q": "Any person, group of people, equipment, or material used in accomplishing an activity is called ________.", "o": ["Deliverables", "Resources", "Tasks", "Risks "], "a": 1, "e": "", "s": false, "n": 117}, {"t": "mcq", "q": "The final phase of the project management process, which focuses on bringing a project to an end, is ________.", "o": ["Project initiation", "Project planning", "Project execution", "Project closedown "], "a": 3, "e": "", "s": false, "n": 118}, {"t": "mcq", "q": "A short document prepared for the customer during project initiation that describes what the project will deliver and outlines generally at a high level all work required is the ________.", "o": ["Project charter", "Business case", "Feasibility study", "System Service Request "], "a": 0, "e": "", "s": false, "n": 119}, {"t": "mcq", "q": "An online or hard-copy repository for all project correspondence, inputs, outputs, deliverables, procedures, and standards is the ________.", "o": ["Project workbook", "Work breakdown structure", "Project charter", "Gantt chart "], "a": 0, "e": "", "s": false, "n": 120}, {"t": "open", "q": "Define the project charter and explain its purpose in project management.", "a": "The project charter is a short (typically one page), high-level document prepared for the customer that describes what the project will deliver and outlines many of the key elements of the project. Its purpose is to formally authorize the project or a phase. It establishes a partnership between the performing organization and the customer, documenting the scope, objectives, and key participants. It acts as a reference throughout the project so all parties understand the high-level goals and constraints.", "s": false, "n": 121}, {"t": "open", "q": "Why is critical path scheduling important, and what is the relationship between the critical path and slack time?", "a": "Critical path scheduling is an important resource control technique. It determines the sequence and duration of task activities that directly affect the project's completion date. The critical path is the sequence of activities that represents the shortest time in which a project can be completed. Slack time is the amount of time an activity can be delayed without delaying the entire project. Activities on the critical path have no slack: any delay in them delays the entire project.", "s": false, "n": 122}, {"t": "open", "q": "There are many ways to divide a project into manageable tasks. Name two of them with a brief explanation for each.", "a": "(1) Work breakdown structure: the process of dividing the project into manageable tasks and logically ordering them to ensure a smooth evolution between tasks. (2) Gantt chart: a graphical representation of a project that shows each task as a horizontal bar whose length is proportional to its time for completion.", "s": false, "n": 123}, {"t": "open", "q": "What causes precedence relationships between project activities?", "a": "Task sequence depends on the tasks needed to produce a deliverable, and those deliverables are needed by other tasks.", "s": false, "n": 124}], "3": [{"t": "mcq", "q": "Which of the following is an approach of information system planning?", "o": ["Ad hoc reuse", "Managed reuse", "Top-down planning", "Designed reuse "], "a": 2, "e": "", "s": false, "n": 1}, {"t": "mcq", "q": "A set of statements that indicate an organization's goals for achieving a desirable future position.", "o": ["Vision statement", "Objectives statements", "Strategy statement", "Mission statement "], "a": 1, "e": "", "s": false, "n": 2}, {"t": "mcq", "q": "When a project reflects the broader needs of the organization, it is preferred to be identified by ________.", "o": ["Functional area", "Business units", "Development group", "Top management "], "a": 3, "e": "", "s": false, "n": 3}, {"t": "mcq", "q": "The matrix that shows which business functions use which data entities is called ________.", "o": ["Function-to-Process", "Unit-to-Function", "Location-to-Function", "Function-to-Data Entity "], "a": 3, "e": "", "s": false, "n": 4}, {"t": "mcq", "q": "The matrix that identifies which information systems are used to support each process is ________.", "o": ["Information System-to-Objective", "Process-to-Data Entity", "Process-to-Information System", "Data Entity-to-Information System "], "a": 2, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "________ is an evaluation criterion focusing on the added value of the products/services.", "o": ["Project size", "Technical difficulty", "Value chain analysis", "Resource availability "], "a": 2, "e": "", "s": false, "n": 6}, {"t": "mcq", "q": "A generic ISP methodology that identifies and defines IS development projects based upon solving operational business problems or taking advantage of business opportunities.", "o": ["Top-down planning", "Mission statement", "Objective statement", "Bottom-up planning "], "a": 3, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "________ is Internet-based communication to support day-to-day government, business, and consumer activities.", "o": ["Electronic commerce", "Internet of Things", "Incremental commitment", "Internet "], "a": 0, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "A series of matrices such as Location-to-Function and Function-to-Objective can be developed ________.", "o": ["To describe the current organizational situation", "To help create the Baseline Project Plan (BPP)", "To review the project after each phase", "To speed the system development "], "a": 0, "e": "", "s": false, "n": 9}, {"t": "mcq", "q": "The quality of the project identification and selection process can be improved if decisions are guided by ________.", "o": ["Corporate strategic planning and ISP", "Mission statement and ISP", "Mission statement", "System Service Request "], "a": 0, "e": "", "s": false, "n": 10}, {"t": "mcq", "q": "Which of the following is considered the earliest step of the IS planning process?", "o": ["Schedule of projects", "Create objectives", "Create planning matrix", "Human resource blueprints "], "a": 2, "e": "", "s": false, "n": 11}, {"t": "mcq", "q": "________ is a statement that makes it clear what business a company is in.", "o": ["Competitive strategy", "Strategic plan", "Mission statement", "Objective statement "], "a": 2, "e": "", "s": false, "n": 12}, {"t": "mcq", "q": "What is NOT a corporate strategic planning component?", "o": ["Strategic plan", "Future enterprise", "Past enterprise", "Current enterprise "], "a": 2, "e": "", "s": false, "n": 13}, {"t": "mcq", "q": "The primary deliverable from the first part of the planning phase is a schedule of specific IS development projects, coming from both top-down and bottom-up sources.", "o": ["Incremental commitment", "Deliverables and outcomes", "Multicriteria analysis "], "a": 1, "e": "Verified in the textbook (Valacich, Modern Systems Analysis and Design).", "s": false, "n": 14}, {"t": "mcq", "q": "The term ________ is used when a project is reviewed after each stage to determine its continuation.", "o": ["Project continuance", "Project re-planning", "Incremental commitment", "Reevaluation "], "a": 2, "e": "", "s": false, "n": 15}, {"t": "mcq", "q": "One method for deciding among different projects, or when considering alternative designs for a given system.", "o": ["Multicriteria analysis ", "Deliverables and outcomes", "Incremental commitment "], "a": 0, "e": "", "s": false, "n": 16}, {"t": "mcq", "q": "_ h functions are essential or desirable in achieving each organizational objective.", "o": ["Function-to-Objective", "Unit-to-Function", "Location-to-Unit", "Location-to-Function "], "a": 0, "e": "", "s": false, "n": 24}, {"t": "mcq", "q": "________ focuses on assessing the relative merit of potential projects.", "o": ["Classifying and ranking IS development projects", "Selecting IS development projects", "Identifying potential development projects "], "a": 0, "e": "", "s": false, "n": 25}, {"t": "mcq", "q": "________ is often out of control, and users may have little confidence in the quality of data.", "o": ["Data redundancy", "Application backlogs", "Systems maintenance "], "a": 0, "e": "", "s": false, "n": 26}, {"t": "mcq", "q": "________ matrix identifies which business functions are being performed at various organizational locations.", "o": ["Function-to-Objective", "Function-to-Process", "Location-to-Unit", "Location-to-Function "], "a": 3, "e": "", "s": false, "n": 27}, {"t": "mcq", "q": "________ identifies the relationships between organizational entities and each business function.", "o": ["Function-to-Objective", "Unit-to-Function", "Location-to-Unit", "Location-to-Function "], "a": 1, "e": "", "s": false, "n": 28}, {"t": "mcq", "q": "________ identifies which organizational units are located in or interact with a specific business location.", "o": ["Unit-to-Function", "Location-to-Unit", "Location-to-Function", "Function-to-Objective "], "a": 1, "e": "", "s": false, "n": 29}, {"t": "mcq", "q": "An ongoing process that defines the mission, objectives, and strategies of an organization.", "o": ["Systems maintenance", "Corporate strategic planning", "Data redundancy "], "a": 1, "e": "", "s": false, "n": 30}, {"t": "mcq", "q": "________ identifies which information systems support each business objective as identified during organizational planning.", "o": ["Data Entity-to-Information System", "Information System-to-Objective", "Process-to-Data Entity "], "a": 1, "e": "", "s": false, "n": 31}, {"t": "mcq", "q": "________ costs are out of control as old, poorly planned systems must constantly be revised.", "o": ["Systems maintenance", "Application backlogs", "Data redundancy "], "a": 0, "e": "", "s": false, "n": 32}, {"t": "mcq", "q": "________ often extend three years or more, and frustrated end users are forced to create their own systems.", "o": ["Application backlogs", "Systems maintenance", "Data redundancy "], "a": 0, "e": "", "s": false, "n": 33}, {"t": "mcq", "q": "During project identification and selection, ________ identifies and assesses all possible systems development projects that an organization unit could undertake.", "o": ["Senior manager", "Planner", "Project manager "], "a": 0, "e": "", "s": false, "n": 34}, {"t": "mcq", "q": "Using value chain analysis or other evaluation criteria.", "o": ["Selecting IS development projects ", "Identifying potential development projects", "Classifying and ranking IS development projects "], "a": 2, "e": "", "s": false, "n": 35}, {"t": "mcq", "q": "If a project has a small or narrow focus, it most likely was chosen by ________.", "o": ["The IS department", "Top management", "A business unit", "A steering committee "], "a": 2, "e": "", "s": false, "n": 36}, {"t": "mcq", "q": "The method by which an organization attempts to achieve its mission and objectives.", "o": ["Competitive strategy", "Mission statement", "Objective statements "], "a": 0, "e": "", "s": false, "n": 37}, {"t": "mcq", "q": "Project identification by the ________ is a bottom-up initiative.", "o": ["Steering committee", "Top manager", "Organization owner", "Development group "], "a": 3, "e": "", "s": false, "n": 38}, {"t": "mcq", "q": "In the system development life cycle, the planning phase consists of ________.", "o": ["Project identification and selection, and requirements structuring", "Project identification and selection, and project initiation and planning", "Requirements determination, and re ", "Project Scope Statement", "Break-even analysis", "Baseline Project Plan "], "a": 3, "e": "", "s": false, "n": 2}, {"t": "mcq", "q": "The process of evaluating how key stakeholders within the organization view the proposed system is:", "o": ["Legal and contractual feasibility", "Political feasibility", "Economic feasibility", "Schedule feasibility "], "a": 1, "e": "", "s": false, "n": 3}, {"t": "mcq", "q": "A document prepared for the customer that describes what the project will deliver and outlines generally at a high level all work required to complete the project is the:", "o": ["Business case", "Break-even analysis", "Baseline Project Plan", "Project Scope Statement "], "a": 3, "e": "", "s": false, "n": 4}, {"t": "mcq", "q": "The Baseline Project Plan is a major outcome and deliverable from:", "o": ["Implementation phase", "Project execution", "The project initiation and planning phase", "Analysis phase "], "a": 2, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "The total cost of ownership is:", "o": ["The cost associated with project start-up", "The cost of owning and operating the system excluding maintenance cost", "The cost of owning and operating the system including maintenance cost", "The total cost of acquisition only "], "a": 2, "e": "", "s": false, "n": 6}, {"t": "mcq", "q": "Which of the following is NOT related to the project initiation tasks and activities?", "o": ["Relationship with customers", "Develop communication plan", "Project workbook", "Initiation team "], "a": 1, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "\"If you own $1000 today it will not be worth the same in five years' time.\" Which of the following terms represents this statement?", "o": ["Break-even analysis", "Return on investment", "One-time cost", "Net present value "], "a": 3, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "Cost reduction and avoidance is one of the ______ categories.", "o": ["Intangible cost", "Tangible benefit", "Tangible cost", "Intangible benefit }, {"t": "mcq", "q": "Technical feasibility is the process of assessing the organization's ability to:", "o": ["Comply with laws and contracts ", "Reduce all costs to zero", "Gain political support from stakeholders", "Construct the proposed system "], "a": 3, "e": "", "s": false, "n": 47}, {"t": "mcq", "q": "Which pairing is correct?", "o": ["One-time costs = only software; Recurring costs = only hardware", "One-time costs = only intangible costs; Recurring costs = only tangible costs", "One-time costs = ongoing evolution and use; Recurring costs = start-up only", "One-time costs = start-up development; Recurring costs = ongoing use/evolution "], "a": 3, "e": "", "s": false, "n": 48}, {"t": "mcq", "q": "Which of the following is a project initiation task?", "o": ["Develop preliminary schedule", "Create preliminary budget", "Establish the project workbook", "Identify and assess risk "], "a": 2, "e": "", "s": false, "n": 49}, {"t": "mcq", "q": "Net Present Value (NPV) primarily accounts for:", "o": ["Staff availability using a skills matrix", "Time value of money using a discount rate", "Stakeholder politics and influence", "System usability and user satisfaction "], "a": 1, "e": "", "s": false, "n": 50}, {"t": "mcq", "q": "Which option is a project risk assessment factor category used to evaluate project risk during initiation and planning?", "o": ["Social media engagement", "Development group", "Customer pricing model", "Public relation strategy "], "a": 1, "e": "", "s": false, "n": 51}, {"t": "mcq", "q": "Which set correctly lists the major sections typically included in a Baseline Project Plan (BPP)?", "o": ["Scope; WBS; Sprint backlog; Release notes", "Background; UML diagrams; Coding standards; Maintenance logs", "Introduction; Database design; Testing; Deployment", "Introduction; System description; Feasibility assessment; Management issues "], "a": 3, "e": "", "s": false, "n": 52}, {"t": "mcq", "q": "Which role is NOT listed among walk-through roles?", "o": [
