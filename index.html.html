ject", "Determining the project's timeline and milestones ", "Identifying the financial benefits and costs associated with the project "], "a": 3, "e": "", "s": false, "n": 59}, {"t": "mcq", "q": "What does \"Total Cost of Ownership (TCO)\" encompass regarding a system?", "o": ["The cost of owning and operating a system, including acquisition, ongoing use, and maintenance", "The initial purchase cost of the system", "The cost of hiring personnel to implement the system", "The cost of acquiring new hardware for the system "], "a": 0, "e": "", "s": false, "n": 60}, {"t": "mcq", "q": "Which type of feasibility measures the extent to which the system will solve identified problems?", "o": ["Operational feasibility", "Technical feasibility", "Legal feasibility", "Political feasibility "], "a": 0, "e": "", "s": false, "n": 61}, {"t": "mcq", "q": "Which activity ensures that project deliverables are reviewed formally by peers and stakeholders?", "o": ["User training workshops", "Post-implementation reviews", "Structured walkthroughs", "Technical feasibility analysis "], "a": 2, "e": "", "s": false, "n": 62}, {"t": "mcq", "q": "Which of the following roles is NOT typically part of a structured walkthrough?", "o": ["The presenter", "The recorder", "The maintenance operator", "The project manager "], "a": 3, "e": "", "s": false, "n": 63}, {"t": "mcq", "q": "Which document serves as a foundation for the entire project and includes scope, objectives, benefits, and deliverables?", "o": ["Baseline Project Plan (BPP)", "User acceptance report", "Final deployment contract", "System maintenance manual "], "a": 0, "e": "", "s": false, "n": 64}, {"t": "mcq", "q": "Which financial technique discounts future benefits and costs to their present value?", "o": ["Payback method", "Break-even analysis (BEA) ", "Net Present Value (NPV)", "Return on Investment (ROI) "], "a": 2, "e": "", "s": false, "n": 65}, {"t": "mcq", "q": "Which document defines project team responsibilities?", "o": ["Marketing Strategy Document", "Task Responsibility Matrix", "Business Case", "Risk Assessment Report "], "a": 1, "e": "", "s": false, "n": 66}, {"t": "mcq", "q": "What is the main purpose of a Baseline Project Plan (BPP)?", "o": ["To outline the project scope, benefits, costs, risks, and resource requirements", "To finalize the project budget", "To provide a detailed schedule for the project", "To assign tasks to team members "], "a": 0, "e": "", "s": false, "n": 67}, {"t": "mcq", "q": "Which feasibility type determines whether a project meets organizational deadlines?", "o": ["Political feasibility", "Technical feasibility", "Schedule feasibility", "Economic feasibility "], "a": 2, "e": "", "s": false, "n": 68}, {"t": "mcq", "q": "Which of the following is an example of a tangible benefit?", "o": ["Brand reputation improvement", "Employee satisfaction", "Customer perception", "Cost reduction and avoidance "], "a": 3, "e": "", "s": false, "n": 69}, {"t": "mcq", "q": "What is a one-time cost?", "o": ["A regular employee salary", "A recurring expense over the project's lifetime", "A customer acquisition expense", "A cost associated with project start-up and development "], "a": 3, "e": "", "s": false, "n": 70}, {"t": "mcq", "q": "Total cost of ownership (TCO) is the cost of owning and operating a system, including the total cost of acquisition, as well as all costs associated with its ongoing use and maintenance.", "o": ["True", "False "], "a": 0, "e": "", "s": false, "n": 71}, {"t": "mcq", "q": "Net Present Value (NPV) is a type of cost-benefit analysis to identify at what point (if ever) benefits equal costs.", "o": ["True", "False "], "a": 1, "e": "", "s": false, "n": 72}, {"t": "mcq", "q": "One-time cost is a cost resulting from the ongoing evolution and use of a system.", "o": ["True", "False "], "a": 1, "e": "", "s": false, "n": 73}, {"t": "mcq", "q": "______ is the process of defining clear activities necessary to complete activities in a single project.", "o": ["Project planning", "Project initiation", "Project execution", "Project closedown "], "a": 0, "e": "", "s": false, "n": 74}, {"t": "mcq", "q": "______ need to be managed in order to be minimized.", "o": ["Costs", "Risks", "Benefits", "Deliverables "], "a": 1, "e": "", "s": false, "n": 75}, {"t": "mcq", "q": "All of the following are categories of feasibility except ______.", "o": ["Economic", "Technical", "Scope", "Political "], "a": 2, "e": "", "s": false, "n": 76}, {"t": "mcq", "q": "All of the following are included in the baseline project report except ______.", "o": ["Introduction", "System description", "Conclusion", "Feasibility assessment "], "a": 2, "e": "", "s": false, "n": 77}, {"t": "mcq", "q": "All of the following are tangible benefits except ______.", "o": ["Cost reduction and avoidance ", "Error reduction", "Increased speed of activity", "Decreased flexibility "], "a": 3, "e": "", "s": false, "n": 78}, {"t": "mcq", "q": "Each organization has to decide its acceptable project mix of ______.", "o": ["Costs", "Staff", "Risks", "Vendors "], "a": 2, "e": "", "s": false, "n": 79}, {"t": "mcq", "q": "Failure to integrate the new system with the old system is an example of ______.", "o": ["Failure to assess and manage risks", "Schedule feasibility", "A tangible benefit", "A one-time cost "], "a": 0, "e": "", "s": false, "n": 80}, {"t": "mcq", "q": "Which of the following is NOT an example of a type of feasibility study?", "o": ["Technical feasibility", "Operational feasibility", "Resource feasibility", "Schedule feasibility "], "a": 2, "e": "", "s": false, "n": 81}, {"t": "mcq", "q": "What is the term that describes the best estimate of a project's scope, benefits, cost, and resources?", "o": ["Business case", "Baseline project plan", "Break-even analysis", "Project charter "], "a": 1, "e": "", "s": false, "n": 82}, {"t": "mcq", "q": "What makes all projects feasible?", "o": ["Unlimited resources and infinite time", "A skilled project team", "Executive approval", "A low budget "], "a": 0, "e": "", "s": false, "n": 83}, {"t": "mcq", "q": "Which document outlines all work required to complete the project?", "o": ["Business case", "System Service Request ", "Project scope document", "Walk-through review form "], "a": 2, "e": "", "s": false, "n": 84}, {"t": "mcq", "q": "Which feasibility category deals with identifying financial benefits associated with the project?", "o": ["Economic", "Technical", "Political", "Schedule "], "a": 0, "e": "", "s": false, "n": 85}, {"t": "mcq", "q": "Which of the following is an example of a tangible benefit?", "o": ["Customer goodwill", "Error reduction in data entry", "Improved employee morale", "Brand image "], "a": 1, "e": "", "s": false, "n": 86}, {"t": "mcq", "q": "Which of the following is an example of an intangible cost?", "o": ["Customer goodwill", "Equipment purchase", "Training fees", "Software license "], "a": 0, "e": "", "s": false, "n": 87}, {"t": "mcq", "q": "Which of the following is NOT a factor in determining legal and contractual feasibility?", "o": ["Intellectual property", "Contract obligations", "Financial budgets", "Software licensing "], "a": 2, "e": "", "s": false, "n": 88}, {"t": "mcq", "q": "Which of the following is NOT a factor in determining schedule feasibility?", "o": ["Organizational deadlines", "Time frame of major activities", "A 45-hour work week", "Completion dates "], "a": 2, "e": "", "s": false, "n": 89}, {"t": "mcq", "q": "Which of the following is NOT a way to manage project risks?", "o": ["Assigning highly skilled project members", "Using proven technology", "Changing the budget ", "Dividing the project into smaller phases "], "a": 2, "e": "", "s": false, "n": 90}, {"t": "mcq", "q": "Which of the following is NOT an example of a recurring cost?", "o": ["Application software maintenance", "Incremental data storage expenses", "System conversion", "Incremental communications "], "a": 2, "e": "", "s": false, "n": 91}, {"t": "mcq", "q": "Which of the options below means the organization has the ability to build the requested system?", "o": ["Operational feasibility", "Technical feasibility", "Political feasibility", "Schedule feasibility "], "a": 1, "e": "", "s": false, "n": 92}, {"t": "mcq", "q": "Which part of the baseline project report contains an outline of the recommended course of action?", "o": ["Introduction", "System description", "Feasibility assessment", "Management issues "], "a": 0, "e": "", "s": false, "n": 93}, {"t": "mcq", "q": "Which role in the walk-through normally has done all or some of the work presented?", "o": ["Secretary", "Coordinator", "Presenter", "User "], "a": 2, "e": "", "s": false, "n": 94}, {"t": "mcq", "q": "Which term means that money available today is worth more than the same amount tomorrow?", "o": ["Time value of money", "Return on investment", "Break-even analysis", "Total cost of ownership "], "a": 0, "e": "", "s": false, "n": 95}, {"t": "mcq", "q": "Which type of feasibility deals with project duration?", "o": ["Schedule feasibility", "Political feasibility", "Legal feasibility ", "Technical feasibility "], "a": 0, "e": "", "s": false, "n": 96}, {"t": "mcq", "q": "Which type of project should companies not have too many of?", "o": ["High risk", "Low risk", "Small", "Short "], "a": 0, "e": "", "s": false, "n": 97}, {"t": "mcq", "q": "Who must review the baseline project plan before it moves to the next phase in the SDLC?", "o": ["The users, managers, and development group", "Only the CIO", "Only the customer", "External auditors "], "a": 0, "e": "", "s": false, "n": 98}, {"t": "mcq", "q": "Which term names an automated software estimation model that uses historical project data and current as well as future project characteristics to estimate project costs?", "o": ["PERT", "COCOMO (Constructive Cost Model)", "NPV", "ROI "], "a": 1, "e": "", "s": false, "n": 99}, {"t": "mcq", "q": "The rate of return used to compute the present value of future cash flows is the ________.", "o": ["Discount rate", "Return on investment", "Total cost of ownership", "Slack time "], "a": 0, "e": "", "s": false, "n": 100}, {"t": "mcq", "q": "A benefit derived from the creation of an information system that cannot be easily measured in dollars or with certainty is a(n) ________.", "o": ["Tangible benefit", "Intangible benefit", "Tangible cost", "Recurring cost "], "a": 1, "e": "", "s": false, "n": 101}, {"t": "mcq", "q": "The current value of a future cash flow is the ________.", "o": ["Net present value", "Present value", "Discount rate", "Break-even point "], "a": 1, "e": "", "s": false, "n": 102}, {"t": "mcq", "q": "A benefit derived from the creation of an information system that can be measured in dollars and with certainty is a(n) ________.", "o": ["Intangible benefit", "Tangible cost", "Tangible benefit", "One-time cost "], "a": 2, "e": "", "s": false, "n": 103}, {"t": "mcq", "q": "A cost resulting from the ongoing evolution and use of a system is a(n) ________.", "o": ["One-time cost", "Recurring cost", "Tangible cost", "Total cost of ownership "], "a": 1, "e": "", "s": false, "n": 104}, {"t": "open", "q": "List any six tasks for project planning.", "a": "Any six of: describe project scope, alternatives, and feasibility; divide the project into tasks; estimate resource requirements and create a resource plan; develop a preliminary schedule; develop a communication plan; determine standards and procedures; identify and assess risk; create a preliminary budget; develop a statement of work; set the baseline project plan.", "s": false, "n": 105}, {"t": "open", "q": "Differentiate between tangible and intangible costs, with examples.", "a": "Tangible cost: a cost associated with an information system that can be measured in dollars and with certainty (for example, purchasing new equipment). Intangible cost: a cost that cannot be easily measured in dollars or with certainty (for example, loss of customer trust due to poor service).", "s": false, "n": 106}, {"t": "open", "q": "Define project risk in system development. Then describe two risk factors and propose one mitigation action for each.", "a": "Project risk is the potential consequence of not assessing and managing risks: failure to attain expected benefits, inaccurate cost or duration estimates, inadequate system performance, or failure to integrate with existing hardware, software, or procedures. Risk factor 1, project size: mitigation is to break the project into smaller phases. Risk factor 2, low familiarity with the technology or application area: mitigation is to train the team or hire experienced staff.", "s": false, "n": 107}, {"t": "open", "q": "A proposed information system has estimated one-time development costs of 450,000 SAR. The system is expected to generate 150,000 SAR in annual benefits while incurring 30,000 SAR in annual operating costs. Calculate the net annual benefit and the break-even (payback) period.", "a": "Net annual benefit = 150,000 - 30,000 = 120,000 SAR. Payback period = 450,000 / 120,000 = 3.75 years.", "s": false, "n": 108}], "5": [{"t": "mcq", "q": "The search for, and implementation of, radical change in business processes to achieve breakthrough improvements in products and services is:", "o": ["Nominal Group Technique (NGT)", "Joint Application Design (JAD)", "Disruptive technologies", "Business process reengineering (BPR) "], "a": 3, "e": "", "s": false, "n": 1}, {"t": "mcq", "q": "A structured process in which users, managers, and analysts work together for several days in a series of meetings to clarify or review requirements is:", "o": ["Joint Application Design (JAD)", "Business process reengineering (BPR)", "Extreme Programming", "Prototyping "], "a": 0, "e": "", "s": false, "n": 2}, {"t": "mcq", "q": "Which of the following is NOT part of the Nominal Group Technique?", "o": ["Observe workers at selected times to see how data are handled and what information people need to do their jobs", "Members come together as a group, but initially work separately", "Facilitator reads ideas out loud, and they are written on a blackboard", "Ideas are prioritized, combined, selected, reduced "], "a": 0, "e": "", "s": false, "n": 3}, {"t": "mcq", "q": "Technologies that enable breaking long-held business rules that inhibit organizations from making radical business changes are:", "o": ["Disruptive technologies", "Nominal Group Technique (NGT)", "Business process reengineering (BPR)", "Joint Application Design (JAD) "], "a": 0, "e": "", "s": false, "n": 4}, {"t": "mcq", "q": "The person who makes detailed notes of the happenings at a JAD session is the:", "o": ["Scribe", "Systems analyst", "Session leader", "Manager "], "a": 0, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "______ is used to build a rudimentary working version of the system to understand the requirements in concrete terms.", "o": ["System prototypes", "Joint Application Design", "CASE tools", "Group Support Systems "], "a": 0, "e": "", "s": false, "n": 6}, {"t": "mcq", "q": "Which of the following methods is used to facilitate sharing of ideas and voicing of opinions about system requirements?", "o": ["Group Support Systems", "Confidentiality", "System prototypes", "CASE tools "], "a": 0, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "Which of the following belongs to open-ended questions?", "o": ["Non-conversational", "Has no specific answers", "Has limited range of answers", "Structured "], "a": 1, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "Which of the following is NOT a contemporary way of requirements determination?", "o": ["Joint Application Design", "Interviewing groups", "CASE tools", "Group Support Systems "], "a": 1, "e": "", "s": false, "n": 9}, {"t": "mcq", "q": "The questions in interviews that have pre-specified answers (specified responses) are called:", "o": ["Closed-ended questions", "Open-ended questions", "Leading questions", "Clarifying questions "], "a": 0, "e": "", "s": false, "n": 10}, {"t": "mcq", "q": "______ is the way a system actually works in practice.", "o": ["Informal system", "Ideal system", "Current state system", "Formal system "], "a": 0, "e": "", "s": false, "n": 11}, {"t": "mcq", "q": "The scribe is the person who ______ during the JAD session.", "o": ["Makes detailed notes of the happenings", "Contributes his/her ideas on the technical limitations of current systems", "Provides insight into new organizational directions and motivations", "Learns from users and managers, not to run or dominate the process "], "a": 0, "e": "", "s": false, "n": 12}, {"t": "mcq", "q": "At the beginning of the ______ process, group members work alone to generate ideas that are pooled under the guidance of a trained facilitator.", "o": ["Nominal Group Technique", "Joint Application Design", "Business Process Reengineering", "Key Business Processes "], "a": 0, "e": "", "s": false, "n": 13}, {"t": "mcq", "q": "When organizations want to make an essential business change, they use ______ to break the current long-held business rules that prevent this change.", "o": ["Prototyping", "Joint application design", "Business process reengineering", "Disruptive technologies "], "a": 3, "e": "", "s": false, "n": 14}, {"t": "mcq", "q": "Which of the following is NOT an advantage of the interviewing groups technique?", "o": ["Easier to schedule", "Saving time", "Can hear agreements and disagreements at the same time", "Opportunity for synergies "], "a": 0, "e": "", "s": false, "n": 15}, {"t": "mcq", "q": "Which of the following statements is considered a drawback of prototyping?", "o": ["Managers must make all decisions", "Information can appear in only one place at a time", "Must choose between centralization and decentralization", "Tendency to avoid formal documentation "], "a": 3, "e": "", "s": false, "n": 16}, {"t": "mcq", "q": "Finding synergies and contrasts among system requirements can be achieved by one of the following methods:", "o": ["Interviewing groups", "Studying business documents", "Interviewing individuals", "Observing workers "], "a": 0, "e": "", "s": false, "n": 17}, {"t": "mcq", "q": "______ is one of the traditional methods of collecting system requirements, used to discover reported issues, policies, rules, and directions in the organization.", "o": ["Observing workers", "Studying business documents", "Interviewing groups", "Interviewing individuals "], "a": 1, "e": "", "s": false, "n": 18}, {"t": "mcq", "q": "You are running a group interview to collect system requirements. The participants have different personalities (shy, talkative, etc.) and you need to give equal opportunity to everyone. Which technique will you use?", "o": ["Directly observing users", "Agile usage-centered design", "Business process reengineering", "Nominal Group Technique "], "a": 3, "e": "", "s": false, "n": 19}, {"t": "mcq", "q": "A(n) ______ could be used to complement the work done in a typical group interview or as part of a Joint Application Design effort.", "o": ["Nominal Group Technique (NGT) process", "Nominal Group Technique (NGT) exercise "], "a": 1, "e": "", "s": false, "n": 20}, {"t": "mcq", "q": "Interview transcripts, observation notes, and meeting minutes are deliverables that come from:", "o": ["Existing written documents", "Interviews and observations", "Computerized sources "], "a": 1, "e": "", "s": false, "n": 21}, {"t": "mcq", "q": "Mission and strategy statements, business forms, procedure manuals, job descriptions, training manuals, system documentation, and flowcharts are deliverables that come from:", "o": ["Computerized sources", "Interviews and observations", "Existing written documents "], "a": 2, "e": "", "s": false, "n": 22}, {"t": "mcq", "q": "Intensive group-oriented requirements determination technique:", "o": ["Joint Application Design (JAD)", "System prototypes", "CASE tools", "Group Support Systems "], "a": 0, "e": "", "s": false, "n": 23}, {"t": "mcq", "q": "JAD session results, CASE repositories, system prot const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const IC={CS350:'🗄️',CS351:'🖥️',CS352:'🧩',CS353:'📐'};
let best={};try{best=JSON.parse(localStorage.getItem('best5')||'{}')}catch(e){}
const saveBest=(k,v)=>{if((best[k]||0)<v){best[k]=v;try{localStorage.setItem('best5',JSON.stringify(best))}catch(e){}}};
const pool=(c,ch)=>{const o=D[c].chapters,ks=ch==='all'?Object.keys(o):[ch];return ks.flatMap(k=>o[k].map(x=>({...x,o:x.o&&x.o.map(s=>s.trim()),ch:k})))};
const cnt=(c,ch)=>pool(c,ch).length, mcqn=(c,ch)=>pool(c,ch).filter(x=>x.t==='mcq').length;
const ready=c=>cnt(c,'all')>0;
function route(){const [c,tab,ch]=location.hash.slice(1).split('/');window.scrollTo(0,0);
 if(!c||!D[c])return home(); if(!ready(c))return home(); if(!tab)return course(c,'mid'); if(!ch)return course(c,tab);
 if(tab==='flashcard')return cards(c,ch); if(tab==='final')return course(c,'final'); return quiz(c,tab,ch)}
addEventListener('hashchange',route);
const topbar=(back,t,sub,right)=>`<div class="bar0"><div class="top"><button class="back" onclick="${back}">←</button><div class="t">${t}<small>${sub||''}</small></div>${right||''}</div></div>`;
function home(){$.innerHTML=`<div class="hero"><h1>CS · Level 5</h1><p>Pick a course and start practicing</p></div><div class="grid">${['CS353','CS350','CS351','CS352'].map(c=>{const n=cnt(c,'all');return `<button class="box ${n?'':'dis'}" ${n?`onclick="location.hash='${c}'"`:''}><span class="ic">${IC[c]}</span>${c}<small>${esc(D[c].name)}<br>${n?n+' questions':'Question bank not added yet'}</small></button>`}).join('')}</div>`}
function course(c,tab){const ks=Object.keys(D[c].chapters);
 let body;
 if(tab==='final')body=`<div class="soon"><b>Not yet</b><p class="sub">The final exam section will be added later.</p></div>`;
 else body=`<p class="sub">${tab==='mid'?'Practice with instant feedback. Multiple choice shows why you were wrong; essay questions show the model answer.':'Flip cards — every question in the chapter, essays included.'}</p><div class="grid">${ks.map(k=>`<button class="box" onclick="location.hash='${c}/${tab}/${k}'">ch${k}<small>${cnt(c,k)} questions${best[c+tab+k]?' · best '+best[c+tab+k]+'%':''}</small></button>`).join('')}<button class="box all" onclick="location.hash='${c}/${tab}/all'">all<small>${cnt(c,'all')} questions (shuffled)${best[c+tab+'all']?' · best '+best[c+tab+'all']+'%':''}</small></button></div>`;
 $.innerHTML=topbar("location.hash=''",c,esc(D[c].name))+`<div class="tabs">${['mid','final','flashcard'].map(t=>`<button class="tab ${t===tab?'on':''}" onclick="location.hash='${c}/${t}'">${t}</button>`).join('')}</div>`+body}
let S;
function quiz(c,tab,ch){let qs=pool(c,ch);if(ch==='all')qs=shuf(qs);S={c,tab,ch,qs,ans:[],shown:[],ai:{}};drawQuiz()}
const stat=()=>{const r=S.qs.filter((q,i)=>q.t==='mcq'&&S.ans[i]===q.a).length,a=S.qs.filter((q,i)=>q.t==='mcq'&&S.ans[i]!=null).length;return {r,a,tot:mcqn(S.c,S.ch)}};
function drawQuiz(keep){const {c,ch,qs,ans,shown}=S,st=stat(),fin=st.a===st.tot&&st.tot>0;
 if(fin)saveBest(c+'mid'+ch,Math.round(st.r/st.tot*100));
 let h=topbar(`location.hash='${c}/mid'`,`${c} · mid · ch${ch}`,`${qs.length} questions`,`<div class="score" id="sc">${st.r}/${st.a}</div>`)+`<div class="bar"><div id="pb" style="width:${st.tot?st.a/st.tot*100:0}%"></div></div>`;
 if(fin)h+=`<div class="res"><b>${st.r}/${st.tot}</b><p class="sub">${Math.round(st.r/st.tot*100)}% — essay questions are not scored</p></div>`;
 qs.forEach((q,i)=>{const rev=ans[i]!=null;
  h+=`<div class="q" id="q${i}"><div class="n"><span class="tag">Q${i+1}</span><span class="tag">ch${q.ch}</span>${q.s?'<span class="tag">★ frequent</span>':''}${q.t==='open'?'<span class="tag">essay</span>':''}${q.v?'<span class="tag w">⚠ verify this answer</span>':''}</div>
  ${q.fig?`<div class="fig">${q.fig}</div>`:''}<div class="tx">${esc(q.q)}</div>`;
  if(q.t==='mcq'){h+=q.o.map((o,k)=>{let cl='';if(rev){if(k===q.a)cl='ok';else if(ans[i]===k)cl='no'}return `<button class="opt ${cl}" onclick="pick(${i},${k})"><i></i><span>${esc(o)}</span></button>`}).join('');
   if(rev){const wrong=ans[i]!==q.a;h+=`<div class="exp">${wrong?`❌ Correct answer: <b>${esc(q.o[q.a])}</b>`:'✅ Correct'}${q.e?`<br>${esc(q.e)}`:''}${q.v?'<br>⚠ The source was not sure about this one — double-check it with your instructor.':''}</div>`;
    if(wrong)h+=S.ai[i]?`<div class="exp ai">${esc(S.ai[i])}</div>`:`<button class="btn sm" onclick="why(${i},this)">Why was my answer wrong?</button>`}}
  else h+=`<textarea id="ta${i}" placeholder="Write your answer here (optional)…"></textarea>`+(shown[i]?`<div class="model"><b>Model answer</b>\n${esc(q.a)}${q.v?'\n⚠ verify with your instructor':''}</div>`:`<button class="btn sm" onclick="S.shown[${i}]=1;keepTa();drawQuiz(${i})">Show model answer</button>`);
  h+='</div>'});
 const tas={};qs.forEach((q,i)=>{const e=document.getElementById('ta'+i);if(e&&e.value)tas[i]=e.value});
 const y=scrollY;$.innerHTML=h;for(const i in tas)document.getElementById('ta'+i).value=tas[i];scrollTo(0,y)}
function keepTa(){}
function pick(i,k){if(S.ans[i]!=null)return;S.ans[i]=k;drawQuiz()}
async function why(i,btn){const q=S.qs[i];btn.disabled=true;btn.textContent='Thinking…';
 try{const sm=await claude.use('sample');if(!sm)throw 0;
  const r=await sm(`You are a friendly university tutor. A student answered a multiple-choice question wrongly.\nQuestion: ${q.q}\nOptions: ${q.o.map((o,k)=>'ABCDEF'[k]+') '+o).join(' | ')}\nStudent chose: ${'ABCDEF'[S.ans[i]]}) ${q.o[S.ans[i]]}\nCorrect: ${'ABCDEF'[q.a]}) ${q.o[q.a]}\nIn 2-3 short sentences explain why the student's choice is wrong and why the correct answer is right. Then add one short sentence in Arabic summarising the key idea. Plain text only.`,{modelTier:'quick'});
  S.ai[i]='💡 '+r.text}catch(e){S.ai[i]='💡 Could not load the AI explanation here. The correct answer is: '+q.o[q.a]}
 drawQuiz()}
let F;
function cards(c,ch){F={c,ch,list:ch==='all'?shuf(pool(c,ch)):pool(c,ch),i:0,flip:false};drawCard()}
function drawCard(){const {c,ch,list,i,flip}=F,x=list[i];
 const ans=x.t==='mcq'?x.o[x.a]+(x.e?'\n'+x.e:''):x.a;
 $.innerHTML=topbar(`location.hash='${c}/flashcard'`,`${c} · flashcards · ch${ch}`,x.t==='open'?'essay':'',`<div class="score">${i+1}/${list.length}</div>`)+`<div class="bar"><div style="width:${(i+1)/list.length*100}%"></div></div>
 <div class="fc ${flip?'back':''}" onclick="F.flip=!F.flip;drawCard()">${!flip&&x.fig?`<div class="fig" style="width:100%">${x.fig}</div>`:''}<div style="white-space:pre-wrap">${esc(flip?ans:x.q)}</div></div>
 <p class="sub" style="text-align:center">${flip?'Answer':'Tap the card to see the answer'}</p>
 <div class="row"><button class="btn alt" onclick="F.i=(F.i+list.length-1)%list.length;F.flip=false;drawCard()">Prev</button><button class="btn" onclick="F.i=(F.i+1)%list.length;F.flip=false;drawCard()">Next</button></div>
 <button class="btn alt" onclick="cards('${c}','${ch}')">Shuffle / restart</button>`}
route();
</script></body></html>
