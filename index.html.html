<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS Level 5 · Study Hub</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--ink:#1d2160;--mut:#656a9a;--line:#d9dcf0;--acc:#4a52d6;--acc2:#7a5af8;--ok:#1f9d63;--okb:#e3f6ec;--no:#d64545;--nob:#fde8e8;--warn:#b7791f;--warnb:#fff4d6;--sh:0 6px 20px rgba(40,44,120,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1028;--card:#181b44;--ink:#e8eaff;--mut:#9aa0d6;--line:#32377a;--acc:#8b93ff;--acc2:#b39dff;--ok:#4cd68f;--okb:#12382a;--no:#ff7b7b;--nob:#3d1a24;--warn:#ffcf66;--warnb:#3b3115;--sh:0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0e1028;--card:#181b44;--ink:#e8eaff;--mut:#9aa0d6;--line:#32377a;--acc:#8b93ff;--acc2:#b39dff;--ok:#4cd68f;--okb:#12382a;--no:#ff7b7b;--nob:#3d1a24;--warn:#ffcf66;--warnb:#3b3115;--sh:0 6px 20px rgba(0,0,0,.35)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
main{max-width:780px;margin:0 auto;padding:16px 16px 70px}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:22px;padding:26px 22px;margin-bottom:20px;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0 0;opacity:.9}
.sub{color:var(--mut);margin:0 0 16px}
.bar0{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:8px 0 6px}
.top{display:flex;align-items:center;gap:10px}
.top .t{flex:1;font-weight:800;font-size:17px;min-width:0}.top .t small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.back{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
.score{font-weight:800;font-size:18px;color:var(--acc);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px}
.bar{height:6px;background:var(--line);border-radius:4px;margin:8px 0 6px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px 12px;text-align:center;font-weight:800;font-size:20px;cursor:pointer;color:var(--ink);font-family:inherit;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.box:hover{transform:translateY(-2px);border-color:var(--acc)}
.box small{display:block;font-weight:500;color:var(--mut);font-size:12.5px;margin-top:4px;line-height:1.35}
.box .ic{font-size:26px;display:block;margin-bottom:4px}
.box.dis{opacity:.5;cursor:default;box-shadow:none}.box.dis:hover{transform:none;border-color:var(--line)}
.box.all{border-color:var(--acc);color:var(--acc)}
.tabs{display:flex;gap:8px;margin:4px 0 14px;background:var(--card);padding:5px;border-radius:16px;border:1.5px solid var(--line)}
.tab{flex:1;padding:10px 4px;border:0;border-radius:12px;background:none;color:var(--mut);font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin:0 0 16px;box-shadow:var(--sh)}
.q .n{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:12.5px;margin-bottom:6px;font-weight:700}
.tag{border-radius:8px;padding:1px 8px;background:var(--bg);border:1px solid var(--line)}.tag.w{background:var(--warnb);color:var(--warn);border-color:var(--warn)}
.q .tx{font-weight:650;margin-bottom:12px}
.fig{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px;margin:0 0 12px;overflow-x:auto;color:var(--ink)}.fig svg{display:block;width:100%;min-width:340px;max-width:620px;margin:auto;height:auto}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:1.5px solid var(--line);border-radius:14px;padding:11px;margin:7px 0;color:var(--ink);font:inherit;cursor:pointer}
.opt i{flex:none;width:20px;height:20px;border:2px solid var(--mut);border-radius:50%;margin-top:2px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok i{background:var(--ok);border-color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no)}.opt.no i{background:var(--no);border-color:var(--no)}
.exp{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14.5px}
.exp.ai{border-color:var(--acc)}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:14px;padding:13px;font-size:16.5px;font-weight:800;cursor:pointer;margin:12px 0;font-family:inherit}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.btn.sm{padding:9px;font-size:14.5px;margin:8px 0 0}
textarea{width:100%;min-height:90px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:vertical}
.model{margin-top:10px;padding:12px;border-radius:12px;background:var(--okb);border:1.5px solid var(--ok);white-space:pre-wrap}
.fc{min-height:240px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:19px;font-weight:650;background:var(--card);border:2px solid var(--line);border-radius:22px;cursor:pointer;margin:12px 0;box-shadow:var(--sh)}
.fc.back{color:var(--ok);font-weight:500;font-size:17px;border-color:var(--ok)}
.row{display:flex;gap:10px}.row .btn{margin:6px 0}
.res{text-align:center;padding:18px;background:var(--card);border-radius:20px;border:1.5px solid var(--line);margin-bottom:16px}.res b{font-size:46px;color:var(--acc)}
.soon{text-align:center;padding:50px 16px;background:var(--card);border:2px dashed var(--line);border-radius:22px}.soon b{font-size:26px}
</style></head><body><main id="app"></main>
<script>
const D={"CS353": {"name": "Design & Analysis of Algorithms", "chapters": {"1": [{"t": "mcq", "q": "Which of the following is NOT one of the characteristics of an algorithm?", "o": ["Definiteness", "Head Section", "Finiteness", "Efficiency"], "a": 1, "e": "", "s": false, "n": "1"}, {"t": "mcq", "q": "Which of the following is NOT part of the head section of an algorithm?", "o": ["Keyword Algorithm and Name", "Problem Description", "Input and Output", "If, for, while and statements like assignments"], "a": 3, "e": "", "s": false, "n": "2"}, {"t": "mcq", "q": "It is very simple and easy to specify an algorithm using:", "o": ["Pseudocode", "Artificial Intelligence", "Flowchart", "Natural Language"], "a": 3, "e": "", "s": false, "n": "3"}, {"t": "mcq", "q": "Which of the following is NOT one of the methods to specify an algorithm?", "o": ["Pseudocode", "Natural Language", "Flowchart", "Binary Code"], "a": 3, "e": "", "s": false, "n": "4"}, {"t": "mcq", "q": "Input and Output can be done using:", "o": ["read", "combine", "read and write", "write"], "a": 2, "e": "", "s": false, "n": "5"}, {"t": "mcq", "q": "Correct algorithm is not one that works most of the time, but one that works:", "o": ["easily", "quickly", "correctly for all inputs", "slowly"], "a": 2, "e": "", "s": false, "n": "6"}, {"t": "mcq", "q": "Common technique for proving correctness of an algorithm is:", "o": ["approximation algorithms", "paper and pencil", "correct algorithm", "mathematical induction"], "a": 3, "e": "", "s": false, "n": "7"}, {"t": "mcq", "q": "Which of the following is NOT among the ways to express algorithm specifications?", "o": ["Natural language", "Pseudocode", "Drawing use cases", "Flowchart"], "a": 2, "e": "", "s": false, "n": "8"}, {"t": "mcq", "q": "The best definition of Pseudocode is:", "o": ["Complete program written in programming language such as Python or C++", "A mixture of a natural language and programming language constructs", "Using everyday spoken or written human language to describe algorithm steps", "A graphical representation using connected geometric shapes"], "a": 1, "e": "", "s": false, "n": "9"}, {"t": "mcq", "q": "Which of the following statements is true?", "o": ["An algorithm should have one or more inputs and produce one or more outputs.", "An algorithm may or may not terminate after a finite number of steps", "To analyze an algorithm means to determine the number of resources to execute it", "Procedure, function and subroutine are synonyms for an algorithm"], "a": 0, "e": "", "s": false, "n": "10"}, {"t": "mcq", "q": "An ________ is defined as a set of well-defined instructions used to accomplish a task.", "o": ["Function", "Program", "Procedure", "Algorithm"], "a": 3, "e": "", "s": false, "n": "11"}, {"t": "mcq", "q": "Input size measure for searching for a key in a list of n items is:", "o": ["Number of vertices and/or edges", "Matrix dimensions or total number of elements", "Number of digits (in binary representation)", "Number of the items in the list"], "a": 3, "e": "", "s": false, "n": "12"}, {"t": "mcq", "q": "Sequential search best-case running time Cbest(n) = 1 means:", "o": ["The element is in the middle of the list", "The element is the last element of the list", "The element is the first element of the list", "The element is not found in the list"], "a": 2, "e": "", "s": false, "n": "13"}, {"t": "mcq", "q": "Sequential search worst-case Cworst(n) = n means:", "o": ["The element is in the middle of the list", "The element is either in the last position or there is no match", "The element is the last element of the list", "The element is not found in the list"], "a": 1, "e": "", "s": false, "n": "14"}, {"t": "mcq", "q": "Time efficiency indicates:", "o": ["How large memory does an algorithm need", "The amount of memory units required by the algorithm", "How simplicity of an algorithm is", "How fast an algorithm runs"], "a": 3, "e": "", "s": false, "n": "15"}, {"t": "open", "q": "Explain the two kinds of algorithm efficiency.", "a": "1. Time Efficiency (Time Complexity): Indicates how fast the algorithm runs. Measured by counting\nthe number of times the algorithm's basic operation is executed. Example: for sequential search the\nbasic operation is the key comparison.\n2. Space Efficiency (Space Complexity): Indicates how much extra memory the algorithm uses\nbeyond what is needed for input and output. Measured by counting the number of extra memory\nunits consumed.", "s": false, "n": "E1"}], "2": [{"t": "mcq", "q": "Big-Theta notation Θ is:", "o": ["Asymptotic tight bound – useful for average case analysis", "Asymptotic lower bound – useful for best case analysis", "Asymptotic lower bound – useful for worst case analysis", "Asymptotic upper bound – useful for worst case analysis"], "a": 0, "e": "", "s": false, "n": "16"}, {"t": "mcq", "q": "The measure of the longest amount of time possibly taken to complete an algorithm is expressed as:", "o": ["Little-O", "Little-Omega", "Big-Omega", "Big-O"], "a": 3, "e": "", "s": false, "n": "17"}, {"t": "mcq", "q": "The _____ bounds the running time from above, guaranteeing it will not exceed this time for any input of size n:", "o": ["average-case analysis", "best-case analysis", "mathematical analysis", "worst-case analysis"], "a": 3, "e": "", "s": false, "n": "18"}, {"t": "mcq", "q": "The _____ is performed by running a program on a sample of inputs and analyzing the observed data:", "o": ["Mathematical analysis", "Asymptotic analysis", "Empirical analysis", "Theoretical analysis"], "a": 2, "e": "", "s": false, "n": "19"}, {"t": "mcq", "q": "For analyzing an algorithm, which is the worst computing time using Big-O?", "o": ["O(n log n)", "O(n²)", "O(n!)", "O(2ⁿ)"], "a": 2, "e": "", "s": false, "n": "20"}, {"t": "mcq", "q": "Time complexity of: f(n) = (n² + 1)(5n⁴ + n² + 2n)", "o": ["O(n⁴)", "O(n⁵)", "O(n⁶)", "O(log n)"], "a": 2, "e": "", "s": false, "n": "21"}, {"t": "mcq", "q": "Which operation has the greatest impact on time complexity?", "o": ["Single line operations", "Loop (repetition) operations", "If-statement operations", "Comment-line operations"], "a": 1, "e": "", "s": false, "n": "22"}, {"t": "mcq", "q": "Which is NOT a reason to perform empirical analysis?", "o": ["To check the accuracy of the algorithm", "To reduce the use of mathematical analysis and algorithm visualization", "To compare the efficiencies of different algorithms", "To develop the algorithm's efficiency class"], "a": 1, "e": "", "s": false, "n": "23"}, {"t": "open", "q": "Which assertions are true? n ∈ O(n²), 100n+5 ∈ O(n²), n⁴+n+1 ∈ O(n²)", "a": "First two are TRUE (lower-order polynomials are bounded by n²). The last is FALSE —\nn⁴+n+1 is 4th degree, higher order than n².", "s": false, "n": "24"}, {"t": "open", "q": "Explain the three asymptotic notations: Big-O, Big-Omega, and Big-Theta.", "a": "1. Big-O O(g(n)) — Asymptotic UPPER bound. Used for WORST-case. t(n) grows no faster than\ng(n). Example: O(n²) means at most n² operations.\n2. Big-Omega Ω(g(n)) — Asymptotic LOWER bound. Used for BEST-case. t(n) grows at least as\nfast as g(n). Example: Ω(n) means at least n operations.\n3. Big-Theta Θ(g(n)) — Asymptotic TIGHT bound. Used for AVERAGE-case. t(n) grows at exactly\nthe same rate as g(n). Example: Θ(nlogn) means exactly nlogn rate.", "s": false, "n": "E2"}], "3": [{"t": "mcq", "q": "A straightforward approach for solving a problem is:", "o": ["Backtracking", "Divide-and-conquer", "Greedy technique", "Brute force"], "a": 3, "e": "", "s": false, "n": "25"}, {"t": "mcq", "q": "________ generates each and every element of the problem domain, selects those satisfying all constraints, then finds the desired element.", "o": ["Brute force", "Binary search", "Selection sort", "Exhaustive search"], "a": 3, "e": "", "s": false, "n": "26"}, {"t": "mcq", "q": "Which is NOT true about the Brute force approach?", "o": ["It is inefficient but useful for solving small-size instances", "It is a straightforward approach to solving a problem", "It is one of the easiest strategies", "It is an approximation search approach"], "a": 3, "e": "", "s": false, "n": "27"}, {"t": "mcq", "q": "Which is true about exhaustive search?", "o": ["It is a sequential search approach to combinatorial problems", "It is a brute force approach to combinatorial problems", "It is an approximation algorithm", "It generates small subset elements of the problem domain"], "a": 1, "e": "", "s": false, "n": "28"}, {"t": "mcq", "q": "Which is NOT an example of a combinatorial problem?", "o": ["Traveling salesman problem", "Knapsack problem", "Assignment problem", "Sequential search"], "a": 3, "e": "", "s": false, "n": "29"}, {"t": "mcq", "q": "Applying exhaustive search for the Knapsack problem yields:", "o": ["n² subsets", "n-1 subsets", "2ⁿ subsets", "n³ subsets"], "a": 2, "e": "", "s": false, "n": "30"}, {"t": "mcq", "q": "Total number of permutations needed for Travelling Salesman problem:", "o": ["1/2(n-1)!", "2log(n²)", "2(n-1)", "log(n-1)"], "a": 0, "e": "", "s": false, "n": "31"}, {"t": "mcq", "q": "_________ can be modeled by a weighted graph where vertices = cities and edges = distances.", "o": ["Knapsack problem", "Assignment problem", "Traveling salesman problem", "Binary search problem"], "a": 2, "e": "", "s": false, "n": "32"}, {"t": "mcq", "q": "Brute-force Closest-pair problem: computes distances between all distinct points and finds the pair with:", "o": ["The largest size", "The largest distance", "The smallest size", "The smallest distance"], "a": 3, "e": "", "s": false, "n": "33"}, {"t": "mcq", "q": "In statistics, one important application of the closest-pair problem is:", "o": ["nonnumerical data", "numerical data", "cluster analysis", "critical analysis"], "a": 2, "e": "", "s": false, "n": "34"}, {"t": "mcq", "q": "Efficiency of element uniqueness with pre-sorting using Brute force:", "o": ["O(n²)", "O(2ⁿ)", "O(logn)", "Θ(nlogn)"], "a": 0, "e": "", "s": false, "n": "35"}, {"t": "mcq", "q": "Brute force string matching worst-case time complexity:", "o": ["O(mn)", "O(logn)", "O(nlogn)", "O(logn!)"], "a": 0, "e": "", "s": false, "n": "36"}, {"t": "mcq", "q": "Which sorting algorithm takes least time on a nearly sorted list?", "o": ["Insertion sort", "Bubble sort", "Selection sort", "Both bubble sort and selection sort"], "a": 0, "e": "", "s": false, "n": "37"}, {"t": "mcq", "q": "Worst-case time complexity of Quicksort:", "o": ["O(N)", "O(NlogN)", "O(N²)", "O(logN)"], "a": 2, "e": "", "s": false, "n": "38"}, {"t": "mcq", "q": "Worst-case time complexity of Merge sort:", "o": ["O(N²)", "O(N)", "O(logN)", "O(NlogN)"], "a": 3, "e": "", "s": false, "n": "39"}, {"t": "mcq", "q": "Average-case insertion sort comparisons on a random array:", "o": ["Cavg(n) ∈ O(log₂n)", "Cavg(n) ∈ O(nlog₂n)", "Cavg(n) ∈ O(n²)", "Cavg(n) ∈ O(nlog₂n!)"], "a": 2, "e": "", "s": false, "n": "40"}, {"t": "mcq", "q": "Merge sort: after two recursive calls but before the merge step, which is true?", "o": ["The array elements form a heap", "Elements in each half are sorted amongst themselves", "Elements in the first half are ≤ elements in the second half", "The array elements are fully sorted"], "a": 1, "e": "", "s": false, "n": "41"}, {"t": "open", "q": "Show divide/conquer/combine steps for Merge sort on A=[7,1,4,10,2,15,3,5]:", "a": "Divide: [7,1,4,10] [2,15,3,5]\nConquer: [1,4,7,10] [2,3,5,15]\nCombine: [1,2,3,4,5,7,10,15]", "s": false, "n": "42"}, {"t": "open", "q": "What is Brute Force? Define it and explain its main types with examples.", "a": "Definition: Brute Force is a straightforward approach to solving a problem, directly based on the\nproblem statement without any optimization. It applies the simplest and most direct strategy.\nMain Types:\n1. Sequential Search: Compares a key with each list element one by one until a match is found or\nthe list is exhausted. Time: Best O(1), Worst O(n).\n2. Bubble Sort: Repeatedly compares adjacent elements and swaps them if out of order. Time:\nO(n²).\n3. Selection Sort: Scans the list to find the minimum element, swaps it to the front, repeats. Time:\nO(n²).\n4. Brute-Force String Matching: Tries every position in the text to match the pattern. Time: O(mn).\n5. Closest-Pair (Brute Force): Computes the Euclidean distance between every pair of points and\nreturns the minimum. Time: O(n²).", "s": false, "n": "E3A"}, {"t": "open", "q": "What is Exhaustive Search? Define it and explain its main problem types.", "a": "Definition: Exhaustive Search is a brute-force approach applied to combinatorial problems. It\ngenerates every element of the problem domain, selects those that satisfy all constraints, and finds\nthe desired element (minimum cost or maximum value). Guarantees optimal solution but is only\npractical for small inputs.\nMain Problem Types:\n1. Traveling Salesman Problem (TSP): Find the shortest Hamiltonian circuit visiting every city\nexactly once and returning to start. Generates all (n-1)!/2 permutations. Time: O(n!).\n2. Knapsack Problem: Find a subset of n items (each with weight and value) that maximizes total\nvalue without exceeding capacity W. Generates all 2ⁿ subsets. Time: O(2ⁿ).\n3. Assignment Problem: Assign n jobs to n workers to minimize total cost. Generates all n!\nassignments. Time: O(n!).\nKey characteristic: all three are NP-hard — no known polynomial-time algorithm exists.", "s": false, "n": "E3B"}], "4": [{"t": "mcq", "q": "This algorithm is based on the relationship between a solution to an instance and a solution to its smaller instance:", "o": ["Decrease-and-conquer", "Greedy", "Brute force", "Transform-and-conquer"], "a": 0, "e": "", "s": false, "n": "43"}, {"t": "mcq", "q": "Which is NOT among major variations of decrease-and-conquer?", "o": ["Decrease by a constant", "Decrease by a constant factor", "Exhaustive approach", "Variable size decrease"], "a": 2, "e": "", "s": false, "n": "44"}, {"t": "mcq", "q": "The major types of Decrease-and-conquer do NOT include:", "o": ["Decrease-by-a-constant", "Decrease-by-a-constant-factor", "Variable-size-decrease", "Infinite-size-decrease"], "a": 3, "e": "", "s": false, "n": "45"}, {"t": "mcq", "q": "In decrease-and-conquer (decrease by constant), the recurrence relation is:", "o": ["an = an-2 · f(n-2)", "an = an-1 · f(n)", "an = an-4 · f(n-4)", "an = an-1"], "a": 1, "e": "", "s": false, "n": "46"}, {"t": "mcq", "q": "Binary search is an example of:", "o": ["Decrease-by-a-constant of 3", "Variable size decrease", "Decrease-by-a-constant factor = n/2", "Decrease constant factor = n/n-2/n-3"], "a": 2, "e": "", "s": false, "n": "47"}, {"t": "mcq", "q": "Which of the following is incorrect about Binary Search?", "o": ["Binary search is based on decrease-by-conquer", "Binary search is an example of divide-and-conquer", "Binary search is used on pre-sorted data", "Binary search is an example of decrease-by-a-constant factor = n/2"], "a": 1, "e": "", "s": false, "n": "48"}, {"t": "mcq", "q": "Worst-case number of key comparisons for binary search:", "o": ["Cworst(n) = ⌊log₂n⌋ + 1", "Cworst(n) = nlog₂n + 1", "Cworst(n) = n²log₂n + 1", "Cworst(n) = log₂n!"], "a": 0, "e": "", "s": false, "n": "49"}, {"t": "mcq", "q": "In Depth First Search, how many times is a node visited?", "o": ["Once", "Thrice", "Twice", "Equal to the number of indegrees of the node"], "a": 0, "e": "", "s": false, "n": "50"}, {"t": "mcq", "q": "Data structure used in standard implementation of Depth First Search:", "o": ["Queue", "Linked list", "Tree", "Stack"], "a": 3, "e": "", "s": false, "n": "51"}, {"t": "mcq", "q": "Data structure used in standard implementation of Breadth First Search:", "o": ["Linked list", "Tree", "Queue", "Stack"], "a": 2, "e": "", "s": false, "n": "52"}, {"t": "mcq", "q": "Breadth-first search has the same efficiency as:", "o": ["Depth-first search", "Binary search", "Insertion sort", "Exhaustive search"], "a": 0, "e": "", "s": false, "n": "53"}, {"t": "mcq", "q": "Which is NOT an application of Breadth First Search?", "o": ["Finding shortest path between two nodes", "Path finding", "GPS navigation system", "Finding bipartiteness of a graph"], "a": 1, "e": "", "s": false, "n": "54"}, {"t": "mcq", "q": "Time complexity of BFS (V = vertices, E = edges):", "o": ["O(V)", "O(V·E)", "O(V+E)", "O(E)"], "a": 2, "e": "", "s": false, "n": "55"}, {"t": "mcq", "q": "Which edge type is NOT in a DFS forest of a directed graph?", "o": ["Tree edges", "Edges without direction", "Forward edges", "Back edges"], "a": 1, "e": "", "s": false, "n": "56"}, {"t": "mcq", "q": "Which is NOT true about a directed graph (digraph)?", "o": ["Adjacency matrix and lists are two principal representation means", "Traversal algorithms are DFS and BFS", "It might not have directions on all edges", "It is a graph with directions specified for all its edges"], "a": 2, "e": "", "s": false, "n": "57"}, {"t": "mcq", "q": "[Image] The graph below represents which variation of decrease-and-conquer? (GCD – Euclid's algorithm)", "o": ["decrease-by-a-constant 6", "decrease-by-a-constant factor = 106/6", "decrease constant factor = 16/10", "variable size decrease"], "a": 3, "e": "", "s": false, "n": "58"}, {"t": "mcq", "q": "[Image] The graph below represents which variation of decrease-and-conquer? (problem of size n → subproblem of size n-1)", "o": ["decrease-by-a-constant factor", "decrease constant = n·(n-1)·(n-2)", "decrease-by-a-constant", "variable size decrease"], "a": 2, "e": "", "s": false, "n": "59"}, {"t": "mcq", "q": "[Image] BFS traversal stack for the graph below (start with 'a' for inner component, 'h' for outer):", "o": ["a1e2d3c4f5b6, g7j8i9h10", "a1c2d3e4f5b6, h7g8i9j10", "c1e2d3c4f5a6, j7h8i9g10", "e1a2d3c4f5b6, h7j8i9g10"], "a": 1, "e": "", "s": false, "n": "60"}, {"t": "mcq", "q": "[Image] Which type of edges is NOT possible for the following diagram?", "o": ["cross edges (dc)", "forward edges (ac)", "back edges (ba)", "tree edges (ac, bcd, cde)"], "a": 3, "e": "", "s": false, "n": "61"}, {"t": "open", "q": "Explain the three variations of Decrease-and-Conquer with an example for each.", "a": "1. Decrease by a Constant (usually by 1): Problem size reduced by 1 each step. Recurrence: an =\nan-1 · f(n). Examples: Insertion Sort, DFS, BFS, computing n! recursively.\n2. Decrease by a Constant Factor (usually by 2): Problem size divided by a fixed factor k each step.\nExamples: Binary Search (halves the range each time), Russian Peasant Multiplication.\n3. Variable-Size Decrease: Size reduction varies each step. Example: Euclid's GCD —\ngcd(106,16)→gcd(16,10)→gcd(10,6)→gcd(6,4)→gcd(4,2)=2. The decrease equals the remainder,\nwhich is variable.", "s": false, "n": "E4"}], "5": [{"t": "mcq", "q": "Which is NOT true about divide-and-conquer?", "o": ["suited for parallel computations", "more efficient than even a brute-force", "not suited for sequential computation", "its plan consists of divide, conquer, and combine"], "a": 2, "e": "", "s": false, "n": "62"}, {"t": "mcq", "q": "Which is NOT true about divide-and-conquer?", "o": ["It is based on recursion", "A problem is divided into several subproblems of the same type", "A divide-and-conquer algorithm is necessarily more efficient than brute force", "A divide-and-conquer algorithm is less efficient than brute force"], "a": 2, "e": "", "s": false, "n": "63"}, {"t": "mcq", "q": "Running time formula for divide-and-conquer of size n divided into b instances of size n/b (a ≥ 1, b > 1): [Master Theorem]", "o": ["T(n) = aT(n/b)", "T(n) = aT(b) + f(n)", "T(n) = aT(n/b) + f(n)", "T(n) = aT(n) + f(n)"], "a": 2, "e": "", "s": false, "n": "64"}, {"t": "mcq", "q": "The term f(n) in the formula T(n) = aT(n/b) + f(n) represents: [Master Theorem]", "o": ["time spent dividing into instances of size b", "time spent dividing into instances of size b/n", "time spent dividing instance of size n² into size n/b", "time spent dividing an instance of size n into instances of size n/b and combining solutions"], "a": 3, "e": "", "s": false, "n": "65"}, {"t": "mcq", "q": "In divide-and-conquer, the order of growth T(n) depends on: [Master Theorem]", "o": ["values of constants a and b only", "values of constants a and b AND the order of growth of f(n)", "the order of growth of f(n) only", "the value of constant a only"], "a": 1, "e": "", "s": false, "n": "66"}, {"t": "mcq", "q": "Efficiency of solving multiplication of two large numbers using Divide-and-conquer: [Master Theorem]", "o": ["T(n) = 4T(n/4)", "T(n) = 4T(n/2)", "T(n) = 3T(n/2)", "T(n) = 3T(n/4)"], "a": 2, "e": "", "s": false, "n": "67"}, {"t": "mcq", "q": "Time complexity of Strassen's matrix multiplication algorithm: [Master Theorem]", "o": ["O(n²)", "O(n^log₂7)  [ = T(n) = 7T(n/2) ]", "O(n³)", "O(n log n)"], "a": 1, "e": "", "s": false, "n": "68"}, {"t": "mcq", "q": "In mergesort when n > 1, the recurrence relation for key comparisons: [Master Theorem]", "o": ["C(n) = C(n-1) + n", "C(n) = n²", "C(n) = 2C(n/2) + n - 1", "C(n) = log 1"], "a": 2, "e": "", "s": false, "n": "69"}, {"t": "mcq", "q": "It is more efficient to solve multiplication of two large numbers using:", "o": ["Brute force", "Divide-and-conquer", "Exhaustive search", "Grade-school algorithm"], "a": 1, "e": "", "s": false, "n": "70"}, {"t": "mcq", "q": "Strassen's matrix multiplication is an application of:", "o": ["Sequential search", "Brute force", "Exhaustive search", "Divide-and-conquer"], "a": 3, "e": "", "s": false, "n": "71"}, {"t": "mcq", "q": "If a problem can be solved by combining solutions to non-overlapping sub-problems, the strategy is:", "o": ["Dynamic programming", "Greedy", "Divide and conquer", "Brute force"], "a": 2, "e": "", "s": false, "n": "72"}, {"t": "mcq", "q": "Breaking the problem into smaller sub-problems is the responsibility of the _____ step.", "o": ["divide", "sort", "conquer", "combine"], "a": 0, "e": "", "s": false, "n": "73"}, {"t": "mcq", "q": "Runtime efficiency of divide-and-conquer for the closest-pair problem:", "o": ["O(N)", "O(NlogN)", "O(N²)", "O(N³logN)"], "a": 1, "e": "", "s": false, "n": "74"}, {"t": "mcq", "q": "Θ(nlogn) + O(n) for element uniqueness with presorting represents:", "o": ["space consumed for checking consecutive elements", "sum of sorting time and memory space", "sum of sorting time and checking consecutive elements time", "time spent on sorting only"], "a": 2, "e": "", "s": false, "n": "75"}, {"t": "mcq", "q": "Efficiency of element uniqueness with pre-sorting using Merge sort:", "o": ["O(n²)", "O(2ⁿ)", "Θ(nlogn)", "O(n!)"], "a": 2, "e": "", "s": false, "n": "76"}, {"t": "mcq", "q": "Which algorithm has worst-case quadratic time among divide-and-conquer?", "o": ["Mergesort", "Strassen's", "Closest-pair", "Quicksort"], "a": 3, "e": "", "s": false, "n": "77"}, {"t": "mcq", "q": "Best-case complexity of Quicksort:", "o": ["O(log n)", "O(n)", "O(n²)", "O(nlogn)"], "a": 3, "e": "", "s": false, "n": "78"}, {"t": "mcq", "q": "Partitioning scheme used in Quicksort:", "o": ["Bellman-Ford's", "Hoare's", "Dijkstra's", "Kruskal's"], "a": 1, "e": "", "s": false, "n": "79"}, {"t": "mcq", "q": "The ____________ technique can be used for parallel computations.", "o": ["decrease and conquer", "greedy", "divide and conquer", "brute force"], "a": 2, "e": "", "s": false, "n": "80"}, {"t": "mcq", "q": "In knapsack problem, the goal is to _______ total weight and _______ total value.", "o": ["Minimizes, Minimizes", "Maximizes, Maximizes", "Maximizes, Minimizes", "Minimizes, Maximizes"], "a": 3, "e": "", "s": false, "n": "81"}, {"t": "mcq", "q": "In postorder traversal, the root is visited:", "o": ["Only if it is a leaf", "After left and right subtrees", "Between subtrees", "First"], "a": 1, "e": "", "s": false, "n": "82"}, {"t": "mcq", "q": "Which algorithm is NOT divide-and-conquer?", "o": ["Binary tree traversals", "Mergesort", "Strassen's algorithm", "Dijkstra's algorithm"], "a": 3, "e": "", "s": false, "n": "83"}, {"t": "mcq", "q": "Which is NOT a suitable candidate for decrease-and-conquer?", "o": ["Insertion into a sorted list", "Searching in a sorted array", "Selection sort", "Multiplying two matrices"], "a": 2, "e": "", "s": false, "n": "84"}, {"t": "mcq", "q": "[Image] Which algorithm does the following figure represent?", "o": ["Divide-and-conquer", "Transform-and-conquer", "Decrease-and-conquer", "Greedy algorithm"], "a": 0, "e": "", "s": false, "n": "85"}, {"t": "mcq", "q": "Which algorithm does the following figure represent? (Q23 from exam paper)", "o": ["Decrease-and-conquer", "Divide-and-conquer", "Transform-and-conquer", "Greedy algorithm"], "a": 1, "e": "", "s": false, "n": "86"}, {"t": "open", "q": "What is the Master Theorem? State its three cases and give an example for each.", "a": "[Master Theorem]\nAnswer:\nThe Master Theorem provides a closed-form solution for recurrences of the form\nT(n) = aT(n/b) + f(n), where a ≥ 1 and b > 1 are constants and f(n) is a function.", "s": false, "n": "E5A"}, {"t": "open", "q": "Explain the Divide-and-Conquer technique – its steps and compare it with Decrease-and-Conquer.", "a": "Three steps of Divide-and-Conquer:\n1. DIVIDE: Split the problem into multiple subproblems of the same type (usually 2 of size n/2).\n2. CONQUER: Solve each subproblem recursively until base case is reached.\n3. COMBINE: Merge subproblem solutions to form the answer to the original problem.\nRecurrence: T(n) = aT(n/b) + f(n) — solved using the Master Theorem.\nComparison with Decrease-and-Conquer:\nDivide-and-Conquer: splits into MULTIPLE subproblems, solves ALL, then combines. Suits parallel\ncomputation.\nDecrease-and-Conquer: reduces to ONE smaller instance, no combining step. Suits sequential\ncomputation.", "s": false, "n": "E5B"}]}}, "CS350": {"name": "Introduction to Database", "chapters": {"1": [{"t": "mcq", "q": "Which term is used to define the computerized system that enables users to create and maintain a database?", "o": ["Database", "Database system", "Meta-data", "Database Management System (DBMS)"], "
