in CPU", "can access main memory at the same time as the main CPU "], "a": 2, "e": "", "s": false, "n": 45}, {"t": "open", "q": "Why is DMA used for devices that execute large transfers?", "a": "Without DMA the CPU must use programmed I/O, watching status bits and feeding data one byte at a time. A DMA controller (special-purpose processor) copies data in chunks, lightening the CPU's burden.", "s": false, "n": 46}, {"t": "mcq", "q": "Buffering is used to:", "o": ["Replace disk", "Handle speed mismatch", "Increase CPU speed", "Reduce storage "], "a": 1, "e": "", "s": false, "n": 47}, {"t": "mcq", "q": "Spooling is useful when:", "o": ["Cache fails", "Multiple CPUs exist ", "A device handles one request at a time", "Memory is full "], "a": 2, "e": "", "s": true, "n": 48}, {"t": "mcq", "q": "In a kernel I/O subsystem, which buffer holds the output for a device?", "o": ["status", "spool", "magic", "Output "], "a": 1, "e": "", "s": false, "n": 49}, {"t": "mcq", "q": "To prevent user programs from interfering with the proper operation of the system, the hardware has two modes:", "o": ["general mode and specialized mode", "base mode and derived mode", "program mode and inductive mode", "user mode and kernel mode "], "a": 3, "e": "", "s": true, "n": 50}, {"t": "mcq", "q": "What are some other terms for kernel mode?", "o": ["supervisor mode", "system mode", "privileged mode", "All of the above "], "a": 3, "e": "", "s": false, "n": 51}, {"t": "mcq", "q": "Which statement concerning privileged instructions is FALSE?", "o": ["They may cause harm to the system", "They can only be executed in kernel mode", "They cannot be attempted from user mode", "They are used to manage interrupts "], "a": 2, "e": "", "s": false, "n": 52}, {"t": "open", "q": "Describe the operating system's two modes of operation.", "a": "Hardware provides a mode bit to tell user mode (running user applications) from kernel mode (running OS code). When an application requests an OS service through a system call, the system switches to kernel mode; on return it resets to user mode. Privileged instructions run only in kernel mode.", "s": false, "n": 53}, {"t": "mcq", "q": "A ____ can be used to prevent a user program from never returning control to the operating system.", "o": ["portal", "program counter", "firewall", "timer "], "a": 3, "e": "", "s": false, "n": 54}, {"t": "open", "q": "What is the purpose of a programmable interval timer?", "a": "Hardware that measures elapsed time and triggers operations. The scheduler uses it to generate an interrupt that preempts a process at the end of its time slice (and stops infinite loops).", "s": false, "n": 55}, {"t": "mcq", "q": "______ are the services provided outside of the kernel.", "o": ["System daemons", "System call", "Trap", "Exceptions "], "a": 0, "e": "", "s": false, "n": 56}, {"t": "mcq", "q": "Which of the following would lead you to believe that a given system is an SMP-type system?", "o": ["Each processor is assigned a specific task", "There is a boss–worker relationship between the processors", "Each processor performs all tasks within the operating system", "None of the above "], "a": 2, "e": "", "s": false, "n": 57}, {"t": "mcq", "q": "Virtually all modern operating systems provide support for SMP.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 58}, {"t": "mcq", "q": "A dual-core system requires that each core has its own cache memory.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": 59}, {"t": "mcq", "q": "What is a key advantage of placing multiple processor cores on the same physical chip?", "o": ["It removes context-switching overhead entirely", "It is faster and consumes less power", "It increases dispatch latency", "It eliminates the need for scheduling "], "a": 1, "e": "", "s": false, "n": 60}, {"t": "open", "q": "Why is multi-core processing more efficient than placing each processor on its own chip?", "a": "Communication between processors on the same chip is faster than between processors on separate chips.", "s": false, "n": 61}, {"t": "open", "q": "List two advantages of multiprocessor systems.", "a": "Increased throughput, economy of scale, and increased reliability (graceful degradation / fault tolerance) – any two.", "s": false, "n": 62}, {"t": "open", "q": "Explain the difference between asymmetric and symmetric multiprocessing.", "a": "In asymmetric multiprocessing each processor is assigned a specific task (boss– worker). In symmetric multiprocessing (SMP) each processor performs all tasks within the operating system.", "s": false, "n": 63}, {"t": "open", "q": "Distinguish between uniform memory access (UMA) and non-uniform memory access (NUMA) systems.", "a": "On UMA, accessing RAM takes the same time from any CPU. On NUMA, some parts of memory take longer to access than others, creating a performance penalty.", "s": false, "n": 64}, {"t": "mcq", "q": "A clustered system ____.", "o": ["gathers together multiple CPUs to accomplish computational work", "is an operating system that provides file sharing across a network", "is used when rigid time requirements are present", "can only operate one application at a time "], "a": 0, "e": "", "s": false, "n": 65}, {"t": "open", "q": "Why are clustered systems considered to provide high-availability service?", "a": "They are built from two or more coupled systems, so redundancy exists: if one system fails, another can take over its task.", "s": false, "n": 66}, {"t": "mcq", "q": "A(n) ________ is the unit of work in a system.", "o": ["process", "operating system", "timer", "mode bit "], "a": 0, "e": "", "s": false, "n": 67}, {"t": "mcq", "q": "A process within an operating system refers to ________.", "o": ["A file stored on disk", "A program in execution ", "A block of allocated memory", "A set of related threads "], "a": 1, "e": "", "s": true, "n": 68}, {"t": "mcq", "q": "Which of the following is an activity of Process Management?", "o": ["Providing a user interface", "Creating and deleting both user and system processes", "Managing the virtual memory page file", "Defragmenting the hard disk "], "a": 1, "e": "", "s": false, "n": 69}, {"t": "open", "q": "Give three examples of resource types.", "a": "CPU cycles, memory space, I/O devices (also file storage).", "s": false, "n": 70}, {"t": "open", "q": "Which feature can allow an operating system to execute multiple OSs on one machine?", "a": "Virtual machine", "s": false, "n": 71}, {"t": "mcq", "q": "Parallel desktops are an example of ______.", "o": ["Type-0 Hypervisor", "Emulators", "Type 2 Hypervisor", "Type 1 Hypervisor "], "a": 2, "e": "", "s": true, "n": 72}, {"t": "mcq", "q": "A special-purpose operating system that runs on native hardware is ______.", "o": ["Type 2 hypervisor", "Emulator", "Type 1 Hypervisor", "Type 0 hypervisor "], "a": 2, "e": "", "s": true, "n": 73}, {"t": "mcq", "q": "Which of these is an example of a Type 1 hypervisor?", "o": ["Citrix XenServer", "Oracle VirtualBox", "IBM LPARs", "Oracle LDOMs "], "a": 0, "e": "", "s": false, "n": 74}, {"t": "mcq", "q": "Type of VM where a hardware feature implemented by firmware requires no special OS handling, and the VMM is in the firmware:", "o": ["Type 1 Hypervisor", "Type 0 Hypervisor ", "Programming Environment Virtualization", "Paravirtualization "], "a": 1, "e": "", "s": false, "n": 75}, {"t": "mcq", "q": "______ is the technique in which the guest operating system is modified to work in cooperation with the VMM to optimize performance.", "o": ["Emulators", "Paravirtualization", "Virtualization", "Programming environment virtualization "], "a": 1, "e": "", "s": true, "n": 76}, {"t": "mcq", "q": "When page-table changes are needed in paravirtualization, the guest uses ______.", "o": ["Interrupt", "Signaling", "System call", "Hypercall "], "a": 3, "e": "", "s": true, "n": 77}, {"t": "mcq", "q": "______ is not virtualization but provides virtualization-like features.", "o": ["Application containment", "Paravirtualization", "Emulators", "Programming environment virtualization "], "a": 0, "e": "", "s": false, "n": 78}, {"t": "mcq", "q": "The process of moving a running VM from one host to another is:", "o": ["Live migration", "Templating", "Simulating", "Application containment "], "a": 0, "e": "", "s": false, "n": 79}, {"t": "open", "q": "Define: Paravirtualization, Templating, and Live Migration.", "a": "Paravirtualization – the guest OS is modified to cooperate with the VMM to optimize performance. Templating – create an OS + application VM image, provide it to customers, and use it to create multiple instances. Live migration – move a running VM from one host to another without interrupting it.", "s": false, "n": 80}, {"t": "mcq", "q": "Embedded computers typically run on a ____ operating system.", "o": ["real-time", "Windows XP", "network", "clustered "], "a": 0, "e": "", "s": false, "n": 81}, {"t": "mcq", "q": "Bluetooth and 802.11 devices use wireless technology to communicate over several feet, in essence creating a ____.", "o": ["local-area network", "wide-area network", "small-area network", "metropolitan-area network "], "a": 2, "e": "", "s": false, "n": 82}, {"t": "mcq", "q": "Which of the following is a property of peer-to-peer systems?", "o": ["Clients and servers are not distinguished from one another", "Separate machines act as either the client or the server but not both", "They do not offer any advantages over client-server systems", "They suffer from the server acting as the bottleneck "], "a": 0, "e": "", "s": true, "n": 83}, {"t": "mcq", "q": "Which configuration allows each node to act as both client and server?", "o": ["Client-server", "Peer-to-peer", "Hybrid", "Centralized "], "a": 1, "e": "", "s": true, "n": 84}, {"t": "mcq", "q": "A ____ provides a file-system interface which allows clients to create and modify files.", "o": ["compute-server system", "file-server system", "wireless network", "network computer "], "a": 1, "e": "", "s": false, "n": 85}, {"t": "open", "q": "Describe the compute-server and file-server types of server systems.", "a": "A compute-server provides an interface through which a client requests an action (e.g., read data from a database); the server executes it and returns the results. A file-server provides a file-system interface where clients create, update, read and delete files (e.g., a Web server delivering files to browsers).", "s": false, "n": 86}, {"t": "mcq", "q": "What better describes a distributed system?", "o": ["A collection of nodes with no interconnection", "A collection of tightly coupled nodes", "A collection of loosely coupled nodes interconnected by a communications network", "A collection of nodes with limited resources "], "a": 2, "e": "", "s": false, "n": 87}, {"t": "mcq", "q": "Which of the following statements is FALSE?", "o": ["Mobile devices must be concerned with power consumption", "Mobile devices can provide features unavailable on desktops or laptops", "The difference in storage capacity between a mobile device and a laptop is shrinking", "Mobile devices usually have fewer processing cores than a standard desktop computer "], "a": 2, "e": "", "s": false, "n": 88}, {"t": "mcq", "q": "______ is a mobile operating system designed for the iPhone and iPad.", "o": ["Mac OS X", "Android", "UNIX", "iOS "], "a": 3, "e": "", "s": false, "n": 89}, {"t": "mcq", "q": "Processors for most mobile devices run at a slower speed than a processor in a desktop PC.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 90}, {"t": "open", "q": "What two operating systems currently dominate mobile computing?", "a": "Apple's iOS and Google's Android.", "s": false, "n": 91}, {"t": "mcq", "q": "iOS is open source, Android is closed source.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": 92}, {"t": "open", "q": "Distinguish mobile computing from traditional desktop computing.", "a": "Mobile computing happens on portable, lightweight handheld devices and tablets, which usually have less processing power and storage than desktops. Features such as GPS and accelerometers give them functionality desktops lack.", "s": false, "n": 93}, {"t": "mcq", "q": "In the context of cloud computing, what does IaaS stand for?", "o": ["Integration as a Service", "Infrastructure as a Service", "Interface as a Service", "Internet as a Service "], "a": 1, "e": "", "s": true, "n": 94}, {"t": "mcq", "q": "______ is a software stack ready for application use via the Internet.", "o": ["Platform as a Service", "Software as a Service", "Network as a Service", "Infrastructure as a Service "], "a": 0, "e": "", "s": false, "n": 95}, {"t": "open", "q": "Describe cloud computing.", "a": "Computing that delivers computing, storage and application services across a network, often built on virtualization. It can be public, private or hybrid, and can offer applications (SaaS), platforms (PaaS) or infrastructure (IaaS).", "s": false, "n": 96}, {"t": "open", "q": "List the main types of cloud computing deployment models.", "a": "Public cloud, private cloud, hybrid cloud.", "s": false, "n": 97}, {"t": "mcq", "q": "Which of the following statements concerning open-source operating systems is true?", "o": ["Solaris is open source", "Source code is freely available", "They are always more secure than commercial closed systems", "All open-source operating systems share the same set of goals "], "a": 1, "e": "", "s": false, "n": 98}, {"t": "mcq", "q": "Which of the following operating systems is not open source?", "o": ["Windows", "BSD UNIX", "Linux", "PCLinuxOS "], "a": 0, "e": "", "s": false, "n": 99}, {"t": "mcq", "q": "A ____ is a custom build of the Linux operating system.", "o": ["LiveCD", "installation", "distribution", "VMWare Player "], "a": 2, "e": "", "s": false, "n": 100}, {"t": "mcq", "q": "KDE and GNOME desktops are available under open-source licenses.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 101}, {"t": "mcq", "q": "Which of the following statements is incorrect?", "o": ["An operating system provides an environment for the execution of programs", "An operating system manages system resources ", "Operating systems provide both command-line and graphical user interfaces", "Operating systems must provide both protection and security "], "a": 2, "e": "an OS may provide a CLI, a GUI, or both.", "s": false, "n": 102}, {"t": "mcq", "q": "If a program terminates abnormally, a dump of memory may be examined by a ____ to determine the cause of the problem.", "o": ["module", "debugger", "shell", "control card "], "a": 1, "e": "", "s": false, "n": 103}, {"t": "mcq", "q": "The two main models of Inter-Process Communication (IPC) are:", "o": ["Paging and Segmentation", "Virtual Memory and Caching", "Multithreading and Multiprocessing", "Shared Memory and Message Passing "], "a": 3, "e": "", "s": true, "n": 104}, {"t": "mcq", "q": "In message passing, how do processes communicate?", "o": ["By reading/writing shared memory", "By exchanging messages via send/receive", "By using a disk file", "By modifying each other's memory "], "a": 1, "e": "", "s": false, "n": 105}, {"t": "mcq", "q": "A message-passing model is ____.", "o": ["easier to implement than a shared-memory model for intercomputer communication", "faster than the shared-memory model", "a network protocol, and does not apply to operating systems", "only useful for small simple operating systems "], "a": 0, "e": "", "s": false, "n": 106}, {"t": "open", "q": "Explain the difference between protection and security.", "a": "Protection is concerned with controlling the access of processes or users to the resources of the computer system. Security defends the system from internal or external attacks.", "s": false, "n": 107}, {"t": "mcq", "q": "Which of the following is NOT a primary method for users to interact directly with an operating system?", "o": ["Network interfaces ", "Graphical user interfaces", "Touchscreen interfaces", "Command interpreters "], "a": 0, "e": "", "s": false, "n": 108}, {"t": "mcq", "q": "A ____ is an example of a systems program.", "o": ["command interpreter", "Web browser", "text formatter", "database system "], "a": 0, "e": "", "s": false, "n": 109}, {"t": "open", "q": "Commands can be processed by a command interpreter in two ways: the interpreter contains the code to execute the command, or the commands are implemented as system programs. Compare the two approaches.", "a": "(1) Built-in code: fast and simple, but every new command means rewriting the interpreter, which can become complicated and large. (2) System programs: new commands can be added without changing the interpreter, but it is slower and passing parameters from the interpreter to the program is clumsy.", "s": false, "n": 110}, {"t": "mcq", "q": "____ provide(s) an interface to the services provided by an operating system.", "o": ["Shared memory", "System calls", "Simulators", "Communication "], "a": 1, "e": "", "s": false, "n": 111}, {"t": "mcq", "q": "____ is not one of the major categories of system calls.", "o": ["Process control", "Communications", "Protection", "Security "], "a": 3, "e": "", "s": false, "n": 112}, {"t": "mcq", "q": "Which system call is used in Unix to open a file?", "o": ["CreateFile()", "Open()", "Read()", "Write() "], "a": 1, "e": "", "s": false, "n": 113}, {"t": "mcq", "q": "One process can create a child process using the ______ system call.", "o": ["release", "fork()", "exit", "acquire() "], "a": 1, "e": "", "s": true, "n": 114}, {"t": "mcq", "q": "The Windows CreateProcess() system call creates a new process. What is the equivalent system call in UNIX?", "o": ["NTCreateProcess()", "process()", "fork()", "getpid() "], "a": 2, "e": "", "s": false, "n": 115}, {"t": "mcq", "q": "The close() system call in UNIX is used to close a file. What is the equivalent system call in Windows?", "o": ["CloseHandle()", "close()", "CloseFile()", "Exit() "], "a": 0, "e": "", "s": false, "n": 116}, {"t": "mcq", "q": "The Windows CreateFile() system call is used to create a file. What is the equivalent system call in UNIX?", "o": ["ioctl()", "open()", "fork()", "createfile() "], "a": 1, "e": "", "s": false, "n": 117}, {"t": "mcq", "q": "The ________ provides a portion of the system call interface for UNIX and Linux.", "o": ["POSIX", "Java", "Standard C library", "Standard API "], "a": 2, "e": "", "s": false, "n": 118}, {"t": "mcq", "q": "____ is/are not a technique for passing parameters from an application to a system call.", "o": ["Cache memory", "Registers ", "Stack", "Special block in memory "], "a": 0, "e": "", "s": false, "n": 119}, {"t": "open", "q": "Describe the relationship between an API, the system-call interface, and the operating system.", "a": "The system-call interface links the programming language to the system calls the OS provides. It intercepts function calls in the API and invokes the needed system call in the OS, so the API (through the run-time support library) hides most details of the OS interface from the programmer.", "s": false, "n": 120}, {"t": "open", "q": "Describe three general methods used to pass parameters to the operating system during system calls.", "a": "(1) Pass the parameters in registers. (2) Store them in a block or table in memory and pass the block's address in a register. (3) Push the parameters onto the stack and let the OS pop them off.", "s": false, "n": 121}, {"t": "mcq", "q": "System calls can run in either user mode or kernel mode.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": 122}, {"t": "mcq", "q": "Application programmers typically use an API rather than directly invoking system calls.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 123}, {"t": "mcq", "q": "In general, Windows system calls have longer, more descriptive names, and UNIX system calls have shorter, less descriptive names.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 124}, {"t": "mcq", "q": "Many operating systems merge I/O devices and files into a combined file because of the similarity of the system calls for each.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 125}], "2": [{"t": "mcq", "q": "A process in an operating system can be defined as:", "o": ["A set of related threads running concurrently", "A program in execution", "An allocated space for a program", "A file stored on disk "], "a": 1, "e": "", "s": true, "n": 1}, {"t": "mcq", "q": "The difference between a program and a process is that a program is an active entity while a process is a passive entity.", "o": ["True", "False"], "a": 1, "e": "a program is passive; a process is active.", "s": false, "n": 2}, {"t": "mcq", "q": "The ____ of a process contains temporary data such as function parameters, return addresses, and local variables.", "o": ["text section", "data section", "program counter", "stack "], "a": 3, "e": "", "s": false, "n": 3}, {"t": "mcq", "q": "Which section of a process contains global variables?", "o": ["Heap Section", "Data Section", "Text Section", "Stack Section "], "a": 1, "e": "", "s": true, "n": 4}, {"t": "mcq", "q": "The memory layout of a process is typically divided into multiple sections. Which section is NOT included?", "o": ["Text section (the executable code) ", "Data section (global variables)", "Heap section (memory dynamically allocated during run time)", "Process section "], "a": 3, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "The process is in ______ state if it is waiting to be assigned to a processor.", "o": ["Ready", "Running", "Waiting", "Terminated "], "a": 0, "e": "", "s": true, "n": 6}, {"t": "mcq", "q": "Which of the following states of a process is NOT defined correctly?", "o": ["Terminated: the process has finished execution", "Running: instructions are being executed", "New: the process is being created", "Ready: the process is waiting for some event to occur "], "a": 3, "e": "that describes the Waiting state; Ready means waiting to be assigned to a processor.", "s": false, "n": 7}, {"t": "mcq", "q": "Which of the following is NOT a valid process state?", "o": ["Ready", "Starvation", "Running", "New "], "a": 1, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "A process may transition to the Ready state by which of the following actions?", "o": ["Completion of an I/O event", "Awaiting its turn on the CPU", "Newly-admitted process", "All of the above "], "a": 3, "e": "", "s": false, "n": 9}, {"t": "mcq", "q": "For a single-processor system, there will never be more than one process in the Running state.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 10}, {"t": "open", "q": "Name and describe the different states a process can exist in at any given time.", "a": "New – the process is being created. Running – instructions are being executed. Waiting – the process is waiting for some event (such as I/O completion or a signal). Ready – the process is waiting to be assigned to a processor. Terminated – the process has finished execution.", "s": false, "n": 11}, {"t": "mcq", "q": "Each process is represented in the operating system by a ______; also called a task control block.", "o": ["Stack", "Translation Lookaside Buffer", "Program control block", "Process control block "], "a": 3, "e": "", "s": true, "n": 12}, {"t": "mcq", "q": "What is the purpose of a Process Control Block (PCB) in an operating system?", "o": ["It holds the hardware design of the CPU", "It stores only the executable code of a process", "It is used for security purposes only", "It contains essential information about a process "], "a": 3, "e": "", "s": false, "n": 13}, {"t": "mcq", "q": "A process control block ____.", "o": ["includes information on the process's state", "stores the address of the next instruction to be processed by a different process", "determines which process is to be executed next", "is an example of a process queue "], "a": 0, "e": "", "s": false, "n": 14}, {"t": "mcq", "q": "In the PCB, ______ indicates the location of the next instruction to execute.", "o": ["I/O status information", "Memory-management information", "Program counter", "CPU register "], "a": 2, "e": "", "s": false, "n": 15}, {"t": "mcq", "q": "PCB stands for:", "o": ["Program Control Buffer", "Program Control block", "Process Control Buffer", "Process Control block "], "a": 3, "e": "", "s": false, "n": 16}, {"t": "mcq", "q": "As processes enter the system, they are put into a ______ where they are ready and waiting to execute on a CPU's core.", "o": ["Ready queue", "Waiting queue", "Running queue", "Termination queue "], "a": 0, "e": "", "s": true, "n": 17}, {"t": "mcq", "q": "The ______ selects from among the processes in the ready queue, and allocates a CPU core to one of them.", "o": ["Kernel", "Memory scheduler", "Bus controller", "CPU scheduler "], "a": 3, "e": "", "s": true, "n": 18}, {"t": "mcq", "q": "A ______ selects among available processes for the next execution on a CPU core.", "o": ["Thread", "Process scheduler", "MMU", "Context "], "a": 1, "e": "", "s": false, "n": 19}, {"t": "mcq", "q": "The list of processes waiting for a particular I/O device is called a(n) ____.", "o": ["standby queue", "device queue", "ready queue", "interrupt queue "], "a": 1, "e": "", "s": false, "n": 20}, {"t": "mcq", "q": "The ____ refers to the number of processes in memory.", "o": ["process count", "long-term scheduler", "degree of multiprogramming", "CPU scheduler "], "a": 2, "e": "", "s": false, "n": 21}, {"t": "mcq", "q": "Switching the CPU core to another process requires performing a state save of the current process and a state restore of a different process. This task is known as a ______.", "o": ["Race condition", "Context switching ", "Deadlock", "CPU-bound process "], "a": 1, "e": "", "s": true, "n": 22}, {"t": "mcq", "q": "The switching of the CPU from one process or thread to another is called:", "o": ["Process switch", "Context switch", "I/O Burst", "Memory Burst "], "a": 1, "e": "", "s": false, "n": 23}, {"t": "open", "q": "Explain the concept of a context switch.", "a": "When the CPU starts executing a new process, the old process's state must be preserved. The context of a process is represented in its PCB. The kernel saves the context of the old process in its PCB and loads the saved context of the new process. This is pure overhead – the system does no useful work while switching.", "s": false, "n": 24}, {"t": "open", "q": "Explain the main differences between a short-term and a long-term scheduler.", "a": "The difference is how often they run. The short-term scheduler selects a new process for the CPU very frequently (at least every ~100 ms), so it must be fast. The long- term scheduler runs much less often (minutes between process creations) and controls the degree of multiprogramming.", "s": false, "n": 25}, {"t": "open", "q": "Explain the difference between an I/O-bound process and a CPU-bound process.", "a": "An I/O-bound process spends more of its time performing I/O than computing. A CPU-bound process requests I/O infrequently and spends most of its time computing.", "s": false, "n": 26}, {"t": "mcq", "q": "One process can create a child process using the ______ system call.", "o": ["release", "fork()", "exit", "acquire() "], "a": 1, "e": "", "s": true, "n": 27}, {"t": "mcq", "q": "When a child process is created, which of the following is a possibility in terms of the execution or address space of the child?", "o": ["The child process runs concurrently with the parent", "The child process has a new program loaded into it ", "The child is a duplicate of the parent", "All of the above "], "a": 3, "e": "", "s": false, "n": 28}, {"t": "mcq", "q": "The exec() system call creates a new process.", "o": ["True", "False"], "a": 1, "e": "exec() replaces the current process's program; fork() creates the new process.", "s": false, "n": 29}, {"t": "open", "q": "Ordinarily the exec() system call follows fork(). What would happen if a programmer inadvertently placed exec() before fork()?", "a": "exec() overwrites the process, so the call to fork() would never be reached and no new process would be created. The program given to exec() would simply run instead.", "s": false, "n": 30}, {"t": "open", "q": "Explain the fundamental differences between the UNIX fork() and Windows CreateProcess() functions.", "a": "Both create a child process. fork() takes no parameters and the child inherits a copy of the parent's address space; CreateProcess() takes ten parameters and requires specifying the address space (program) of the child.", "s": false, "n": 31}, {"t": "mcq", "q": "A process that has terminated, but whose parent has not yet called wait(), is known as a ______ process.", "o": ["zombie", "orphan", "terminated", "init "], "a": 0, "e": "", "s": false, "n": 32}, {"t": "mcq", "q": "The ______ process is assigned as the parent to orphan processes.", "o": ["zombie", "init", "main", "renderer "], "a": 1, "e": "", "s": false, "n": 33}, {"t": "open", "q": "Describe how UNIX and Linux manage orphan processes.", "a": "If a parent terminates without calling wait(), its children become orphans. UNIX/Linux assign the init process as their new parent; init periodically calls wait(), so the resources of terminated processes are reclaimed.", "s": false, "n": 34}, {"t": "mcq", "q": "All processes in UNIX first become a zombie process upon termination.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 35}, {"t": "mcq", "q": "What does it mean by an independent process in an operating system?", "o": ["The process runs and interrupts other processes", "The process does not share data with other processes", "The process only runs in kernel mode", "The process shares data with other processes "], "a": 1, "e": "", "s": true, "n": 36}, {"t": "mcq", "q": "Why do processes share information?", "o": ["To allow concurrent data access", "To slow down performance", "To block other processes", "To run only one process at a time "], "a": 0, "e": "other reasons for cooperation: computation speedup and modularity.", "s": true, "n": 37}, {"t": "mcq", "q": "The two main models of Inter-Process Communication (IPC) are:", "o": ["Paging and Segmentation", "Virtual Memory and Caching", "Multithreading and Multiprocessing", "Shared Memory and Message Passing "], "a": 3, "e": "", "s": true, "n": 38}, {"t": "mcq", "q": "In message passing, how do processes communicate?", "o": ["By modifying each other's memory directly", "By exchanging messages via send and receive operations", "By reading and writing to shared memory", "By using a disk file "], "a": 1, "e": "", "s": true, "n": 39}, {"t": "mcq", "q": "Which of the following statements is true?", "o": ["Shared memory is typically faster than message passing", "Message passing is typically faster than shared memory", "Message passing is most useful for exchanging large amounts of data", "Shared memory is far more common in operating systems than message passing "], "a": 0, "e": "", "s": false, "n": 40}, {"t": "mcq", "q": "Shared memory is a more appropriate IPC mechanism than message passing for distributed systems.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": 41}, {"t": "open", "q": "When is a communication link established in indirect communication?", "a": "Only if the processes share a common mailbox.", "s": false, "n": 42}, {"t": "mcq", "q": "In a(n) ____ temporary queue, the sender must always block until the recipient receives the message.", "o": ["zero capacity", "variable capacity", "bounded capacity", "unbounded capacity "], "a": 0, "e": "", "s": false, "n": 43}, {"t": "mcq", "q": "A blocking send() and blocking receive() is known as a(n) ______.", "o": ["synchronized message", "rendezvous", "blocked message", "asynchronous message "], "a": 1, "e": "", "s": false, "n": 44}, {"t": "mcq", "q": "A traditional (or heavyweight) process has a single thread of control.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 45}, {"t": "mcq", "q": "A thread is composed of a thread ID, program counter, register set, and heap.", "o": ["True", "False"], "a": 1, "e": "a thread has its own stack, not a heap (the heap is shared by the process).", "s": false, "n": 46}, {"t": "mcq", "q": "Each thread has its own register set and stack.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 47}, {"t": "open", "q": "Why should a web server not run as a single-threaded process?", "a": "A single-threaded server can serve only one client at a time, which could cause enormous wait times for a busy server.", "s": false, "n": 48}, {"t": "open", "q": "List the major categories of benefits of multithreaded programming and briefly explain each.", "a": "Responsiveness – the program keeps running even if part of it is blocked. Resource sharing – threads share the resources of their process, which is easier than shared memory or message passing. Economy – creating and switching threads is cheaper than creating processes and context switching. Scalability – a process can take advantage of multicore architectures.", "s": false, "n": 49}, {"t": "mcq", "q": "______ is NOT considered a challenge when designing applications for multicore systems.", "o": ["Deciding which activities can be run in parallel", "Ensuring there is a sufficient number of cores", "Determining if data can be separated so that it is accessed on separate cores", "Identifying data dependencies between tasks "], "a": 1, "e": "", "s": false, "n": 50}, {"t": "mcq", "q": "What is data parallelism?", "o": ["Distributing data subsets across cores and applying the same operation", "Assigning different tasks to processors", "Running processes sequentially on one core", "Using a single thread for all operations "], "a": 0, "e": "", "s": true, "n": 51}, {"t": "mcq", "q": "______ involves distributing tasks across multiple computing cores.", "o": ["Concurrency", "Task parallelism", "Data parallelism", "Parallelism "], "a": 1, "e": "", "s": false, "n": 52}, {"t": "mcq", "q": "Task parallelism distributes threads and data across multiple computing cores.", "o": ["True", "False"], "a": 1, "e": "task parallelism distributes threads (tasks), each performing a unique operation.", "s": false, "n": 53}, {"t": "mcq", "q": "It is possible to have concurrency without parallelism.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 54}, {"t": "open", "q": "Multicore systems present certain challenges for multithreaded programming. Briefly describe them.", "a": "Dividing activities (deciding which tasks can run in parallel), balance (tasks should do equal work), data splitting (data must be divided so it can be accessed on separate cores), data dependency (dependencies between tasks must be identified and synchronized), and testing and debugging (many different execution paths make it harder).", "s": false, "n": 55}, {"t": "open", "q": "Distinguish between parallelism and concurrency.", "a": "A parallel system can perform more than one task simultaneously. A concurrent system supports more than one task making progress (a single core can do this by switching between tasks).", "s": false, "n": 56}, {"t": "open", "q": "Distinguish between data parallelism and task parallelism.", "a": "Data parallelism distributes subsets of the same data across multiple cores and performs the same operation on each. Task parallelism distributes tasks (threads) across cores, with each performing a unique operation.", "s": false, "n": 57}, {"t": "mcq", "q": "A ____ provides an API for creating and managing threads.", "o": ["set of system calls", "multicore system", "thread library", "multithreading model "], "a": 2, "e": "", "s": false, "n": 58}, {"t": "mcq", "q": "Pthreads refers to ____.", "o": ["the POSIX standard", "an implementation for thread behavior", "a specification for thread behavior", "an API for process creation and synchronization "], "a": 2, "e": "", "s": false, "n": 59}, {"t": "mcq", "q": "Virtually all contemporary operating systems support kernel threads.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 60}, {"t": "mcq", "q": "It is possible to create a thread library without any kernel-level support.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 61}, {"t": "open", "q": "What are the two different ways in which a thread library could be implemented?", "a": "(1) A user-level library – all code and data structures reside in user space with no kernel support. (2) A kernel-level library supported directly by the operating system, with code and data structures in kernel space.", "s": false, "n": 62}, {"t": "mcq", "q": "What is the multithreading model that maps many user-level threads to a single kernel thread?", "o": ["Many-to-One", "Many-to-Many", "One-to-Many", "One-to-One "], "a": 0, "e": "", "s": true, "n": 63}, {"t": "mcq", "q": "The _____ model maps each user-level thread to one kernel thread.", "o": ["many-to-many", "two-level ", "one-to-one", "many-to-one "], "a": 2, "e": "", "s": false, "n": 64}, {"t": "mcq", "q": "The ____ multithreading model multiplexes many user-level threads to a smaller or equal number of kernel threads.", "o": ["many-to-one model", "one-to-one model", "many-to-many model", "many-to-some model "], "a": 2, "e": "", "s": false, "n": 65}, {"t": "mcq", "q": "____ is a thread library for Solaris that maps many user-level threads to one kernel thread.", "o": ["Pthreads", "Green threads", "Sthreads", "Java threads "], "a": 1, "e": "", "s": false, "n": 66}, {"t": "mcq", "q": "Windows uses the ____.", "o": ["one-to-one model", "many-to-one model", "one-to-many model", "many-to-many model "], "a": 0, "e": "", "s": false, "n": 67}, {"t": "open", "q": "Explain the many-to-one threading model. Does this model allow multiple threads to run at the same time?", "a": "Many user-level threads are mapped to a single kernel thread. It does not allow multiple threads to run simultaneously, because only one thread can be in the kernel at a time; also, if one thread blocks, all of them block.", "s": false, "n": 68}, {"t": "open", "q": "Explain the different thread mapping models.", "a": "Many-to-One – many user threads map to one kernel thread (no parallelism; one blocking thread blocks all). One-to-One – each user thread maps to its own kernel thread (more concurrency, but the number of threads per process may be restricted due to overhead; used by Windows and Linux). Many-to-Many – many user threads are multiplexed onto a smaller or equal number of kernel threads, letting the OS create a sufficient number of kernel threads.", "s": false, "n": 69}, {"t": "open", "q": "Some UNIX systems have two versions of fork(). Describe each version and how to decide which to use.", "a": "One version duplicates all threads; the other duplicates only the thread that called fork(). If exec() is called immediately after fork(), duplicating only the calling thread is enough, because exec() replaces the whole process. If the new process does not call exec(), it should duplicate all threads.", "s": false, "n": 70}, {"t": "mcq", "q": "Which of the following would be an acceptable signal-handling scheme for a multithreaded program?", "o": ["Deliver the signal to the thread to which the signal applies", "Deliver the signal to every thread in the process", "Deliver the signal to only certain threads in the process", "All of the above "], "a": 3, "e": "", "s": false, "n": 71}, {"t": "mcq", "q": "Cancellation points are associated with ____ cancellation.", "o": ["asynchronous", "deferred", "synchronous", "non-deferred "], "a": 1, "e": "", "s": false, "n": 72}, {"t": "open", "q": "How can deferred cancellation ensure that thread termination occurs in an orderly manner compared with asynchronous cancellation?", "a": "In asynchronous cancellation the thread is cancelled immediately, possibly in the middle of a data update. In deferred cancellation the thread checks periodically whether it should terminate, so it can cancel itself at a safe, convenient time.", "s": false, "n": 73}, {"t": "mcq", "q": "Deferred cancellation is preferred over asynchronous cancellation.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 74}, {"t": "mcq", "q": "Thread-local storage is data that ____.", "o": ["is not associated with any process", "has been modified by the thread, but not yet updated to the parent process", "is generated by the thread independent of the thread's process", "is unique to each thread "], "a": 3, "e": "", "s": false, "n": 75}, {"t": "mcq", "q": "LWP is ____.", "o": ["short for lightweight processor", "placed between system and kernel threads ", "placed between user and kernel threads", "common in systems implementing one-to-one multithreading models "], "a": 2, "e": "", "s": false, "n": 76}, {"t": "mcq", "q": "In multithreaded programs, the kernel informs an application about certain events using a procedure known as a(n) ____.", "o": ["signal", "upcall", "event handler", "pool "], "a": 1, "e": "", "s": false, "n": 77}], "3": [{"t": "mcq", "q": "The fundamental execution model of a process involves alternating between which two distinct activities?", "o": ["Running state and ready queue waiting", "Context switching and I/O wait", "Dispatch latency and user mode switch", "CPU burst and I/O burst "], "a": 3, "e": "", "s": true, "n": 1}, {"t": "open", "q": "Explain the concept of a CPU–I/O burst cycle.", "a": "The lifecycle of a process consists of bursts of two kinds. Every process alternates between bursts of CPU execution and I/O wait. The distribution of CPU bursts (many short bursts, few long ones) is the main concern for CPU scheduling.", "s": false, "n": 2}, {"t": "mcq", "q": "The ______ selects from among the processes in the ready queue, and allocates a CPU core to one of them.", "o": ["Kernel", "Memory scheduler", "Bus controller", "CPU scheduler "], "a": 3, "e": "", "s": true, "n": 3}, {"t": "mcq", "q": "Which of the following is true of cooperative (nonpreemptive) scheduling?", "o": ["It requires a timer", "A process keeps the CPU until it releases it, either by terminating or by switching to the waiting state ", "It incurs a cost associated with access to shared data", "A process switches from the running state to the ready state when an interrupt occurs "], "a": 1, "e": "", "s": false, "n": 4}, {"t": "mcq", "q": "When can a CPU scheduling decision not be made, leading to non-preemptive behavior? (Equivalently: which scheduling decisions are non-preemptive?)", "o": ["When the process terminates or switches from running to waiting", "Whenever data shared between processes are inconsistent", "When the process is preempted", "When the process switches from waiting to ready state "], "a": 0, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "Virtually all modern operating systems (Windows, Linux, macOS) use which type of scheduling?", "o": ["Preemptive scheduling", "Nonpreemptive scheduling", "Shortest Job First", "First-Come First-Served "], "a": 0, "e": "", "s": true, "n": 6}, {"t": "mcq", "q": "What characteristic of modern operating systems allows a running process to be forcibly interrupted and give up the CPU?", "o": ["Priority setting", "Non-preemption", "Dispatching latency", "Preemptive scheduling "], "a": 3, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "Which of the following scheduling algorithms must be nonpreemptive?", "o": ["SJF", "RR", "FCFS", "Priority algorithms "], "a": 2, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "When a process is preempted while updating shared data, which issue can arise due to the OS scheduling feature?", "o": ["Increased dispatch latency", "Queue overflow condition", "Race conditions, leading to inconsistent data reads", "Context switching failure "], "a": 2, "e": "", "s": false, "n": 9}, {"t": "mcq", "q": "In preemptive scheduling, the sections of code affected by interrupts must be guarded from simultaneous use.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 10}, {"t": "open", "q": "______ is a module that gives control of the CPU to the process selected by the scheduler.", "a": "The dispatcher", "s": true, "n": 11}, {"t": "mcq", "q": "What is dispatch latency?", "o": ["The process executing", "Jumping to the proper location in the user program to restart that program", "It gives control of the CPU to the process selected by the CPU scheduler", "The time it takes for the dispatcher to stop one process and start another running "], "a": 3, "e": "", "s": true, "n": 12}, {"t": "open", "q": "What role does the dispatcher play in CPU scheduling?", "a": "The dispatcher gives control of the CPU to the process selected by the CPU scheduler. This requires a context switch, a switch to user mode, and a jump to the proper location in the user program. The time lost doing this is the dispatch latency, so the dispatcher should be as fast as possible.", "s": false, "n": 13}, {"t": "mcq", "q": "____ is the number of processes that are completed per time unit.", "o": ["CPU utilization", "Response time", "Turnaround time", "Throughput "], "a": 3, "e": "", "s": true, "n": 14}, {"t": "mcq", "q": "The interval from the time of submission of a process to the time of completion is termed:", "o": ["Waiting time", "Turnaround time", "Response time", "Throughput "], "a": 1, "e": "", "s": false, "n": 15}, {"t": "mcq", "q": "Which CPU scheduling metric is defined as the amount of time a process waits in the ready queue?", "o": ["Waiting Time (Min)", "Turnaround Time (Min) ", "Response Time (Min)", "Throughput (Max) "], "a": 0, "e": "", "s": false, "n": 16}, {"t": "mcq", "q": "Which of the following scheduling criteria should be MAXIMIZED?", "o": ["Turnaround time", "Throughput", "Response time", "Waiting time "], "a": 1, "e": "CPU utilization and throughput are maximized; turnaround, waiting and response time are minimized.", "s": false, "n": 17}, {"t": "open", "q": "Explain the difference between response time and turnaround time.", "a": "Turnaround time is the total time to execute a process: the sum of the time spent waiting to get into memory, waiting in the ready queue, executing on the CPU, and doing I/O. Response time is the time from when a request was submitted until the first response is produced.", "s": false, "n": 18}, {"t": "mcq", "q": "The ______ occurs in first-come-first-served scheduling when a process with a long CPU burst occupies the CPU.", "o": ["dispatch latency", "waiting time", "convoy effect", "system-contention scope "], "a": 2, "e": "", "s": false, "n": 19}, {"t": "mcq", "q": "Using FCFS, processes P1 (burst = 6), P2 (burst = 2) and P3 (burst = 4) arrive in that order. What is the average waiting time?", "o": ["2", "8", "4", "6 "], "a": 2, "e": "The waiting times are 0, 6 and 8, so the average is 14/3 ≈ 4.67. None of the options matches exactly (the closest is C); check the original wording of this question with your instructor.", "s": false, "n": 20, "v": 1}, {"t": "mcq", "q": "Which scheduling algorithm associates with each process the length of its next CPU burst (and picks the process with the smallest one)?", "o": ["Round-Robin", "Shortest-Job-First", "Priority Scheduling", "First-Come, First-Served "], "a": 1, "e": "", "s": true, "n": 21}, {"t": "mcq", "q": "The Shortest Job First (SJF) scheduling algorithm is known for which property regarding average waiting time?", "o": ["It guarantees maximum CPU utilization", "It achieves the minimum average waiting time", "It minimizes context switch overhead", "It supports non-preemptive operation only "], "a": 1, "e": "", "s": false, "n": 22}, {"t": "mcq", "q": "____ scheduling is approximated by predicting the next CPU burst with an exponential average of the measured lengths of previous CPU bursts.", "o": ["Multilevel queue", "RR", "FCFS", "SJF "], "a": 3, "e": "", "s": false, "n": 23}, {"t": "mcq", "q": "______ is sometimes called shortest-remaining-time-first scheduling.", "o": ["Priority Scheduling", "First-Come, First-Served Scheduling", "Round Robin Scheduling", "Preemptive SJF Scheduling "], "a": 3, "e": "", "s": false, "n": 24}, {"t": "open", "q": "Compare the performance of FCFS and SJF scheduling in terms of average waiting time.", "a": "SJF has a lower average waiting time than FCFS because shorter jobs are executed first. FCFS can cause long waiting times when a long process arrives before short ones (convoy effect).", "s": false, "n": 25}, {"t": "open", "q": "Given the processes and burst times P1 = 2, P2 = 1, P3 = 8, P4 = 4, P5 = 5, use SJF to (a) draw the Gantt chart and (b) compute the waiting time of each process.", "a": "(a) P2 | P1 | P4 | P5 | P3, with boundaries at 0, 1, 3, 7, 12, 20. (b) Waiting times: P2 = 0, P1 = 1, P4 = 3, P5 = 7, P3 = 12 (average = 23/5 = 4.6).", "s": false, "n": 26}, {"t": "mcq", "q": "The ____ scheduling algorithm is designed especially for time-sharing systems.", "o": ["SJF", "FCFS", "RR", "Multilevel queue "], "a": 2, "e": "", "s": false, "n": 27}, {"t": "mcq", "q": "In RR scheduling, the time quantum should be small with respect to the context-switch time.", "o": ["True", "False"], "a": 1, "e": "the quantum should be large compared with the context-switch time.", "s": false, "n": 28}, {"t": "mcq", "q": "Round-robin scheduling degenerates to first-come-first-served scheduling if the time quantum is too long.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 29}, {"t": "mcq", "q": "In a system using Round Robin scheduling, what happens if the time quantum (q) is set too small compared to the context switch time?", "o": ["The overhead from frequent context switches becomes excessive", "The process always runs in non-preemptive mode", "The average waiting time decreases significantly", "The overall throughput increases dramatically "], "a": 0, "e": "", "s": false, "n": 30}, {"t": "open", "q": "What effect does the size of the time quantum have on the performance of an RR algorithm?", "a": "If the quantum is extremely large, RR behaves like FCFS. If it is extremely small, RR is called processor sharing and creates the appearance that each of n processes has its own processor running at 1/n of the real speed, but the context-switch overhead becomes too high.", "s": false, "n": 31}, {"t": "mcq", "q": "A significant problem with priority scheduling algorithms is ____.", "o": ["complexity", "starvation", "determining the length of the next CPU burst", "determining the length of the time quantum "], "a": 1, "e": "", "s": false, "n": 32}, {"t": "mcq", "q": "Which scheduling technique addresses the problem where low-priority processes might never get scheduled due to continuous high-priority arrivals?", "o": ["Priority Scheduling", "Multilevel Queue ", "Round Robin (RR)", "Aging "], "a": 3, "e": "", "s": true, "n": 33}, {"t": "open", "q": "Explain the process of starvation and how aging can be used to prevent it.", "a": "Starvation occurs when a process is ready to run but waits indefinitely for the CPU, for example because higher-priority processes keep arriving. Aging gradually increases the priority of a waiting process, so it eventually becomes high enough to execute.", "s": false, "n": 34}, {"t": "mcq", "q": "Which of the following is true of multilevel queue scheduling?", "o": ["Processes can move between queues", "Each queue has its own scheduling algorithm", "A queue cannot have absolute priority over lower-priority queues", "It is the most general CPU-scheduling algorithm "], "a": 1, "e": "", "s": false, "n": 35}, {"t": "mcq", "q": "Which algorithm moves a process from one priority queue to another based on its execution time?", "o": ["Round Robin", "Multilevel Feedback Queue", "Round Robin with Aging", "Multilevel Queue "], "a": 1, "e": "", "s": true, "n": 36}, {"t": "mcq", "q": "The most complex scheduling algorithm is the multilevel feedback-queue algorithm.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 37}, {"t": "mcq", "q": "In advanced CPU scheduling, if a system uses kernel-level threads, which resource competition scope is involved?", "o": ["Dispatch latency overhead", "System Contention Scope (SCS)", "User-level thread contention", "Process Contention Scope (PCS) "], "a": 1, "e": "", "s": true, "n": 38}, {"t": "mcq", "q": "__________ involves the decision of which kernel thread to schedule onto which CPU.", "o": ["Process-contention scope", "System-contention scope", "Dispatcher", "Round-robin scheduling "], "a": 1, "e": "", "s": false, "n": 39}, {"t": "open", "q": "Explain the difference between Process Contention Scope (PCS) and System Contention Scope (SCS) in thread scheduling.", "a": "PCS is used with the many-to-one and many-to-many models: the thread library schedules user-level threads to run on an available LWP, so the competition is among threads within the same process (typically via priorities set by the programmer). SCS is when the kernel schedules a kernel thread onto an available CPU, so the competition is among all threads in the system.", "s": false, "n": 40}, {"t": "mcq", "q": "Systems using a one-to-one model (such as Windows, Solaris and Linux) schedule threads using process-contention scope (PCS).", "o": ["True", "False"], "a": 1, "e": "they use system-contention scope (SCS).", "s": false, "n": 41}, {"t": "mcq", "q": "What is the primary goal of load balancing in SMP systems?", "o": ["To increase the number of processors", "To keep the workload evenly distributed among all CPUs", "To reduce the number of running threads", "To increase the complexity of scheduling "], "a": 1, "e": "", "s": false, "n": 42}, {"t": "mcq", "q": "The two general approaches to load balancing are __________ and ____________.", "o": ["soft affinity, hard affinity", "coarse grained, fine grained", "soft real-time, hard real-time", "push migration, pull migration "], "a": 3, "e": "", "s": false, "n": 43}, {"t": "open", "q": "Describe two general approaches to load balancing.", "a": "Push migration – a periodic task checks the load on each processor and, if it finds an imbalance, moves tasks from overloaded processors to idle or less-busy ones. Pull migration – an idle processor pulls a waiting task from a busy processor. They are often implemented in parallel.", "s": false, "n": 44}, {"t": "mcq", "q": "Load balancing is typically only necessary on systems with a common run queue.", "o": ["True", "False"], "a": 1, "e": "it is needed mainly with per-processor (private) run queues.", "s": false, "n": 45}, {"t": "open", "q": "Explain the fundamental difference between asymmetric and symmetric multiprocessing.", "a": "In asymmetric multiprocessing, all scheduling decisions, I/O and other system activities are handled by a single processor. In SMP, each processor is self-scheduling.", "s": false, "n": 46}, {"t": "mcq", "q": "______ allows a thread to run on only one processor (or a specified set of processors).", "o": ["Processor affinity", "Processor set", "NUMA", "Load balancing "], "a": 0, "e": "soft affinity only tries to keep a thread on the same processor; hard affinity lets a process specify the set of processors it may run on.", "s": false, "n": 47}, {"t": "mcq", "q": "Load balancing algorithms have no impact on the benefits of processor affinity.", "o": ["True", "False"], "a": 1, "e": "moving a thread to balance load makes it lose the contents of the cache of the processor it left.", "s": false, "n": 48}, {"t": "mcq", "q": "If an operating system is NUMA-aware, what optimization strategy does it employ regarding resource placement?", "o": ["Running threads on any available core regardless of memory location", "Load balancing across all processors", "Assigning memory closest to the CPU where the thread is running", "Using a fixed queue for process management "], "a": 2, "e": "", "s": false, "n": 49}, {"t": "mcq", "q": "Chip multithreading (CMT) is also referred to by Intel as:", "o": ["Load balancing", "Soft threading", "Processor affinity", "Hyperthreading "], "a": 3, "e": "", "s": true, "n": 50}, {"t": "mcq", "q": "With ______ a thread executes on a processor until a long-latency event (such as a memory stall) occurs.", "o": ["coarse-grained multithreading ", "fine-grained multithreading", "virtualization", "multicore processors "], "a": 0, "e": "", "s": false, "n": 51}, {"t": "open", "q": "Distinguish between coarse-grained and fine-grained multithreading.", "a": "Coarse-grained multithreading lets a thread run on a processor until a long- latency event (such as waiting for memory) occurs, and then switches to another thread. Fine-grained multithreading switches between threads at a much finer granularity, such as between instructions.", "s": false, "n": 52}, {"t": "mcq", "q": "SMP systems that use multicore processors typically run faster than SMP systems that place each processor on a separate chip.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 53}, {"t": "mcq", "q": "A multicore system allows two (or more) threads that are in compute cycles to execute at the same time.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 54}, {"t": "open", "q": "Burst times: P1 = 24, P2 = 3, P3 = 3. Compute the average waiting time if the processes arrive in the order (a) P1, P2, P3 and (b) P2, P3, P1.", "a": "(a) Gantt: P1 (0–24), P2 (24–27), P3 (27–30); waiting times 0, 24, 27, so the average is 17. (b) Gantt: P2 (0–3), P3 (3–6), P1 (6–30); waiting times 6, 0, 3, so the average is", "s": false, "n": 55}, {"t": "open", "q": "Burst times (all arrive at time 0): P1 = 6, P2 = 8, P3 = 7, P4 = 3. Draw the SJF Gantt chart and compute the average waiting time.", "a": "P4 (0–3), P1 (3–9), P3 (9–16), P2 (16–24). Waiting times: P4 = 0, P1 = 3, P3 = 9, P2 = 16; average = 28/4 = 7.", "s": false, "n": 56}, {"t": "open", "q": "(Shortest-remaining-time-first) P1 (arrival 0, burst 8), P2 (1, 4), P3 (2, 9), P4 (3, 5). Draw the preemptive SJF Gantt chart and compute the average waiting time.", "a": "P1 (0–1), P2 (1–5), P4 (5–10), P1 (10–17), P3 (17–26). Waiting times: P1 = 10−1 = 9, P2 = 0, P3 = 17−2 = 15, P4 = 5−3 = 2; average = 26/4 = 6.5.", "s": false, "n": 57}, {"t": "open", "q": "Burst times: P1 = 24, P2 = 3, P3 = 3, time quantum = 4. Draw the Gantt chart and compute the average waiting time.", "a": "P1 (0–4), P2 (4–7), P3 (7–10), then P1 runs 10–14, 14–18, 18–22, 22–26, 26–30. Waiting times: P1 = 6, P2 = 4, P3 = 7; average = 17/3 ≈ 5.67.", "s": false, "n": 58}, {"t": "open", "q": "P1 (burst 10, priority 3), P2 (1, 1), P3 (2, 4), P4 (1, 5), P5 (5, 2). A smaller number means higher priority. Draw the Gantt chart and compute the average waiting time.", "a": "P2 (0–1), P5 (1–6), P1 (6–16), P3 (16–18), P4 (18–19). Waiting times: 0, 1, 6, 16, 18 for P2, P5, P1, P3, P4; average = 41/5 = 8.2.", "s": false, "n": 59}, {"t": "open", "q": "Using α = 1/2 and an initial guess τ₀ = 10, with the formula τ(n+1) = α·t(n) + (1−α)·τ(n), predict the next CPU burst for the measured bursts 6, 4, 6, 4, 13, 13, 13.", "a": "The predictions are τ = 10, 8, 6, 6, 5, 9, 11, 12 (each new guess is the average of the last actual burst and the previous guess).", "s": false, "n": 60}], "4": [{"t": "mcq", "q": "A race condition ____.", "o": ["results when several threads try to access the same data concurrently", "results when several threads try to access and modify the same data concurrently", "will result only if the outcome of execution does not depend on the order in which instructions are executed", "None of the above "], "a": 1, "e": "", "s": true, "n": 1}, {"t": "mcq", "q": "A race condition occurs when:", "o": ["A deadlock happens", "Only one thread executes", "Processes run too fast", "The outcome depends on execution order "], "a": 3, "e": "", "s": false, "n": 2}, {"t": "open", "q": "In the context of synchronization, what is a \"race condition\"?", "a": "Two processes access shared data concurrently, leading to inconsistency (the result depends on the order in which the accesses happen).", "s": false, "n": 3}, {"t": "mcq", "q": "What is the fundamental problem that synchronization tools aim to solve?", "o": ["The Race Condition Problem", "The I/O Blocking Problem", "The Memory Allocation Problem", "The Deadlock Problem "], "a": 0, "e": "", "s": false, "n": 4}, {"t": "mcq", "q": "The main goal of synchronization is to:", "o": ["Reduce RAM size", "Increase CPU speed ", "Delete processes", "Maintain data consistency "], "a": 3, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "Race conditions are prevented by requiring that critical regions be protected by locks.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 6}, {"t": "mcq", "q": "The segment of code where processes modify shared variables is called:", "o": ["Non-Critical section", "Synchronization", "Critical section", "Program "], "a": 2, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "The critical section refers to:", "o": ["A CPU instruction", "A part of code accessing shared data", "A disk operation", "A section of memory "], "a": 1, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "A(n) _______ refers to where a process is accessing/updating shared data.", "o": ["critical section", "entry section", "mutex", "test-and-set "], "a": 0, "e": "", "s": false, "n": 9}, {"t": "mcq", "q": "The critical-section problem occurs when:", "o": ["No shared memory exists", "Only one process runs at a time", "Processes execute sequentially", "Multiple processes access shared data concurrently "], "a": 3, "e": "", "s": false, "n": 10}, {"t": "mcq", "q": "Which of the following is a requirement for the critical section problem?", "o": ["Mutual exclusion, progress, and bounded waiting", "Critical sections must be identical in all processes ", "Progress must be guaranteed", "No process can enter the critical section "], "a": 0, "e": "", "s": true, "n": 11}, {"t": "mcq", "q": "A solution to the critical section problem does NOT have to satisfy which of the following requirements?", "o": ["mutual exclusion", "progress", "atomicity", "bounded waiting "], "a": 2, "e": "", "s": false, "n": 12}, {"t": "mcq", "q": "If process Pi is executing in its critical section, then no other process can be executing in its critical section. This requirement is called:", "o": ["Progress", "Mutual Exclusion", "Bounded Waiting", "Program "], "a": 1, "e": "", "s": true, "n": 13}, {"t": "mcq", "q": "Which requirement ensures that if no process is in its critical section and some processes wish to enter, the selection cannot be postponed indefinitely?", "o": ["Progress", "Mutual Exclusion", "Atomic Operation", "Bounded Waiting "], "a": 0, "e": "", "s": false, "n": 14}, {"t": "mcq", "q": "Progress means:", "o": ["Interrupts are disabled", "A process waiting to enter the critical section should eventually proceed", "Memory size grows", "CPU speed increases "], "a": 1, "e": "", "s": false, "n": 15}, {"t": "mcq", "q": "Mutual exclusion means:", "o": ["Multiple processes execute together", "Only one process accesses shared data at a time", "CPU scheduling stops", "Memory becomes shared "], "a": 1, "e": "", "s": false, "n": 16}, {"t": "open", "q": "What three conditions must be satisfied in order to solve the critical-section problem?", "a": "(1) Mutual exclusion – if a process is executing in its critical section, no other process can be executing in theirs. (2) Progress – if no process is in its critical section and some wish to enter, only the processes not in their remainder sections take part in deciding who enters next, and this decision cannot be postponed indefinitely. (3) Bounded waiting – a bound exists on the number of times other processes may enter their critical sections after a process has requested entry and before that request is granted.", "s": false, "n": 17}, {"t": "mcq", "q": "In Peterson's solution, the variable that indicates whether a process is ready to enter its critical section is:", "o": ["turn", "lock", "flag[i]", "turn[i] "], "a": 2, "e": "", "s": true, "n": 18}, {"t": "mcq", "q": "Peterson's algorithm uses two variables:", "o": ["flag and turn", "mutex and semaphore", "counter and lock", "page and frame "], "a": 0, "e": "", "s": false, "n": 19}, {"t": "mcq", "q": "Peterson's solution is designed for:", "o": ["Four processes", "Two processes", "Unlimited processes", "One process "], "a": 1, "e": "", "s": false, "n": 20}, {"t": "mcq", "q": "Which synchronization solution is generally considered too inefficient on multiprocessor systems due to potential instruction reordering?", "o": ["Mutex Lock", "Atomic Variables", "Peterson's Solution", "Semaphores "], "a": 2, "e": "processors and compilers may reorder operations that have no dependencies, so Peterson's solution is not guaranteed to work on modern architectures.", "s": false, "n": 21}, {"t": "mcq", "q": "An instruction that executes atomically ____.", "o": ["must consist of only one machine instruction", "executes as a single, uninterruptible unit", "cannot be used to solve the critical section problem", "All of the above "], "a": 1, "e": "", "s": false, "n": 22}, {"t": "open", "q": "What does the test_and_set instruction do?", "a": "It atomically sets the target variable to true and returns its original value.", "s": false, "n": 23}, {"t": "mcq", "q": "How does the test_and_set instruction help solve the critical-section problem?", "o": ["By atomically checking and setting a lock", "It only works on uniprocessor systems", "It requires explicit synchronization", "It ensures atomic updates to a shared variable "], "a": 0, "e": "", "s": false, "n": 24}, {"t": "mcq", "q": "What hardware instruction is often used as a building block for implementing atomic operations?", "o": ["Compare-and-Swap instruction", "MOV instruction", "ADD instruction", "JUMP instruction "], "a": 0, "e": "", "s": false, "n": 25}, {"t": "mcq", "q": "Which of the following statements is true?", "o": ["Operations on atomic integers do not require locking", "Operations on atomic integers do require additional locking", "Linux only provides the atomic_inc() and atomic_sub() operations", "Operations on atomic integers can be interrupted "], "a": 0, "e": "", "s": false, "n": 26}, {"t": "mcq", "q": "A mutex lock ____.", "o": ["is exactly like a counting semaphore", "is essentially a boolean variable", "is not guaranteed to be atomic", "can be used to eliminate busy waiting "], "a": 1, "e": "", "s": false, "n": 27}, {"t": "mcq", "q": "Which synchronization tool is used to protect critical sections and ensure exclusive access to shared resources?", "o": ["Mutex locks", "Compare-and-swap operations", "Memory barriers", "Race condition "], "a": 0, "e": "", "s": false, "n": 28}, {"t": "mcq", "q": "What is the primary function of a mutex lock in process synchronization?", "o": ["To implement device drivers", "To provide ways for processes to synchronize their activities", "To handle virtual memory paging", "To manage file access only "], "a": 1, "e": "", "s": false, "n": 29}, {"t": "mcq", "q": "A mutex lock allows:", "o": ["Unlimited access", "Only one process in the critical section", "No synchronization", "Multiple processes in the critical section "], "a": 1, "e": "", "s": false, "n": 30}, {"t": "mcq", "q": "What is the correct order of operations for protecting a critical section using mutex locks?", "o": ["release() followed by acquire()", "acquire() followed by release()", "wait() followed by signal()", "signal() followed by wait() "], "a": 1, "e": "", "s": false, "n": 31}, {"t": "open", "q": "Assume you had a function named update() that updates shared data. Illustrate how a mutex lock named mutex might be used to prevent a race condition in update().", "a": "void update() { mutex.acquire(); /* update shared data */ mutex.release(); }", "s": false, "n": 32}, {"t": "mcq", "q": "Mutex locks and counting semaphores are essentially the same thing.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": 33}, {"t": "mcq", "q": "Mutex locks and binary semaphores are essentially the same thing.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 34}, {"t": "mcq", "q": "Which synchronization tool provides more sophisticated ways for processes to synchronize their activities?", "o": ["Mutex Lock", "Test-and-Set instruction", "Race Condition", "Semaphore "], "a": 3, "e": "", "s": true, "n": 35}, {"t": "mcq", "q": "What synchronization tool is defined by an integer variable that can range over an unrestricted domain?", "o": ["Binary semaphore", "Atomic Variable", "Mutex Lock", "Counting semaphore "], "a": 3, "e": "", "s": false, "n": 36}, {"t": "mcq", "q": "A counting semaphore ____.", "o": ["is essentially an integer variable", "is accessed through only one standard operation", "can be modified simultaneously by multiple threads", "cannot be used to control access to a thread's critical sections "], "a": 0, "e": "", "s": false, "n": 37}, {"t": "mcq", "q": "A binary semaphore's value ranges between:", "o": ["0 and 1", "0 and 2", "1 and 2", "1 and 3 "], "a": 0, "e": "", "s": false, "n": 38}, {"t": "mcq", "q": "The value of a counting semaphore can range only between 0 and 1.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": 39}, {"t": "mcq", "q": "The wait() operation on a semaphore:", "o": ["Resets the semaphore", "Decrements the semaphore", "Increments the semaphore", "Deletes the semaphore "], "a": 1, "e": "", "s": false, "n": 40}, {"t": "mcq", "q": "Which of the following must guarantee mutual exclusion on a semaphore?", "o": ["wait(0) and signal(0)", "stop(0) and wait(0)", "hold(0) and signal(0)", "stop(0) and signal(0) "], "a": 0, "e": "the wait() and signal() operations must each execute atomically.", "s": false, "n": 41}, {"t": "mcq", "q": "What is the correct order of operations for protecting a critical section using a binary semaphore?", "o": ["release() followed by acquire()", "acquire() followed by release()", "wait() followed by signal()", "signal() followed by wait() "], "a": 2, "e": "", "s": false, "n": 42}, {"t": "mcq", "q": "When using semaphores, a process invokes wait() before accessing its critical section, followed by signal() upon completion. If the order of these two operations is reversed (signal() first, then wait()), what would be a possible outcome?", "o": ["Starvation is possible", "Several processes could be active in their critical sections at the same time", "Mutual exclusion is still assured", "Deadlock is possible "], "a": 1, "e": "", "s": false, "n": 43}, {"t": "mcq", "q": "____ can be used to prevent busy waiting when implementing a semaphore.", "o": ["Spinlocks", "Waiting queues", "Mutex lock", "Allowing the wait() operation to succeed "], "a": 1, "e": "with a waiting queue, a process is blocked and later woken up instead of spinning.", "s": false, "n": 44}, {"t": "mcq", "q": "Which of the following statements is true?", "o": ["A counting semaphore can never be used as a binary semaphore", "A binary semaphore can never be used as a counting semaphore", "Spinlocks can be used to prevent busy waiting in the implementation of a semaphore", "Counting semaphores can be used to control access to a resource with a finite number of instances "], "a": 3, "e": "the source answer key says C, but that is a mistake: a spinlock is busy waiting.", "s": false, "n": 45}, {"t": "open", "q": "Write two short methods that implement the simple semaphore wait() and signal() operations on a global variable S.", "a": "wait(S) { while (S <= 0) ; /* busy wait */ S--; } and signal(S) { S++; } . Both operations must execute atomically.", "s": false, "n": 46}, {"t": "mcq", "q": "In the bounded-buffer problem, what is the initial value of the semaphore 'full'?", "o": ["-1", "n (the number of buffers)", "1", "0 "], "a": 3, "e": "", "s": true, "n": 47}, {"t": "mcq", "q": "In the bounded-buffer problem, the semaphore mutex is initialized to:", "o": ["1", "0", "-1", "n "], "a": 0, "e": "", "s": false, "n": 48}, {"t": "mcq", "q": "What is the purpose of the mutex semaphore in the implementation of the bounded- buffer problem using semaphores?", "o": ["It indicates the number of empty slots in the buffer", "It indicates the number of occupied slots in the buffer", "It controls access to the shared buffer", "It ensures mutual exclusion "], "a": 3, "e": "", "s": false, "n": 49}, {"t": "open", "q": "The purpose of using the empty semaphore in solving the bounded-buffer problem is to:", "a": "Count the number of free slots in the buffer.", "s": false, "n": 50}, {"t": "mcq", "q": "In the bounded-buffer problem, what does the producer do when the 'empty' semaphore reaches 0?", "o": ["Signals the consumer immediately", "Increments the 'full' semaphore", "Overrides the buffer", "Goes to sleep (blocks) "], "a": 3, "e": "", "s": false, "n": 51}, {"t": "mcq", "q": "In the bounded-buffer consumer process, which semaphore is signaled LAST after consuming an item?", "o": ["mutex", "full", "rw_mutex", "empty "], "a": 3, "e": "", "s": false, "n": 52}, {"t": "mcq", "q": "The bounded-buffer problem is an example of a synchronization problem that involves:", "o": ["Race conditions between multiple writers", "Coordinating the limited buffer space between producers and consumers", "Resolving priority conflicts between readers and writers", "Deadlock situations in the producer-consumer scenario "], "a": 1, "e": "", "s": false, "n": 53}, {"t": "open", "q": "Explain the bounded-buffer problem. Describe the roles of the three semaphores used in the solution (mutex, full and empty) and explain how the producer and consumer use them to avoid race conditions.", "a": "A producer and a consumer share a buffer of n slots, each holding one item. mutex (initialized to 1) gives mutual exclusion on access to the buffer. full (initialized to 0) counts the occupied slots. empty (initialized to n) counts the free slots. The producer does wait(empty), wait(mutex), adds the item, then signal(mutex), signal(full); it blocks when the buffer is full. The consumer does wait(full), wait(mutex), removes the item, then signal(mutex), signal(empty); it blocks when the buffer is empty. Together they prevent the race condition on the buffer.", "s": false, "n": 54}, {"t": "mcq", "q": "In the readers-writers problem, the primary objective is to:", "o": ["Allow multiple writers to access the shared data", "Enable multiple readers to access the shared data concurrently", "Ensure only one reader can access the shared data", "Restrict readers from accessing the shared data "], "a": 1, "e": "", "s": false, "n": 55}, {"t": "mcq", "q": "In the readers-writers problem, multiple readers can:", "o": ["Read simultaneously", "Write simultaneously", "Access without synchronization", "Modify data "], "a": 0, "e": "", "s": false, "n": 56}, {"t": "mcq", "q": "In the readers-writers problem, the variable 'read_count' is used to:", "o": ["Indicate the size of the shared data", "Store the number of available buffers", "Track how many readers are currently reading", "Count how many writers are waiting "], "a": 2, "e": "", "s": false, "n": 57}, {"t": "mcq", "q": "The 'First readers-writers' problem refers to a situation where:", "o": ["Writers can proceed even while readers are active", "Only one reader is allowed at a time", "Readers are always given higher priority, which can starve writers", "The first writer always gets priority over all readers "], "a": 2, "e": "", "s": false, "n": 58}, {"t": "mcq", "q": "The first readers-writers problem ____.", "o": ["requires that, once a writer is ready, that writer performs its write as soon as possible", "is not used to test synchronization primitives", "requires that no reader will be kept waiting unless a writer has already obtained permission to use the shared database", "requires that no reader will be kept waiting unless a reader has already obtained permission to use the shared database "], "a": 2, "e": "", "s": false, "n": 59}, {"t": "mcq", "q": "In the readers-writers problem, the 'Second readers-writers' variation ensures that:", "o": ["The mutex semaphore is never used", "Multiple writers can write at the same time", "Once a writer is ready, no newly arrived reader is allowed to read", "Readers always have priority over writers "], "a": 2, "e": "", "s": false, "n": 60}, {"t": "open", "q": "Explain the difference between the first readers–writers problem and the second readers–writers problem.", "a": "In the first problem, no reader is kept waiting unless a writer has already obtained permission to use the shared data, so readers have priority and a writer may starve. In the second problem, once a writer is ready, no newly arrived reader is allowed to start reading, so the writer goes as soon as possible. Both can cause starvation.", "s": false, "n": 61}, {"t": "open", "q": "Describe a scenario when using a reader–writer lock is more appropriate than another synchronization tool such as a semaphore.", "a": "A semaphore lets only one process access shared data at a time. A reader–writer lock is useful when it is easy to tell read-only processes from read/write processes: readers can access the data concurrently, so with many readers it is much more efficient.", "s": false, "n": 62}, {"t": "mcq", "q": "In the dining philosophers problem with 5 philosophers, the semaphore array 'chopstick' is initialized to:", "o": ["All 1s", "All 5s", "All zeros", "Random values "], "a": 0, "e": "", "s": false, "n": 63}, {"t": "mcq", "q": "How many philosophers may eat simultaneously in the Dining Philosophers problem with 5 philosophers?", "o": ["1", "2", "3", "5 "], "a": 1, "e": "", "s": false, "n": 64}, {"t": "mcq", "q": "The dining philosophers algorithm (basic semaphore solution) may lead to:", "o": ["Starvation", "Deadlock", "Race condition", "Priority inversion "], "a": 1, "e": "if every philosopher picks up one chopstick, all wait forever for the other.", "s": true, "n": 65}, {"t": "mcq", "q": "The dining-philosophers problem involves a scenario where philosophers:", "o": ["Compete to acquire the largest portion of food from a shared bowl", "Alternate between thinking and eating using chopsticks", "Collaborate to solve a complex mathematical puzzle", "Engage in philosophical discussions while seated around a table "], "a": 1, "e": "", "s": false, "n": 66}, {"t": "open", "q": "Describe the dining-philosophers problem and how it relates to operating systems. What is the main problem in the basic algorithm?", "a": "Five philosophers sit at a round table with a bowl of rice and five chopsticks, one between each adjacent pair. They alternate between thinking and eating, and need both neighboring chopsticks to eat, so two adjacent philosophers cannot eat at the same time. It is like scheduling processes that need a limited number of resources. The main problem of the basic semaphore solution (wait on chopstick[i], then chopstick[(i+1) % 5]) is deadlock: if all philosophers pick up their left chopstick at once, each waits forever for the other.", "s": false, "n": 67}, {"t": "mcq", "q": "How does the Windows kernel handle synchronization on uniprocessor systems?", "o": ["By using spinlocks", "By using mutex locks", "By using interrupt masks", "By using condition variables "], "a": 2, "e": "", "s": false, "n": 68}, {"t": "mcq", "q": "On Windows, which kernel synchronization mechanism is used on multiprocessor systems to protect shared resources?", "o": ["Spinlocks", "Mutex dispatcher object only", "Condition variables", "Interrupt masks "], "a": 0, "e": "", "s": true, "n": 69}, {"t": "open", "q": "When a dispatcher object is in the signaled state, it means that:", "a": "The object is available (a thread that waits on it will not block).", "s": false, "n": 70}, {"t": "mcq", "q": "A thread will immediately acquire a dispatcher lock that is in the signaled state.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 71}]}}, "CS352": {"name": "Systems Analysis & Design", "chapters": {"1": [{"t": "mcq", "q": "The correct order of the phases of the system development life cycle is ________.", "o": ["Planning, analysis, design, implementation, maintenance", "Planning, design, analysis, implementation, ma
