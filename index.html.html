se is:", "o": ["A self-describing collection of related tables", "A collection of forms and reports that support a given purpose", "A library of queries and data files for querying", "A set of applications and the data sets for those applications", "A set of meta-data"], "a": 0, "e": "", "s": false, "n": 18}, {"t": "mcq", "q": "What does \"program-data independence\" refer to in a DBMS?", "o": ["The programming language used to interact with the database", "The link between an application and its source code", "The ability to change data structures without modifying the application programs", "The method of encrypting program data"], "a": 2, "e": "", "s": false, "n": 19}, {"t": "mcq", "q": "A collection of concepts that can be used to describe the structure of a database is called a:", "o": ["Database", "Data schema", "Data basic", "Data model"], "a": 3, "e": "", "s": false, "n": 20}, {"t": "mcq", "q": "Duplication of data at several locations is called the ______ problem.", "o": ["Data redundancy", "Data isolation", "Atomicity", "Data inconsistency"], "a": 0, "e": "", "s": false, "n": 21}, {"t": "mcq", "q": "In file-based systems, when common fields do not match across duplicated files, the result is the ______ problem.", "o": ["Data inconsistency", "Atomicity", "Data redundancy", "Data isolation"], "a": 0, "e": "", "s": false, "n": 22}, {"t": "mcq", "q": "Which of the following problems of storing data in a list is avoided by storing data in a relational database?", "o": ["Maintaining the data may require changing the same data value in many locations", "Inconsistency when a data item is used multiple times", "Inability to store partial data", "Duplication of data items", "All of the above"], "a": 4, "e": "", "s": false, "n": 23}, {"t": "mcq", "q": "Which type of database user is responsible for security and efficiency?", "o": ["Database administrators", "End-users", "Database designers", "Parametric end-users"], "a": 0, "e": "", "s": false, "n": 24}, {"t": "mcq", "q": "The main responsibility of the database designers is to:", "o": ["Coordinate and monitor database users", "Use the database to print reports", "Authorize and control access to the database", "Define the database structure, constraints and transactions by communicating with users to understand their needs"], "a": 3, "e": "", "s": false, "n": 25}, {"t": "mcq", "q": "What is the role of the database administrator (DBA)?", "o": ["Monitoring database efficiency", "Designing database structures", "Writing SQL queries", "Developing application programs"], "a": 0, "e": "", "s": false, "n": 26}, {"t": "mcq", "q": "Which of the following is NOT one of the types of database users?", "o": ["Database administrators", "Database trainer", "Database designers", "Database end-users"], "a": 1, "e": "", "s": false, "n": 27}, {"t": "mcq", "q": "Which of the following is a key advantage of a DBMS over a traditional file processing system?", "o": ["Increased data redundancy", "Tight coupling between programs and data", "Controlling data redundancy and enforcing integrity constraints", "Restricting concurrent access to one user at a time"], "a": 2, "e": "", "s": false, "n": 28}, {"t": "mcq", "q": "Which of the following is NOT an advantage of using a DBMS?", "o": ["Providing storage structures for efficient query processing", "Enforcing integrity constraints", "High initial investment in hardware, software and training", "Providing backup and recovery facilities"], "a": 2, "e": "", "s": false, "n": 29}, {"t": "mcq", "q": "What is NOT an implication of using the database approach?", "o": ["Conflict in updating the information", "Availability of up-to-date information", "Reduced application development time", "Economies of scale"], "a": 0, "e": "", "s": false, "n": 30}, {"t": "mcq", "q": "When should you NOT use a DBMS?", "o": ["When you need to improve performance", "When the overhead costs (inhibitors) of using a DBMS are not justified", "When you want to reduce application development time", "When there is a potential for enforcing standards"], "a": 1, "e": "", "s": false, "n": 31}, {"t": "mcq", "q": "Which of the following is considered an ongoing, operational cost of a DBMS?", "o": ["Acquisition of hardware", "Maintenance and software licensing fees", "Initial database design and conversion", "Training of development staff"], "a": 1, "e": "", "s": false, "n": 32}, {"t": "mcq", "q": "Which model has emerged as a standard for exchanging data over the Web?", "o": ["XML model", "Relational model", "Network model", "Hierarchical model"], "a": 0, "e": "", "s": false, "n": 33}, {"t": "mcq", "q": "In a hierarchical model, records are organized as a:", "o": ["Tree", "Link", "Graph", "List"], "a": 0, "e": "", "s": false, "n": 34}, {"t": "mcq", "q": "Which of the following describes the hierarchical model?", "o": ["A combination of an object-oriented and a relational model", "Represents data as a hierarchical tree structure", "Represents data as record types", "Represents data as objects"], "a": 1, "e": "", "s": false, "n": 35}, {"t": "mcq", "q": "Difficulty in storing data where multiple relationships exist among the data records is a disadvantage of the:", "o": ["Relational model", "Hierarchical model", "Object-relational model", "Object-oriented model"], "a": 1, "e": "", "s": false, "n": 36}, {"t": "mcq", "q": "Today almost every commercial database is based on:", "o": ["Lists", "The hierarchical model", "The linked-list model", "The relational model", "The object-oriented model"], "a": 3, "e": "", "s": false, "n": 37}, {"t": "mcq", "q": "What is the role of Database Administrators (DBAs)?", "o": ["Developing application programs", "Writing SQL queries", "Monitoring database efficiency", "Designing database structures"], "a": 2, "e": "", "s": false, "n": "X1"}, {"t": "mcq", "q": "Which of the following is NOT a term used in Database?", "o": ["Relation", "Entities", "Relationships", "Activity"], "a": 3, "e": "", "s": false, "n": "X2"}, {"t": "mcq", "q": "Which of the following is NOT one of the main components found in a DBMS?", "o": ["Relationships", "Attributes", "Entities", "Algorithms"], "a": 3, "e": "", "s": false, "n": "X3"}, {"t": "mcq", "q": "Which of the following is NOT one of the Manipulating of DBMS Functionality?", "o": ["Modification: Insertions, deletions and updates to its content.", "Retrieval: Querying, generating reports.", "Organizing: Sorting data in tables following sequential logic.", "Accessing/changing the database through Web applications."], "a": 2, "e": "", "s": false, "n": "X4"}, {"t": "mcq", "q": "When NOT to use a DBMS?", "o": ["When you need to improve performance.", "When there is inhibitor (costs) of using a DBMS.", "When you want to reduce application development time.", "When there is a potential for enforcing standards."], "a": 2, "e": "", "s": false, "n": "X5"}, {"t": "mcq", "q": "A transaction is a collection of operations that performs a single logical function in a database application.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": "TF1"}, {"t": "mcq", "q": "In the early days, database applications were built directly on top of file systems.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": "TF2"}, {"t": "mcq", "q": "Data redundancy decreases the cost of storing and retrieving data.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": "TF3"}, {"t": "mcq", "q": "It is more difficult to access data in a conventional file system than in a database system.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": "TF4"}, {"t": "open", "q": "The purpose of a database is to help people ________.", "a": "Keep track of things", "s": false, "n": "C1"}, {"t": "open", "q": "Data that the database keeps about its own structure is called ________.", "a": "Meta-data", "s": false, "n": "C2"}, {"t": "open", "q": "The purpose of the ________ in a database system is to receive requests from applications and translate those requests into reads and writes on the database files.", "a": "DBMS", "s": false, "n": "C3"}, {"t": "open", "q": "The DBMS controls ________ by ensuring that one user's work does not inappropriately interfere with another user's work.", "a": "Concurrency", "s": false, "n": "C4"}, {"t": "open", "q": "A(n) ________ is a set of one or more computer programs that serves as an intermediary between the user and the DBMS.", "a": "Database application", "s": false, "n": "C5"}, {"t": "open", "q": "In a database system, the ________ creates and processes forms.", "a": "Database application", "s": false, "n": "C6"}, {"t": "open", "q": "List four advantages of using a DBMS.", "a": "Advantages of using a DBMS (any four): Controlling redundancy: storing each data item in only one place. Restricting unauthorized access: providing security and authorization subsystems. Providing persistent storage: program objects survive after the program ends. Efficient query processing: using indexes and query optimization to speed up access.", "s": false, "n": "D1"}, {"t": "open", "q": "Explain the role and responsibilities of the database administrator (DBA).", "a": "The database administrator (DBA): The DBA is the central authority for managing a database system. Responsibilities include granting privileges to users who need to use the system, and classifying users and data in accordance with the organization's policy. The DBA has a DBA account (system or superuser account) with powerful capabilities: account creation, privilege granting, privilege revocation, and security level assignment.", "s": false, "n": "D2"}], "2": [{"t": "mcq", "q": "Which term describes the concepts used to describe the structure and operations of a database?", "o": ["Database", "Data schema", "Data basic", "Data model"], "a": 3, "e": "", "s": false, "n": 1}, {"t": "mcq", "q": "The Entity-Relationship model is a/an ______ data model for database design.", "o": ["Physical", "Conceptual", "Application program", "Logical"], "a": 1, "e": "", "s": false, "n": 2}, {"t": "mcq", "q": "Which of the following is the physical (low-level, internal) data model?", "o": ["Provides concepts that are close to the way many users perceive data", "Provides concepts that describe details of how data is stored in the computer", "Provides concepts that are used by many commercial DBMS implementations", "Provides concepts that are only available for the database users"], "a": 1, "e": "", "s": false, "n": 3}, {"t": "mcq", "q": "______ provide concepts that describe details of how data is stored in the computer.", "o": ["Physical (low-level) data model", "Physical (high-level) data model", "Implementation data model", "Conceptual (high-level) data model"], "a": 0, "e": "", "s": false, "n": 4}, {"t": "mcq", "q": "Which level of data abstraction describes exactly how the data is actually stored?", "o": ["Physical level", "Conceptual level", "File level", "Logical level"], "a": 0, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "There are ______ levels of data abstraction.", "o": ["1", "2", "3", "4"], "a": 2, "e": "", "s": false, "n": 6}, {"t": "mcq", "q": "The ______ level is the lowest level in data abstraction.", "o": ["Physical", "Application", "Logical", "View"], "a": 0, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "The ______ level of data abstraction hides details of data types and information for security purposes.", "o": ["Application", "View", "Logical", "Physical"], "a": 1, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "The database architecture level that describes how the data is actually stored on physical media is the:", "o": ["External level", "Physical level (internal level)", "Conceptual level", "Logical level"], "a": 1, "e": "", "s": false, "n": 9}, {"t": "mcq", "q": "In the three-schema architecture, the level that hides physical storage details and describes the structure of the whole database for a community of users is the:", "o": ["Internal level", "External level", "Conceptual level", "Physical level"], "a": 2, "e": "", "s": false, "n": 10}, {"t": "mcq", "q": "Which schema describes physical storage structures?", "o": ["Internal schema", "Operational schema", "Conceptual schema", "External schema"], "a": 0, "e": "", "s": false, "n": 11}, {"t": "mcq", "q": "The internal level has a schema that describes the ______ storage structure of the database.", "o": ["Network", "Virtual", "Logical", "Physical"], "a": 3, "e": "", "s": false, "n": 12}, {"t": "mcq", "q": "An ______ is an example of an access path that allows direct access to data using an index term or keyword.", "o": ["Catalog", "Key", "Index", "Table"], "a": 2, "e": "", "s": false, "n": 13}, {"t": "mcq", "q": "The ______ is the description of the database structure, relationships, data types and constraints.", "o": ["Database schema", "Database description", "Database diagram", "Database state"], "a": 0, "e": "", "s": false, "n": 14}, {"t": "mcq", "q": "The actual data stored in a database at a particular moment in time is known as the:", "o": ["Database state", "Schema diagram", "Schema construct", "Database schema"], "a": 0, "e": "", "s": false, "n": 15}, {"t": "mcq", "q": "The difference between database schema and database state is that:", "o": ["The schema changes frequently; the state is relatively stable", "The schema refers to the initial loading of data; the state refers to ongoing updates", "The schema describes the database structure; the state is the actual data stored at any point", "There is no significant difference between the two"], "a": 2, "e": "", "s": false, "n": 16}, {"t": "mcq", "q": "What is a database instance?", "o": ["The state of the database system at any given point of time", "The initial values inserted into the database immediately after its creation", "The database system's logical structure", "A single relation that contains all of the database's attributes"], "a": 0, "e": "", "s": false, "n": 17}, {"t": "mcq", "q": "If all constraints are satisfied by a database state, it is called a:", "o": ["Valid state", "Ordered state", "Recovered state", "Invalid state"], "a": 0, "e": "", "s": false, "n": 18}, {"t": "mcq", "q": "The DBMS stores the description of the schema constructs and constraints, which is referred to as:", "o": ["Intension", "Meta-data", "Data management", "Extension"], "a": 1, "e": "", "s": false, "n": 19}, {"t": "mcq", "q": "Physical data independence is the capacity to change the internal schema without having to change the ______ schema.", "o": ["Conceptual", "Meta-data", "Partial", "Virtual"], "a": 0, "e": "", "s": false, "n": 20}, {"t": "mcq", "q": "Allowing internal schema changes without requiring conceptual schema changes is known as:", "o": ["External data independence", "Physical data independence", "Conceptual data independence", "Logical data independence"], "a": 1, "e": "", "s": false, "n": 21}, {"t": "mcq", "q": "Logical data independence is defined as:", "o": ["The capacity to change the conceptual schema without having to change external schemas", "The capacity to change the internal schema without having to change external schemas", "The capacity to change the conceptual schema without having to change internal schemas", "The capacity to change the internal schema without having to change conceptual schemas"], "a": 0, "e": "", "s": false, "n": 22}, {"t": "mcq", "q": "Which of the following is generally used for creating the structure of relations or deleting relations?", "o": ["Relational schema", "DML (Data Manipulation Language)", "Query", "DDL (Data Definition Language)"], "a": 3, "e": "", "s": false, "n": 23}, {"t": "mcq", "q": "Which of the following is the full form of DDL?", "o": ["Data Definition Language", "Detailed Data Language", "Data Derivation Language", "Dynamic Data Language"], "a": 0, "e": "", "s": false, "n": 24}, {"t": "mcq", "q": "The database schema is written in:", "o": ["DDL", "HLL", "DML", "DCL"], "a": 0, "e": "", "s": false, "n": 25}, {"t": "mcq", "q": "Which language defines the conceptual schema?", "o": ["DDL", "IDL", "DML", "VDL"], "a": 0, "e": "", "s": false, "n": 26}, {"t": "mcq", "q": "The database language used to specify the internal schema is:", "o": ["Data definition language", "View definition language", "Data manipulation language", "Storage definition language"], "a": 3, "e": "", "s": false, "n": 27}, {"t": "mcq", "q": "The database language used by end-users and programmers to retrieve, insert, delete and modify data is:", "o": ["VDL (View Definition Language)", "DML (Data Manipulation Language)", "DDL (Data Definition Language)", "SDL (Storage Definition Language)"], "a": 1, "e": "", "s": false, "n": 28}, {"t": "mcq", "q": "DBMSs may include many user-friendly interfaces. Which of the following can NOT be considered an interface for a database?", "o": ["Universal serial bus interface", "Natural language interface", "Graphical user interface", "Forms-based interface"], "a": 0, "e": "", "s": false, "n": 29}, {"t": "mcq", "q": "The following are approaches of interfaces for embedding DML in a programming language, except:", "o": ["Embedded approach", "Programming approach", "Procedure call approach", "Database programming language approach"], "a": 1, "e": "", "s": false, "n": 30}, {"t": "mcq", "q": "Which standard provides an application programming interface (API) that allows client-side programs to call the DBMS?", "o": ["Open Database Call (ODBC)", "Open Database Collection (ODBC)", "Open Database Connectivity (ODBC)", "Open Database Commit (ODBC)"], "a": 2, "e": "", "s": false, "n": 31}, {"t": "mcq", "q": "In an RDBMS, the server is also often called an ______ server.", "o": ["Data", "JDBC", "XML", "SQL"], "a": 3, "e": "", "s": false, "n": 32}, {"t": "mcq", "q": "Reorganizing database file structures, report generation and performance monitoring are all examples of:", "o": ["SQL", "Database internal schema", "DBMS", "Database system utilities"], "a": 3, "e": "", "s": false, "n": 33}, {"t": "mcq", "q": "The utility that observes database usage and provides statistics to the DBA is called the:", "o": ["Database storage reorganization utility", "Performance monitoring utility", "Loading utility", "Backup utility"], "a": 1, "e": "", "s": false, "n": 34}, {"t": "mcq", "q": "______ is one kind of data dictionary that can be accessed by the DBMS software and by the user/DBA.", "o": ["Active data dictionary", "Inter-active data dictionary", "Pro-active data dictionary", "Passive data dictionary"], "a": 0, "e": "", "s": false, "n": 35}, {"t": "mcq", "q": "Many DBMSs have their own module to schedule disk read/write. This module is called the:", "o": ["Buffer management module", "Operating system module", "Data definition module", "User interface module"], "a": 0, "e": "", "s": false, "n": 36}, {"t": "mcq", "q": "In regard to DBMS components, the query optimizer's function is:", "o": ["The rearrangement of operations, elimination of redundancies and use of efficient search algorithms during execution", "Extracting DML commands from an application program written in a host programming language", "Executing the privileged commands", "Compiling a query into an internal form"], "a": 0, "e": "", "s": false, "n": 37}, {"t": "mcq", "q": "Which of the following is not a component of a database management system?", "o": ["File manager", "Query language", "Database manager", "MS Office"], "a": 3, "e": "", "s": false, "n": 38}, {"t": "mcq", "q": "Which software's main function is to provide access to the database from remote locations through computer terminals, workstations or personal computers?", "o": ["Communications software", "Host software", "Client software", "Spreadsheet software"], "a": 0, "e": "", "s": false, "n": 39}, {"t": "mcq", "q": "The database architecture that combines everything into a single computer system is the:", "o": ["Centralized DBMS architecture", "2-tier client-server architecture", "Many-tier client-server architecture", "3-tier client-server architecture"], "a": 0, "e": "", "s": false, "n": 40}, {"t": "mcq", "q": "Three-tier architecture includes:", "o": ["Three client layers", "Two client layers and one server layer", "Three server layers", "A client layer and two server layers"], "a": 3, "e": "", "s": false, "n": 41}, {"t": "mcq", "q": "In the three-tier architecture, the intermediate (middle) tier is called the:", "o": ["Application server", "Web server", "Functional server", "Storage server"], "a": 0, "e": "", "s": false, "n": 42}, {"t": "mcq", "q": "Which DBMS architecture serves as a conduit for sending partially processed data between the client and the database server?", "o": ["One-tier client-server", "Two-tier client-server", "Three-tier client-server", "A physical centralized architecture"], "a": 2, "e": "", "s": false, "n": 43}, {"t": "mcq", "q": "The ______ layer provides a high-level view of data and actions on data.", "o": ["Data access", "Business logic", "Presentation", "User interaction"], "a": 1, "e": "", "s": false, "n": 44}, {"t": "mcq", "q": "The ______ layer provides the interface between the business-logic layer and the underlying database.", "o": ["Business logic", "Presentation", "User interaction", "Data access"], "a": 3, "e": "", "s": false, "n": 45}, {"t": "mcq", "q": "DBMSs can be classified using the criterion \"number of sites\" into:", "o": ["Single-user systems / multiuser systems", "Centralized systems / distributed systems", "Key-value based systems / graph value storage systems", "Relational database systems / tree-structured database systems"], "a": 1, "e": "", "s": false, "n": 46}, {"t": "mcq", "q": "A heterogeneous database management system is defined as:", "o": ["DBMSs that use the same DBMS software at all the sites", "DBMSs that use the same DBMS software for all the users", "DBMSs that can use different DBMS software at each site", "DBMSs that can use one DBMS software from the same vendor at all the sites"], "a": 2, "e": "", "s": false, "n": 47}, {"t": "mcq", "q": "Which of the following is a heterogeneous distributed database?", "o": ["The same DBMS is used at each location and data are not distributed across all nodes", "A different DBMS is used at each location and data are not distributed across all nodes", "The same DBMS is used at each location and data are distributed across all nodes", "A different DBMS is used at each location and data are distributed across all nodes"], "a": 3, "e": "", "s": false, "n": 48}, {"t": "mcq", "q": "Which of the following is not a correct data model used in NoSQL systems?", "o": ["Document-based model", "Graph-based model", "Column-based model", "Network data model"], "a": 3, "e": "", "s": false, "n": 49}, {"t": "mcq", "q": "Which of the following is not a DBMS classification based on the emerging data model?", "o": ["NoSQL", "Relational", "Key-value", "Object-oriented"], "a": 1, "e": "", "s": false, "n": 50}, {"t": "mcq", "q": "In a hierarchical model, records are organized as a:", "o": ["Tree", "Links", "Graph", "List"], "a": 0, "e": "", "s": false, "n": 51}, {"t": "mcq", "q": "Which of the following describes the hierarchical model?", "o": ["A combination of an object-oriented and a relational model", "Represents data as a hierarchical tree structure", "Represents data as record types", "Represents data as objects"], "a": 1, "e": "", "s": false, "n": 52}, {"t": "mcq", "q": "Difficulty in storing data where multiple relationships exist among the data records is a disadvantage of the:", "o": ["Relational model", "Hierarchical model", "Object-relational model", "Object-oriented model"], "a": 1, "e": "", "s": false, "n": 53}, {"t": "mcq", "q": "What is a Data Model?", "o": ["A programming language for DBMS.", "A type of database schema.", "A set of concepts to describe the structure of a database.", "A set of commands for querying databases."], "a": 2, "e": "", "s": false, "n": "X1"}, {"t": "mcq", "q": "What do Data Model constructs often include?", "o": ["Data elements and their data types, entities, and relationships.", "User interfaces.", "Data security measures.", "External schemas."], "a": 0, "e": "", "s": false, "n": "X2"}, {"t": "mcq", "q": "What does DDL stand for in DBMS languages?", "o": ["Data Definition Language", "Database Description Language", "Database Design Language", "Data Display Language"], "a": 0, "e": "", "s": false, "n": "X3"}, {"t": "mcq", "q": "Which of the following focuses on the physical storage of data, including details such as file organization, indexing methods, and storage structures?", "o": ["Application program", "Conceptual schema", "Logical schema", "Physical schema"], "a": 3, "e": "", "s": false, "n": "X4"}, {"t": "mcq", "q": "What is a Database Instance?", "o": ["The state of the database system at any given point of time.", "The initial values inserted into the database immediately after its creation.", "The database system's logical structure.", "A single relation that contains all of the database's attributes."], "a": 0, "e": "", "s": false, "n": "X5"}, {"t": "mcq", "q": "Which of the following is NOT a DBMS classification based on the emerging data model?", "o": ["NoSQL", "Relational", "Key-value", "Object-oriented"], "a": 1, "e": "", "s": false, "n": "X6"}, {"t": "mcq", "q": "Which DBMS language is used to allow users to insert, delete, and modify tuples in addition to querying data?", "o": ["Data Manipulation Language", "Data View Language", "Data Definition Language", "Data Control Language"], "a": 0, "e": "", "s": false, "n": "X7"}, {"t": "mcq", "q": "The database system contains not only the database itself but also a complete definition or description of the database structure and constraints. This definition is stored in the form of a ______.", "o": ["DBMS audit log", "DBMS journal", "DBMS catalog", "DBMS archive"], "a": 2, "e": "", "s": false, "n": "X8"}, {"t": "mcq", "q": "Which of the following DBMS architectures serves as a conduit for sending partially processed data between the client and the database server?", "o": ["One Tier Client-Server", "Two Tier Client-Server", "Three Tier Client-Server", "A Physical Centralized Architecture"], "a": 2, "e": "", "s": false, "n": "X9"}, {"t": "mcq", "q": "Allowing internal schema changes without requiring conceptual schema changes is known as ______.", "o": ["External Data Independence", "Physical Data Independence", "Conceptual Data Independence", "Logical Data Independence"], "a": 1, "e": "", "s": false, "n": "X10"}, {"t": "mcq", "q": "A database instance is the actual content of the database at a particular point in time.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": "TF1"}, {"t": "mcq", "q": "Data manipulation language commands are used to define a database, including creating, altering and dropping tables and establishing constraints.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": "TF2"}, {"t": "open", "q": "In reference to the three-schema architecture, what are the three levels at which schemas are defined? Write a short description of each.", "a": "The three-schema architecture: Internal schema (internal level): describes the physical storage structure of the database and its access paths, for example files and indexes. Conceptual schema (conceptual level): describes the structure and constraints of the whole database for a community of users, hiding physical storage details. External schemas (external level, views): each describes the part of the database that a particular user group is interested in and hides the rest.", "s": false, "n": "C1"}, {"t": "open", "q": "Define and compare database schema and database state.", "a": "Database schema versus database state: Database schema: the description of a database, including its structure, relationships, data types and constraints. It changes very infrequently. Database state: the actual data stored in the database at a particular moment in time, including all the data in the database. It is also called a database instance, occurrence or snapshot, and it changes every time the database is updated.", "s": false, "n": "C2"}, {"t": "open", "q": "Explain the concept of Three-Schema Architecture in the context of database systems.", "a": "Explain the concept of Three-Schema Architecture in the context of database systems.", "s": false, "n": "S-A"}], "3": [{"t": "mcq", "q": "The data elements in each row represent facts about a real-world entity. In the formal model, rows are called:", "o": ["Attributes", "Relations", "Tuples", "Database state"], "a": 2, "e": "", "s": false, "n": 1}, {"t": "mcq", "q": "The element of a table represented by a column is called a:", "o": ["Attribute", "Tuple", "Relation", "File"], "a": 0, "e": "", "s": false, "n": 2}, {"t": "mcq", "q": "The element of a table represented by a row is called a:", "o": ["Attribute", "Tuple", "Relation", "File"], "a": 1, "e": "", "s": false, "n": 3}, {"t": "mcq", "q": "SQL uses the term table for the formal relational-model term:", "o": ["Attribute", "Relation", "Tuple", "Object"], "a": 1, "e": "", "s": false, "n": 4}, {"t": "mcq", "q": "A set of possible data values is called:", "o": ["Tuple", "Domain", "Degree", "Attribute"], "a": 1, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "A domain is a set of atomic values. Atomic value means:", "o": ["Each value in the domain is repeatable", "Each value in the domain is composite", "Each value in the domain is automatically generated", "Each value in the domain is indivisible"], "a": 3, "e": "", "s": false, "n": 6}, {"t": "mcq", "q": "The characteristics or properties that define all items of a category, applied to all cells of a column, are:", "o": ["Tuples", "Cardinality", "Domain", "Attributes"], "a": 3, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "The logical design of a database is called:", "o": ["Relation structure", "Relation program", "Relation instance", "Relation schema"], "a": 3, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "A relation state is:", "o": ["A set of attributes", "The key constraints applied to a relation", "The total number of tuples in a relation", "A set of tuples representing a snapshot of the relation"], "a": 3, "e": "", "s": false, "n": 9}, {"t": "mcq", "q": "The number of tuples in a relation is referred to as its:", "o": ["Cardinality", "Degree", "Attribute count", "Domain"], "a": 0, "e": "", "s": false, "n": 10}, {"t": "mcq", "q": "The order of tuples in a relational table:", "o": ["Affects the primary key selection", "Is always predefined by SQL", "Does not matter because a relation is a set", "Matters since queries are retrieved in order"], "a": 2, "e": "", "s": false, "n": 11}, {"t": "mcq", "q": "A term used to describe the conditions that must hold on all valid relation states is:", "o": ["Domain", "Key", "Constraints", "Cardinality"], "a": 2, "e": "", "s": false, "n": 12}, {"t": "mcq", "q": "Which statement is true about a superkey?", "o": ["It must always be a single attribute", "It is a set of attributes that uniquely identifies a tuple in a relation", "It cannot contain extra attributes beyond the minimal key", "It is always chosen as the primary key"], "a": 1, "e": "", "s": false, "n": 13}, {"t": "mcq", "q": "If a relation has several keys, they are called:", "o": ["Unique keys", "Candidate keys", "Secondary keys", "Primary keys"], "a": 1, "e": "", "s": false, "n": 14}, {"t": "mcq", "q": "What is the purpose of a key in a relational database?", "o": ["To speed up database performance by optimizing queries", "To uniquely identify each row (tuple) in a table", "To act as a temporary placeholder for data computations", "To encrypt data for security purposes"], "a": 1, "e": "", "s": false, "n": 15}, {"t": "mcq", "q": "The key used to represent relationships between tables is called:", "o": ["Foreign key", "Primary key", "Secondary key", "Candidate key"], "a": 0, "e": "", "s": false, "n": 16}, {"t": "mcq", "q": "What is the purpose of the FOREIGN KEY constraint?", "o": ["Links two tables", "Ensures uniqueness", "Stores binary data", "Defines primary keys"], "a": 0, "e": "", "s": false, "n": 17}, {"t": "mcq", "q": "If no attribute has the uniqueness property, a new attribute can be added to identify the rows. This key is called:", "o": ["Candidate key", "Artificial (surrogate) key", "Superkey", "Foreign key"], "a": 1, "e": "", "s": false, "n": 18}, {"t": "mcq", "q": "In Student(ID, name, dept_name, tot_cred), which attribute can form the primary key?", "o": ["tot_cred", "ID", "name", "dept_name"], "a": 1, "e": "", "s": false, "n": 19}, {"t": "mcq", "q": "In Products(ProductID, Name, Quantity, Price), which attribute is the primary key?", "o": ["ProductID", "Quantity", "Price", "Name"], "a": 0, "e": "", "s": false, "n": 20}, {"t": "mcq", "q": "In STUDENT(StudentID, StudentName, GPA, MajorNumber), which attribute could be the foreign key?", "o": ["StudentName", "StudentID", "GPA", "MajorNumber"], "a": 3, "e": "", "s": false, "n": 21}, {"t": "mcq", "q": "In Student(ID, Email, name, degree, DateBirth, departmentNumber) and Department(DepID, DepartmentName, NumberofStudent), which is the foreign key attribute?", "o": ["ID", "DepID", "departmentNumber", "Email"], "a": 2, "e": "", "s": false, "n": 22}, {"t": "mcq", "q": "Which constraint ensures that attribute values fall within an allowed range?", "o": ["Key constraint", "Referential integrity constraint", "Domain constraint", "Entity integrity constraint"], "a": 2, "e": "", "s": false, "n": 23}, {"t": "mcq", "q": "A domain constraint refers to:", "o": ["A set of unique keys", "A set of tuples in the relation", "A set of valid values for the attribute", "A set of attributes"], "a": 2, "e": "", "s": false, "n": 24}, {"t": "mcq", "q": "Which constraint ensures uniqueness?", "o": ["Cardinality", "Integrity", "Key constraint", "Participation"], "a": 2, "e": "", "s": false, "n": 25}, {"t": "mcq", "q": "The entity integrity constraint implies that:", "o": ["All entities must remain entirely independent of each other", "All entities must be integrated into a single database schema", "The primary key attributes cannot have null values in any tuple", "Entity relationships must be defined explicitly by foreign keys"], "a": 2, "e": "", "s": false, "n": 26}, {"t": "mcq", "q": "Which is NOT one of the three main built-in constraints in the relational model?", "o": ["Referential integrity constraints", "Candidate key constraints", "Entity integrity constraints", "Key constraints"], "a": 1, "e": "", "s": false, "n": 27}, {"t": "mcq", "q": "Referential integrity is specified via the:", "o": ["DISCRIMINATING KEY", "FOREIGN KEY", "PRIMARY KEY", "SECONDARY KEY"], "a": 1, "e": "", "s": false, "n": 28}, {"t": "mcq", "q": "If a foreign key value does not match any primary key value in the referenced table, which constraint is violated?", "o": ["Referential integrity", "Key constraint", "Domain constraint", "Entity integrity"], "a": 0, "e": "", "s": false, "n": 29}, {"t": "mcq", "q": "The ______ violation means a foreign key value in a new tuple references a primary key value that does not exist in the referenced relation.", "o": ["Key constraint", "Domain constraint", "Entity integrity", "Referential integrity"], "a": 3, "e": "", "s": false, "n": 30}, {"t": "mcq", "q": "After an insert operation, if the primary key value is null in the new tuple, which constraint is violated?", "o": ["Domain constraint", "Entity integrity", "Referential integrity", "Key constraint"], "a": 1, "e": "", "s": false, "n": 31}, {"t": "mcq", "q": "Updating a foreign key (FK) may violate:", "o": ["Referential integrity", "Entity integrity", "Domain constraint", "Key constraint"], "a": 0, "e": "", "s": false, "n": 32}, {"t": "mcq", "q": "The ______ operation may violate only referential integrity constraints.", "o": ["DELETE", "INSERT", "ENTER", "UPDATE"], "a": 0, "e": "", "s": false, "n": 33}, {"t": "mcq", "q": "The ______ operation modifies the value of attributes in one or more existing tuples in a relation.", "o": ["DELETE", "INSERT", "ENTER", "UPDATE"], "a": 3, "e": "", "s": false, "n": 34}, {"t": "mcq", "q": "Which operation modifies an existing tuple?", "o": ["UPDATE", "SELECT", "DELETE", "INSERT"], "a": 0, "e": "", "s": false, "n": 35}, {"t": "mcq", "q": "When can the SET NULL option be used in a referential integrity constraint?", "o": ["Only if the primary key is numeric", "If the foreign key allows NULL", "When the parent table is empty", "If the table has no primary key"], "a": 1, "e": "", "s": false, "n": 36}, {"t": "mcq", "q": "With the DELETE statement, tuples are deleted from only one table at a time, unless ______ is specified on a referential integrity constraint.", "o": ["NULL", "DEFAULT", "CASCADE", "REJECT"], "a": 2, "e": "", "s": false, "n": 37}, {"t": "mcq", "q": "What is the effect of specifying ON UPDATE CASCADE on a foreign key?", "o": ["Prevents any update to the referenced key", "Automatically updates the foreign key values to match the new referenced key value", "Raises an error when the referenced key is updated", "Sets the foreign key to NULL on update"], "a": 1, "e": "", "s": false, "n": 38}, {"t": "mcq", "q": "Updates that violate ______ are disallowed.", "o": ["Integrity constraints", "Authorization", "Transaction control", "DDL constraints"], "a": 0, "e": "", "s": false, "n": 39}, {"t": "mcq", "q": "In the relational model, the term relation refers to a:", "o": ["Row", "Column", "Table", "Cell"], "a": 2, "e": "", "s": false, "n": "X1"}, {"t": "mcq", "q": "The formal term of the Column Header in the relation definitions is ______.", "o": ["Relation", "Attribute", "Domain", "Schema"], "a": 1, "e": "", "s": false, "n": "X2"}, {"t": "mcq", "q": "If a relation has several keys, they are called ______.", "o": ["Unique Keys", "Secondary Keys", "Candidate keys", "Primary Keys"], "a": 2, "e": "", "s": false, "n": "X3"}, {"t": "mcq", "q": "Consider a BOOK relation in a library database which has six attributes (Title, Author, ISBN, No. of pages, Publish year, Price). Which attribute should be used as the primary key?", "o": ["ISBN", "Title", "Author", "Publish year"], "a": 0, "e": "", "s": false, "n": "X4"}, {"t": "mcq", "q": "Updating an ordinary attribute (neither PK nor FK) can only violate which of the following?", "o": ["Entity integrity constraints", "Referential integrity constraints", "Key constraints", "Domain or NOT NULL constraints"], "a": 3, "e": "", "s": false, "n": "X5"}, {"t": "mcq", "q": "Which of the following constraints could be violated by a DELETE operation?", "o": ["Referential integrity", "Entity integrity", "Key constraint", "Domain constraint"], "a": 0, "e": "", "s": false, "n": "X6"}, {"t": "mcq", "q": "For a particular database state, the value of the foreign key attribute in each tuple of the referencing relation can be ______.", "o": ["a new secondary key value in any relation", "an existing primary key value in the referencing relation", "an existing primary key value in the referenced relation", "an existing foreign key value in the referenced relation"], "a": 2, "e": "", "s": false, "n": "X7"}, {"t": "mcq", "q": "A superkey of a relation is a set of one or more attributes whose values are guaranteed to uniquely identify tuples in the relation.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": "TF1"}, {"t": "mcq", "q": "A foreign key can refer to any attributes of the referenced relation.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": "TF2"}, {"t": "mcq", "q": "The order of tuples in a relation matters, because queries retrieve tuples in order.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": "TF3"}, {"t": "open", "q": "List three constraint violations that can occur with the INSERT operation, and explain each.", "a": "Constraint violations on INSERT: Domain constraint: an attribute value in the new tuple is not of the attribute's domain. Key constraint: the value of a key attribute in the new tuple already exists in another tuple of the relation. Referential integrity: a foreign key value in the new tuple references a primary key value that does not exist in the referenced relation. Entity integrity: the primary key value of the new tuple is null.", "s": false, "n": "S1"}, {"t": "open", "q": "Explain the purpose of the actions RESTRICT, CASCADE and SET NULL in the deletion operation.", "a": "Actions on deleting a referenced tuple: RESTRICT: reject the deletion while referencing tuples exist. CASCADE: also delete the tuples that reference the deleted tuple. SET NULL: set the foreign key of the referencing tuples to NULL (only if the foreign key allows NULL).", "s": false, "n": "S2"}, {"t": "open", "q": "Explain the INSERT, DELETE and UPDATE operations and the constraints they must respect. Short answer S-A. What are the main types of built-in constraints in the relational model?", "a": "INSERT: adds a new tuple; it must satisfy the domain, key, entity-integrity and referential-integrity constraints. DELETE: removes a tuple; it may violate referential integrity if other tuples reference it. UPDATE: modifies attribute values; changing a non-key attribute can violate the domain constraint, while changing a primary or foreign key can also violate key, entity or referential integrity.", "s": false, "n": "S3"}, {"t": "open", "q": "What are the main types of built-in constraints in the relational model?", "a": "Domain constraints, key constraints, NOT NULL constraints, entity integrity constraints, and referential integrity constraints.", "s": false, "n": "S-A"}], "4": [{"t": "mcq", "q": "The ER model has three main concepts:", "o": ["Entities, relationships, and roles", "Entities, relationships, and attributes", "Entities, relationships, and data values", "Entities, attributes, and keys"], "a": 1, "e": "", "s": false, "n": 1}, {"t": "mcq", "q": "Which is NOT one of the three main concepts of an ER model?", "o": ["Classes", "Entities", "Attributes", "Relationships"], "a": 0, "e": "", "s": false, "n": 2}, {"t": "mcq", "q": "The Entity-Relationship model is a/an ______ data model for database design.", "o": ["Physical", "Conceptual", "Application program", "Logical"], "a": 1, "e": "", "s": false, "n": 3}, {"t": "mcq", "q": "The first step in designing a high-level conceptual data model is:", "o": ["Requirements collection and analysis", "Logical design analysis", "Functional requirements analysis", "Conceptual design analysis"], "a": 0, "e": "", "s": false, "n": 4}, {"t": "mcq", "q": "Which database design activity focuses on the programs and interfaces that access and update the database?", "o": ["Application program design", "Logical schema design", "Physical schema design", "Both logical and physical schema design"], "a": 0, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "Which of the following best defines an entity?", "o": ["A collection of related data files", "A software module that manages data", "A specific constraint on a database table", "A specific object or thing in the miniworld that is represented in the database"], "a": 3, "e": "", "s": false, "n": 6}, {"t": "mcq", "q": "Which of the following does NOT represent an entity?", "o": ["Student", "Employee", "Car", "Employee_Id"], "a": 3, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "In an ER diagram, an entity is represented as:", "o": ["Oval shaped box", "Rectangular box", "Square box", "Diamond shaped box"], "a": 1, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "In the ER model, a rectangle represents:", "o": ["Tuples", "Entity set", "Relationships", "Attributes"], "a": 1, "e": "", "s": false, "n": 9}, {"t": "mcq", "q": "Entities with the same basic attributes are grouped into an:", "o": ["Structural type", "Relationship type", "Entity type", "Universal type"], "a": 2, "e": "", "s": false, "n": 10}, {"t": "mcq", "q": "The descriptive property possessed by each entity set is the:", "o": ["Attribute", "Relation", "Model", "Entity"], "a": 0, "e": "", "s": false, "n": 11}, {"t": "mcq", "q": "______ are properties used to describe an entity.", "o": ["Values", "Domains", "Attributes", "Weak entities"], "a": 2, "e": "", "s": false, "n": 12}, {"t": "mcq", "q": "What are the properties that describe an entity and are stored in the database?", "o": ["Schemas", "Attributes", "Relations", "Instances"], "a": 1, "e": "", "s": false, "n": 13}, {"t": "mcq", "q": "What is the purpose of an attribute in an ER diagram?", "o": ["To define a relationship between entities", "To specify the foreign key of an entity", "To specify the primary key of an entity", "To describe a characteristic of an entity"], "a": 3, "e": "", "s": false, "n": 14}, {"t": "mcq", "q": "What is the significance of underlining an attribute in an ER diagram?", "o": ["To show composite attributes", "To denote derived attributes", "To indicate nullable attributes", "To indicate primary keys"], "a": 3, "e": "", "s": false, "n": 15}, {"t": "mcq", "q": "An attribute that can be divided into smaller sub-parts with independent meanings is called a:", "o": ["Composite attribute", "Complex attribute", "Stored attribute", "Simple attribute"], "a": 0, "e": "", "s": false, "n": 16}, {"t": "mcq", "q": "Which is an example of a composite attribute?", "o": ["{PreviousDegrees}", "Color = {Red, Blue, Green}", "Customer_ID", "Address = (House#, Street, City, ZipCode, Country)"], "a": 3, "e": "", "s": false, "n": 17}, {"t": "mcq", "q": "A(n) ______ attribute is a property used to describe an entity, which may be composed of several components.", "o": ["Simple", "Atomic", "Multivalued", "Composite"], "a": 3, "e": "", "s": false, "n": 18}, {"t": "mcq", "q": "What is a multivalued attribute?", "o": ["An attribute that can only have one value for a single entity instance", "An attribute used to represent relationships between entities", "An attribute that is not related to any entity instances", "An attribute that can have multiple values for a single entity instance"], "a": 3, "e": "", "s": false, "n": 19}, {"t": "mcq", "q": "Which of the following could be considered a multi-valued attribute?", "o": ["Location", "Birthday", "Name", "ID"], "a": 0, "e": "", "s": false, "n": 20}, {"t": "mcq", "q": "In an ER diagram, a multivalued attribute is displayed as:", "o": ["Ovals", "Rectangular box", "Double rectangular box", "Double ovals"], "a": 3, "e": "", "s": false, "n": 21}, {"t": "mcq", "q": "What is a key attribute of an entity type?", "o": ["An attribute that can have multiple values for each entity", "An attribute for which each entity must have a unique (distinct) value", "An attribute that is optional for each entity to have", "An attribute that is not necessary for each entity to have"], "a": 1, "e": "", "s": false, "n": 22}, {"t": "mcq", "q": "The function that an entity plays in a relationship is called that entity's:", "o": ["Role", "Instance", "Position", "Use"], "a": 0, "e": "", "s": false, "n": 23}, {"t": "mcq", "q": "The number of participating entity types in a relationship type is called the:", "o": ["Cardinality", "Degree", "Role", "Participation"], "a": 1, "e": "", "s": false, "n": 24}, {"t": "mcq", "q": "What is a \"ternary\" relationship?", "o": ["A relationship between two entities", "A relationship between three entities", "A relationship between a weak entity and its parent entity", "A relationship between an entity and its attribute"], "a": 1, "e": "", "s": false, "n": 25}, {"t": "mcq", "q": "What is an example of a relationship type of degree higher than two?", "o": ["WORKS_ON (Employee, Project)", "ATTEND (Employee, Training Session, Courses)", "MANAGES (Employee, Department)", "BELONGS_TO (Employee, Department)"], "a": 1, "e": "", "s": false, "n": 26}, {"t": "mcq", "q": "A relationship type in which the same entity type participates twice in two distinct roles is called:", "o": ["N-ary relation", "Binary relation", "Recursive relation", "Ternary relation"], "a": 2, "e": "", "s": false, "n": 27}, {"t": "mcq", "q": "A recursive relationship is a relationship between an entity and:", "o": ["Itself", "An instance entity", "A weak entity", "A subtype entity"], "a": 0, "e": "", "s": false, "n": 28}, {"t": "mcq", "q": "A relationship within the SAME entity is called:", "o": ["Recursive", "Binary", "4-ary", "Ternary"], "a": 0, "e": "", "s": false, "n": 29}, {"t": "mcq", "q": "To display a ______ relationship in an ER diagram, we need to display role names to distinguish participations.", "o": ["Binary", "Ternary", "Recursive", "Primary"], "a": 2, "e": "", "s": false, "n": 30}, {"t": "mcq", "q": "In ER, it is compulsory to write the role name on the ______ relationship.", "o": ["Ternary", "Recursive", "All types of", "Binary"], "a": 1, "e": "", "s": false, "n": 31}, {"t": "mcq", "q": "The entities that do not have key attributes to be distinct are considered as:", "o": ["Single entity", "Foreign entity", "Weak entity", "Strong entity"], "a": 2, "e": "", "s": false, "n": 32}, {"t": "mcq", "q": "In an ER model, an entity type that does not have a key attribute on its own is known as a:", "o": ["Strong entity type", "Relation", "Composite entity type", "Weak entity type"], "a": 3, "e": "", "s": false, "n": 33}, {"t": "mcq", "q": "An entity type that does not have its own primary key attributes is called a:", "o": ["Strong entity type", "Subclass entity type", "Owner entity type", "Weak entity type"], "a": 3, "e": "", "s": false, "n": 34}, {"t": "mcq", "q": "What defines a weak entity type?", "o": ["An entity type that has a composite key", "An entity type that does not participate in any relationships", "An entity type that does not have a key attribute of its own and depends on another entity", "An entity type that can exist without any related entities"], "a": 2, "e": "", "s": false, "n": 35}, {"t": "mcq", "q": "An entity which depends on another entity for its existence is called:", "o": ["Weak entity", "TABLE operation", "Strong entity", "Primary key"], "a": 0, "e": "", "s": false, "n": 36}, {"t": "mcq", "q": "\"A DEPENDENT entity is identified by the dependent's first name and the specific EMPLOYEE with whom the dependent is related.\" DEPENDENT is a:", "o": ["Two entities", "Weak entity type", "Strong entity type", "A relationship"], "a": 1, "e": "", "s": false, "n": 37}, {"t": "mcq", "q": "A(n) ______ entity must participate in an identifying relationship type with a(n) ______ entity type.", "o": ["Weak, weak", "Owner (or identifying), weak", "Strong, weak", "Weak, owner (or identifying)"], "a": 3, "e": "", "s": false, "n": 38}, {"t": "mcq", "q": "A weak entity type normally has a ______, the attribute that can uniquely identify weak entities related to the same owner entity.", "o": ["Foreign key", "Symmetric key", "Partial key", "Primary key"], "a": 2, "e": "", "s": false, "n": 39}, {"t": "mcq", "q": "Which is an example of a weak entity?", "o": ["EMPLOYEE entity with emp_id", "DEPENDENT identified by first name and the related EMPLOYEE", "DEPARTMENT with a unique name", "PROJECT with start and end dates"], "a": 1, "e": "", "s": false, "n": 40}, {"t": "mcq", "q": "A weak entity is ______.", "o": ["An entity with a foreign key relationship", "An entity with no attributes", "An entity with a composite primary key", "An entity that cannot be uniquely identified by its attributes alone"], "a": 3, "e": "", "s": false, "n": "X1"}, {"t": "mcq", "q": "An entity type that does not have a key attribute on its own ______.", "o": ["should be a single entity within a defined ER diagram", "does not exist", "is called weak entity", "is called recursive"], "a": 2, "e": "", "s": false, "n": "X2"}, {"t": "mcq", "q": "A ______ is a relationship type with the same entity type participating twice in two distinct roles.", "o": ["Ternary Relation", "Recursive Relation", "N-ary Relation", "Binary Relation"], "a": 1, "e": "", "s": false, "n": "X3"}, {"t": "mcq", "q": "An attribute of an entity type for which each entity must have a unique (distinct) value is ______.", "o": ["Composite attribute", "Multivalued attribute", "Simple attribute", "Key attribute"], "a": 3, "e": "", "s": false, "n": "X4"}, {"t": "mcq", "q": "An employee has an address which consists of the street name, the zip code, and the region. The Emp_Addr attribute should be:", "o": ["Multi-valued", "Key", "Composite", "Simple"], "a": 2, "e": "", "s": false, "n": "X5"}, {"t": "mcq", "q": "Which of the following is an example of a multivalued attribute?", "o": ["Age", "SSN", "Name", "Interests / hobbies"], "a": 3, "e": "", "s": false, "n": "X6"}, {"t": "mcq", "q": "______ are specific objects or things in the mini-world that are represented in the database.", "o": ["Attributes", "Set of Values", "Values", "Entities"], "a": 3, "e": "", "s": false, "n": "X7"}, {"t": "mcq", "q": "A role name of the relationship MUST be written in ______.", "o": ["any relationship types", "ternary relationship only", "binary relationship only", "recursive relationship only"], "a": 3, "e": "", "s": false, "n": "X8"}, {"t": "mcq", "q": "A ______ attribute has a single value for the attribute.", "o": ["multi-valued", "composite", "simple", "key"], "a": 2, "e": "", "s": false, "n": "X9"}, {"t": "mcq", "q": "In the entity-relationship (ER) model, which of the following attributes should be used as a composite attribute (BOOK: Title, No. of pages, Publish year, Author name)?", "o": ["Title", "No. of pages", "Publish year", "Author name"], "a": 3, "e": "", "s": false, "n": "X10"}, {"t": "mcq", "q": "A relationship of marriage within entity PERSON is called ______.", "o": ["4-ary", "recursive", "ternary", "binary"], "a": 1, "e": "", "s": false, "n": "X11"}, {"t": "open", "q": "In the ER model, attributes have different types. Mention and define two of them.", "a": "Simple attribute: cannot be divided into smaller parts (e.g. Age, Salary). Composite attribute: can be divided into meaningful sub-parts (e.g. Address = Street, City, ZIP).", "s": false, "n": "S1"}, {"t": "open", "q": "Explain the composite and the multi-valued attribute, and give an example of each.", "a": "Composite: made of parts, e.g. Name = (First, "A student can enroll in many courses, and each course can have many students", "A product can have many orders, and each order can only include one product", "A department can have many employees, and each employee can only work for one department"], "a": 1, "e": "", "s": false, "n": 4}, {"t": "mcq", "q": "In a hospital database, an employee can work in only one department, and each department can have multiple employees. What is the cardinality ratio of the relationship between EMPLOYEE and DEPARTMENT?", "o": ["1:200", "200:N", "M:N", "N:1"], "a": 3, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "Which of the following is NOT correct about the existence dependency constraint?", "o": ["It can be one or more, which means mandatory participation (existence-dependent)", "It specifies minimum participation", "It can be zero, which means optional participation (not existence-dependent)", "It specifies maximum participation"], "a": 3, "e": "", "s": false, "n": 6}, {"t": "mcq", "q": "Which of the following is considered a structural constraint on relationship types?", "o": ["Domain constraint", "Cardinality ratio", "Key constraint", "Referential integrity constraint"], "a": 1, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "The structural constraint that specifies whether the existence of an entity depends on its being related to another entity via the relationship type is called:", "o": ["Specialization", "Cardinality ratio", "Participation constraint", "Generalization"], "a": 2, "e": "", "s": false, "n": 8}, {"t": "mcq", "q": "The condition for total participation of an entity in a relationship is:", "o": ["Maximum cardinality should be one", "Maximum cardinality should be M", "Minimum cardinality should be one", "Minimum cardinality should be zero"], "a": 2, "e": "", "s": false, "n": 9}, {"t": "mcq", "q": "What type of participation constraint is represented by a single line between an entity and a relationship in an ER diagram?", "o": ["Total participation", "Partial participation", "Recursive participation", "Generalization"], "a": 1, "e": "", "s": false, "n": 10}, {"t": "mcq", "q": "Which (min, max) notation specifies that \"each instructor is a member of exactly one department, but a department can have any number of instructors\"?", "o": ["(1,1) for INSTRUCTOR in MEMBER_OF and (0,n) for DEPARTMENT in MEMBER_OF", "(n,1) for INSTRUCTOR in MEMBER_OF and (0,1) for DEPARTMENT in MEMBER_OF", "(0,1) for DEPARTMENT in MEMBER_OF and (0,n) for INSTRUCTOR in MEMBER_OF", "(1,0) for DEPARTMENT in MEMBER_OF and (0,1) for INSTRUCTOR in MEMBER_OF"], "a": 0, "e": "", "s": false, "n": 11}, {"t": "mcq", "q": "In a UML class diagram, each class has three sections. The second section includes:", "o": ["Class operations", "Constraints", "Attributes", "Entity type (class) name"], "a": 2, "e": "", "s": false, "n": 12}, {"t": "mcq", "q": "How is an entity type represented in a UML class diagram?", "o": ["Single-line text", "Oval", "Diamond", "Rectangle with three sections"], "a": 3, "e": "", "s": false, "n": 13}, {"t": "mcq", "q": "In UML class diagrams, the aggregation relationship between an object and its parts is displayed as a line with a small ______:", "o": ["Square at the object end", "Triangle at the object end", "Diamond at the object end", "Circle at the object end"], "a": 2, "e": "", "s": false, "n": 14}, {"t": "mcq", "q": "______ is an abstraction concept for building composite objects from their component objects.", "o": ["Association", "Specialization", "Generalization", "Aggregation"], "a": 3, "e": "", "s": false, "n": 15}, {"t": "mcq", "q": "What is the purpose of the Extended Entity-Relationship (EER) model?", "o": ["To represent higher-degree relationships in ER diagrams", "To enhance the ER model with additional constructs to represent more complex applications", "To display database schemas using UML class diagrams", "To specify classes and their relationships in object-oriented software design"], "a": 1, "e": "", "s": false, "n": 16}, {"t": "mcq", "q": "A superclass or subclass represents a collection of entities of the ______ type, which is why superclasses and subclasses are all shown in rectangles in EER diagrams.", "o": ["Different", "Same", "Diverse", "General"], "a": 1, "e": "", "s": false, "n": 17}, {"t": "mcq", "q": "Specialization is the process of classifying a class of objects into more specialized ______.", "o": ["Polymorphism", "Class", "Superclass", "Subclass"], "a": 3, "e": "", "s": false, "n": 18}, {"t": "mcq", "q": "Specialization is the process of defining a set of subclasses of an entity type; this entity type is called the ______ of the specialization.", "o": ["Superclass", "Class", "Polymorphism", "Subclass"], "a": 0, "e": "", "s": false, "n": 19}, {"t": "mcq", "q": "We may have ______ specializations of the same entity type based on different distinguishing characteristics.", "o": ["Only one", "Several", "Same", "Only two"], "a": 1, "e": "", "s": false, "n": 20}, {"t": "mcq", "q": "The set of ______ that forms a specialization is defined on the basis of some distinguishing characteristic of the entities in the superclass.", "o": ["Superclass", "Subclass", "Class", "Polymorphism"], "a": 1, "e": "", "s": false, "n": 21}, {"t": "mcq", "q": "The entity set person is classified as student and employee. This process is called:", "o": ["Inheritance", "Specialization", "Generalization", "Constraint generalization"], "a": 1, "e": "", "s": false, "n": 22}, {"t": "mcq", "q": "What is the process of specialization in the context of database systems?", "o": ["Creating a new table to store duplicate data", "Removing unnecessary columns from a table", "Creating new tables with specific attributes inherited from a parent table", "Combining multiple tables into a single table"], "a": 2, "e": "", "s": false, "n": 23}, {"t": "mcq", "q": "The term ______ is used to refer to the process of defining a generalized entity type from the given entity types.", "o": ["Generalization", "Specialization", "Polymorphism", "Encapsulation"], "a": 0, "e": "", "s": false, "n": 24}, {"t": "mcq", "q": "The term generalization is used to refer to the process of defining a generalized ______ type from the given ______ types.", "o": ["Class", "Entity", "Superclass", "Subclass"], "a": 1, "e": "", "s": false, "n": 25}, {"t": "mcq", "q": "A reverse process of abstraction in which we suppress the differences among several entity types, identify their common features, and generalize them into a single superclass is called:", "o": ["Subclass", "Superclass", "Class", "Generalization"], "a": 3, "e": "", "s": false, "n": 26}, {"t": "mcq", "q": "The specialization process can be viewed as being functionally the inverse of the ______ process.", "o": ["Generalization", "Specialization", "Polymorphism", "Encapsulation"], "a": 0, "e": "", "s": false, "n": 27}, {"t": "mcq", "q": "In a diagram, an arrow pointing to the generalized ______ represents a generalization process, while arrows pointing to the specialized subclasses represent a specialization process.", "o": ["Subclass", "Superclass", "Class", "Generalization"], "a": 1, "e": "", "s": false, "n": 28}, {"t": "mcq", "q": "The subclasses that define a specialization are attached by lines to a circle that represents the specialization, which is connected in turn to the ______.", "o": ["Subclass", "Superclass", "Class", "Polymorphism"], "a": 1, "e": "", "s": false, "n": 29}, {"t": "mcq", "q": "An entity that is a member of a subclass ______ all the attributes of the entity as a member of the superclass.", "o": ["Polymorphic", "Abstract", "Inherits", "Encapsulates"], "a": 2, "e": "", "s": false, "n": 30}, {"t": "mcq", "q": "Which of the following is a correct relationship between an object and its parts; displayed as lines with a small diamond at the object end?", "o": ["Dependency", "Association", "Aggregation", "Generalization"], "a": 2, "e": "", "s": false, "n": "X1"}, {"t": "mcq", "q": "What is the best description of an aggregation relationship?", "o": ["Relationship between two independent objects; displayed as lines.", "Relationship between two independent objects; displayed as diamond with a small line at the object end.", "Relationship between object and its parts; displayed as lines with a small diamond at the object end.", "Relationship between two independent objects; displayed as diamond."], "a": 2, "e": "", "s": false, "n": "X2"}, {"t": "mcq", "q": "In a UML class diagram, the class has three sections; the second section includes ______.", "o": ["entity name", "class operations", "constraints", "attributes"], "a": 3, "e": "", "s": false, "n": "X3"}, {"t": "open", "q": "Explain the two main structural constraints on binary relationships in detail, including how they are specified in the ER diagram.", "a": "Two main constraints on binary relationships: Cardinality ratio (specifies maximum participation): one-to-one (1:1), one-to-many (1:N) or many-to-one (N:1), many-to-many (M:N). It is shown by writing 1, M or N on the relationship lines in the ER diagram. Existence dependency constraint (specifies minimum participation, also called participation constraint): zero means optional participation (not existence-dependent); one or more means mandatory participation (existence-dependent). It is shown by a double line for total participation and a single line for partial participation. Some notations specify both together using (min, max) constraints.", "s": false, "n": "S1"}, {"t": "open", "q": "Explain the EER concepts of specialization and generalization. For each, provide an illustrative example.", "a": "Specialization: the process of defining a set of subclasses of a superclass, based on some distinguishing characteristic of the entities in the superclass. Example: {SECRETARY, ENGINEER, TECHNICIAN} is a specialization of EMPLOYEE based on job type. Generalization: the reverse of specialization. Several classes with common features are generalized into a superclass, and the original classes become its subclasses. Example: CAR and TRUCK are generalized into VEHICLE because they have several common attributes. Notes Only Q31 has an image (it is shown in the question as Question 5 of the exam file; I do not have its page number in the compilations). The module's own diagrams are in the slides: Fig. 7.15 COMPANY ER schema with (min, max) notation (slide 9), UML class diagram of COMPANY (slide 14), and EER Fig. 8.1 with the \"d\" circles (slides 31 and 39, the figure Q31 is based on), generalization Fig. 8.3 (slide 41). Questions about the constraints on specialization (disjoint/overlapping, total/partial, attribute- defined/user-defined), shared subclasses, lattices and categories are not explained in this module's slides (the \"d\" symbol only appears in the figures), so I left them out. They are probably part of the next EER module. Answers to Q10 and Q29 are my own reading, since the compilation text for those questions is partly garbled.", "s": false, "n": "S2"}, {"t": "mcq", "q": "In the figure (an EER diagram of EMPLOYEE with a disjoint specialization by Job_type), an employee ______.", "o": ["Can be only technician", "Can be a secretary and technician", "Can be only an engineer", "Cannot be secretary and engineer at the same time"], "a": 3, "e": "The circle is \"d\" = disjoint, so an employee belongs to at most one of the subclasses (secretary, technician, engineer).", "s": false, "n": "Q31", "fig": "<svg viewBox=\"0 0 500 270\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" font-size=\"12\" font-family=\"sans-serif\"><g fill=\"currentColor\" stroke=\"none\" opacity=\"0\"><\/g><rect x=\"200\" y=\"70\" width=\"100\" height=\"30\"/><text fill=\"currentColor\" stroke=\"none\" x=\"250.0\" y=\"89.0\" text-anchor=\"middle\">EMPLOYEE<\/text><ellipse cx=\"40\" cy=\"20\" rx=\"26\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"40\" y=\"24\" text-anchor=\"middle\" font-size=\"10\">Name<\/text><ellipse cx=\"40\" cy=\"48\" rx=\"22\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"40\" y=\"52\" text-anchor=\"middle\" font-size=\"10\">Ssn<\/text><ellipse cx=\"125\" cy=\"20\" rx=\"38\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"125\" y=\"24\" text-anchor=\"middle\" font-size=\"10\">Birth_date<\/text><ellipse cx=\"200\" cy=\"20\" rx=\"30\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"200\" y=\"24\" text-anchor=\"middle\" font-size=\"10\">Address<\/text><ellipse cx=\"280\" cy=\"20\" rx=\"32\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"280\" y=\"24\" text-anchor=\"middle\" font-size=\"10\">Job_type<\/text><line x1=\"66\" y1=\"22\" x2=\"200\" y2=\"72\"/><line x1=\"62\" y1=\"48\" x2=\"200\" y2=\"78\"/><line x1=\"140\" y1=\"30\" x2=\"230\" y2=\"70\"/><line x1=\"215\" y1=\"30\" x2=\"240\" y2=\"70\"/><line x1=\"280\" y1=\"31\" x2=\"270\" y2=\"70\"/><line x1=\"250\" y1=\"100\" x2=\"250\" y2=\"128\"/><circle cx=\"250\" cy=\"138\" r=\"10\"/><text fill=\"currentColor\" stroke=\"none\" x=\"250\" y=\"142\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">d<\/text><text fill=\"currentColor\" stroke=\"none\" x=\"262\" y=\"122\" font-size=\"11\" font-weight=\"700\">Job_type<\/text><line x1=\"250\" y1=\"148\" x2=\"100\" y2=\"190\"/><rect x=\"50\" y=\"190\" width=\"100\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"100.0\" y=\"208.0\" text-anchor=\"middle\">SECRETARY<\/text><ellipse cx=\"85\" cy=\"250\" rx=\"38\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"85\" y=\"254\" text-anchor=\"middle\" font-size=\"10\">Typing_speed<\/text><line x1=\"100\" y1=\"218\" x2=\"85\" y2=\"239\"/><line x1=\"250\" y1=\"148\" x2=\"250\" y2=\"190\"/><rect x=\"200\" y=\"190\" width=\"100\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"250.0\" y=\"208.0\" text-anchor=\"middle\">TECHNICIAN<\/text><ellipse cx=\"250\" cy=\"250\" rx=\"38\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"250\" y=\"254\" text-anchor=\"middle\" font-size=\"10\">Tgrade<\/text><line x1=\"250\" y1=\"218\" x2=\"250\" y2=\"239\"/><line x1=\"250\" y1=\"148\" x2=\"400\" y2=\"190\"/><rect x=\"350\" y=\"190\" width=\"100\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"400.0\" y=\"208.0\" text-anchor=\"middle\">ENGINEER<\/text><ellipse cx=\"400\" cy=\"250\" rx=\"38\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"400\" y=\"254\" text-anchor=\"middle\" font-size=\"10\">Eng_type<\/text><line x1=\"400\" y1=\"218\" x2=\"400\" y2=\"239\"/><\/svg>"}]}}, "CS351": {"name": "Operating Systems", "chapters": {"1": [{"t": "mcq", "q": "Which is NOT a primary goal of an operating system?", "o": ["Execute user programs and make solving user problems easier", "Make the computer system convenient to use", "Use hardware efficiently", "Maximize the cost of using the computer system "], "a": 3, "e": "", "s": true, "n": 1}, {"t": "mcq", "q": "In what way is an operating system like a government?", "o": ["It seldom functions correctly", "It creates an environment within which other programs can do useful work", "It performs most useful functions by itself", "It is always concerned primarily with the individual's needs "], "a": 1, "e": "", "s": false, "n": 2}, {"t": "mcq", "q": "What is the primary role of an operating system?", "o": ["To provide a platform for playing video games only", "To compile high-level programming languages", "To manufacture computer hardware components", "To act as an intermediary between the user and the computer hardware "], "a": 3, "e": "", "s": false, "n": 3}, {"t": "mcq", "q": "Program that acts as an intermediary between a user and the computer hardware:", "o": ["Device drivers", "Ports", "Operating System", "Device controller "], "a": 2, "e": "", "s": false, "n": 4}, {"t": "mcq", "q": "______ is used to allow users to interact with computers.", "o": ["Program", "Database ", "Compiler", "Operating System "], "a": 3, "e": "", "s": false, "n": 5}, {"t": "mcq", "q": "______ operating systems are designed primarily to maximize resource utilization.", "o": ["PC", "Handheld computer", "Mainframe", "Network "], "a": 2, "e": "", "s": false, "n": 6}, {"t": "mcq", "q": "The one program that runs at all times on the computer is part of the operating system and is known as:", "o": ["System Program", "Application Program", "Device Driver", "Kernel "], "a": 3, "e": "", "s": false, "n": 7}, {"t": "mcq", "q": "A set of software frameworks that provides additional services to application developers is:", "o": ["Middleware", "System software", "Application program", "Firmware "], "a": 0, "e": "", "s": true, "n": 8}, {"t": "mcq", "q": "The operating system kernel consists of all system and application programs in a computer.", "o": ["True", "False"], "a": 1, "e": "the kernel is the one program always running; system and application programs are separate.", "s": false, "n": 9}, {"t": "mcq", "q": "There is no universally accepted definition of an operating system.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 10}, {"t": "mcq", "q": "All computer systems have some sort of user interaction.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": 11}, {"t": "open", "q": "What is an operating system? List any two of its goals.", "a": "Software that manages hardware and software resources and acts as an intermediary between the user and the hardware. Goals: (1) resource management – allocate CPU, memory, storage and I/O efficiently; (2) user convenience – provide an easy- to-use environment for running programs.", "s": false, "n": 12}, {"t": "open", "q": "Explain why an operating system can be viewed as a resource allocator.", "a": "A computer has many resources (CPU time, memory, file storage, I/O devices). The OS manages them and, facing many possibly conflicting requests, decides how to allocate them to programs and users efficiently and fairly.", "s": false, "n": 13}, {"t": "open", "q": "Computer systems can be divided into four approximate components. What are they?", "a": "Hardware, operating system, application programs, and users.", "s": false, "n": 14}, {"t": "open", "q": "Distinguish between system programs and application programs.", "a": "System programs are not part of the kernel but are associated with the operating system. Application programs are not associated with the operation of the system.", "s": false, "n": 15}, {"t": "mcq", "q": "What is the primary function of the bootstrap program?", "o": ["To allocate memory to all running processes", "To manage user login", "To initialize the system and load the operating-system kernel", "To run user applications "], "a": 2, "e": "", "s": true, "n": 16}, {"t": "mcq", "q": "A program that is loaded at power-up or reboot:", "o": ["Device drivers", "Bootstrap program", "Module controller", "Operating System "], "a": 1, "e": "", "s": false, "n": 17}, {"t": "mcq", "q": "A boot block ____.", "o": ["typically only knows the location and length of the rest of the bootstrap program", "is sophisticated enough to load the OS and begin its execution", "is composed of multiple disk blocks", "is composed of multiple disk cylinders "], "a": 0, "e": "", "s": false, "n": 18}, {"t": "mcq", "q": "An initial bootstrap program is in the form of random-access memory (RAM).", "o": ["True", "False"], "a": 1, "e": "it is stored in ROM/EEPROM (firmware).", "s": false, "n": 19}, {"t": "open", "q": "What is a bootstrap program, and where is it stored?", "a": "The initial program the computer runs at power-up or reboot. It initializes all aspects of the system (CPU registers, device controllers, memory contents), then loads the OS kernel and starts it. It is stored in ROM or EEPROM, known as firmware.", "s": false, "n": 20}, {"t": "mcq", "q": "What is the role of a device driver in an operating system?", "o": ["To provide access to shared memory", "To load registers in the device controller", "To facilitate communication between the OS and a hardware device", "To determine logical interaction between device and computer "], "a": 2, "e": "", "s": true, "n": 21}, {"t": "open", "q": "A device driver loads the appropriate ______ in the device controller.", "a": "registers", "s": false, "n": 22}, {"t": "mcq", "q": "A device controller informs the CPU that it has finished its operation by ______.", "o": ["Signaling", "Interrupt", "Messaging", "Scheduling "], "a": 1, "e": "", "s": true, "n": 23}, {"t": "open", "q": "What role do device controllers and device drivers play in a computer system?", "a": "CPUs and device controllers connect through a common bus. Each controller is in charge of one device type and moves data between the device and its local buffer. The OS has a device driver for each controller; it understands the controller and presents a uniform interface to the rest of the OS.", "s": false, "n": 24}, {"t": "mcq", "q": "What is a trap or exception in the context of operating systems?", "o": ["A method for moving data via Direct Memory Access", "A software-generated interrupt caused by an error or a user request", "A hardware interrupt generated by a device like a keyboard", "A signal used to synchronize two CPU cores "], "a": 1, "e": "", "s": false, "n": 25}, {"t": "mcq", "q": "What is NOT correct for an interrupt?", "o": ["Loads the operating system kernel and starts execution", "Key part of how operating systems and hardware interact ", "Each computer design has its own interrupt mechanism", "Transfers control to the interrupt service routine "], "a": 0, "e": "", "s": true, "n": 26}, {"t": "mcq", "q": "The routine or program that receives and serves the interrupts is called:", "o": ["Interrupt processor", "Interrupt Controller", "Interrupt Driver", "Interrupt handler "], "a": 3, "e": "", "s": false, "n": 27}, {"t": "mcq", "q": "Interrupts may be triggered by either hardware or software.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 28}, {"t": "mcq", "q": "A system call is triggered by hardware.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": 29}, {"t": "open", "q": "Explain the purpose of an interrupt vector.", "a": "It is a table of pointers to the specific interrupt-handling (service) routines. Because the number of interrupts is fixed, the table lets the OS jump straight to the right handler instead of using one general interrupt-processing routine.", "s": false, "n": 30}, {"t": "mcq", "q": "The most common secondary storage device is ____.", "o": ["random access memory", "solid state disks", "tape drives", "magnetic disk "], "a": 3, "e": "", "s": false, "n": 31}, {"t": "mcq", "q": "Which of the following is a common type of secondary storage device used in modern computers?", "o": ["Central processing unit", "Random-access memory", "Solid-state disk", "Optical disc drive "], "a": 2, "e": "", "s": true, "n": 32}, {"t": "mcq", "q": "What kind of storage does the CPU directly interact with?", "o": ["Hard disk drive", "Main memory (RAM)", "Optical storage", "External flash drive "], "a": 1, "e": "", "s": false, "n": 33}, {"t": "mcq", "q": "SSDs differ from HDDs because they:", "o": ["Have higher latency", "Use magnetic disks", "Are slower", "Have no moving parts "], "a": 3, "e": "", "s": false, "n": 34}, {"t": "mcq", "q": "Flash memory is slower than DRAM but needs no power to retain its contents.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 35}, {"t": "mcq", "q": "Solid state disks are generally faster than magnetic disks.", "o": ["True", "False"], "a": 0, "e": "", "s": false, "n": 36}, {"t": "mcq", "q": "Solid state disks are considered volatile storage.", "o": ["True", "False"], "a": 1, "e": "", "s": false, "n": 37}, {"t": "open", "q": "Why is main memory not suitable for permanent program storage or backup? What is the main disadvantage of storing information on a magnetic disk instead of main memory?", "a": "Main memory is volatile – a power loss erases its contents. Disks hold more data permanently but are significantly slower.", "s": false, "n": 38}, {"t": "open", "q": "Describe the differences between physical, virtual, and logical memory.", "a": "Physical memory is the hardware memory used to execute operations (cache, RAM). Virtual memory lets programs larger than physical memory run by using disk as a backing store. Logical memory is an abstraction that gives programmers a simplified view of memory, freeing them from storage limits.", "s": false, "n": 39}, {"t": "mcq", "q": "A ______ is a technique used to temporarily copy information from slower to faster storage.", "o": ["Caching", "Compression", "Fragmentation", "Virtualization "], "a": 0, "e": "", "s": false, "n": 40}, {"t": "mcq", "q": "Two important design issues for cache memory are ____.", "o": ["speed and volatility", "size and replacement policy", "power consumption and reusability", "size and access privileges "], "a": 1, "e": "", "s": false, "n": 41}, {"t": "open", "q": "Explain cache coherency.", "a": "In multiprocessor systems each CPU's cache may hold a copy of the same data. When one CPU changes it, the other caches must receive the updated value. Cache coherency ensures every cache holds the most recent version.", "s": false, "n": 42}, {"t": "mcq", "q": "Which term refers to transferring blocks of data from a buffer directly to main memory without using the CPU?", "o": ["System daemons", "Interrupt", "Direct Memory Access (DMA)", "Swapping "], "a": 2, "e": "", "s": true, "n": 43}, {"t": "open", "q": "Describe why DMA is considered an efficient mechanism for performing I/O.", "a": "It moves large amounts of data between I/O devices and main memory without the CPU doing the transfer. The controller moves whole blocks and raises one interrupt per block rather than one per byte.", "s": false, "n": 44}, {"t": "mcq", "q": "DMA controllers ____.", "o": ["do not use an additional special-purpose processor", "are a nonstandard component in PCs", "can steal memory access cycles from the ma
