 9}, {"t": "mcq", "q": "There is no universally accepted definition of an operating system.", "o": ["True", "False"], "a": 0, "e": "True: OS definitions vary; \"the one program always running\" (kernel) is the most common one.", "s": false, "n": 10}, {"t": "mcq", "q": "All computer systems have some sort of user interaction.", "o": ["True", "False"], "a": 1, "e": "False: some systems, such as embedded computers, run without any user interface.", "s": false, "n": 11}, {"t": "open", "q": "What is an operating system? List any two of its goals.", "a": "Software that manages hardware and software resources and acts as an intermediary between the user and the hardware. Goals: (1) resource management – allocate CPU, memory, storage and I/O efficiently; (2) user convenience – provide an easy- to-use environment for running programs.", "s": false, "n": 12}, {"t": "open", "q": "Explain why an operating system can be viewed as a resource allocator.", "a": "A computer has many resources (CPU time, memory, file storage, I/O devices). The OS manages them and, facing many possibly conflicting requests, decides how to allocate them to programs and users efficiently and fairly.", "s": false, "n": 13}, {"t": "open", "q": "Computer systems can be divided into four approximate components. What are they?", "a": "Hardware, operating system, application programs, and users.", "s": false, "n": 14}, {"t": "open", "q": "Distinguish between system programs and application programs.", "a": "System programs are not part of the kernel but are associated with the operating system. Application programs are not associated with the operation of the system.", "s": false, "n": 15}, {"t": "mcq", "q": "What is the primary function of the bootstrap program?", "o": ["To allocate memory to all running processes", "To manage user login", "To initialize the system and load the operating-system kernel", "To run user applications "], "a": 2, "e": "The bootstrap program initializes the hardware and loads the OS kernel into memory at startup.", "s": true, "n": 16}, {"t": "mcq", "q": "A program that is loaded at power-up or reboot:", "o": ["Device drivers", "Bootstrap program", "Module controller", "Operating System "], "a": 1, "e": "The bootstrap program is loaded at power-up or reboot, usually from firmware (ROM/EEPROM).", "s": false, "n": 17}, {"t": "mcq", "q": "A boot block ____.", "o": ["typically only knows the location and length of the rest of the bootstrap program", "is sophisticated enough to load the OS and begin its execution", "is composed of multiple disk blocks", "is composed of multiple disk cylinders "], "a": 0, "e": "The boot block usually only knows the location and length of the rest of the bootstrap code, which it loads.", "s": false, "n": 18}, {"t": "mcq", "q": "An initial bootstrap program is in the form of random-access memory (RAM).", "o": ["True", "False"], "a": 1, "e": "it is stored in ROM/EEPROM (firmware).", "s": false, "n": 19}, {"t": "open", "q": "What is a bootstrap program, and where is it stored?", "a": "The initial program the computer runs at power-up or reboot. It initializes all aspects of the system (CPU registers, device controllers, memory contents), then loads the OS kernel and starts it. It is stored in ROM or EEPROM, known as firmware.", "s": false, "n": 20}, {"t": "mcq", "q": "What is the role of a device driver in an operating system?", "o": ["To provide access to shared memory", "To load registers in the device controller", "To facilitate communication between the OS and a hardware device", "To determine logical interaction between device and computer "], "a": 2, "e": "A device driver hides hardware details and lets the OS talk to a specific device controller.", "s": true, "n": 21}, {"t": "open", "q": "A device driver loads the appropriate ______ in the device controller.", "a": "registers", "s": false, "n": 22}, {"t": "mcq", "q": "A device controller informs the CPU that it has finished its operation by ______.", "o": ["Signaling", "Interrupt", "Messaging", "Scheduling "], "a": 1, "e": "A device controller signals the CPU that it finished by raising an interrupt.", "s": true, "n": 23}, {"t": "open", "q": "What role do device controllers and device drivers play in a computer system?", "a": "CPUs and device controllers connect through a common bus. Each controller is in charge of one device type and moves data between the device and its local buffer. The OS has a device driver for each controller; it understands the controller and presents a uniform interface to the rest of the OS.", "s": false, "n": 24}, {"t": "mcq", "q": "What is a trap or exception in the context of operating systems?", "o": ["A method for moving data via Direct Memory Access", "A software-generated interrupt caused by an error or a user request", "A hardware interrupt generated by a device like a keyboard", "A signal used to synchronize two CPU cores "], "a": 1, "e": "A trap (exception) is a software-generated interrupt caused by an error (e.g. divide by zero) or a user request (system call).", "s": false, "n": 25}, {"t": "mcq", "q": "What is NOT correct for an interrupt?", "o": ["Loads the operating system kernel and starts execution", "Key part of how operating systems and hardware interact ", "Each computer design has its own interrupt mechanism", "Transfers control to the interrupt service routine "], "a": 0, "e": "An interrupt transfers control to its interrupt handler; loading the kernel at startup is the bootstrap program's job.", "s": true, "n": 26}, {"t": "mcq", "q": "The routine or program that receives and serves the interrupts is called:", "o": ["Interrupt processor", "Interrupt Controller", "Interrupt Driver", "Interrupt handler "], "a": 3, "e": "The routine that receives and serves an interrupt is the interrupt handler (interrupt service routine).", "s": false, "n": 27}, {"t": "mcq", "q": "Interrupts may be triggered by either hardware or software.", "o": ["True", "False"], "a": 0, "e": "True: hardware raises interrupts through the bus; software raises them with traps or system calls.", "s": false, "n": 28}, {"t": "mcq", "q": "A system call is triggered by hardware.", "o": ["True", "False"], "a": 1, "e": "False: a system call is software-triggered (a trap), not hardware-triggered.", "s": false, "n": 29}, {"t": "open", "q": "Explain the purpose of an interrupt vector.", "a": "It is a table of pointers to the specific interrupt-handling (service) routines. Because the number of interrupts is fixed, the table lets the OS jump straight to the right handler instead of using one general interrupt-processing routine.", "s": false, "n": 30}, {"t": "mcq", "q": "The most common secondary storage device is ____.", "o": ["random access memory", "solid state disks", "tape drives", "magnetic disk "], "a": 3, "e": "Magnetic disks (HDDs) are the most common secondary storage; SSDs are growing in use.", "s": false, "n": 31}, {"t": "mcq", "q": "Which of the following is a common type of secondary storage device used in modern computers?", "o": ["Central processing unit", "Random-access memory", "Solid-state disk", "Optical disc drive "], "a": 2, "e": "Solid-state disks are common secondary storage in modern computers.", "s": true, "n": 32}, {"t": "mcq", "q": "What kind of storage does the CPU directly interact with?", "o": ["Hard disk drive", "Main memory (RAM)", "Optical storage", "External flash drive "], "a": 1, "e": "The CPU can directly access only registers, cache and main memory (RAM).", "s": false, "n": 33}, {"t": "mcq", "q": "SSDs differ from HDDs because they:", "o": ["Have higher latency", "Use magnetic disks", "Are slower", "Have no moving parts "], "a": 3, "e": "SSDs use flash memory with no moving parts, so they are faster and more reliable than HDDs.", "s": false, "n": 34}, {"t": "mcq", "q": "Flash memory is slower than DRAM but needs no power to retain its contents.", "o": ["True", "False"], "a": 0, "e": "True: flash memory is non-volatile, so it keeps data without power, though slower than DRAM.", "s": false, "n": 35}, {"t": "mcq", "q": "Solid state disks are generally faster than magnetic disks.", "o": ["True", "False"], "a": 0, "e": "True: with no moving parts, SSDs have lower access times than magnetic disks.", "s": false, "n": 36}, {"t": "mcq", "q": "Solid state disks are considered volatile storage.", "o": ["True", "False"], "a": 1, "e": "False: SSDs are non-volatile storage; they keep data without power.", "s": false, "n": 37}, {"t": "open", "q": "Why is main memory not suitable for permanent program storage or backup? What is the main disadvantage of storing information on a magnetic disk instead of main memory?", "a": "Main memory is volatile – a power loss erases its contents. Disks hold more data permanently but are significantly slower.", "s": false, "n": 38}, {"t": "open", "q": "Describe the differences between physical, virtual, and logical memory.", "a": "Physical memory is the hardware memory used to execute operations (cache, RAM). Virtual memory lets programs larger than physical memory run by using disk as a backing store. Logical memory is an abstraction that gives programmers a simplified view of memory, freeing them from storage limits.", "s": false, "n": 39}, {"t": "mcq", "q": "A ______ is a technique used to temporarily copy information from slower to faster storage.", "o": ["Caching", "Compression", "Fragmentation", "Virtualization "], "a": 0, "e": "Caching copies information from slower storage into faster storage temporarily.", "s": false, "n": 40}, {"t": "mcq", "q": "Two important design issues for cache memory are ____.", "o": ["speed and volatility", "size and replacement policy", "power consumption and reusability", "size and access privileges "], "a": 1, "e": "Cache design issues are its size and the replacement policy (which entry to evict).", "s": false, "n": 41}, {"t": "open", "q": "Explain cache coherency.", "a": "In multiprocessor systems each CPU's cache may hold a copy of the same data. When one CPU changes it, the other caches must receive the updated value. Cache coherency ensures every cache holds the most recent version.", "s": false, "n": 42}, {"t": "mcq", "q": "Which term refers to transferring blocks of data from a buffer directly to main memory without using the CPU?", "o": ["System daemons", "Interrupt", "Direct Memory Access (DMA)", "Swapping "], "a": 2, "e": "DMA moves blocks of data between a device buffer and main memory without the CPU copying each byte.", "s": true, "n": 43}, {"t": "open", "q": "Describe why DMA is considered an efficient mechanism for performing I/O.", "a": "It moves large amounts of data between I/O devices and main memory without the CPU doing the transfer. The controller moves whole blocks and raises one interrupt per block rather than one per byte.", "s": false, "n": 44}, {"t": "mcq", "q": "DMA controllers ____.", "o": ["do not use an additional special-purpose processor", "are a nonstandard component in PCs", "can steal memory access cycles from the main CPU", "can access main memory at the same time as the main CPU "], "a": 2, "e": "DMA controllers can steal memory access cycles from the CPU (cycle stealing) while transferring data.", "s": false, "n": 45}, {"t": "open", "q": "Why is DMA used for devices that execute large transfers?", "a": "Without DMA the CPU must use programmed I/O, watching status bits and feeding data one byte at a time. A DMA controller (special-purpose processor) copies data in chunks, lightening the CPU's burden.", "s": false, "n": 46}, {"t": "mcq", "q": "Buffering is used to:", "o": ["Replace disk", "Handle speed mismatch", "Increase CPU speed", "Reduce storage "], "a": 1, "e": "Buffering handles speed mismatch between devices (and size/copy-semantics differences).", "s": false, "n": 47}, {"t": "mcq", "q": "Spooling is useful when:", "o": ["Cache fails", "Multiple CPUs exist ", "A device handles one request at a time", "Memory is full "], "a": 2, "e": "Spooling is useful when a device can serve only one request at a time, such as a printer.", "s": true, "n": 48}, {"t": "mcq", "q": "In a kernel I/O subsystem, which buffer holds the output for a device?", "o": ["status", "spool", "magic", "Output "], "a": 1, "e": "The spool holds output for a device (e.g. print jobs) until the device is ready.", "s": false, "n": 49}, {"t": "mcq", "q": "To prevent user programs from interfering with the proper operation of the system, the hardware has two modes:", "o": ["general mode and specialized mode", "base mode and derived mode", "program mode and inductive mode", "user mode and kernel mode "], "a": 3, "e": "Hardware has user mode and kernel (privileged) mode to protect the system from user programs.", "s": true, "n": 50}, {"t": "mcq", "q": "What are some other terms for kernel mode?", "o": ["supervisor mode", "system mode", "privileged mode", "All of the above "], "a": 3, "e": "Kernel mode is also called supervisor, system or privileged mode, so all the listed names apply.", "s": false, "n": 51}, {"t": "mcq", "q": "Which statement concerning privileged instructions is FALSE?", "o": ["They may cause harm to the system", "They can only be executed in kernel mode", "They cannot be attempted from user mode", "They are used to manage interrupts "], "a": 2, "e": "The false statement is that privileged instructions cannot be attempted from user mode; they can be, but the hardware traps them as illegal.", "s": false, "n": 52}, {"t": "open", "q": "Describe the operating system's two modes of operation.", "a": "Hardware provides a mode bit to tell user mode (running user applications) from kernel mode (running OS code). When an application requests an OS service through a system call, the system switches to kernel mode; on return it resets to user mode. Privileged instructions run only in kernel mode.", "s": false, "n": 53}, {"t": "mcq", "q": "A ____ can be used to prevent a user program from never returning control to the operating system.", "o": ["portal", "program counter", "firewall", "timer "], "a": 3, "e": "A timer interrupts the CPU after a set time, so the OS regains control from a program that never returns.", "s": false, "n": 54}, {"t": "open", "q": "What is the purpose of a programmable interval timer?", "a": "Hardware that measures elapsed time and triggers operations. The scheduler uses it to generate an interrupt that preempts a process at the end of its time slice (and stops infinite loops).", "s": false, "n": 55}, {"t": "mcq", "q": "______ are the services provided outside of the kernel.", "o": ["System daemons", "System call", "Trap", "Exceptions "], "a": 0, "e": "System daemons are services that run outside the kernel.", "s": false, "n": 56}, {"t": "mcq", "q": "Which of the following would lead you to believe that a given system is an SMP-type system?", "o": ["Each processor is assigned a specific task", "There is a boss–worker relationship between the processors", "Each processor performs all tasks within the operating system", "None of the above "], "a": 2, "e": "In SMP, every processor is a peer and performs all tasks, including OS tasks.", "s": false, "n": 57}, {"t": "mcq", "q": "Virtually all modern operating systems provide support for SMP.", "o": ["True", "False"], "a": 0, "e": "True: virtually all modern operating systems support SMP.", "s": false, "n": 58}, {"t": "mcq", "q": "A dual-core system requires that each core has its own cache memory.", "o": ["True", "False"], "a": 1, "e": "False: cores can share a cache (e.g. a shared L2/L3); each core does not strictly need its own.", "s": false, "n": 59}, {"t": "mcq", "q": "What is a key advantage of placing multiple processor cores on the same physical chip?", "o": ["It removes context-switching overhead entirely", "It is faster and consumes less power", "It increases dispatch latency", "It eliminates the need for scheduling "], "a": 1, "e": "On-chip cores communicate faster than separate chips and use less power than separate processors.", "s": false, "n": 60}, {"t": "open", "q": "Why is multi-core processing more efficient than placing each processor on its own chip?", "a": "Communication between processors on the same chip is faster than between processors on separate chips.", "s": false, "n": 61}, {"t": "open", "q": "List two advantages of multiprocessor systems.", "a": "Increased throughput, economy of scale, and increased reliability (graceful degradation / fault tolerance) – any two.", "s": false, "n": 62}, {"t": "open", "q": "Explain the difference between asymmetric and symmetric multiprocessing.", "a": "In asymmetric multiprocessing each processor is assigned a specific task (boss– worker). In symmetric multiprocessing (SMP) each processor performs all tasks within the operating system.", "s": false, "n": 63}, {"t": "open", "q": "Distinguish between uniform memory access (UMA) and non-uniform memory access (NUMA) systems.", "a": "On UMA, accessing RAM takes the same time from any CPU. On NUMA, some parts of memory take longer to access than others, creating a performance penalty.", "s": false, "n": 64}, {"t": "mcq", "q": "A clustered system ____.", "o": ["gathers together multiple CPUs to accomplish computational work", "is an operating system that provides file sharing across a network", "is used when rigid time requirements are present", "can only operate one application at a time "], "a": 0, "e": "A clustered system gathers multiple CPUs (nodes) to do computational work together.", "s": false, "n": 65}, {"t": "open", "q": "Why are clustered systems considered to provide high-availability service?", "a": "They are built from two or more coupled systems, so redundancy exists: if one system fails, another can take over its task.", "s": false, "n": 66}, {"t": "mcq", "q": "A(n) ________ is the unit of work in a system.", "o": ["process", "operating system", "timer", "mode bit "], "a": 0, "e": "A process is the unit of work in a system.", "s": false, "n": 67}, {"t": "mcq", "q": "A process within an operating system refers to ________.", "o": ["A file stored on disk", "A program in execution ", "A block of allocated memory", "A set of related threads "], "a": 1, "e": "A process is a program in execution (an active entity).", "s": true, "n": 68}, {"t": "mcq", "q": "Which of the following is an activity of Process Management?", "o": ["Providing a user interface", "Creating and deleting both user and system processes", "Managing the virtual memory page file", "Defragmenting the hard disk "], "a": 1, "e": "Process management includes creating and deleting user and system processes, scheduling, suspension and resumption, synchronization and communication.", "s": false, "n": 69}, {"t": "open", "q": "Give three examples of resource types.", "a": "CPU cycles, memory space, I/O devices (also file storage).", "s": false, "n": 70}, {"t": "open", "q": "Which feature can allow an operating system to execute multiple OSs on one machine?", "a": "Virtual machine", "s": false, "n": 71}, {"t": "mcq", "q": "Parallel desktops are an example of ______.", "o": ["Type-0 Hypervisor", "Emulators", "Type 2 Hypervisor", "Type 1 Hypervisor "], "a": 2, "e": "Parallels Desktop runs on top of a host OS, so it is a Type 2 hypervisor.", "s": true, "n": 72}, {"t": "mcq", "q": "A special-purpose operating system that runs on native hardware is ______.", "o": ["Type 2 hypervisor", "Emulator", "Type 1 Hypervisor", "Type 0 hypervisor "], "a": 2, "e": "A Type 1 hypervisor is a special-purpose OS that runs directly on the hardware.", "s": true, "n": 73}, {"t": "mcq", "q": "Which of these is an example of a Type 1 hypervisor?", "o": ["Citrix XenServer", "Oracle VirtualBox", "IBM LPARs", "Oracle LDOMs "], "a": 0, "e": "Citrix XenServer (like VMware ESX) is a Type 1 hypervisor.", "s": false, "n": 74}, {"t": "mcq", "q": "Type of VM where a hardware feature implemented by firmware requires no special OS handling, and the VMM is in the firmware:", "o": ["Type 1 Hypervisor", "Type 0 Hypervisor ", "Programming Environment Virtualization", "Paravirtualization "], "a": 1, "e": "Type 0 hypervisors are implemented in hardware/firmware and need no special OS handling.", "s": false, "n": 75}, {"t": "mcq", "q": "______ is the technique in which the guest operating system is modified to work in cooperation with the VMM to optimize performance.", "o": ["Emulators", "Paravirtualization", "Virtualization", "Programming environment virtualization "], "a": 1, "e": "In paravirtualization the guest OS is modified to cooperate with the VMM for better performance.", "s": true, "n": 76}, {"t": "mcq", "q": "When page-table changes are needed in paravirtualization, the guest uses ______.", "o": ["Interrupt", "Signaling", "System call", "Hypercall "], "a": 3, "e": "In paravirtualization, the guest uses hypercalls to ask the VMM to change page tables.", "s": true, "n": 77}, {"t": "mcq", "q": "______ is not virtualization but provides virtualization-like features.", "o": ["Application containment", "Paravirtualization", "Emulators", "Programming environment virtualization "], "a": 0, "e": "Application containment (containers, zones) offers virtualization-like isolation without being true virtualization.", "s": false, "n": 78}, {"t": "mcq", "q": "The process of moving a running VM from one host to another is:", "o": ["Live migration", "Templating", "Simulating", "Application containment "], "a": 0, "e": "Live migration moves a running VM from one host to another without stopping it.", "s": false, "n": 79}, {"t": "open", "q": "Define: Paravirtualization, Templating, and Live Migration.", "a": "Paravirtualization – the guest OS is modified to cooperate with the VMM to optimize performance. Templating – create an OS + application VM image, provide it to customers, and use it to create multiple instances. Live migration – move a running VM from one host to another without interrupting it.", "s": false, "n": 80}, {"t": "mcq", "q": "Embedded computers typically run on a ____ operating system.", "o": ["real-time", "Windows XP", "network", "clustered "], "a": 0, "e": "Embedded computers need predictable timing, so they usually run a real-time OS.", "s": false, "n": 81}, {"t": "mcq", "q": "Bluetooth and 802.11 devices use wireless technology to communicate over several feet, in essence creating a ____.", "o": ["local-area network", "wide-area network", "small-area network", "metropolitan-area network "], "a": 2, "e": "Bluetooth and 802.11 create a small-area (personal-area) network over a few feet.", "s": false, "n": 82}, {"t": "mcq", "q": "Which of the following is a property of peer-to-peer systems?", "o": ["Clients and servers are not distinguished from one another", "Separate machines act as either the client or the server but not both", "They do not offer any advantages over client-server systems", "They suffer from the server acting as the bottleneck "], "a": 0, "e": "In peer-to-peer systems every node can act as a client and a server; there is no fixed distinction.", "s": true, "n": 83}, {"t": "mcq", "q": "Which configuration allows each node to act as both client and server?", "o": ["Client-server", "Peer-to-peer", "Hybrid", "Centralized "], "a": 1, "e": "Peer-to-peer lets each node act as both client and server.", "s": true, "n": 84}, {"t": "mcq", "q": "A ____ provides a file-system interface which allows clients to create and modify files.", "o": ["compute-server system", "file-server system", "wireless network", "network computer "], "a": 1, "e": "A file-server system provides a file-system interface that clients use to create, update and delete files.", "s": false, "n": 85}, {"t": "open", "q": "Describe the compute-server and file-server types of server systems.", "a": "A compute-server provides an interface through which a client requests an action (e.g., read data from a database); the server executes it and returns the results. A file-server provides a file-system interface where clients create, update, read and delete files (e.g., a Web server delivering files to browsers).", "s": false, "n": 86}, {"t": "mcq", "q": "What better describes a distributed system?", "o": ["A collection of nodes with no interconnection", "A collection of tightly coupled nodes", "A collection of loosely coupled nodes interconnected by a communications network", "A collection of nodes with limited resources "], "a": 2, "e": "A distributed system is a collection of loosely coupled nodes connected by a network.", "s": false, "n": 87}, {"t": "mcq", "q": "Which of the following statements is FALSE?", "o": ["Mobile devices must be concerned with power consumption", "Mobile devices can provide features unavailable on desktops or laptops", "The difference in storage capacity between a mobile device and a laptop is shrinking", "Mobile devices usually have fewer processing cores than a standard desktop computer "], "a": 2, "e": "This statement is the false one: mobile devices have much less storage than laptops, so the claimed small difference is wrong.", "s": false, "n": 88}, {"t": "mcq", "q": "______ is a mobile operating system designed for the iPhone and iPad.", "o": ["Mac OS X", "Android", "UNIX", "iOS "], "a": 3, "e": "iOS is Apple's mobile OS for iPhone and iPad.", "s": false, "n": 89}, {"t": "mcq", "q": "Processors for most mobile devices run at a slower speed than a processor in a desktop PC.", "o": ["True", "False"], "a": 0, "e": "True: mobile processors run slower than desktop CPUs to save power and heat.", "s": false, "n": 90}, {"t": "open", "q": "What two operating systems currently dominate mobile computing?", "a": "Apple's iOS and Google's Android.", "s": false, "n": 91}, {"t": "mcq", "q": "iOS is open source, Android is closed source.", "o": ["True", "False"], "a": 1, "e": "False: it is the opposite. Android is open source and iOS is closed source.", "s": false, "n": 92}, {"t": "open", "q": "Distinguish mobile computing from traditional desktop computing.", "a": "Mobile computing happens on portable, lightweight handheld devices and tablets, which usually have less processing power and storage than desktops. Features such as GPS and accelerometers give them functionality desktops lack.", "s": false, "n": 93}, {"t": "mcq", "q": "In the context of cloud computing, what does IaaS stand for?", "o": ["Integration as a Service", "Infrastructure as a Service", "Interface as a Service", "Internet as a Service "], "a": 1, "e": "IaaS = Infrastructure as a Service: servers or storage rented over the Internet.", "s": true, "n": 94}, {"t": "mcq", "q": "______ is a software stack ready for application use via the Internet.", "o": ["Platform as a Service", "Software as a Service", "Network as a Service", "Infrastructure as a Service "], "a": 0, "e": "PaaS (Platform as a Service) provides a software stack ready for applications over the Internet.", "s": false, "n": 95}, {"t": "open", "q": "Describe cloud computing.", "a": "Computing that delivers computing, storage and application services across a network, often built on virtualization. It can be public, private or hybrid, and can offer applications (SaaS), platforms (PaaS) or infrastructure (IaaS).", "s": false, "n": 96}, {"t": "open", "q": "List the main types of cloud computing deployment models.", "a": "Public cloud, private cloud, hybrid cloud.", "s": false, "n": 97}, {"t": "mcq", "q": "Which of the following statements concerning open-source operating systems is true?", "o": ["Solaris is open source", "Source code is freely available", "They are always more secure than commercial closed systems", "All open-source operating systems share the same set of goals "], "a": 1, "e": "Open-source OSs make their source code freely available to read and modify.", "s": false, "n": 98}, {"t": "mcq", "q": "Which of the following operating systems is not open source?", "o": ["Windows", "BSD UNIX", "Linux", "PCLinuxOS "], "a": 0, "e": "Windows is closed source; Linux and BSD are open source.", "s": false, "n": 99}, {"t": "mcq", "q": "A ____ is a custom build of the Linux operating system.", "o": ["LiveCD", "installation", "distribution", "VMWare Player "], "a": 2, "e": "A Linux distribution is a custom build of Linux (kernel plus software), e.g. Ubuntu.", "s": false, "n": 100}, {"t": "mcq", "q": "KDE and GNOME desktops are available under open-source licenses.", "o": ["True", "False"], "a": 0, "e": "True: KDE and GNOME are open-source desktop environments.", "s": false, "n": 101}, {"t": "mcq", "q": "Which of the following statements is incorrect?", "o": ["An operating system provides an environment for the execution of programs", "An operating system manages system resources ", "Operating systems provide both command-line and graphical user interfaces", "Operating systems must provide both protection and security "], "a": 2, "e": "an OS may provide a CLI, a GUI, or both.", "s": false, "n": 102}, {"t": "mcq", "q": "If a program terminates abnormally, a dump of memory may be examined by a ____ to determine the cause of the problem.", "o": ["module", "debugger", "shell", "control card "], "a": 1, "e": "A debugger examines the memory dump (core dump) to find why a program crashed.", "s": false, "n": 103}, {"t": "mcq", "q": "The two main models of Inter-Process Communication (IPC) are:", "o": ["Paging and Segmentation", "Virtual Memory and Caching", "Multithreading and Multiprocessing", "Shared Memory and Message Passing "], "a": 3, "e": "The two IPC models are shared memory and message passing.", "s": true, "n": 104}, {"t": "mcq", "q": "In message passing, how do processes communicate?", "o": ["By reading/writing shared memory", "By exchanging messages via send/receive", "By using a disk file", "By modifying each other's memory "], "a": 1, "e": "Message-passing processes communicate by exchanging messages with send() and receive().", "s": false, "n": 105}, {"t": "mcq", "q": "A message-passing model is ____.", "o": ["easier to implement than a shared-memory model for intercomputer communication", "faster than the shared-memory model", "a network protocol, and does not apply to operating systems", "only useful for small simple operating systems "], "a": 0, "e": "Message passing is easier to implement than shared memory for communication between computers.", "s": false, "n": 106}, {"t": "open", "q": "Explain the difference between protection and security.", "a": "Protection is concerned with controlling the access of processes or users to the resources of the computer system. Security defends the system from internal or external attacks.", "s": false, "n": 107}, {"t": "mcq", "q": "Which of the following is NOT a primary method for users to interact directly with an operating system?", "o": ["Network interfaces ", "Graphical user interfaces", "Touchscreen interfaces", "Command interpreters "], "a": 0, "e": "Users interact directly through the command line, GUI or touch interfaces; network interfaces are not a user-interface method.", "s": false, "n": 108}, {"t": "mcq", "q": "A ____ is an example of a systems program.", "o": ["command interpreter", "Web browser", "text formatter", "database system "], "a": 0, "e": "A command interpreter (shell) is a systems program that gives users access to OS services.", "s": false, "n": 109}, {"t": "open", "q": "Commands can be processed by a command interpreter in two ways: the interpreter contains the code to execute the command, or the commands are implemented as system programs. Compare the two approaches.", "a": "(1) Built-in code: fast and simple, but every new command means rewriting the interpreter, which can become complicated and large. (2) System programs: new commands can be added without changing the interpreter, but it is slower and passing parameters from the interpreter to the program is clumsy.", "s": false, "n": 110}, {"t": "mcq", "q": "____ provide(s) an interface to the services provided by an operating system.", "o": ["Shared memory", "System calls", "Simulators", "Communication "], "a": 1, "e": "System calls are the interface to the services the OS provides.", "s": false, "n": 111}, {"t": "mcq", "q": "____ is not one of the major categories of system calls.", "o": ["Process control", "Communications", "Protection", "Security "], "a": 3, "e": "The categories are process control, file management, device management, information maintenance, communication and protection; \"Security\" is not one of them.", "s": false, "n": 112}, {"t": "mcq", "q": "Which system call is used in Unix to open a file?", "o": ["CreateFile()", "Open()", "Read()", "Write() "], "a": 1, "e": "The Unix system call that opens a file is open().", "s": false, "n": 113}, {"t": "mcq", "q": "One process can create a child process using the ______ system call.", "o": ["release", "fork()", "exit", "acquire() "], "a": 1, "e": "fork() creates a child process in UNIX.", "s": true, "n": 114}, {"t": "mcq", "q": "The Windows CreateProcess() system call creates a new process. What is the equivalent system call in UNIX?", "o": ["NTCreateProcess()", "process()", "fork()", "getpid() "], "a": 2, "e": "UNIX fork() (with exec()) corresponds to Windows CreateProcess().", "s": false, "n": 115}, {"t": "mcq", "q": "The close() system call in UNIX is used to close a file. What is the equivalent system call in Windows?", "o": ["CloseHandle()", "close()", "CloseFile()", "Exit() "], "a": 0, "e": "Windows CloseHandle() is the counterpart of UNIX close().", "s": false, "n": 116}, {"t": "mcq", "q": "The Windows CreateFile() system call is used to create a file. What is the equivalent system call in UNIX?", "o": ["ioctl()", "open()", "fork()", "createfile() "], "a": 1, "e": "UNIX open() corresponds to Windows CreateFile().", "s": false, "n": 117}, {"t": "mcq", "q": "The ________ provides a portion of the system call interface for UNIX and Linux.", "o": ["POSIX", "Java", "Standard C library", "Standard API "], "a": 2, "e": "The standard C library provides part of the system call interface for UNIX and Linux.", "s": false, "n": 118}, {"t": "mcq", "q": "____ is/are not a technique for passing parameters from an application to a system call.", "o": ["Cache memory", "Registers ", "Stack", "Special block in memory "], "a": 0, "e": "Parameters are passed in registers, in a memory block/table, or on the stack. Cache memory is not a parameter-passing technique.", "s": false, "n": 119}, {"t": "open", "q": "Describe the relationship between an API, the system-call interface, and the operating system.", "a": "The system-call interface links the programming language to the system calls the OS provides. It intercepts function calls in the API and invokes the needed system call in the OS, so the API (through the run-time support library) hides most details of the OS interface from the programmer.", "s": false, "n": 120}, {"t": "open", "q": "Describe three general methods used to pass parameters to the operating system during system calls.", "a": "(1) Pass the parameters in registers. (2) Store them in a block or table in memory and pass the block's address in a register. (3) Push the parameters onto the stack and let the OS pop them off.", "s": false, "n": 121}, {"t": "mcq", "q": "System calls can run in either user mode or kernel mode.", "o": ["True", "False"], "a": 1, "e": "False: system calls always execute in kernel mode (the trap switches the mode).", "s": false, "n": 122}, {"t": "mcq", "q": "Application programmers typically use an API rather than directly invoking system calls.", "o": ["True", "False"], "a": 0, "e": "True: programmers use an API (e.g. the Windows API, POSIX) that calls system calls for them.", "s": false, "n": 123}, {"t": "mcq", "q": "In general, Windows system calls have longer, more descriptive names, and UNIX system calls have shorter, less descriptive names.", "o": ["True", "False"], "a": 0, "e": "True: Windows names are longer and descriptive, UNIX names are short.", "s": false, "n": 124}, {"t": "mcq", "q": "Many operating systems merge I/O devices and files into a combined file because of the similarity of the system calls for each.", "o": ["True", "False"], "a": 0, "e": "True: many OSs treat devices and files alike because their system calls are similar.", "s": false, "n": 125}], "2": [{"t": "mcq", "q": "A process in an operating system can be defined as:", "o": ["A set of related threads running concurrently", "A program in execution", "An allocated space for a program", "A file stored on disk "], "a": 1, "e": "A process is a program in execution; a program on disk is passive.", "s": true, "n": 1}, {"t": "mcq", "q": "The difference between a program and a process is that a program is an active entity while a process is a passive entity.", "o": ["True", "False"], "a": 1, "e": "a program is passive; a process is active.", "s": false, "n": 2}, {"t": "mcq", "q": "The ____ of a process contains temporary data such as function parameters, return addresses, and local variables.", "o": ["text section", "data section", "program counter", "stack "], "a": 3, "e": "The stack holds temporary data: function parameters, return addresses and local variables.", "s": false, "n": 3}, {"t": "mcq", "q": "Which section of a process contains global variables?", "o": ["Heap Section", "Data Section", "Text Section", "Stack Section "], "a": 1, "e": "Global variables live in the data section.", "s": true, "n": 4}, {"t": "mcq", "q": "The memory layout of a process is typically divided into multiple sections. Which section is NOT included?", "o": ["Text section (the executable code) ", "Data section (global variables)", "Heap section (memory dynamically allocated during run time)", "Process section "], "a": 3, "e": "Process memory has text, data, heap and stack sections; there is no \"process section\".", "s": false, "n": 5}, {"t": "mcq", "q": "The process is in ______ state if it is waiting to be assigned to a processor.", "o": ["Ready", "Running", "Waiting", "Terminated "], "a": 0, "e": "A process waiting to be assigned a processor is Ready (waiting for an event is Waiting).", "s": true, "n": 6}, {"t": "mcq", "q": "Which of the following states of a process is NOT defined correctly?", "o": ["Terminated: the process has finished execution", "Running: instructions are being executed", "New: the process is being created", "Ready: the process is waiting for some event to occur "], "a": 3, "e": "that describes the Waiting state; Ready means waiting to be assigned to a processor.", "s": false, "n": 7}, {"t": "mcq", "q": "Which of the following is NOT a valid process state?", "o": ["Ready", "Starvation", "Running", "New "], "a": 1, "e": "The states are new, ready, running, waiting and terminated; starvation is not a state.", "s": false, "n": 8}, {"t": "mcq", "q": "A process may transition to the Ready state by which of the following actions?", "o": ["Completion of an I/O event", "Awaiting its turn on the CPU", "Newly-admitted process", "All of the above "], "a": 3, "e": "A process becomes ready when admitted (new), when its I/O completes, or when it is preempted, so all apply.", "s": false, "n": 9}, {"t": "mcq", "q": "For a single-processor system, there will never be more than one process in the Running state.", "o": ["True", "False"], "a": 0, "e": "True: one core runs only one process at a time.", "s": false, "n": 10}, {"t": "open", "q": "Name and describe the different states a process can exist in at any given time.", "a": "New – the process is being created. Running – instructions are being executed. Waiting – the process is waiting for some event (such as I/O completion or a signal). Ready – the process is waiting to be assigned to a processor. Terminated – the process has finished execution.", "s": false, "n": 11}, {"t": "mcq", "q": "Each process is represented in the operating system by a ______; also called a task control block.", "o": ["Stack", "Translation Lookaside Buffer", "Program control block", "Process control block "], "a": 3, "e": "The OS represents each process by a process control block (PCB).", "s": true, "n": 12}, {"t": "mcq", "q": "What is the purpose of a Process Control Block (PCB) in an operating system?", "o": ["It holds the hardware design of the CPU", "It stores only the executable code of a process", "It is used for security purposes only", "It contains essential information about a process "], "a": 3, "e": "The PCB stores essential information about a process: state, PC, registers, scheduling and memory data.", "s": false, "n": 13}, {"t": "mcq", "q": "A process control block ____.", "o": ["includes information on the process's state", "stores the address of the next instruction to be processed by a different process", "determines which process is to be executed next", "is an example of a process queue "], "a": 0, "e": "A PCB includes the process state along with PC, registers and other info.", "s": false, "n": 14}, {"t": "mcq", "q": "In the PCB, ______ indicates the location of the next instruction to execute.", "o": ["I/O status information", "Memory-management information", "Program counter", "CPU register "], "a": 2, "e": "The program counter holds the address of the next instruction to execute.", "s": false, "n": 15}, {"t": "mcq", "q": "PCB stands for:", "o": ["Program Control Buffer", "Program Control block", "Process Control Buffer", "Process Control block "], "a": 3, "e": "PCB = Process Control Block.", "s": false, "n": 16}, {"t": "mcq", "q": "As processes enter the system, they are put into a ______ where they are ready and waiting to execute on a CPU's core.", "o": ["Ready queue", "Waiting queue", "Running queue", "Termination queue "], "a": 0, "e": "New processes wait in the ready queue until the CPU scheduler picks them.", "s": true, "n": 17}, {"t": "mcq", "q": "The ______ selects from among the processes in the ready queue, and allocates a CPU core to one of them.", "o": ["Kernel", "Memory scheduler", "Bus controller", "CPU scheduler "], "a": 3, "e": "The CPU scheduler selects a process from the ready queue and gives it a core.", "s": true, "n": 18}, {"t": "mcq", "q": "A ______ selects among available processes for the next execution on a CPU core.", "o": ["Thread", "Process scheduler", "MMU", "Context "], "a": 1, "e": "The process scheduler picks the next process to run on a core.", "s": false, "n": 19}, {"t": "mcq", "q": "The list of processes waiting for a particular I/O device is called a(n) ____.", "o": ["standby queue", "device queue", "ready queue", "interrupt queue "], "a": 1, "e": "A device queue holds processes waiting for a particular I/O device.", "s": false, "n": 20}, {"t": "mcq", "q": "The ____ refers to the number of processes in memory.", "o": ["process count", "long-term scheduler", "degree of multiprogramming", "CPU scheduler "], "a": 2, "e": "Degree of multiprogramming = number of processes in memory.", "s": false, "n": 21}, {"t": "mcq", "q": "Switching the CPU core to another process requires performing a state save of the current process and a state restore of a different process. This task is known as a ______.", "o": ["Race condition", "Context switching ", "Deadlock", "CPU-bound process "], "a": 1, "e": "Saving the old process state and restoring another is a context switch.", "s": true, "n": 22}, {"t": "mcq", "q": "The switching of the CPU from one process or thread to another is called:", "o": ["Process switch", "Context switch", "I/O Burst", "Memory Burst "], "a": 1, "e": "Switching the CPU from one process or thread to another is a context switch.", "s": false, "n": 23}, {"t": "open", "q": "Explain the concept of a context switch.", "a": "When the CPU starts executing a new process, the old process's state must be preserved. The context of a process is represented in its PCB. The kernel saves the context of the old process in its PCB and loads the saved context of the new process. This is pure overhead – the system does no useful work while switching.", "s": false, "n": 24}, {"t": "open", "q": "Explain the main differences between a short-term and a long-term scheduler.", "a": "The difference is how often they run. The short-term scheduler selects a new process for the CPU very frequently (at least every ~100 ms), so it must be fast. The long- term scheduler runs much less often (minutes between process creations) and controls the degree of multiprogramming.", "s": false, "n": 25}, {"t": "open", "q": "Explain the difference between an I/O-bound process and a CPU-bound process.", "a": "An I/O-bound process spends more of its time performing I/O than computing. A CPU-bound process requests I/O infrequently and spends most of its time computing.", "s": false, "n": 26}, {"t": "mcq", "q": "One process can create a child process using the ______ system call.", "o": ["release", "fork()", "exit", "acquire() "], "a": 1, "e": "fork() is the system call that creates a child process.", "s": true, "n": 27}, {"t": "mcq", "q": "When a child process is created, which of the following is a possibility in terms of the execution or address space of the child?", "o": ["The child process runs concurrently with the parent", "The child process has a new program loaded into it ", "The child is a duplicate of the parent", "All of the above "], "a": 3, "e": "A child may run concurrently with the parent, may be a duplicate of it, or may load a new program, so all are possible.", "s": false, "n": 28}, {"t": "mcq", "q": "The exec() system call creates a new process.", "o": ["True", "False"], "a": 1, "e": "exec() replaces the current process's program; fork() creates the new process.", "s": false, "n": 29}, {"t": "open", "q": "Ordinarily the exec() system call follows fork(). What would happen if a programmer inadvertently placed exec() before fork()?", "a": "exec() overwrites the process, so the call to fork() would never be reached and no new process would be created. The program given to exec() would simply run instead.", "s": false, "n": 30}, {"t": "open", "q": "Explain the fundamental differences between the UNIX fork() and Windows CreateProcess() functions.", "a": "Both create a child process. fork() takes no parameters and the child inherits a copy of the parent's address space; CreateProcess() takes ten parameters and requires specifying the address space (program) of the child.", "s": false, "n": 31}, {"t": "mcq", "q": "A process that has terminated, but whose parent has not yet called wait(), is known as a ______ process.", "o": ["zombie", "orphan", "terminated", "init "], "a": 0, "e": "A terminated process whose parent has not called wait() is a zombie.", "s": false, "n": 32}, {"t": "mcq", "q": "The ______ process is assigned as the parent to orphan processes.", "o": ["zombie", "init", "main", "renderer "], "a": 1, "e": "init becomes the parent of orphan processes and cleans them up with wait().", "s": false, "n": 33}, {"t": "open", "q": "Describe how UNIX and Linux manage orphan processes.", "a": "If a parent terminates without calling wait(), its children become orphans. UNIX/Linux assign the init process as their new parent; init periodically calls wait(), so the resources of terminated processes are reclaimed.", "s": false, "n": 34}, {"t": "mcq", "q": "All processes in UNIX first become a zombie process upon termination.", "o": ["True", "False"], "a": 0, "e": "True: every UNIX process briefly becomes a zombie until the parent collects its exit status.", "s": false, "n": 35}, {"t": "mcq", "q": "What does it mean by an independent process in an operating system?", "o": ["The process runs and interrupts other processes", "The process does not share data with other processes", "The process only runs in kernel mode", "The process shares data with other processes "], "a": 1, "e": "An independent process does not share data with other processes and is not affected by them.", "s": true, "n": 36}, {"t": "mcq", "q": "Why do processes share information?", "o": ["To allow concurrent data access", "To slow down performance", "To block other processes", "To run only one process at a time "], "a": 0, "e": "other reasons for cooperation: computation speedup and modularity.", "s": true, "n": 37}, {"t": "mcq", "q": "The two main models of Inter-Process Communication (IPC) are:", "o": ["Paging and Segmentation", "Virtual Memory and Caching", "Multithreading and Multiprocessing", "Shared Memory and Message Passing "], "a": 3, "e": "IPC uses shared memory or message passing.", "s": true, "n": 38}, {"t": "mcq", "q": "In message passing, how do processes communicate?", "o": ["By modifying each other's memory directly", "By exchanging messages via send and receive operations", "By reading and writing to shared memory", "By using a disk file "], "a": 1, "e": "Message-passing processes communicate with send and receive operations.", "s": true, "n": 39}, {"t": "mcq", "q": "Which of the following statements is true?", "o": ["Shared memory is typically faster than message passing", "Message passing is typically faster than shared memory", "Message passing is most useful for exchanging large amounts of data", "Shared memory is far more common in operating systems than message passing "], "a": 0, "e": "Shared memory is typically faster, since after setup no kernel calls are needed.", "s": false, "n": 40}, {"t": "mcq", "q": "Shared memory is a more appropriate IPC mechanism than message passing for distributed systems.", "o": ["True", "False"], "a": 1, "e": "False: message passing suits distributed systems better, as memory cannot be shared across machines.", "s": false, "n": 41}, {"t": "open", "q": "When is a communication link established in indirect communication?", "a": "Only if the processes share a common mailbox.", "s": false, "n": 42}, {"t": "mcq", "q": "In a(n) ____ temporary queue, the sender must always block until the recipient receives the message.", "o": ["zero capacity", "variable capacity", "bounded capacity", "unbounded capacity "], "a": 0, "e": "With zero capacity, the sender must block until the receiver receives the message.", "s": false, "n": 43}, {"t": "mcq", "q": "A blocking send() and blocking receive() is known as a(n) ______.", "o": ["synchronized message", "rendezvous", "blocked message", "asynchronous message "], "a": 1, "e": "Blocking send plus blocking receive is a rendezvous.", "s": false, "n": 44}, {"t": "mcq", "q": "A traditional (or heavyweight) process has a single thread of control.", "o": ["True", "False"], "a": 0, "e": "True: a traditional (heavyweight) process has a single thread of control.", "s": false, "n": 45}, {"t": "mcq", "q": "A thread is composed of a thread ID, program counter, register set, and heap.", "o": ["True", "False"], "a": 1, "e": "a thread has its own stack, not a heap (the heap is shared by the process).", "s": false, "n": 46}, {"t": "mcq", "q": "Each thread has its own register set and stack.", "o": ["True", "False"], "a": 0, "e": "True: each thread has its own registers, program counter and stack.", "s": false, "n": 47}, {"t": "open", "q": "Why should a web server not run as a single-threaded process?", "a": "A single-threaded server can serve only one client at a time, which could cause enormous wait times for a busy server.", "s": false, "n": 48}, {"t": "open", "q": "List the major categories of benefits of multithreaded programming and briefly explain each.", "a": "Responsiveness – the program keeps running even if part of it is blocked. Resource sharing – threads share the resources of their process, which is easier than shared memory or message passing. Economy – creating and switching threads is cheaper than creating processes and context switching. Scalability – a process can take advantage of multicore architectures.", "s": false, "n": 49}, {"t": "mcq", "q": "______ is NOT considered a challenge when designing applications for multicore systems.", "o": ["Deciding which activities can be run in parallel", "Ensuring there is a sufficient number of cores", "Determining if data can be separated so that it is accessed on separate cores", "Identifying data dependencies between tasks "], "a": 1, "e": "Challenges are dividing activities, balance, data splitting and dependency; having enough cores is not a design challenge.", "s": false, "n": 50}, {"t": "mcq", "q": "What is data parallelism?", "o": ["Distributing data subsets across cores and applying the same operation", "Assigning different tasks to processors", "Running processes sequentially on one core", "Using a single thread for all operations "], "a": 0, "e": "Data parallelism distributes subsets of the same data across cores, each doing the same operation.", "s": true, "n": 51}, {"t": "mcq", "q": "______ involves distributing tasks across multiple computing cores.", "o": ["Concurrency", "Task parallelism", "Data parallelism", "Parallelism "], "a": 1, "e": "Task parallelism distributes different tasks (threads) across cores.", "s": false, "n": 52}, {"t": "mcq", "q": "Task parallelism distributes threads and data across multiple computing cores.", "o": ["True", "False"], "a": 1, "e": "task parallelism distributes threads (tasks), each performing a unique operation.", "s": false, "n": 53}, {"t": "mcq", "q": "It is possible to have concurrency without parallelism.", "o": ["True", "False"], "a": 0, "e": "True: concurrency means progress on several tasks, which one core can do by switching.", "s": false, "n": 54}, {"t": "open", "q": "Multicore systems present certain challenges for multithreaded programming. Briefly describe them.", "a": "Dividing activities (deciding which tasks can run in parallel), balance (tasks should do equal work), data splitting (data must be divided so it can be accessed on separate cores), data dependency (dependencies between tasks must be identified and synchronized), and testing and debugging (many different execution paths make it harder).", "s": false, "n": 55}, {"t": "open", "q": "Distinguish between parallelism and concurrency.", "a": "A parallel system can perform more than one task simultaneously. A concurrent system supports more than one task making progress (a single core can do this by switching between tasks).", "s": false, "n": 56}, {"t": "open", "q": "Distinguish between data parallelism and task parallelism.", "a": "Data parallelism distributes subsets of the same data across multiple cores and performs the same operation on each. Task parallelism distributes tasks (threads) across cores, with each performing a unique operation.", "s": false, "n": 57}, {"t": "mcq", "q": "A ____ provides an API for creating and managing threads.", "o": ["set of system calls", "multicore system", "thread library", "multithreading model "], "a": 2, "e": "A thread library provides an API for creating and managing threads.", "s": false, "n": 58}, {"t": "mcq", "q": "Pthreads refers to ____.", "o": ["the POSIX standard", "an implementation for thread behavior", "a specification for thread behavior", "an API for process creation and synchronization "], "a": 2, "e": "Pthreads is a specification (POSIX standard) for thread behavior, not an implementation.", "s": false, "n": 59}, {"t": "mcq", "q": "Virtually all contemporary operating systems support kernel threads.", "o": ["True", "False"], "a": 0, "e": "True: virtually all modern OSs support kernel threads.", "s": false, "n": 60}, {"t": "mcq", "q": "It is possible to create a thread library without any kernel-level support.", "o": ["True", "False"], "a": 0, "e": "True: a user-level thread library needs no kernel support.", "s": false, "n": 61}, {"t": "open", "q": "What are the two different ways in which a thread library could be implemented?", "a": "(1) A user-level library – all code and data structures reside in user space with no kernel support. (2) A kernel-level library supported directly by the operating system, with code and data structures in kernel space.", "s": false, "n": 62}, {"t": "mcq", "q": "What is the multithreading model that maps many user-level threads to a single kernel thread?", "o": ["Many-to-One", "Many-to-Many", "One-to-Many", "One-to-One "], "a": 0, "e": "Many-to-one maps many user threads to one kernel thread.", "s": true, "n": 63}, {"t": "mcq", "q": "The _____ model maps each user-level thread to one kernel thread.", "o": ["many-to-many", "two-level ", "one-to-one", "many-to-one "], "a": 2, "e": "One-to-one maps each user thread to its own kernel thread.", "s": false, "n": 64}, {"t": "mcq", "q": "The ____ multithreading model multiplexes many user-level threads to a smaller or equal number of kernel threads.", "o": ["many-to-one model", "one-to-one model", "many-to-many model", "many-to-some model "], "a": 2, "e": "Many-to-many multiplexes many user threads onto a smaller or equal number of kernel threads.", "s": false, "n": 65}, {"t": "mcq", "q": "____ is a thread library for Solaris that maps many user-level threads to one kernel thread.", "o": ["Pthreads", "Green threads", "Sthreads", "Java threads "], "a": 1, "e": "Green threads is the Solaris library using the many-to-one model.", "s": false, "n": 66}, {"t": "mcq", "q": "Windows uses the ____.", "o": ["one-to-one model", "many-to-one model", "one-to-many model", "many-to-many model "], "a": 0, "e": "Windows uses the one-to-one model (like Linux).", "s": false, "n": 67}, {"t": "open", "q": "Explain the many-to-one threading model. Does this model allow multiple threads to run at the same time?", "a": "Many user-level threads are mapped to a single kernel thread. It does not allow multiple threads to run simultaneously, because only one thread can be in the kernel at a time; also, if one thread blocks, all of them block.", "s": false, "n": 68}, {"t": "open", "q": "Explain the different thread mapping models.", "a": "Many-to-One – many user threads map to one kernel thread (no parallelism; one blocking thread blocks all). One-to-One – each user thread maps to its own kernel thread (more concurrency, but the number of threads per process may be restricted due to overhead; used by Windows and Linux). Many-to-Many – many user threads are multiplexed onto a smaller or equal number of kernel threads, letting the OS create a sufficient number of kernel threads.", "s": false, "n": 69}, {"t": "open", "q": "Some UNIX systems have two versions of fork(). Describe each version and how to decide which to use.", "a": "One version duplicates all threads; the other duplicates only the thread that called fork(). If exec() is called immediately after fork(), duplicating only the calling thread is enough, because exec() replaces the whole process. If the new process does not call exec(), it should duplicate all threads.", "s": false, "n": 70}, {"t": "mcq", "q": "Which of the following would be an acceptable signal-handling scheme for a multithreaded program?", "o": ["Deliver the signal to the thread to which the signal applies", "Deliver the signal to every thread in the process", "Deliver the signal to only certain threads in the process", "All of the above "], "a": 3, "e": "A signal may go to the target thread, every thread, only some threads, or a designated thread, so all are acceptable.", "s": false, "n": 71}, {"t": "mcq", "q": "Cancellation points are associated with ____ cancellation.", "o": ["asynchronous", "deferred", "synchronous", "non-deferred "], "a": 1, "e": "Cancellation points exist only in deferred cancellation, where the thread checks if it should stop.", "s": false, "n": 72}, {"t": "open", "q": "How can deferred cancellation ensure that thread termination occurs in an orderly manner compared with asynchronous cancellation?", "a": "In asynchronous cancellation the thread is cancelled immediately, possibly in the middle of a data update. In deferred cancellation the thread checks periodically whether it should terminate, so it can cancel itself at a safe, convenient time.", "s": false, "n": 73}, {"t": "mcq", "q": "Deferred cancellation is preferred over asynchronous cancellation.", "o": ["True", "False"], "a": 0, "e": "True: deferred cancellation lets the thread end at a safe point, avoiding half-finished updates.", "s": false, "n": 74}, {"t": "mcq", "q": "Thread-local storage is data that ____.", "o": ["is not associated with any process", "has been modified by the thread, but not yet updated to the parent process", "is generated by the thread independent of the thread's process", "is unique to each thread "], "a": 3, "e": "Thread-local storage is data unique to each thread.", "s": false, "n": 75}, {"t": "mcq", "q": "LWP is ____.", "o": ["short for lightweight processor", "placed between system and kernel threads ", "placed between user and kernel threads", "common in systems implementing one-to-one multithreading models "], "a": 2, "e": "An LWP (lightweight process) sits between user threads and kernel threads.", "s": false, "n": 76}, {"t": "mcq", "q": "In multithreaded programs, the kernel informs an application about certain events using a procedure known as a(n) ____.", "o": ["signal", "upcall", "event handler", "pool "], "a": 1, "e": "The kernel informs the application with an upcall, handled by an upcall handler.", "s": false, "n": 77}], "3": [{"t": "mcq", "q": "The fundamental execution model of a process involves alternating between which two distinct activities?", "o": ["Running state and ready queue waiting", "Context switching and I/O wait", "Dispatch latency and user mode switch", "CPU burst and I/O burst "], "a": 3, "e": "Execution alternates between CPU bursts and I/O bursts.", "s": true, "n": 1}, {"t": "open", "q": "Explain the concept of a CPU–I/O burst cycle.", "a": "The lifecycle of a process consists of bursts of two kinds. Every process alternates between bursts of CPU execution and I/O wait. The distribution of CPU bursts (many short bursts, few long ones) is the main concern for CPU scheduling.", "s": false, "n": 2}, {"t": "mcq", "q": "The ______ selects from among the processes in the ready queue, and allocates a CPU core to one of them.", "o": ["Kernel", "Memory scheduler", "Bus controller", "CPU scheduler "], "a": 3, "e": "The CPU scheduler picks from the ready queue and allocates a core.", "s": true, "n": 3}, {"t": "mcq", "q": "Which of the following is true of cooperative (nonpreemptive) scheduling?", "o": ["It requires a timer", "A process keeps the CPU until it releases it, either by terminating or by switching to the waiting state ", "It incurs a cost associated with access to shared data", "A process switches from the running state to the ready state when an interrupt occurs "], "a": 1, "e": "In nonpreemptive scheduling the process keeps the CPU until it terminates or waits for I/O.", "s": false, "n": 4}, {"t": "mcq", "q": "When can a CPU scheduling decision not be made, leading to non-preemptive behavior? (Equivalently: which scheduling decisions are non-preemptive?)", "o": ["When the process terminates or switches from running to waiting", "Whenever data shared between processes are inconsistent", "When the process is preempted", "When the process switches from waiting to ready state "], "a": 0, "e": "Nonpreemptive decisions happen only when the process terminates or switches from running to waiting.", "s": false, "n": 5}, {"t": "mcq", "q": "Virtually all modern operating systems (Windows, Linux, macOS) use which type of scheduling?", "o": ["Preemptive scheduling", "Nonpreemptive scheduling", "Shortest Job First", "First-Come First-Served "], "a": 0, "e": "Modern OSs (Windows, Linux, macOS) use preemptive scheduling.", "s": true, "n": 6}, {"t": "mcq", "q": "What characteristic of modern operating systems allows a running process to be forcibly interrupted and give up the CPU?", "o": ["Priority setting", "Non-preemption", "Dispatching latency", "Preemptive scheduling "], "a": 3, "e": "Preemptive scheduling lets the OS forcibly take the CPU from a running process.", "s": false, "n": 7}, {"t": "mcq", "q": "Which of the following scheduling algorithms must be nonpreemptive?", "o": ["SJF", "RR", "FCFS", "Priority algorithms "], "a": 2, "e": "FCFS has no preemption: the CPU is released only when the process ends or blocks.", "s": false, "n": 8}, {"t": "mcq", "q": "When a process is preempted while updating shared data, which issue can arise due to the OS scheduling feature?", "o": ["Increased dispatch latency", "Queue overflow condition", "Race conditions, leading to inconsistent data reads", "Context switching failure "], "a": 2, "e": "A preempted process can leave shared data half-updated, causing race conditions.", "s": false, "n": 9}, {"t": "mcq", "q": "In preemptive scheduling, the sections of code affected by interrupts must be guarded from simultaneous use.", "o": ["True", "False"], "a": 0, "e": "True: shared data touched by code that can be interrupted must be protected.", "s": false, "n": 10}, {"t": "open", "q": "______ is a module that gives control of the CPU to the process selected by the scheduler.", "a": "The dispatcher", "s": true, "n": 11}, {"t": "mcq", "q": "What is dispatch latency?", "o": ["The process executing", "Jumping to the proper location in the user program to restart that program", "It gives control of the CPU to the process selected by the CPU scheduler", "The time it takes for the dispatcher to stop one process and start another running "], "a": 3, "e": "Dispatch latency is the time the dispatcher needs to stop one process and start another.", "s": true, "n": 12}, {"t": "open", "q": "What role does the dispatcher play in CPU scheduling?", "a": "The dispatcher gives control of the CPU to the process selected by the CPU scheduler. This requires a context switch, a switch to user mode, and a jump to the proper location in the user program. The time lost doing this is the dispatch latency, so the dispatcher should be as fast as possible.", "s": false, "n": 13}, {"t": "mcq", "q": "____ is the number of processes that are completed per time unit.", "o": ["CPU utilization", "Response time", "Turnaround time", "Throughput "], "a": 3, "e": "Throughput = processes completed per time unit.", "s": true, "n": 14}, {"t": "mcq", "q": "The interval from the time of submission of a process to the time of completion is termed:", "o": ["Waiting time", "Turnaround time", "Response time", "Throughput "], "a": 1, "e": "Turnaround time = submission to completion.", "s": false, "n": 15}, {"t": "mcq", "q": "Which CPU scheduling metric is defined as the amount of time a process waits in the ready queue?", "o": ["Waiting Time (Min)", "Turnaround Time (Min) ", "Response Time (Min)", "Throughput (Max) "], "a": 0, "e": "Waiting time is the time spent waiting in the ready queue.", "s": false, "n": 16}, {"t": "mcq", "q": "Which of the following scheduling criteria should be MAXIMIZED?", "o": ["Turnaround time", "Throughput", "Response time", "Waiting time "], "a": 1, "e": "CPU utilization and throughput are maximized; turnaround, waiting and response time are minimized.", "s": false, "n": 17}, {"t": "open", "q": "Explain the difference between response time and turnaround time.", "a": "Turnaround time is the total time to execute a process: the sum of the time spent waiting to get into memory, waiting in the ready queue, executing on the CPU, and doing I/O. Response time is the time from when a request was submitted until the first response is produced.", "s": false, "n": 18}, {"t": "mcq", "q": "The ______ occurs in first-come-first-served scheduling when a process with a long CPU burst occupies the CPU.", "o": ["dispatch latency", "waiting time", "convoy effect", "system-contention scope "], "a": 2, "e": "The convoy effect: short processes wait behind one long CPU-bound process.", "s": false, "n": 19}, {"t": "mcq", "q": "Using FCFS, processes P1 (burst = 6), P2 (burst = 2) and P3 (burst = 4) arrive in that order. What is the average waiting time?", "o": ["2", "8", "4", "6 "], "a": 2, "e": "The waiting times are 0, 6 and 8, so the average is 14/3 ≈ 4.67. None of the options matches exactly (the closest is C); check the original wording of this question with your instructor.", "s": false, "n": 20, "v": 1}, {"t": "mcq", "q": "Which scheduling algorithm associates with each process the length of its next CPU burst (and picks the process with the smallest one)?", "o": ["Round-Robin", "Shortest-Job-First", "Priority Scheduling", "First-Come, First-Served "], "a": 1, "e": "SJF picks the process with the shortest next CPU burst.", "s": true, "n": 21}, {"t": "mcq", "q": "The Shortest Job First (SJF) scheduling algorithm is known for which property regarding average waiting time?", "o": ["It guarantees maximum CPU utilization", "It achieves the minimum average waiting time", "It minimizes context switch overhead", "It supports non-preemptive operation only "], "a": 1, "e": "SJF is optimal: it gives the minimum average waiting time.", "s": false, "n": 22}, {"t": "mcq", "q": "____ scheduling is approximated by predicting the next CPU burst with an exponential average of the measured lengths of previous CPU bursts.", "o": ["Multilevel queue", "RR", "FCFS", "SJF "], "a": 3, "e": "SJF predicts the next burst with an exponential average of previous bursts.", "s": false, "n": 23}, {"t": "mcq", "q": "______ is sometimes called shortest-remaining-time-first scheduling.", "o": ["Priority Scheduling", "First-Come, First-Served Scheduling", "Round Robin Scheduling", "Preemptive SJF Scheduling "], "a": 3, "e": "Preemptive SJF is shortest-remaining-time-first.", "s": false, "n": 24}, {"t": "open", "q": "Compare the performance of FCFS and SJF scheduling in terms of average waiting time.", "a": "SJF has a lower average waiting time than FCFS because shorter jobs are executed first. FCFS can cause long waiting times when a long process arrives before short ones (convoy effect).", "s": false, "n": 25}, {"t": "open", "q": "Given the processes and burst times P1 = 2, P2 = 1, P3 = 8, P4 = 4, P5 = 5, use SJF to (a) draw the Gantt chart and (b) compute the waiting time of each process.", "a": "(a) P2 | P1 | P4 | P5 | P3, with boundaries at 0, 1, 3, 7, 12, 20. (b) Waiting times: P2 = 0, P1 = 1, P4 = 3, P5 = 7, P3 = 12 (average = 23/5 = 4.6).", "s": false, "n": 26}, {"t": "mcq", "q": "The ____ scheduling algorithm is designed especially for time-sharing systems.", "o": ["SJF", "FCFS", "RR", "Multilevel queue "], "a": 2, "e": "Round robin was designed for time-sharing systems.", "s": false, "n": 27}, {"t": "mcq", "q": "In RR scheduling, the time quantum should be small with respect to the context-switch time.", "o": ["True", "False"], "a": 1, "e": "the quantum should be large compared with the context-switch time.", "s": false, "n": 28}, {"t": "mcq", "q": "Round-robin scheduling degenerates to first-come-first-served scheduling if the time quantum is too long.", "o": ["True", "False"], "a": 0, "e": "True: with a huge quantum each process finishes its burst, which is FCFS.", "s": false, "n": 29}, {"t": "mcq", "q": "In a system using Round Robin scheduling, what happens if the time quantum (q) is set too small compared to the context switch time?", "o": ["The overhead from frequent context switches becomes excessive", "The process always runs in non-preemptive mode", "The average waiting time decreases significantly", "The overall throughput increases dramatically "], "a": 0, "e": "If q is tiny compared with the context switch time, most time goes to switching, so overhead is excessive.", "s": false, "n": 30}, {"t": "open", "q": "What effect does the size of the time quantum have on the performance of an RR algorithm?", "a": "If the quantum is extremely large, RR behaves like FCFS. If it is extremely small, RR is called processor sharing and creates the appearance that each of n processes has its own processor running at 1/n of the real speed, but the context-switch overhead becomes too high.", "s": false, "n": 31}, {"t": "mcq", "q": "A significant problem with priority scheduling algorithms is ____.", "o": ["complexity", "starvation", "determining the length of the next CPU burst", "determining the length of the time quantum "], "a": 1, "e": "The problem with priority scheduling is starvation of low-priority processes.", "s": false, "n": 32}, {"t": "mcq", "q": "Which scheduling technique addresses the problem where low-priority processes might never get scheduled due to continuous high-priority arrivals?", "o": ["Priority Scheduling", "Multilevel Queue ", "Round Robin (RR)", "Aging "], "a": 3, "e": "Aging raises the priority of waiting processes over time, preventing starvation.", "s": true, "n": 33}, {"t": "open", "q": "Explain the process of starvation and how aging can be used to prevent it.", "a": "Starvation occurs when a process is ready to run but waits indefinitely for the CPU, for example because higher-priority processes keep arriving. Aging gradually increases the priority of a waiting process, so it eventually becomes high enough to execute.", "s": false, "n": 34}, {"t": "mcq", "q": "Which of the following is true of multilevel queue scheduling?", "o": ["Processes can move between queues", "Each queue has its own scheduling algorithm", "A queue cannot have absolute priority over lower-priority queues", "It is the most general CPU-scheduling algorithm "], "a": 1, "e": "In multilevel queue scheduling each queue has its own scheduling algorithm; processes do not move between queues.", "s": false, "n": 35}, {"t": "mcq", "q": "Which algorithm moves a process from one priority queue to another based on its execution time?", "o": ["Round Robin", "Multilevel Feedback Queue", "Round Robin with Aging", "Multilevel Queue "], "a": 1, "e": "The multilevel feedback queue moves processes between queues based on their CPU usage.", "s": true, "n": 36}, {"t": "mcq", "q": "The most complex scheduling algorithm is the multilevel feedback-queue algorithm.", "o": ["True", "False"], "a": 0, "e": "True: MLFQ has the most parameters, so it is the most complex.", "s": false, "n": 37}, {"t": "mcq", "q": "In advanced CPU scheduling, if a system uses kernel-level threads, which resource competition scope is involved?", "o": ["Dispatch latency overhead", "System Contention Scope (SCS)", "User-level thread contention", "Process Contention Scope (PCS) "], "a": 1, "e": "Kernel threads are scheduled system-wide, which is system-contention scope (SCS).", "s": true, "n": 38}, {"t": "mcq", "q": "__________ involves the decision of which kernel thread to schedule onto which CPU.", "o": ["Process-contention scope", "System-contention scope", "Dispatcher", "Round-robin scheduling "], "a": 1, "e": "Choosing which kernel thread runs on which CPU is system-contention scope.", "s": false, "n": 39}, {"t": "open", "q": "Explain the difference between Process Contention Scope (PCS) and System Contention Scope (SCS) in thread scheduling.", "a": "PCS is used with the many-to-one and many-to-many models: the thread library schedules user-level threads to run on an available LWP, so the competition is among threads within the same process (typically via priorities set by the programmer). SCS is when the kernel schedules a kernel thread onto an available CPU, so the competition is among all threads in the system.", "s": false, "n": 40}, {"t": "mcq", "q": "Systems using a one-to-one model (such as Windows, Solaris and Linux) schedule threads using process-contention scope (PCS).", "o": ["True", "False"], "a": 1, "e": "they use system-contention scope (SCS).", "s": false, "n": 41}, {"t": "mcq", "q": "What is the primary goal of load balancing in SMP systems?", "o": ["To increase the number of processors", "To keep the workload evenly distributed among all CPUs", "To reduce the number of running threads", "To increase the complexity of scheduling "], "a": 1, "e": "Load balancing keeps work evenly spread across all CPUs in SMP.", "s": false, "n": 42}, {"t": "mcq", "q": "The two general approaches to load balancing are __________ and ____________.", "o": ["soft affinity, hard affinity", "coarse grained, fine grained", "soft real-time, hard real-time", "push migration, pull migration "], "a": 3, "e": "The two load-balancing approaches are push migration and pull migration.", "s": false, "n": 43}, {"t": "open", "q": "Describe two general approaches to load balancing.", "a": "Push migration – a periodic task checks the load on each processor and, if it finds an imbalance, moves tasks from overloaded processors to idle or less-busy ones. Pull migration – an idle processor pulls a waiting task from a busy processor. They are often implemented in parallel.", "s": false, "n": 44}, {"t": "mcq", "q": "Load balancing is typically only necessary on systems with a common run queue.", "o": ["True", "False"], "a": 1, "e": "it is needed mainly with per-processor (private) run queues.", "s": false, "n": 45}, {"t": "open", "q": "Explain the fundamental difference between asymmetric and symmetric multiprocessing.", "a": "In asymmetric multiprocessing, all scheduling decisions, I/O and other system activities are handled by a single processor. In SMP, each processor is self-scheduling.", "s": false, "n": 46}, {"t": "mcq", "q": "______ allows a thread to run on only one processor (or a specified set of processors).", "o": ["Processor affinity", "Processor set", "NUMA", "Load balancing "], "a": 0, "e": "soft affinity only tries to keep a thread on the same processor; hard affinity lets a process specify the set of processors it may run on.", "s": false, "n": 47}, {"t": "mcq", "q": "Load balancing algorithms have no impact on the benefits of processor affinity.", "o": ["True", "False"], "a": 1, "e": "moving a thread to balance load makes it lose the contents of the cache of the processor it left.", "s": false, "n": 48}, {"t": "mcq", "q": "If an operating system is NUMA-aware, what optimization strategy does it employ regarding resource placement?", "o": ["Running threads on any available core regardless of memory location", "Load balancing across all processors", "Assigning memory closest to the CPU where the thread is running", "Using a fixed queue for process management "], "a": 2, "e": "A NUMA-aware OS allocates memory closest to the CPU the thread runs on.", "s": false, "n": 49}, {"t": "mcq", "q": "Chip multithreading (CMT) is also referred to by Intel as:", "o": ["Load balancing", "Soft threading", "Processor affinity", "Hyperthreading "], "a": 3, "e": "Intel calls chip multithreading hyperthreading.", "s": true, "n": 50}, {"t": "mcq", "q": "With ______ a thread executes on a processor until a long-latency event (such as a memory stall) occurs.", "o": ["coarse-grained multithreading ", "fine-grained multithreading", "virtualization", "multicore processors "], "a": 0, "e": "Coarse-grained multithreading switches threads only after a long-latency event such as a memory stall.", "s": false, "n": 51}, {"t": "open", "q": "Distinguish between coarse-grained and fine-grained multithreading.", "a": "Coarse-grained multithreading lets a thread run on a processor until a long- latency event (such as waiting for memory) occurs, and then switches to another thread. Fine-grained multithreading switches between threads at a much finer granularity, such as between instructions.", "s": false, "n": 52}, {"t": "mcq", "q": "SMP systems that use multicore processors typically run faster than SMP systems that place each processor on a separate chip.", "o": ["True", "False"], "a": 0, "e": "True: on-chip cores communicate faster and use less power than separate chips.", "s": false, "n": 53}, {"t": "mcq", "q": "A multicore system allows two (or more) threads that are in compute cycles to execute at the same time.", "o": ["True", "False"], "a": 0, "e": "True: each core runs its own thread, so threads in compute cycles run simultaneously.", "s": false, "n": 54}, {"t": "open", "q": "Burst times: P1 = 24, P2 = 3, P3 = 3. Compute the average waiting time if the processes arrive in the order (a) P1, P2, P3 and (b) P2, P3, P1.", "a": "(a) Gantt: P1 (0–24), P2 (24–27), P3 (27–30); waiting times 0, 24, 27, so the average is 17. (b) Gantt: P2 (0–3), P3 (3–6), P1 (6–30); waiting times 6, 0, 3, so the average is", "s": false, "n": 55}, {"t": "open", "q": "Burst times (all arrive at time 0): P1 = 6, P2 = 8, P
