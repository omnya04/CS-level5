cq", "q": "________ is an end product of an SDLC phase.", "o": ["Deliverable", "Planning", "Project management", "Project manager "], "a": 0, "e": "A deliverable is the end product of an SDLC phase.", "s": false, "n": 11}, {"t": "mcq", "q": "In critical path scheduling, if an activity is on the critical path ________.", "o": ["It has slack time", "It has no effect on the total project completion time", "It consumes fewer resources", "Once it is delayed in completion, the entire project is delayed "], "a": 3, "e": "A critical-path activity that is delayed delays the entire project.", "s": false, "n": 12}, {"t": "mcq", "q": "Which of the following is NOT related to the project initiation tasks and activities?", "o": ["Relationship with customers", "Develop communication plan", "Project workbook", "Initiation team "], "a": 1, "e": "Developing a communication plan belongs to planning, not initiation.", "s": false, "n": 13}, {"t": "mcq", "q": "The shortest time in which a project can be completed is called ________.", "o": ["PERT", "Critical path", "Slack time", "Work breakdown "], "a": 1, "e": "The critical path determines the shortest time in which the project can be completed.", "s": false, "n": 14}, {"t": "mcq", "q": "What determines the tasks and requirements within a project?", "o": ["Schedule", "Communication", "Risks", "Scope "], "a": 3, "e": "The scope determines the tasks and requirements of the project.", "s": false, "n": 15}, {"t": "mcq", "q": "Projects can conclude with a natural or unnatural termination. This happens in ________.", "o": ["Executing the project", "Planning the project", "Closing the project "], "a": 2, "e": "Projects end (naturally or unnaturally) in the closing phase.", "s": false, "n": 16}, {"t": "mcq", "q": "In which phase do you describe project scope, alternatives, and feasibility?", "o": ["Planning phase", "Initiation phase", "Closedown", "Execution phase "], "a": 0, "e": "Scope, alternatives and feasibility are described in the planning phase.", "s": false, "n": 17}, {"t": "mcq", "q": "You use the information on tasks and resource availability to assign time estimates to each activity in the work breakdown structure. This is ________.", "o": ["Developing a preliminary schedule", "Determining project standards and procedures", "Developing a communication plan "], "a": 0, "e": "Task and resource information is used to estimate time for each activity: developing a preliminary schedule.", "s": false, "n": 18}, {"t": "mcq", "q": "A scheduling technique whose order and duration of a sequence of task activities directly affects the completion date of a project.", "o": ["Slack time", "Critical path scheduling", "Critical path "], "a": 1, "e": "Critical path scheduling uses a sequence of activities whose order and duration directly affect completion date.", "s": false, "n": 19}, {"t": "mcq", "q": "The goal of this activity is to identify sources of project risk and to estimate the consequences of those risks.", "o": ["Identifying and assessing risk", "Creating a preliminary budget", "Determining project standards and procedures "], "a": 0, "e": "Identifying and assessing risk finds sources of project risk and estimates their consequences.", "s": false, "n": 20}, {"t": "mcq", "q": "A thorough understanding of your customer builds stronger partnerships and higher levels of trust.", "o": ["Establishing the project initiation team", "Establishing a relationship with the customer", "Establishing the project initiation plan "], "a": 1, "e": "Establishing a relationship with the customer builds trust and partnership.", "s": false, "n": 21}, {"t": "mcq", "q": "Specify how various deliverables are produced and tested by you and your project team.", "o": ["Determining project standards and procedures", "Developing a preliminary schedule", "Developing a communication plan "], "a": 0, "e": "Determining project standards and procedures defines how deliverables are produced and tested.", "s": false, "n": 22}, {"t": "mcq", "q": "Dividing the project into manageable tasks and logically ordering them to ensure a smooth evolution between tasks.", "o": ["Work breakdown structure ", "Project scope", "Project workbook "], "a": 0, "e": "A work breakdown structure divides the project into manageable, ordered tasks.", "s": false, "n": 23}, {"t": "mcq", "q": "A systems analyst with a diverse set of skills: management, leadership, technical, conflict management, and customer relationship.", "o": ["System Service Request", "Deliverable", "Project manager "], "a": 2, "e": "The project manager has management, leadership, technical and conflict-management skills.", "s": false, "n": 24}, {"t": "mcq", "q": "The phase in which the plans created in the prior phases are put into action.", "o": ["Initiation phase", "Execution phase", "Closedown phase", "Planning phase "], "a": 1, "e": "In the execution phase the plans from earlier phases are put into action.", "s": false, "n": 25}, {"t": "mcq", "q": "________ involves organizing an initial core of project team members to assist in accomplishing the project initiation activities.", "o": ["Establishing management procedures", "Establishing a relationship with the customer", "Establishing the project initiation plan", "Establishing the project initiation team "], "a": 3, "e": "The initiation team is organized to help accomplish project goals.", "s": false, "n": 26}, {"t": "mcq", "q": "________ does not show time overlap but does show which tasks could be done in parallel.", "o": ["Network diagram", "Gantt charts "], "a": 0, "e": "A network diagram shows which tasks can be done in parallel, but not time overlap.", "s": false, "n": 27}, {"t": "mcq", "q": "________ show the duration of tasks.", "o": ["Network diagram", "Gantt charts "], "a": 1, "e": "Gantt charts show the duration of tasks.", "s": false, "n": 28}, {"t": "mcq", "q": "The team must decide which tools to use, how the standard SDLC might be modified, which SDLC methods will be used.", "o": ["Developing a preliminary schedule", "Determining project standards and procedures", "Identifying and assessing risk "], "a": 1, "e": "Choosing tools and modifying the SDLC is determining project standards and procedures.", "s": false, "n": 29}, {"t": "mcq", "q": "________ determines whether a requested system makes economic and operational sense for an organization.", "o": ["System Service Request (SSR) ", "Feasibility study "], "a": 1, "e": "A feasibility study decides whether a requested system makes economic and operational sense.", "s": false, "n": 30}, {"t": "mcq", "q": "Determine the strengths and weaknesses of project deliverables.", "o": ["Conducting post-project reviews", "Closing the customer contract", "Closing down the project "], "a": 0, "e": "Post-project reviews examine the strengths and weaknesses of deliverables.", "s": false, "n": 31}, {"t": "mcq", "q": "Assess each team member and provide an appraisal for personnel files and salary determination.", "o": ["Closing the customer contract", "Closing down the project "], "a": 1, "e": "Appraising team members for personnel files is part of closing down the project.", "s": false, "n": 32}, {"t": "mcq", "q": "________ show the time overlap of tasks.", "o": ["Gantt charts", "Network diagram "], "a": 0, "e": "Gantt charts show the time overlap of tasks.", "s": false, "n": 33}, {"t": "mcq", "q": "________ shows the sequence dependencies between tasks.", "o": ["Gantt charts", "Network diagram "], "a": 1, "e": "A network diagram shows sequence dependencies.", "s": false, "n": 34}, {"t": "mcq", "q": "A diagram that depicts project tasks and their interrelationships.", "o": ["Gantt charts", "Network diagram "], "a": 1, "e": "A network diagram depicts tasks and their interrelationships.", "s": false, "n": 35}, {"t": "mcq", "q": "An online repository of all project-related documents that is accessible by all team members.", "o": ["Work breakdown structure", "Project scope", "Project workbook "], "a": 2, "e": "The project workbook is the online repository of all project documents.", "s": false, "n": 36}, {"t": "mcq", "q": "What is the first phase of the project management process?", "o": ["Project closedown", "Project planning phase", "Project initiation "], "a": 2, "e": "Project initiation is the first phase of project management.", "s": false, "n": 37}, {"t": "mcq", "q": "A standard form for requesting or proposing systems development work within an organization.", "o": ["System Service Request (SSR)", "Feasibility study "], "a": 0, "e": "The SSR is a standard form for requesting development work.", "s": false, "n": 38}, {"t": "mcq", "q": "What is the third phase of project management?", "o": ["Project closedown", "Project planning phase", "Project initiation", "Project execution "], "a": 3, "e": "The phases are initiation, planning, execution, closedown, so execution is the third.", "s": false, "n": 39}, {"t": "mcq", "q": "The shortest time in which a project can be completed.", "o": ["Critical path", "Slack time "], "a": 0, "e": "The critical path gives the shortest possible completion time.", "s": false, "n": 40}, {"t": "mcq", "q": "Defines the activities required to organize the initiation team while it is working to define the goals and scope of the project.", "o": ["Establishing the project initiation team", "Establishing the project management environment and project workbook", "Establishing the project initiation plan "], "a": 2, "e": "The project initiation plan defines the activities needed to organize the initiation team.", "s": false, "n": 41}, {"t": "mcq", "q": "Final reviews of the project should be conducted with management and customers.", "o": ["Closing the customer contract", "Closing down the project", "Conducting post-project reviews "], "a": 2, "e": "Post-project reviews are final reviews with management and customers.", "s": false, "n": 42}, {"t": "mcq", "q": "An important activity that occurs near the end of the project planning phase.", "o": ["Developing a Project Scope Statement", "Creating a preliminary budget", "Setting a Baseline Project Plan "], "a": 0, "e": "Developing the project scope statement happens near the end of planning.", "s": false, "n": 43}, {"t": "mcq", "q": "The most commonly used methods in representing and scheduling project plans are ________.", "o": ["Gantt charts and network diagrams", "Bar chart "], "a": 0, "e": "Gantt charts and network diagrams are the common ways to represent and schedule plans.", "s": false, "n": 44}, {"t": "mcq", "q": "A high-level document prepared for the customer that describes what the project will deliver and outlines many of the key elements of the project.", "o": ["Establishing management procedures", "Establishing a relationship with the customer", "Establishing the project initiation plan", "Developing the project charter "], "a": 3, "e": "The project charter is a short high-level document for the customer describing deliverables and outcomes.", "s": false, "n": 45}, {"t": "mcq", "q": "Successful projects require the development of effective management procedures.", "o": ["Establishing the project initiation team ", "Establishing the project management environment and project workbook", "Establishing the project initiation plan", "Establishing management procedures "], "a": 3, "e": "Effective management procedures are set up in establishing management procedures.", "s": false, "n": 46}, {"t": "mcq", "q": "To collect and organize the tools that you will use while managing the project and to construct the project workbook.", "o": ["Establishing the project initiation plan", "Establishing the project management environment and project workbook", "Establishing a relationship with the customer "], "a": 1, "e": "Setting up the management environment and the project workbook organizes tools and documents.", "s": false, "n": 47}, {"t": "mcq", "q": "Once all of the prior project planning activities have been completed, you will be able to develop a ________.", "o": ["Baseline Project Plan", "Project Scope Statement "], "a": 0, "e": "After all planning activities you produce the Baseline Project Plan (BPP).", "s": false, "n": 48}, {"t": "mcq", "q": "A project governed by a contractual agreement is typically not completed until agreed to by both parties, often in writing.", "o": ["Conducting post-project reviews", "Closing down the project", "Closing the customer contract "], "a": 2, "e": "Closing the customer contract ensures both parties agree the project is complete.", "s": false, "n": 49}, {"t": "mcq", "q": "To ensure that all contractual terms of the project have been met.", "o": ["Conducting post-project reviews", "Closing down the project", "Closing the customer contract "], "a": 2, "e": "Closing the customer contract confirms all contractual terms have been met.", "s": false, "n": 50}, {"t": "mcq", "q": "Defining clear, discrete activities and the work needed to complete each activity within a single project.", "o": ["Project initiation", "Executing the project", "Closing the project", "Planning the project "], "a": 3, "e": "Planning the project means defining clear, discrete activities and the work for each.", "s": false, "n": 51}, {"t": "mcq", "q": "________ is a controlled process of initiating, planning, executing, and closing down a project.", "o": ["Project management", "Project scope ", "Work breakdown structure", "Critical path scheduling "], "a": 0, "e": "Project management is the controlled process of initiating, planning, executing and closing a project.", "s": false, "n": 52}, {"t": "mcq", "q": "________ is the process of dividing the project into manageable tasks and logically ordering them to ensure a smooth evolution between tasks.", "o": ["Project charter", "Work breakdown structure", "Gantt chart", "Project workbook "], "a": 1, "e": "A WBS divides the project into manageable tasks and orders them.", "s": false, "n": 53}, {"t": "mcq", "q": "________ is the third phase of the project management process in which the plans created in the prior phases (project initiation and planning) are put into action.", "o": ["Project initiation", "Project planning", "Project execution", "Project closedown "], "a": 2, "e": "Execution is the third phase: plans are put into action.", "s": false, "n": 54}, {"t": "mcq", "q": "________ refers to the amount of time a task can be delayed without delaying the completion of the project.", "o": ["Critical path", "Expected time", "Total slack", "Lead time "], "a": 2, "e": "Total slack is the time a task can be delayed without delaying project completion.", "s": false, "n": 55}, {"t": "mcq", "q": "A ________ is a planned undertaking of a series of related activities to reach an objective that has a beginning and an end.", "o": ["Deliverable", "Feasibility study", "Process", "Project "], "a": 3, "e": "A project is a planned undertaking with a beginning and an end.", "s": false, "n": 56}, {"t": "mcq", "q": "A ________, conducted by the project manager, involves determining if the information system makes sense for the organization from an economic and operational standpoint.", "o": ["System Service Request", "Project charter", "Post-project review", "Feasibility study "], "a": 3, "e": "A feasibility study determines whether the system makes economic and operational sense.", "s": false, "n": 57}, {"t": "mcq", "q": "A critical path refers to a sequence of task activities whose ________ and ________ directly affect the completion date of a project.", "o": ["Cost; quality", "Scope; budget", "Order; duration", "Priority; resources "], "a": 2, "e": "The order and duration of critical-path activities directly affect the project completion date.", "s": false, "n": 58}, {"t": "mcq", "q": "A Gantt chart is the graphical representation of a project that shows each task as a ________ bar whose length is proportional to its time for completion.", "o": ["Vertical", "Diagonal", "Circular", "Horizontal "], "a": 3, "e": "In a Gantt chart each task is a horizontal bar whose length shows its duration.", "s": false, "n": 59}, {"t": "mcq", "q": "Defining tasks in too much detail will make the management of the project ________.", "o": ["Easier", "Unnecessarily complex", "More accurate", "Faster "], "a": 1, "e": "Too much detail makes managing the project unnecessarily complex.", "s": false, "n": 60}, {"t": "mcq", "q": "During ________, the project manager performs several activities to assess the size, scope, and complexity of the project and to establish procedures to support subsequent activities.", "o": ["Project planning", "Project initiation", "Project execution", "Project closedown "], "a": 1, "e": "During project initiation the manager assesses the size, scope and complexity of the project.", "s": false, "n": 61}, {"t": "mcq", "q": "Identifying, assessing, and managing the risks and day-to-day changes that occur during a project is attributed to ________.", "o": ["Customer relations", "Team management", "Risk and change management", "Conflict management "], "a": 2, "e": "Risk and change management identifies, assesses and handles risks and changes during a project.", "s": false, "n": 62}, {"t": "mcq", "q": "Influencing the activities of others toward the attainment of a common goal through the use of intelligence, personality, and abilities refers to the ________ activity of a project manager.", "o": ["Leadership", "Management", "Conflict management", "Technical problem solving "], "a": 0, "e": "Leadership is influencing others toward a common goal.", "s": false, "n": 63}, {"t": "mcq", "q": "Nodes not on the critical path contain ________ time and allow the project manager some flexibility in scheduling.", "o": ["Critical", "Idle", "Lead", "Slack "], "a": 3, "e": "Nodes not on the critical path have slack time, which gives scheduling flexibility.", "s": false, "n": 64}, {"t": "mcq", "q": "Resource estimates may need to be revised based upon the skills of the actual person (or people) assigned to a particular ________.", , "n": 71}, {"t": "open", "q": "What is the next step taken after project initiation?", "a": "Project planning.", "s": false, "n": 72}, {"t": "open", "q": "Which is the first activity in the project planning phase?", "a": "Describing project scope, alternatives, and feasibility.", "s": false, "n": 73}, {"t": "open", "q": "Which statement about the project workbook is FALSE?", "a": "The false statement is: \"It is not useful for project audits.\" (The workbook is used for project audits.)", "s": false, "n": 74}, {"t": "open", "q": "Which statement about the resource estimation activity is FALSE?", "a": "The false statement is: \"Resource estimates need not be revised based upon the skills of the actual person (or people) assigned to a particular activity.\" (They may need to be revised.)", "s": false, "n": 75}, {"t": "open", "q": "Which statement about the Gantt chart and the network diagram is FALSE?", "a": "The false statement is that a network diagram shows time overlap. Gantt charts visually show the time overlap of tasks; a network diagram does not show time overlap but does show which tasks could be done in parallel.", "s": false, "n": 76}, {"t": "open", "q": "Which is the first activity in the project execution phase?", "a": "Executing the Baseline Project Plan. Part E", "s": false, "n": 77}, {"t": "open", "q": "What are the four phases of the project management process?", "a": "Initiating the project, planning the project, executing the project, and closing down the project.", "s": false, "n": 78}, {"t": "open", "q": "What is project initiation?", "a": "The first phase of the project management process, in which activities are performed to assess the size, scope, and complexity of the project and to establish procedures to support later project activities.", "s": false, "n": 79}, {"t": "open", "q": "What does planning the project involve?", "a": "The second phase of the project management process, which focuses on defining clear, discrete activities and the work needed to complete each activity within a single project.", "s": false, "n": 80}, {"t": "open", "q": "Define executing the project.", "a": "The third phase of the project management process, in which the plans created in the prior phases are put into action.", "s": false, "n": 81}, {"t": "open", "q": "What does project execution put into action?", "a": "The Baseline Project Plan.", "s": false, "n": 82}, {"t": "open", "q": "What does closing down the project include?", "a": "Closing down the project, conducting post-project reviews, and closing the customer contract.", "s": false, "n": 83}, {"t": "open", "q": "What is the focus of project management?", "a": "To ensure that systems development projects meet customer expectations and are delivered within budget and time constraints.", "s": false, "n": 84}, {"t": "open", "q": "What is a project manager?", "a": "A systems analyst with a diverse set of skills (management, leadership, technical, conflict management, and customer relationship) who is responsible for initiating, planning, executing, and closing down a project.", "s": false, "n": 85}, {"t": "open", "q": "Who can be designated as a project manager?", "a": "In some organizations the project manager is a very experienced systems analyst, whereas in others both junior and senior analysts are expected to take on this role.", "s": false, "n": 86}, {"t": "open", "q": "What is a project workbook?", "a": "An online or hard-copy repository for all project correspondence, inputs, outputs, deliverables, procedures, and standards, used for project audits, orienting new team members, communicating with management and customers, identifying future projects, and performing post-project reviews.", "s": false, "n": 87}, {"t": "open", "q": "What is a work breakdown structure?", "a": "The process of dividing the project into manageable tasks and logically ordering them to ensure a smooth evolution between tasks.", "s": false, "n": 88}, {"t": "open", "q": "What is a Gantt chart?", "a": "A graphical representation of a project that shows each task as a horizontal bar whose length is proportional to its time for completion.", "s": false, "n": 89}, {"t": "open", "q": "What is a network diagram?", "a": "A diagram that depicts project tasks and their interrelationships.", "s": false, "n": 90}, {"t": "open", "q": "What is a distinguishing feature of a network diagram?", "a": "The ordering of tasks is shown by connecting tasks, depicted as rectangles or ovals, with their predecessor and successor tasks.", "s": false, "n": 91}, {"t": "open", "q": "What is PERT, and what is its formula?", "a": "Program Evaluation Review Technique: it uses optimistic (o), realistic (r), and pessimistic (p) time estimates to determine the expected task duration. ET = (o + 4r + p) /", "s": false, "n": 92}, {"t": "open", "q": "What is the critical path, and what is slack time?", "a": "Critical path: the shortest time in which a project can be completed. Slack time: the time an activity can be delayed without delaying the project.", "s": false, "n": 93}, {"t": "open", "q": "What is critical path scheduling?", "a": "A scheduling technique whose order and duration of a sequence of task activities directly affect the completion date of a project.", "s": false, "n": 94}, {"t": "open", "q": "What is a deliverable?", "a": "An end product of an SDLC phase.", "s": false, "n": 95}, {"t": "open", "q": "What is a System Service Request (SSR)?", "a": "A standard form for requesting or proposing systems development work within an organization.", "s": false, "n": 96}, {"t": "open", "q": "What is a feasibility study?", "a": "A study that determines whether a requested system makes economic and operational sense for an organization.", "s": false, "n": 97}, {"t": "open", "q": "What does a natural termination mean?", "a": "It occurs when the requirements of the project have been met: the project has been completed and is a success.", "s": false, "n": 98}, {"t": "open", "q": "Describe the project manager skills.", "a": "Leadership: communication; liaison between management, users and developers; assigning activities; monitoring progress. Management: defining and sequencing activities; communicating expectations; assigning resources to activities; monitoring outcomes. Conflict management: problem solving; smoothing out personality differences; compromising; goal setting. Customer relations: interpreting system requests and specifications; site preparation and user training; contact point for customers. Technical problem solving: interpreting system requests and specifications; defining activities and their sequence; making trade-offs between alternative solutions; designing solutions to problems. Risk and change management: environmental scanning; risk and opportunity identification and assessment; forecasting; resource redeployment. Team management: communication within and between teams; peer evaluations; conflict resolution; team building; self-management. Part F", "s": false, "n": 99}, {"t": "open", "q": "What is a critical path? Can a project have more than one critical path? Explain why.", "a": "A critical path is the shortest time in which a project can be completed: the sequence of tasks whose order and duration directly affect the completion date. Yes, a project can have more than one critical path, because of: Multiple dependencies between tasks. Separate sequences that run for the same duration. One critical path may not contain all the tasks necessary for project success. More than one critical path may be required to account for other teams and their projects.", "s": false, "n": 100}, {"t": "open", "q": "Gantt charts and network diagrams are techniques for depicting and documenting project plans. Describe the differences between them.", "a": "Gantt chart: horizontal bars represent task durations; shows task durations; shows the time overlap of tasks; shows slack time within an earliest start and latest finish duration. Network diagram: boxes and links represent task dependencies; shows task dependencies (sequence); does not show time overlap but shows which tasks can run in parallel; shows slack time as data within the activity rectangles or boxes. Answer key – Part G (added from the main file) 102–111: 102-A · 103-D · 104-D · 105-D · 106-D · 107-C · 108-D · 109-A (True) · 110-A (True) · 111-B (False) 112–120: 112-B · 113-C · 114-B · 115-C · 116-C · 117-B · 118-D · 119-A · 120-A Q111: the source marked this answer as uncertain. A project can have more than one critical path (see Q100), so the statement is false.", "s": false, "n": 101}, {"t": "mcq", "q": "What does a Gantt chart primarily represent?", "o": ["Duration of tasks as horizontal bars", "Project risks", "Task dependencies", "Resource allocation "], "a": 0, "e": "A Gantt chart shows task durations as horizontal bars.", "s": false, "n": 102}, {"t": "mcq", "q": "A network diagram is mainly used to show:", "o": ["Task durations", "Project costs", "Stakeholder communication", "Task dependencies and sequencing "], "a": 3, "e": "A network diagram shows task dependencies and sequencing.", "s": false, "n": 103}, {"t": "mcq", "q": "The formula for estimating task duration in PERT is:", "o": ["(o + 4p + r) / 6", "(r + p − o) / 6", "(o + r) / 6", "(o + 4r + p) / 6 "], "a": 3, "e": "PERT expected time ET = (o + 4r + p) / 6, a weighted average of optimistic, realistic and pessimistic times.", "s": false, "n": 104}, {"t": "mcq", "q": "Monitoring project progress occurs during:", "o": ["Initiation", "Closedown", "Planning", "Execution "], "a": 3, "e": "Monitoring progress occurs during execution.", "s": false, "n": 105}, {"t": "mcq", "q": "The Work Breakdown Structure (WBS) is used to:", "o": ["Test software", "Write code", "Calculate the budget", "Divide the project into manageable tasks "], "a": 3, "e": "A WBS divides the project into manageable tasks.", "s": false, "n": 106}, {"t": "mcq", "q": "Dividing the project into manageable tasks is known as:", "o": ["Resource planning", "Baseline scheduling", "Work breakdown structure", "Critical path analysis "], "a": 2, "e": "Dividing the project into manageable tasks is a work breakdown structure.", "s": false, "n": 107}, {"t": "mcq", "q": "Which chart shows each task as a horizontal bar proportional to its completion time?", "o": ["Flowchart", "PERT chart", "Network diagram", "Gantt chart "], "a": 3, "e": "A Gantt chart shows each task as a horizontal bar proportional to its time.", "s": false, "n": 108}, {"t": "mcq", "q": "A Gantt chart is a graphical representation of a project that shows each task as a horizontal bar whose length is proportional to its time for completion.", "o": ["True ", "False "], "a": 0, "e": "True: that is the definition of a Gantt chart.", "s": false, "n": 109}, {"t": "mcq", "q": "A project manager should have the skills to manage conflict, risk, and change.", "o": ["True", "False "], "a": 0, "e": "True: project managers need skills to manage conflict, risk and change.", "s": false, "n": 110}, {"t": "mcq", "q": "A critical path is unique (a project can have only one critical path).", "o": ["True", "False "], "a": 1, "e": "False: a project can have more than one critical path (ties for the longest path).", "s": false, "n": 111}, {"t": "mcq", "q": "The amount of time that an activity can be delayed without delaying the project is called ________.", "o": ["Critical path", "Slack time", "PERT", "Work breakdown structure "], "a": 1, "e": "Slack time is the delay an activity can absorb without delaying the project.", "s": false, "n": 112}, {"t": "mcq", "q": "The shortest time in which a project can be completed is the ________.", "o": ["Slack time", "Gantt chart", "Critical path", "Network diagram "], "a": 2, "e": "The critical path gives the shortest project completion time.", "s": false, "n": 113}, {"t": "mcq", "q": "A scheduling technique whose order and duration of a sequence of task activities directly affect the completion date of a project is ________.", "o": ["Critical path", "Critical path scheduling", "Work breakdown structure", "PERT "], "a": 1, "e": "Critical path scheduling is the technique based on the order and duration of the critical sequence.", "s": false, "n": 114}, {"t": "mcq", "q": "A technique that uses optimistic, pessimistic, and realistic time estimates to calculate the expected time for a task is ________.", "o": ["Gantt chart", "Network diagram", "PERT", "Critical path "], "a": 2, "e": "PERT uses optimistic, pessimistic and realistic estimates to compute an expected time.", "s": false, "n": 115}, {"t": "mcq", "q": "A diagram that depicts project tasks and their interrelationships is a ________.", "o": ["Gantt chart ", "Work breakdown structure", "Network diagram", "PERT "], "a": 2, "e": "A network diagram depicts tasks and their relationships.", "s": false, "n": 116}, {"t": "mcq", "q": "Any person, group of people, equipment, or material used in accomplishing an activity is called ________.", "o": ["Deliverables", "Resources", "Tasks", "Risks "], "a": 1, "e": "Resources are people, equipment or materials used to accomplish an activity.", "s": false, "n": 117}, {"t": "mcq", "q": "The final phase of the project management process, which focuses on bringing a project to an end, is ________.", "o": ["Project initiation", "Project planning", "Project execution", "Project closedown "], "a": 3, "e": "Project closedown is the final phase of project management.", "s": false, "n": 118}, {"t": "mcq", "q": "A short document prepared for the customer during project initiation that describes what the project will deliver and outlines generally at a high level all work required is the ________.", "o": ["Project charter", "Business case", "Feasibility study", "System Service Request "], "a": 0, "e": "A project charter is prepared for the customer during initiation.", "s": false, "n": 119}, {"t": "mcq", "q": "An online or hard-copy repository for all project correspondence, inputs, outputs, deliverables, procedures, and standards is the ________.", "o": ["Project workbook", "Work breakdown structure", "Project charter", "Gantt chart "], "a": 0, "e": "The project workbook is the repository of all project documents.", "s": false, "n": 120}, {"t": "open", "q": "Define the project charter and explain its purpose in project management.", "a": "The project charter is a short (typically one page), high-level document prepared for the customer that describes what the project will deliver and outlines many of the key elements of the project. Its purpose is to formally authorize the project or a phase. It establishes a partnership between the performing organization and the customer, documenting the scope, objectives, and key participants. It acts as a reference throughout the project so all parties understand the high-level goals and constraints.", "s": false, "n": 121}, {"t": "open", "q": "Why is critical path scheduling important, and what is the relationship between the critical path and slack time?", "a": "Critical path scheduling is an important resource control technique. It determines the sequence and duration of task activities that directly affect the project's completion date. The critical path is the sequence of activities that represents the shortest time in which a project can be completed. Slack time is the amount of time an activity can be delayed without delaying the entire project. Activities on the critical path have no slack: any delay in them delays the entire project.", "s": false, "n": 122}, {"t": "open", "q": "There are many ways to divide a project into manageable tasks. Name two of them with a brief explanation for each.", "a": "(1) Work breakdown structure: the process of dividing the project into manageable tasks and logically ordering them to ensure a smooth evolution between tasks. (2) Gantt chart: a graphical representation of a project that shows each task as a horizontal bar whose length is proportional to its time for completion.", ation-to-Function "], "a": 1, "e": "Unit-to-Function shows the relationships between organizational units and business functions.", "s": false, "n": 28}, {"t": "mcq", "q": "________ identifies which organizational units are located in or interact with a specific business location.", "o": ["Unit-to-Function", "Location-to-Unit", "Location-to-Function", "Function-to-Objective "], "a": 1, "e": "Location-to-Unit shows which units are located in or interact with a location.", "s": false, "n": 29}, {"t": "mcq", "q": "An ongoing process that defines the mission, objectives, and strategies of an organization.", "o": ["Systems maintenance", "Corporate strategic planning", "Data redundancy "], "a": 1, "e": "Corporate strategic planning is the ongoing process of defining mission, objectives and strategies.", "s": false, "n": 30}, {"t": "mcq", "q": "________ identifies which information systems support each business objective as identified during organizational planning.", "o": ["Data Entity-to-Information System", "Information System-to-Objective", "Process-to-Data Entity "], "a": 1, "e": "Information System-to-Objective shows which systems support each business objective.", "s": false, "n": 31}, {"t": "mcq", "q": "________ costs are out of control as old, poorly planned systems must constantly be revised.", "o": ["Systems maintenance", "Application backlogs", "Data redundancy "], "a": 0, "e": "Systems maintenance costs rise as old, poorly planned systems must constantly be revised.", "s": false, "n": 32}, {"t": "mcq", "q": "________ often extend three years or more, and frustrated end users are forced to create their own systems.", "o": ["Application backlogs", "Systems maintenance", "Data redundancy "], "a": 0, "e": "Application backlogs extend three years or more and push users to build their own systems.", "s": false, "n": 33}, {"t": "mcq", "q": "During project identification and selection, ________ identifies and assesses all possible systems development projects that an
