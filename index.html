ibuted database?", "o": ["The same DBMS is used at each location and data are not distributed across all nodes", "A different DBMS is used at each location and data are not distributed across all nodes", "The same DBMS is used at each location and data are distributed across all nodes", "A different DBMS is used at each location and data are distributed across all nodes"], "a": 3, "e": "Heterogeneous distributed = different DBMS at each location and data spread across nodes.", "s": false, "n": 48}, {"t": "mcq", "q": "Which of the following is not a correct data model used in NoSQL systems?", "o": ["Document-based model", "Graph-based model", "Column-based model", "Network data model"], "a": 3, "e": "NoSQL models are document, graph, column and key-value. The network model is older and not a NoSQL model.", "s": false, "n": 49}, {"t": "mcq", "q": "Which of the following is not a DBMS classification based on the emerging data model?", "o": ["NoSQL", "Relational", "Key-value", "Object-oriented"], "a": 1, "e": "Relational is a classic data-model class; NoSQL, key-value and object-oriented are the emerging ones in this list.", "s": false, "n": 50}, {"t": "mcq", "q": "In a hierarchical model, records are organized as a:", "o": ["Tree", "Links", "Graph", "List"], "a": 0, "e": "In a hierarchical model records form a tree.", "s": false, "n": 51}, {"t": "mcq", "q": "Which of the following describes the hierarchical model?", "o": ["A combination of an object-oriented and a relational model", "Represents data as a hierarchical tree structure", "Represents data as record types", "Represents data as objects"], "a": 1, "e": "The hierarchical model represents data as a tree.", "s": false, "n": 52}, {"t": "mcq", "q": "Difficulty in storing data where multiple relationships exist among the data records is a disadvantage of the:", "o": ["Relational model", "Hierarchical model", "Object-relational model", "Object-oriented model"], "a": 1, "e": "The hierarchical model has difficulty with many-to-many relationships.", "s": false, "n": 53}, {"t": "mcq", "q": "What is a Data Model?", "o": ["A programming language for DBMS.", "A type of database schema.", "A set of concepts to describe the structure of a database.", "A set of commands for querying databases."], "a": 2, "e": "A data model is a set of concepts describing the structure of a database.", "s": false, "n": "X1"}, {"t": "mcq", "q": "What do Data Model constructs often include?", "o": ["Data elements and their data types, entities, and relationships.", "User interfaces.", "Data security measures.", "External schemas."], "a": 0, "e": "Constructs include data elements and types, entities and relationships.", "s": false, "n": "X2"}, {"t": "mcq", "q": "What does DDL stand for in DBMS languages?", "o": ["Data Definition Language", "Database Description Language", "Database Design Language", "Data Display Language"], "a": 0, "e": "DDL stands for Data Definition Language.", "s": false, "n": "X3"}, {"t": "mcq", "q": "Which of the following focuses on the physical storage of data, including details such as file organization, indexing methods, and storage structures?", "o": ["Application program", "Conceptual schema", "Logical schema", "Physical schema"], "a": 3, "e": "The physical schema covers file organization, indexes and storage structures.", "s": false, "n": "X4"}, {"t": "mcq", "q": "What is a Database Instance?", "o": ["The state of the database system at any given point of time.", "The initial values inserted into the database immediately after its creation.", "The database system's logical structure.", "A single relation that contains all of the database's attributes."], "a": 0, "e": "A database instance is the state of the database at a given moment.", "s": false, "n": "X5"}, {"t": "mcq", "q": "Which of the following is NOT a DBMS classification based on the emerging data model?", "o": ["NoSQL", "Relational", "Key-value", "Object-oriented"], "a": 1, "e": "Relational is a traditional classification, not an emerging one.", "s": false, "n": "X6"}, {"t": "mcq", "q": "Which DBMS language is used to allow users to insert, delete, and modify tuples in addition to querying data?", "o": ["Data Manipulation Language", "Data View Language", "Data Definition Language", "Data Control Language"], "a": 0, "e": "DML lets users insert, delete, modify and query.", "s": false, "n": "X7"}, {"t": "mcq", "q": "The database system contains not only the database itself but also a complete definition or description of the database structure and constraints. This definition is stored in the form of a ______.", "o": ["DBMS audit log", "DBMS journal", "DBMS catalog", "DBMS archive"], "a": 2, "e": "The structure definition is stored in the DBMS catalog.", "s": false, "n": "X8"}, {"t": "mcq", "q": "Which of the following DBMS architectures serves as a conduit for sending partially processed data between the client and the database server?", "o": ["One Tier Client-Server", "Two Tier Client-Server", "Three Tier Client-Server", "A Physical Centralized Architecture"], "a": 2, "e": "In a three-tier architecture the middle tier is the conduit between client and database server.", "s": false, "n": "X9"}, {"t": "mcq", "q": "Allowing internal schema changes without requiring conceptual schema changes is known as ______.", "o": ["External Data Independence", "Physical Data Independence", "Conceptual Data Independence", "Logical Data Independence"], "a": 1, "e": "Changing the internal schema without changing the conceptual one is physical data independence.", "s": false, "n": "X10"}, {"t": "mcq", "q": "A database instance is the actual content of the database at a particular point in time.", "o": ["True", "False"], "a": 0, "e": "True: an instance is the actual content of the database at a point in time.", "s": false, "n": "TF1"}, {"t": "mcq", "q": "Data manipulation language commands are used to define a database, including creating, altering and dropping tables and establishing constraints.", "o": ["True", "False"], "a": 1, "e": "False: that describes DDL. DML retrieves and updates data.", "s": false, "n": "TF2"}, {"t": "open", "q": "In reference to the three-schema architecture, what are the three levels at which schemas are defined? Write a short description of each.", "a": "The three-schema architecture: Internal schema (internal level): describes the physical storage structure of the database and its access paths, for example files and indexes. Conceptual schema (conceptual level): describes the structure and constraints of the whole database for a community of users, hiding physical storage details. External schemas (external level, views): each describes the part of the database that a particular user group is interested in and hides the rest.", "s": false, "n": "C1"}, {"t": "open", "q": "Define and compare database schema and database state.", "a": "Database schema versus database state: Database schema: the description of a database, including its structure, relationships, data types and constraints. It changes very infrequently. Database state: the actual data stored in the database at a particular moment in time, including all the data in the database. It is also called a database instance, occurrence or snapshot, and it changes every time the database is updated.", "s": false, "n": "C2"}, {"t": "open", "q": "Explain the concept of Three-Schema Architecture in the context of database systems.", "a": "Explain the concept of Three-Schema Architecture in the context of database systems.", "s": false, "n": "S-A"}], "3": [{"t": "mcq", "q": "The data elements in each row represent facts about a real-world entity. In the formal model, rows are called:", "o": ["Attributes", "Relations", "Tuples", "Database state"], "a": 2, "e": "In the formal relational model, rows are called tuples.", "s": false, "n": 1}, {"t": "mcq", "q": "The element of a table represented by a column is called a:", "o": ["Attribute", "Tuple", "Relation", "File"], "a": 0, "e": "A column is an attribute.", "s": false, "n": 2}, {"t": "mcq", "q": "The element of a table represented by a row is called a:", "o": ["Attribute", "Tuple", "Relation", "File"], "a": 1, "e": "A row is a tuple.", "s": false, "n": 3}, {"t": "mcq", "q": "SQL uses the term table for the formal relational-model term:", "o": ["Attribute", "Relation", "Tuple", "Object"], "a": 1, "e": "SQL says table where the formal model says relation.", "s": false, "n": 4}, {"t": "mcq", "q": "A set of possible data values is called:", "o": ["Tuple", "Domain", "Degree", "Attribute"], "a": 1, "e": "A domain is the set of possible (atomic) values for an attribute.", "s": false, "n": 5}, {"t": "mcq", "q": "A domain is a set of atomic values. Atomic value means:", "o": ["Each value in the domain is repeatable", "Each value in the domain is composite", "Each value in the domain is automatically generated", "Each value in the domain is indivisible"], "a": 3, "e": "Atomic means indivisible: no composite or multivalued values.", "s": false, "n": 6}, {"t": "mcq", "q": "The characteristics or properties that define all items of a category, applied to all cells of a column, are:", "o": ["Tuples", "Cardinality", "Domain", "Attributes"], "a": 3, "e": "Attributes define the properties of every item in a column.", "s": false, "n": 7}, {"t": "mcq", "q": "The logical design of a database is called:", "o": ["Relation structure", "Relation program", "Relation instance", "Relation schema"], "a": 3, "e": "The relation schema is the logical design of a relation.", "s": false, "n": 8}, {"t": "mcq", "q": "A relation state is:", "o": ["A set of attributes", "The key constraints applied to a relation", "The total number of tuples in a relation", "A set of tuples representing a snapshot of the relation"], "a": 3, "e": "A relation state is a snapshot: the set of tuples at a given time.", "s": false, "n": 9}, {"t": "mcq", "q": "The number of tuples in a relation is referred to as its:", "o": ["Cardinality", "Degree", "Attribute count", "Domain"], "a": 0, "e": "The number of tuples is the relation's cardinality; the number of attributes is its degree.", "s": false, "n": 10}, {"t": "mcq", "q": "The order of tuples in a relational table:", "o": ["Affects the primary key selection", "Is always predefined by SQL", "Does not matter because a relation is a set", "Matters since queries are retrieved in order"], "a": 2, "e": "A relation is a set of tuples, and sets have no order.", "s": false, "n": 11}, {"t": "mcq", "q": "A term used to describe the conditions that must hold on all valid relation states is:", "o": ["Domain", "Key", "Constraints", "Cardinality"], "a": 2, "e": "Constraints are the conditions every valid relation state must satisfy.", "s": false, "n": 12}, {"t": "mcq", "q": "Which statement is true about a superkey?", "o": ["It must always be a single attribute", "It is a set of attributes that uniquely identifies a tuple in a relation", "It cannot contain extra attributes beyond the minimal key", "It is always chosen as the primary key"], "a": 1, "e": "A superkey is a set of attributes that uniquely identifies tuples. It may contain extra attributes.", "s": false, "n": 13}, {"t": "mcq", "q": "If a relation has several keys, they are called:", "o": ["Unique keys", "Candidate keys", "Secondary keys", "Primary keys"], "a": 1, "e": "Several keys of a relation are candidate keys; one is chosen as primary key.", "s": false, "n": 14}, {"t": "mcq", "q": "What is the purpose of a key in a relational database?", "o": ["To speed up database performance by optimizing queries", "To uniquely identify each row (tuple) in a table", "To act as a temporary placeholder for data computations", "To encrypt data for security purposes"], "a": 1, "e": "A key identifies each tuple uniquely.", "s": false, "n": 15}, {"t": "mcq", "q": "The key used to represent relationships between tables is called:", "o": ["Foreign key", "Primary key", "Secondary key", "Candidate key"], "a": 0, "e": "A foreign key represents the relationship between tables.", "s": false, "n": 16}, {"t": "mcq", "q": "What is the purpose of the FOREIGN KEY constraint?", "o": ["Links two tables", "Ensures uniqueness", "Stores binary data", "Defines primary keys"], "a": 0, "e": "A foreign key links two tables by referring to a key in another table.", "s": false, "n": 17}, {"t": "mcq", "q": "If no attribute has the uniqueness property, a new attribute can be added to identify the rows. This key is called:", "o": ["Candidate key", "Artificial (surrogate) key", "Superkey", "Foreign key"], "a": 1, "e": "A surrogate (artificial) key is a new attribute added to identify rows when none is naturally unique.", "s": false, "n": 18}, {"t": "mcq", "q": "In Student(ID, name, dept_name, tot_cred), which attribute can form the primary key?", "o": ["tot_cred", "ID", "name", "dept_name"], "a": 1, "e": "ID is unique per student; names, departments and credits repeat.", "s": false, "n": 19}, {"t": "mcq", "q": "In Products(ProductID, Name, Quantity, Price), which attribute is the primary key?", "o": ["ProductID", "Quantity", "Price", "Name"], "a": 0, "e": "ProductID uniquely identifies a product; names and prices can repeat.", "s": false, "n": 20}, {"t": "mcq", "q": "In STUDENT(StudentID, StudentName, GPA, MajorNumber), which attribute could be the foreign key?", "o": ["StudentName", "StudentID", "GPA", "MajorNumber"], "a": 3, "e": "MajorNumber would refer to another table (Major), so it can be the foreign key.", "s": false, "n": 21}, {"t": "mcq", "q": "In Student(ID, Email, name, degree, DateBirth, departmentNumber) and Department(DepID, DepartmentName, NumberofStudent), which is the foreign key attribute?", "o": ["ID", "DepID", "departmentNumber", "Email"], "a": 2, "e": "departmentNumber in Student refers to DepID in Department, so it is the foreign key.", "s": false, "n": 22}, {"t": "mcq", "q": "Which constraint ensures that attribute values fall within an allowed range?", "o": ["Key constraint", "Referential integrity constraint", "Domain constraint", "Entity integrity constraint"], "a": 2, "e": "A domain constraint limits values to the attribute's allowed range or type.", "s": false, "n": 23}, {"t": "mcq", "q": "A domain constraint refers to:", "o": ["A set of unique keys", "A set of tuples in the relation", "A set of valid values for the attribute", "A set of attributes"], "a": 2, "e": "A domain constraint is the set of valid values for an attribute.", "s": false, "n": 24}, {"t": "mcq", "q": "Which constraint ensures uniqueness?", "o": ["Cardinality", "Integrity", "Key constraint", "Participation"], "a": 2, "e": "The key constraint ensures key values are unique.", "s": false, "n": 25}, {"t": "mcq", "q": "The entity integrity constraint implies that:", "o": ["All entities must remain entirely independent of each other", "All entities must be integrated into a single database schema", "The primary key attributes cannot have null values in any tuple", "Entity relationships must be defined explicitly by foreign keys"], "a": 2, "e": "Entity integrity: primary key attributes cannot be NULL.", "s": false, "n": 26}, {"t": "mcq", "q": "Which is NOT one of the three main built-in constraints in the relational model?", "o": ["Referential integrity constraints", "Candidate key constraints", "Entity integrity constraints", "Key constraints"], "a": 1, "e": "The three built-in constraints are key, entity integrity and referential integrity. \"Candidate key constraints\" is not one.", "s": false, "n": 27}, {"t": "mcq", "q": "Referential integrity is specified via the:", "o": ["DISCRIMINATING KEY", "FOREIGN KEY", "PRIMARY KEY", "SECONDARY KEY"], "a": 1, "e": "Referential integrity is specified with a FOREIGN KEY.", "s": false, "n": 28}, {"t": "mcq", "q": "If a foreign key value does not match any primary key value in the referenced table, which constraint is violated?", "o": ["Referential integrity", "Key constraint", "Domain constraint", "Entity integrity"], "a": 0, "e": "An FK value with no matching PK value violates referential integrity.", "s": false, "n": 29}, {"t": "mcq", "q": "The ______ violation means a foreign key value in a new tuple references a primary key value that does not exist in the referenced relation.", "o": ["Key constraint", "Domain constraint", "Entity integrity", "Referential integrity"], "a": 3, "e": "An inserted tuple whose FK points to a missing PK violates referential integrity.", "s": false, "n": 30}, {"t": "mcq", "q": "After an insert operation, if the primary key value is null in the new tuple, which constraint is violated?", "o": ["Domain constraint", "Entity integrity", "Referential integrity", "Key constraint"], "a": 1, "e": "A NULL primary key violates entity integrity.", "s": false, "n": 31}, {"t": "mcq", "q": "Updating a foreign key (FK) may violate:", "o": ["Referential integrity", "Entity integrity", "Domain constraint", "Key constraint"], "a": 0, "e": "Updating an FK may violate referential integrity if the new value has no matching PK.", "s": false, "n": 32}, {"t": "mcq", "q": "The ______ operation may violate only referential integrity constraints.", "o": ["DELETE", "INSERT", "ENTER", "UPDATE"], "a": 0, "e": "DELETE can violate only referential integrity (when other tuples reference the deleted one).", "s": false, "n": 33}, {"t": "mcq", "q": "The ______ operation modifies the value of attributes in one or more existing tuples in a relation.", "o": ["DELETE", "INSERT", "ENTER", "UPDATE"], "a": 3, "e": "UPDATE modifies attribute values of existing tuples.", "s": false, "n": 34}, {"t": "mcq", "q": "Which operation modifies an existing tuple?", "o": ["UPDATE", "SELECT", "DELETE", "INSERT"], "a": 0, "e": "UPDATE modifies an existing tuple; INSERT adds and DELETE removes.", "s": false, "n": 35}, {"t": "mcq", "q": "When can the SET NULL option be used in a referential integrity constraint?", "o": ["Only if the primary key is numeric", "If the foreign key allows NULL", "When the parent table is empty", "If the table has no primary key"], "a": 1, "e": "SET NULL needs the foreign key to allow NULL values.", "s": false, "n": 36}, {"t": "mcq", "q": "With the DELETE statement, tuples are deleted from only one table at a time, unless ______ is specified on a referential integrity constraint.", "o": ["NULL", "DEFAULT", "CASCADE", "REJECT"], "a": 2, "e": "ON DELETE CASCADE also deletes the referencing tuples in other tables.", "s": false, "n": 37}, {"t": "mcq", "q": "What is the effect of specifying ON UPDATE CASCADE on a foreign key?", "o": ["Prevents any update to the referenced key", "Automatically updates the foreign key values to match the new referenced key value", "Raises an error when the referenced key is updated", "Sets the foreign key to NULL on update"], "a": 1, "e": "ON UPDATE CASCADE changes the foreign keys automatically to match the new key value.", "s": false, "n": 38}, {"t": "mcq", "q": "Updates that violate ______ are disallowed.", "o": ["Integrity constraints", "Authorization", "Transaction control", "DDL constraints"], "a": 0, "e": "Updates that violate integrity constraints are rejected.", "s": false, "n": 39}, {"t": "mcq", "q": "In the relational model, the term relation refers to a:", "o": ["Row", "Column", "Table", "Cell"], "a": 2, "e": "In the relational model a relation is a table.", "s": false, "n": "X1"}, {"t": "mcq", "q": "The formal term of the Column Header in the relation definitions is ______.", "o": ["Relation", "Attribute", "Domain", "Schema"], "a": 1, "e": "The column header is the attribute.", "s": false, "n": "X2"}, {"t": "mcq", "q": "If a relation has several keys, they are called ______.", "o": ["Unique Keys", "Secondary Keys", "Candidate keys", "Primary Keys"], "a": 2, "e": "Several keys of one relation are candidate keys.", "s": false, "n": "X3"}, {"t": "mcq", "q": "Consider a BOOK relation in a library database which has six attributes (Title, Author, ISBN, No. of pages, Publish year, Price). Which attribute should be used as the primary key?", "o": ["ISBN", "Title", "Author", "Publish year"], "a": 0, "e": "ISBN is unique for each book; titles, authors and years repeat.", "s": false, "n": "X4"}, {"t": "mcq", "q": "Updating an ordinary attribute (neither PK nor FK) can only violate which of the following?", "o": ["Entity integrity constraints", "Referential integrity constraints", "Key constraints", "Domain or NOT NULL constraints"], "a": 3, "e": "Updating an ordinary attribute can violate only domain or NOT NULL constraints.", "s": false, "n": "X5"}, {"t": "mcq", "q": "Which of the following constraints could be violated by a DELETE operation?", "o": ["Referential integrity", "Entity integrity", "Key constraint", "Domain constraint"], "a": 0, "e": "DELETE can violate referential integrity if other tuples refer to the deleted one.", "s": false, "n": "X6"}, {"t": "mcq", "q": "For a particular database state, the value of the foreign key attribute in each tuple of the referencing relation can be ______.", "o": ["a new secondary key value in any relation", "an existing primary key value in the referencing relation", "an existing primary key value in the referenced relation", "an existing foreign key value in the referenced relation"], "a": 2, "e": "A foreign key value must be an existing primary key value in the referenced relation (or NULL).", "s": false, "n": "X7"}, {"t": "mcq", "q": "A superkey of a relation is a set of one or more attributes whose values are guaranteed to uniquely identify tuples in the relation.", "o": ["True", "False"], "a": 0, "e": "True: a superkey uniquely identifies tuples.", "s": false, "n": "TF1"}, {"t": "mcq", "q": "A foreign key can refer to any attributes of the referenced relation.", "o": ["True", "False"], "a": 1, "e": "False: an FK refers to the primary key (or a candidate key) of the referenced relation.", "s": false, "n": "TF2"}, {"t": "mcq", "q": "The order of tuples in a relation matters, because queries retrieve tuples in order.", "o": ["True", "False"], "a": 1, "e": "False: a relation is a set, so tuple order does not matter.", "s": false, "n": "TF3"}, {"t": "open", "q": "List three constraint violations that can occur with the INSERT operation, and explain each.", "a": "Constraint violations on INSERT: Domain constraint: an attribute value in the new tuple is not of the attribute's domain. Key constraint: the value of a key attribute in the new tuple already exists in another tuple of the relation. Referential integrity: a foreign key value in the new tuple references a primary key value that does not exist in the referenced relation. Entity integrity: the primary key value of the new tuple is null.", "s": false, "n": "S1"}, {"t": "open", "q": "Explain the purpose of the actions RESTRICT, CASCADE and SET NULL in the deletion operation.", "a": "Actions on deleting a referenced tuple: RESTRICT: reject the deletion while referencing tuples exist. CASCADE: also delete the tuples that reference the deleted tuple. SET NULL: set the foreign key of the referencing tuples to NULL (only if the foreign key allows NULL).", "s": false, "n": "S2"}, {"t": "open", "q": "Explain the INSERT, DELETE and UPDATE operations and the constraints they must respect. Short answer S-A. What are the main types of built-in constraints in the relational model?", "a": "INSERT: adds a new tuple; it must satisfy the domain, key, entity-integrity and referential-integrity constraints. DELETE: removes a tuple; it may violate referential integrity if other tuples reference it. UPDATE: modifies attribute values; changing a non-key attribute can violate the domain constraint, while changing a primary or foreign key can also violate key, entity or referential integrity.", "s": false, "n": "S3"}, {"t": "open", "q": "What are the main types of built-in constraints in the relational model?", "a": "Domain constraints, key constraints, NOT NULL constraints, entity integrity constraints, and referential integrity constraints.", "s": false, "n": "S-A"}], "4": [{"t": "mcq", "q": "The ER model has three main concepts:", "o": ["Entities, relationships, and roles", "Entities, relationships, and attributes", "Entities, relationships, and data values", "Entities, attributes, and keys"], "a": 1, "e": "The ER model is built from entities, relationships and attributes.", "s": false, "n": 1}, {"t": "mcq", "q": "Which is NOT one of the three main concepts of an ER model?", "o": ["Classes", "Entities", "Attributes", "Relationships"], "a": 0, "e": "Classes belong to UML/OO, not to the three ER concepts.", "s": false, "n": 2}, {"t": "mcq", "q": "The Entity-Relationship model is a/an ______ data model for database design.", "o": ["Physical", "Conceptual", "Application program", "Logical"], "a": 1, "e": "The ER model is a conceptual (high-level) model.", "s": false, "n": 3}, {"t": "mcq", "q": "The first step in designing a high-level conceptual data model is:", "o": ["Requirements collection and analysis", "Logical design analysis", "Functional requirements analysis", "Conceptual design analysis"], "a": 0, "e": "Design starts with requirements collection and analysis.", "s": false, "n": 4}, {"t": "mcq", "q": "Which database design activity focuses on the programs and interfaces that access and update the database?", "o": ["Application program design", "Logical schema design", "Physical schema design", "Both logical and physical schema design"], "a": 0, "e": "Application program design covers the programs and interfaces that access and update the database.", "s": false, "n": 5}, {"t": "mcq", "q": "Which of the following best defines an entity?", "o": ["A collection of related data files", "A software module that manages data", "A specific constraint on a database table", "A specific object or thing in the miniworld that is represented in the database"], "a": 3, "e": "An entity is a specific object or thing in the mini-world represented in the database.", "s": false, "n": 6}, {"t": "mcq", "q": "Which of the following does NOT represent an entity?", "o": ["Student", "Employee", "Car", "Employee_Id"], "a": 3, "e": "Student, Employee and Car are things; Employee_Id is an attribute.", "s": false, "n": 7}, {"t": "mcq", "q": "In an ER diagram, an entity is represented as:", "o": ["Oval shaped box", "Rectangular box", "Square box", "Diamond shaped box"], "a": 1, "e": "An entity is drawn as a rectangle.", "s": false, "n": 8}, {"t": "mcq", "q": "In the ER model, a rectangle represents:", "o": ["Tuples", "Entity set", "Relationships", "Attributes"], "a": 1, "e": "A rectangle represents an entity set (entity type).", "s": false, "n": 9}, {"t": "mcq", "q": "Entities with the same basic attributes are grouped into an:", "o": ["Structural type", "Relationship type", "Entity type", "Universal type"], "a": 2, "e": "Entities with the same attributes form an entity type.", "s": false, "n": 10}, {"t": "mcq", "q": "The descriptive property possessed by each entity set is the:", "o": ["Attribute", "Relation", "Model", "Entity"], "a": 0, "e": "An attribute is the descriptive property of an entity.", "s": false, "n": 11}, {"t": "mcq", "q": "______ are properties used to describe an entity.", "o": ["Values", "Domains", "Attributes", "Weak entities"], "a": 2, "e": "Attributes describe an entity.", "s": false, "n": 12}, {"t": "mcq", "q": "What are the properties that describe an entity and are stored in the database?", "o": ["Schemas", "Attributes", "Relations", "Instances"], "a": 1, "e": "Attributes describe an entity and are stored as its data.", "s": false, "n": 13}, {"t": "mcq", "q": "What is the purpose of an attribute in an ER diagram?", "o": ["To define a relationship between entities", "To specify the foreign key of an entity", "To specify the primary key of an entity", "To describe a characteristic of an entity"], "a": 3, "e": "An attribute describes a characteristic of an entity.", "s": false, "n": 14}, {"t": "mcq", "q": "What is the significance of underlining an attribute in an ER diagram?", "o": ["To show composite attributes", "To denote derived attributes", "To indicate nullable attributes", "To indicate primary keys"], "a": 3, "e": "Underlining marks a key attribute (primary key).", "s": false, "n": 15}, {"t": "mcq", "q": "An attribute that can be divided into smaller sub-parts with independent meanings is called a:", "o": ["Composite attribute", "Complex attribute", "Stored attribute", "Simple attribute"], "a": 0, "e": "A composite attribute can be divided into meaningful sub-parts.", "s": false, "n": 16}, {"t": "mcq", "q": "Which is an example of a composite attribute?", "o": ["{PreviousDegrees}", "Color = {Red, Blue, Green}", "Customer_ID", "Address = (House#, Street, City, ZipCode, Country)"], "a": 3, "e": "Address (house#, street, city, zip, country) is made of sub-parts, so it is composite.", "s": false, "n": 17}, {"t": "mcq", "q": "A(n) ______ attribute is a property used to describe an entity, which may be composed of several components.", "o": ["Simple", "Atomic", "Multivalued", "Composite"], "a": 3, "e": "A composite attribute is built from several components.", "s": false, "n": 18}, {"t": "mcq", "q": "What is a multivalued attribute?", "o": ["An attribute that can only have one value for a single entity instance", "An attribute used to represent relationships between entities", "An attribute that is not related to any entity instances", "An attribute that can have multiple values for a single entity instance"], "a": 3, "e": "A multivalued attribute can have several values for one entity.", "s": false, "n": 19}, {"t": "mcq", "q": "Which of the following could be considered a multi-valued attribute?", "o": ["Location", "Birthday", "Name", "ID"], "a": 0, "e": "Location can hold several values (e.g. a department in several places), unlike birthday, name or ID.", "s": false, "n": 20}, {"t": "mcq", "q": "In an ER diagram, a multivalued attribute is displayed as:", "o": ["Ovals", "Rectangular box", "Double rectangular box", "Double ovals"], "a": 3, "e": "Multivalued attributes are drawn as double ovals.", "s": false, "n": 21}, {"t": "mcq", "q": "What is a key attribute of an entity type?", "o": ["An attribute that can have multiple values for each entity", "An attribute for which each entity must have a unique (distinct) value", "An attribute that is optional for each entity to have", "An attribute that is not necessary for each entity to have"], "a": 1, "e": "A key attribute has a unique value for each entity.", "s": false, "n": 22}, {"t": "mcq", "q": "The function that an entity plays in a relationship is called that entity's:", "o": ["Role", "Instance", "Position", "Use"], "a": 0, "e": "The function an entity plays in a relationship is its role.", "s": false, "n": 23}, {"t": "mcq", "q": "The number of participating entity types in a relationship type is called the:", "o": ["Cardinality", "Degree", "Role", "Participation"], "a": 1, "e": "Degree = number of participating entity types.", "s": false, "n": 24}, {"t": "mcq", "q": "What is a \"ternary\" relationship?", "o": ["A relationship between two entities", "A relationship between three entities", "A relationship between a weak entity and its parent entity", "A relationship between an entity and its attribute"], "a": 1, "e": "A ternary relationship connects three entity types.", "s": false, "n": 25}, {"t": "mcq", "q": "What is an example of a relationship type of degree higher than two?", "o": ["WORKS_ON (Employee, Project)", "ATTEND (Employee, Training Session, Courses)", "MANAGES (Employee, Department)", "BELONGS_TO (Employee, Department)"], "a": 1, "e": "ATTEND connects three types (Employee, Training Session, Course), so its degree is 3.", "s": false, "n": 26}, {"t": "mcq", "q": "A relationship type in which the same entity type participates twice in two distinct roles is called:", "o": ["N-ary relation", "Binary relation", "Recursive relation", "Ternary relation"], "a": 2, "e": "A recursive relationship has the same entity type playing two roles.", "s": false, "n": 27}, {"t": "mcq", "q": "A recursive relationship is a relationship between an entity and:", "o": ["Itself", "An instance entity", "A weak entity", "A subtype entity"], "a": 0, "e": "A recursive relationship relates an entity type to itself.", "s": false, "n": 28}, {"t": "mcq", "q": "A relationship within the SAME entity is called:", "o": ["Recursive", "Binary", "4-ary", "Ternary"], "a": 0, "e": "A relationship within the same entity type is recursive.", "s": false, "n": 29}, {"t": "mcq", "q": "To display a ______ relationship in an ER diagram, we need to display role names to distinguish participations.", "o": ["Binary", "Ternary", "Recursive", "Primary"], "a": 2, "e": "Recursive relationships need role names to tell the two participations apart.", "s": false, "n": 30}, {"t": "mcq", "q": "In ER, it is compulsory to write the role name on the ______ relationship.", "o": ["Ternary", "Recursive", "All types of", "Binary"], "a": 1, "e": "Role names are compulsory on recursive relationships.", "s": false, "n": 31}, {"t": "mcq", "q": "The entities that do not have key attributes to be distinct are considered as:", "o": ["Single entity", "Foreign entity", "Weak entity", "Strong entity"], "a": 2, "e": "Entities without their own key are weak entities.", "s": false, "n": 32}, {"t": "mcq", "q": "In an ER model, an entity type that does not have a key attribute on its own is known as a:", "o": ["Strong entity type", "Relation", "Composite entity type", "Weak entity type"], "a": 3, "e": "A weak entity type has no key attribute on its own.", "s": false, "n": 33}, {"t": "mcq", "q": "An entity type that does not have its own primary key attributes is called a:", "o": ["Strong entity type", "Subclass entity type", "Owner entity type", "Weak entity type"], "a": 3, "e": "An entity type without its own key attributes is a weak entity type.", "s": false, "n": 34}, {"t": "mcq", "q": "What defines a weak entity type?", "o": ["An entity type that has a composite key", "An entity type that does not participate in any relationships", "An entity type that does not have a key attribute of its own and depends on another entity", "An entity type that can exist without any related entities"], "a": 2, "e": "A weak entity has no key of its own and depends on another (owner) entity.", "s": false, "n": 35}, {"t": "mcq", "q": "An entity which depends on another entity for its existence is called:", "o": ["Weak entity", "TABLE operation", "Strong entity", "Primary key"], "a": 0, "e": "An entity whose existence depends on another entity is weak.", "s": false, "n": 36}, {"t": "mcq", "q": "\"A DEPENDENT entity is identified by the dependent's first name and the specific EMPLOYEE with whom the dependent is related.\" DEPENDENT is a:", "o": ["Two entities", "Weak entity type", "Strong entity type", "A relationship"], "a": 1, "e": "DEPENDENT is identified through its employee plus its first name, so it is weak.", "s": false, "n": 37}, {"t": "mcq", "q": "A(n) ______ entity must participate in an identifying relationship type with a(n) ______ entity type.", "o": ["Weak, weak", "Owner (or identifying), weak", "Strong, weak", "Weak, owner (or identifying)"], "a": 3, "e": "A weak entity must participate in an identifying relationship with an owner entity type.", "s": false, "n": 38}, {"t": "mcq", "q": "A weak entity type normally has a ______, the attribute that can uniquely identify weak entities related to the same owner entity.", "o": ["Foreign key", "Symmetric key", "Partial key", "Primary key"], "a": 2, "e": "A weak entity has a partial key that distinguishes entities of the same owner.", "s": false, "n": 39}, {"t": "mcq", "q": "Which is an example of a weak entity?", "o": ["EMPLOYEE entity with emp_id", "DEPENDENT identified by first name and the related EMPLOYEE", "DEPARTMENT with a unique name", "PROJECT with start and end dates"], "a": 1, "e": "DEPENDENT is identified by first name together with its EMPLOYEE, so it is weak.", "s": false, "n": 40}, {"t": "mcq", "q": "A weak entity is ______.", "o": ["An entity with a foreign key relationship", "An entity with no attributes", "An entity with a composite primary key", "An entity that cannot be uniquely identified by its attributes alone"], "a": 3, "e": "A weak entity cannot be uniquely identified by its own attributes alone.", "s": false, "n": "X1"}, {"t": "mcq", "q": "An entity type that does not have a key attribute on its own ______.", "o": ["should be a single entity within a defined ER diagram", "does not exist", "is called weak entity", "is called recursive"], "a": 2, "e": "An entity type without its own key is called weak.", "s": false, "n": "X2"}, {"t": "mcq", "q": "A ______ is a relationship type with the same entity type participating twice in two distinct roles.", "o": ["Ternary Relation", "Recursive Relation", "N-ary Relation", "Binary Relation"], "a": 1, "e": "The same entity type in two roles is a recursive relationship.", "s": false, "n": "X3"}, {"t": "mcq", "q": "An attribute of an entity type for which each entity must have a unique (distinct) value is ______.", "o": ["Composite attribute", "Multivalued attribute", "Simple attribute", "Key attribute"], "a": 3, "e": "A key attribute has a distinct value for every entity.", "s": false, "n": "X4"}, {"t": "mcq", "q": "An employee has an address which consists of the street name, the zip code, and the region. The Emp_Addr attribute should be:", "o": ["Multi-valued", "Key", "Composite", "Simple"], "a": 2, "e": "An address with street, zip and region is divisible, so composite.", "s": false, "n": "X5"}, {"t": "mcq", "q": "Which of the following is an example of a multivalued attribute?", "o": ["Age", "SSN", "Name", "Interests / hobbies"], "a": 3, "e": "Interests/hobbies can have several values per person, so multivalued.", "s": false, "n": "X6"}, {"t": "mcq", "q": "______ are specific objects or things in the mini-world that are represented in the database.", "o": ["Attributes", "Set of Values", "Values", "Entities"], "a": 3, "e": "Entities are specific objects or things represented in the database.", "s": false, "n": "X7"}, {"t": "mcq", "q": "A role name of the relationship MUST be written in ______.", "o": ["any relationship types", "ternary relationship only", "binary relationship only", "recursive relationship only"], "a": 3, "e": "Role names are mandatory only in recursive relationships.", "s": false, "n": "X8"}, {"t": "mcq", "q": "A ______ attribute has a single value for the attribute.", "o": ["multi-valued", "composite", "simple", "key"], "a": 2, "e": "A simple attribute has a single value.", "s": false, "n": "X9"}, {"t": "mcq", "q": "In the entity-relationship (ER) model, which of the following attributes should be used as a composite attribute (BOOK: Title, No. of pages, Publish year, Author name)?", "o": ["Title", "No. of pages", "Publish year", "Author name"], "a": 3, "e": "Author name can be split (first, last), so it is composite.", "s": false, "n": "X10"}, {"t": "mcq", "q": "A relationship of marriage within entity PERSON is called ______.", "o": ["4-ary", "recursive", "ternary", "binary"], "a": 1, "e": "Marriage links PERSON to PERSON, so it is recursive.", "s": false, "n": "X11"}, {"t": "open", "q": "In the ER model, attributes have different types. Mention and define two of them.", "a": "Simple attribute: cannot be divided into smaller parts (e.g. Age, Salary). Composite attribute: can be divided into meaningful sub-parts (e.g. Address = Street, City, ZIP).", "s": false, "n": "S1"}, {"t": "open", "q": "Explain the composite and the multi-valued attribute, and give an example of each.", "a": "Composite: made of parts, e.g. Name = (First, Middle, Last). Multi-valued: can have many values for one entity, e.g. Car colors = {Red, Black, White}, or phone numbers.", "s": false, "n": "S2"}, {"t": "open", "q": "Compare simple, composite and multi-valued attributes.", "a": "Simple (atomic): one indivisible value, e.g. Age. Composite: subparts, e.g. Address = {Street, City, ZIP}. Multi-valued: several values, e.g. PhoneNumbers = {123, 456}.", "s": false, "n": "S3"}, {"t": "open", "q": "What are the key attributes of an entity?", "a": "A key attribute is unique for each entity and identifies every entity clearly. An entity type can have one or more key attributes; if there are several they are candidate keys, and one is chosen as the primary key. A key can also be composite (made of several attributes).", "s": false, "n": "S4"}, {"t": "open", "q": "Explain weak entity types and give an example.", "a": "A weak entity type has no key attribute of its own and depends on a strong (owner) entity for its identity. It is identified by its partial key together with the owner entity, through an identifying relationship. Example: DEPENDENT (partial key: first name) is identified together with its EMPLOYEE.", "s": false, "n": "S5"}, {"t": "mcq", "q": "What is the degree of relationship R in the diagram? (R is connected to five entity types E1–E5.)", "o": ["Binary", "Ternary", "4-ary", "5-ary"], "a": 3, "e": "Degree = number of participating entity types. R connects E1, E2, E3, E4 and E5, so it is 5-ary.", "s": false, "n": "Q41", "fig": "<svg viewBox=\"0 0 460 210\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" font-size=\"12\" font-family=\"sans-serif\"><g fill=\"currentColor\" stroke=\"none\" opacity=\"0\"><\/g><polygon points=\"230,74.0 270.0,100 230,126.0 190.0,100\"/><text fill=\"currentColor\" stroke=\"none\" x=\"230\" y=\"104\" text-anchor=\"middle\" font-size=\"10\">R<\/text><rect x=\"20\" y=\"20\" width=\"60\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"50.0\" y=\"38.0\" text-anchor=\"middle\">E1<\/text><line x1=\"230\" y1=\"100\" x2=\"50\" y2=\"48\"/><rect x=\"20\" y=\"160\" width=\"60\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"50.0\" y=\"178.0\" text-anchor=\"middle\">E2<\/text><line x1=\"230\" y1=\"100\" x2=\"50\" y2=\"160\"/><rect x=\"190\" y=\"172\" width=\"60\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"220.0\" y=\"190.0\" text-anchor=\"middle\">E3<\/text><line x1=\"230\" y1=\"100\" x2=\"220\" y2=\"172\"/><rect x=\"360\" y=\"160\" width=\"60\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"390.0\" y=\"178.0\" text-anchor=\"middle\">E4<\/text><line x1=\"230\" y1=\"100\" x2=\"390\" y2=\"160\"/><rect x=\"380\" y=\"20\" width=\"60\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"410.0\" y=\"38.0\" text-anchor=\"middle\">E5<\/text><line x1=\"230\" y1=\"100\" x2=\"410\" y2=\"48\"/><\/svg>"}, {"t": "open", "q": "Bank ER diagram (shown above). a) Which entity is the weak entity set? b) What is the identifying relationship of the weak entity? c) What is the degree of the relationship ACCTS? d) Give one example of a key attribute. e) Which attribute is the partial key? f) How many entity types are there?", "a": "a) Bank_Branch. b) Branches. c) Binary. d) Code (or Ssn, Acct_no, Loan_no). e) Branch_no. f) 5 (Bank, Bank_Branch, Account, Loan, Customer).", "s": false, "n": "D1", "fig": "<svg viewBox=\"0 0 580 370\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" font-size=\"12\" font-family=\"sans-serif\"><g fill=\"currentColor\" stroke=\"none\" opacity=\"0\"><\/g><rect x=\"20\" y=\"20\" width=\"80\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"60.0\" y=\"38.0\" text-anchor=\"middle\">BANK<\/text><ellipse cx=\"35\" cy=\"78\" rx=\"18.8\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"35\" y=\"82\" text-anchor=\"middle\" font-size=\"10\">Code<\/text><line x1=\"24.2\" x2=\"45.8\" y1=\"85\" y2=\"85\"/><ellipse cx=\"85\" cy=\"100\" rx=\"18.8\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"85\" y=\"104\" text-anchor=\"middle\" font-size=\"10\">Name<\/text><ellipse cx=\"130\" cy=\"70\" rx=\"18.8\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"130\" y=\"74\" text-anchor=\"middle\" font-size 1=\"420\" y1=\"48\" x2=\"420\" y2=\"110\"/><polygon points=\"420,108.0 456.0,124 420,140.0 384.0,124\"/><text fill=\"currentColor\" stroke=\"none\" x=\"420\" y=\"128\" text-anchor=\"middle\" font-size=\"10\">LOANS<\/text><text fill=\"currentColor\" stroke=\"none\" x=\"425\" y=\"76\" font-size=\"11\" font-weight=\"700\">1<\/text><line x1=\"420\" y1=\"140\" x2=\"420\" y2=\"160\"/><text fill=\"currentColor\" stroke=\"none\" x=\"425\" y=\"156\" font-size=\"11\" font-weight=\"700\">N<\/text><rect x=\"250\" y=\"160\" width=\"100\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"300.0\" y=\"178.0\" text-anchor=\"middle\">ACCOUNT<\/text><ellipse cx=\"130\" cy=\"150\" rx=\"32\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"130\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">Acct_no<\/text><line x1=\"111.1\" x2=\"148.9\" y1=\"157\" y2=\"157\"/><ellipse cx=\"130\" cy=\"190\" rx=\"32\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"130\" y=\"194\" text-anchor=\"middle\" font-size=\"10\">Balance<\/text><line x1=\"162\" y1=\"152\" x2=\"250\" y2=\"168\"/><line x1=\"162\" y1=\"188\" x2=\"250\" y2=\"182\"/><rect x=\"370\" y=\"160\" width=\"100\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"420.0\" y=\"178.0\" text-anchor=\"middle\">LOAN<\/text><ellipse cx=\"540\" cy=\"150\" rx=\"32\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"540\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">Loan_no<\/text><line x1=\"521.1\" x2=\"558.9\" y1=\"157\" y2=\"157\"/><ellipse cx=\"540\" cy=\"190\" rx=\"32\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"540\" y=\"194\" text-anchor=\"middle\" font-size=\"10\">Amount<\/text><line x1=\"508\" y1=\"152\" x2=\"470\" y2=\"168\"/><line x1=\"508\" y1=\"188\" x2=\"470\" y2=\"182\"/><line x1=\"300\" y1=\"188\" x2=\"300\" y2=\"225\"/><text fill=\"currentColor\" stroke=\"none\" x=\"305\" y=\"208\" font-size=\"11\" font-weight=\"700\">M<\/text><polygon points=\"300,225.0 330.0,240 300,255.0 270.0,240\"/><text fill=\"currentColor\" stroke=\"none\" x=\"300\" y=\"244\" text-anchor=\"middle\" font-size=\"10\">A_C<\/text><line x1=\"300\" y1=\"255\" x2=\"320\" y2=\"285\"/><text fill=\"currentColor\" stroke=\"none\" x=\"318\" y=\"276\" font-size=\"11\" font-weight=\"700\">N<\/text><line x1=\"420\" y1=\"188\" x2=\"420\" y2=\"225\"/><text fill=\"currentColor\" stroke=\"none\" x=\"425\" y=\"208\" font-size=\"11\" font-weight=\"700\">M<\/text><polygon points=\"420,225.0 450.0,240 420,255.0 390.0,240\"/><text fill=\"currentColor\" stroke=\"none\" x=\"420\" y=\"244\" text-anchor=\"middle\" font-size=\"10\">L_C<\/text><line x1=\"420\" y1=\"255\" x2=\"370\" y2=\"285\"/><text fill=\"currentColor\" stroke=\"none\" x=\"400\" y=\"276\" font-size=\"11\" font-weight=\"700\">N<\/text><rect x=\"290\" y=\"285\" width=\"110\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"345.0\" y=\"303.0\" text-anchor=\"middle\">CUSTOMER<\/text><ellipse cx=\"330\" cy=\"345\" rx=\"15.600000000000001\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"330\" y=\"349\" text-anchor=\"middle\" font-size=\"10\">Ssn<\/text><line x1=\"321.9\" x2=\"338.1\" y1=\"352\" y2=\"352\"/><ellipse cx=\"390\" cy=\"345\" rx=\"18.8\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"390\" y=\"349\" text-anchor=\"middle\" font-size=\"10\">Name<\/text><ellipse cx=\"235\" cy=\"325\" rx=\"22.0\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"235\" y=\"329\" text-anchor=\"middle\" font-size=\"10\">Phone<\/text><ellipse cx=\"455\" cy=\"325\" rx=\"18.8\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"455\" y=\"329\" text-anchor=\"middle\" font-size=\"10\">Addr<\/text><line x1=\"330\" y1=\"313\" x2=\"330\" y2=\"334\"/><line x1=\"375\" y1=\"313\" x2=\"390\" y2=\"334\"/><line x1=\"290\" y1=\"300\" x2=\"262\" y2=\"320\"/><line x1=\"400\" y1=\"300\" x2=\"430\" y2=\"320\"/><\/svg>"}, {"t": "open", "q": "From the ER diagram of Customer and Child (shown above), list: the strong entity, the weak entity, a multivalued attribute, a composite attribute, a key attribute, and an entity with total participation.", "a": "Strong entity: Customer. Weak entity: Child. Multivalued attribute: Telephone number (double oval). Composite attribute: Postal address (Street address, City, ZIP code, Country). Key attribute: Email address (underlined). Entity with total participation: Child (double line to the identifying relationship). Partial key of Child: First name (dashed underline).", "s": false, "n": "D2", "fig": "<svg viewBox=\"0 0 600 300\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" font-size=\"12\" font-family=\"sans-serif\"><g fill=\"currentColor\" stroke=\"none\" opacity=\"0\"><\/g><rect x=\"250\" y=\"100\" width=\"90\" height=\"30\"/><text fill=\"currentColor\" stroke=\"none\" x=\"295.0\" y=\"119.0\" text-anchor=\"middle\">Customer<\/text><ellipse cx=\"90\" cy=\"14\" rx=\"62\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"90\" y=\"18\" text-anchor=\"middle\" font-size=\"10\">Given names<\/text><line x1=\"152\" y1=\"14\" x2=\"250\" y2=\"115\"/><ellipse cx=\"90\" cy=\"48\" rx=\"62\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"90\" y=\"52\" text-anchor=\"middle\" font-size=\"10\">Surname<\/text><line x1=\"152\" y1=\"48\" x2=\"250\" y2=\"115\"/><ellipse cx=\"90\" cy=\"82\" rx=\"62\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"90\" y=\"86\" text-anchor=\"middle\" font-size=\"10\">Email address<\/text><line x1=\"54.9\" x2=\"125.1\" y1=\"89\" y2=\"89\"/><line x1=\"152\" y1=\"82\" x2=\"250\" y2=\"115\"/><ellipse cx=\"90\" cy=\"116\" rx=\"62\" ry=\"11\"/><ellipse cx=\"90\" cy=\"116\" rx=\"59\" ry=\"8\"/><text fill=\"currentColor\" stroke=\"none\" x=\"90\" y=\"120\" text-anchor=\"middle\" font-size=\"10\">Telephone number<\/text><line x1=\"152\" y1=\"116\" x2=\"250\" y2=\"115\"/><ellipse cx=\"90\" cy=\"150\" rx=\"62\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"90\" y=\"154\" text-anchor=\"middle\" font-size=\"10\">Postal address<\/text><line x1=\"152\" y1=\"150\" x2=\"250\" y2=\"115\"/><ellipse cx=\"205\" cy=\"184\" rx=\"48\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"205\" y=\"188\" text-anchor=\"middle\" font-size=\"10\">Street address<\/text><line x1=\"157\" y1=\"184\" x2=\"70\" y2=\"160\"/><ellipse cx=\"205\" cy=\"214\" rx=\"48\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"205\" y=\"218\" text-anchor=\"middle\" font-size=\"10\">City<\/text><line x1=\"157\" y1=\"214\" x2=\"70\" y2=\"160\"/><ellipse cx=\"205\" cy=\"244\" rx=\"48\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"205\" y=\"248\" text-anchor=\"middle\" font-size=\"10\">ZIP code<\/text><line x1=\"157\" y1=\"244\" x2=\"70\" y2=\"160\"/><ellipse cx=\"205\" cy=\"274\" rx=\"48\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"205\" y=\"278\" text-anchor=\"middle\" font-size=\"10\">Country<\/text><line x1=\"157\" y1=\"274\" x2=\"70\" y2=\"160\"/><line x1=\"340\" y1=\"115\" x2=\"420\" y2=\"115\"/><line x1=\"420\" y1=\"115\" x2=\"420\" y2=\"160\"/><text fill=\"currentColor\" stroke=\"none\" x=\"425\" y=\"148\" font-size=\"11\" font-weight=\"700\">1<\/text><polygon points=\"420,155.0 482.0,185 420,215.0 358.0,185\"/><polygon points=\"420,163.57142857142856 464.2857142857143,185 420,206.42857142857144 375.7142857142857,185\"/><text fill=\"currentColor\" stroke=\"none\" x=\"420\" y=\"189\" text-anchor=\"middle\" font-size=\"10\">Is a child of<\/text><line x1=\"420\" y1=\"200\" x2=\"420\" y2=\"225\"/><text fill=\"currentColor\" stroke=\"none\" x=\"425\" y=\"222\" font-size=\"11\" font-weight=\"700\">M<\/text><rect x=\"380\" y=\"225\" width=\"80\" height=\"28\"/><rect x=\"384\" y=\"229\" width=\"72\" height=\"20\"/><text fill=\"currentColor\" stroke=\"none\" x=\"420.0\" y=\"243.0\" text-anchor=\"middle\">Child<\/text><ellipse cx=\"520\" cy=\"200\" rx=\"40\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"520\" y=\"204\" text-anchor=\"middle\" font-size=\"10\">First name<\/text><line x1=\"493.0\" x2=\"547.0\" y1=\"207\" y2=\"207\" stroke-dasharray=\"3 2\"/><ellipse cx=\"520\" cy=\"238\" rx=\"30\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"520\" y=\"242\" text-anchor=\"middle\" font-size=\"10\">Gender<\/text><ellipse cx=\"520\" cy=\"276\" rx=\"45\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"520\" y=\"280\" text-anchor=\"middle\" font-size=\"10\">Date of birth<\/text><line x1=\"460\" y1=\"235\" x2=\"486\" y2=\"205\"/><line x1=\"460\" y1=\"239\" x2=\"490\" y2=\"238\"/><line x1=\"440\" y1=\"253\" x2=\"490\" y2=\"272\"/><\/svg>"}], "5": [{"t": "mcq", "q": "Which term describes the constraint that specifies the maximum participation of entities in a relationship type?", "o": ["Existence dependency", "Cardinality ratio", "Aggregation", "Association"], "a": 1, "e": "The cardinality ratio specifies maximum participation.", "s": false, "n": 1}, {"t": "mcq", "q": "The cardinality ratio for a binary relationship specifies the ______ number of relationship instances that an entity can participate in.", "o": ["Maximum", "Minimum", "Optimal", "Least"], "a": 0, "e": "Cardinality ratio gives the maximum number of relationship instances an entity can take part in.", "s": false, "n": 2}, {"t": "mcq", "q": "An entity in A is associated with at most one entity in B, and an entity in B is associated with at most one entity in A. This is called:", "o": ["One to many", "Many to one", "Many to many", "One to one"], "a": 3, "e": "At most one on each side is a one-to-one relationship.", "s": false, "n": 3}, {"t": "mcq", "q": "Which is an example of a many-to-many relationship in an ER diagram?", "o": ["A customer can place many orders, but each order can only belong to one customer", "A student can enroll in many courses, and each course can have many students", "A product can have many orders, and each order can only include one product", "A department can have many employees, and each employee can only work for one department"], "a": 1, "e": "Students and courses are both many on each side, so many-to-many.", "s": false, "n": 4}, {"t": "mcq", "q": "In a hospital database, an employee can work in only one department, and each department can have multiple employees. What is the cardinality ratio of the relationship between EMPLOYEE and DEPARTMENT?", "o": ["1:200", "200:N", "M:N", "N:1"], "a": 3, "e": "Many employees work in one department, so EMPLOYEE:DEPARTMENT is N:1.", "s": false, "n": 5}, {"t": "mcq", "q": "Which of the following is NOT correct about the existence dependency constraint?", "o": ["It can be one or more, which means mandatory participation (existence-dependent)", "It specifies minimum participation", "It can be zero, which means optional participation (not existence-dependent)", "It specifies maximum participation"], "a": 3, "e": "Existence dependency specifies minimum participation (0 or ≥1), not maximum.", "s": false, "n": 6}, {"t": "mcq", "q": "Which of the following is considered a structural constraint on relationship types?", "o": ["Domain constraint", "Cardinality ratio", "Key constraint", "Referential integrity constraint"], "a": 1, "e": "Cardinality ratio and participation are the structural constraints on relationships.", "s": false, "n": 7}, {"t": "mcq", "q": "The structural constraint that specifies whether the existence of an entity depends on its being related to another entity via the relationship type is called:", "o": ["Specialization", "Cardinality ratio", "Participation constraint", "Generalization"], "a": 2, "e": "The participation constraint says whether an entity must be related to another.", "s": false, "n": 8}, {"t": "mcq", "q": "The condition for total participation of an entity in a relationship is:", "o": ["Maximum cardinality should be one", "Maximum cardinality should be M", "Minimum cardinality should be one", "Minimum cardinality should be zero"], "a": 2, "e": "Total participation means minimum cardinality of at least one.", "s": false, "n": 9}, {"t": "mcq", "q": "What type of participation constraint is represented by a single line between an entity and a relationship in an ER diagram?", "o": ["Total participation", "Partial participation", "Recursive participation", "Generalization"], "a": 1, "e": "A single line means partial participation; a double line means total.", "s": false, "n": 10}, {"t": "mcq", "q": "Which (min, max) notation specifies that \"each instructor is a member of exactly one department, but a department can have any number of instructors\"?", "o": ["(1,1) for INSTRUCTOR in MEMBER_OF and (0,n) for DEPARTMENT in MEMBER_OF", "(n,1) for INSTRUCTOR in MEMBER_OF and (0,1) for DEPARTMENT in MEMBER_OF", "(0,1) for DEPARTMENT in MEMBER_OF and (0,n) for INSTRUCTOR in MEMBER_OF", "(1,0) for DEPARTMENT in MEMBER_OF and (0,1) for INSTRUCTOR in MEMBER_OF"], "a": 0, "e": "Instructor is in exactly one department: (1,1). A department has any number of instructors: (0,n).", "s": false, "n": 11}, {"t": "mcq", "q": "In a UML class diagram, each class has three sections. The second section includes:", "o": ["Class operations", "Constraints", "Attributes", "Entity type (class) name"], "a": 2, "e": "The second UML section holds the attributes.", "s": false, "n": 12}, {"t": "mcq", "q": "How is an entity type represented in a UML class diagram?", "o": ["Single-line text", "Oval", "Diamond", "Rectangle with three sections"], "a": 3, "e": "A UML class is a rectangle with three sections: name, attributes, operations.", "s": false, "n": 13}, {"t": "mcq", "q": "In UML class diagrams, the aggregation relationship between an object and its parts is displayed as a line with a small ______:", "o": ["Square at the object end", "Triangle at the object end", "Diamond at the object end", "Circle at the object end"], "a": 2, "e": "Aggregation is drawn with a small diamond at the whole object's end.", "s": false, "n": 14}, {"t": "mcq", "q": "______ is an abstraction concept for building composite objects from their component objects.", "o": ["Association", "Specialization", "Generalization", "Aggregation"], "a": 3, "e": "Aggregation builds composite objects from component objects.", "s": false, "n": 15}, {"t": "mcq", "q": "What is the purpose of the Extended Entity-Relationship (EER) model?", "o": ["To represent higher-degree relationships in ER diagrams", "To enhance the ER model with additional constructs to represent more complex applications", "To display database schemas using UML class diagrams", "To specify classes and their relationships in object-oriented software design"], "a": 1, "e": "EER extends ER with extra constructs for more complex applications.", "s": false, "n": 16}, {"t": "mcq", "q": "A superclass or subclass represents a collection of entities of the ______ type, which is why superclasses and subclasses are all shown in rectangles in EER diagrams.", "o": ["Different", "Same", "Diverse", "General"], "a": 1, "e": "A subclass and superclass are collections of entities of the same type, so both are drawn as rectangles.", "s": false, "n": 17}, {"t": "mcq", "q": "Specialization is the process of classifying a class of objects into more specialized ______.", "o": ["Polymorphism", "Class", "Superclass", "Subclass"], "a": 3, "e": "Specialization classifies a class into more specialized subclasses.", "s": false, "n": 18}, {"t": "mcq", "q": "Specialization is the process of defining a set of subclasses of an entity type; this entity type is called the ______ of the specialization.", "o": ["Superclass", "Class", "Polymorphism", "Subclass"], "a": 0, "e": "The entity type that is specialized is the superclass.", "s": false, "n": 19}, {"t": "mcq", "q": "We may have ______ specializations of the same entity type based on different distinguishing characteristics.", "o": ["Only one", "Several", "Same", "Only two"], "a": 1, "e": "An entity type can have several specializations based on different characteristics.", "s": false, "n": 20}, {"t": "mcq", "q": "The set of ______ that forms a specialization is defined on the basis of some distinguishing characteristic of the entities in the superclass.", "o": ["Superclass", "Subclass", "Class", "Polymorphism"], "a": 1, "e": "The subclasses form the specialization.", "s": false, "n": 21}, {"t": "mcq", "q": "The entity set person is classified as student and employee. This process is called:", "o": ["Inheritance", "Specialization", "Generalization", "Constraint generalization"], "a": 1, "e": "Splitting PERSON into STUDENT and EMPLOYEE is specialization (superclass to subclasses).", "s": false, "n": 22}, {"t": "mcq", "q": "What is the process of specialization in the context of database systems?", "o": ["Creating a new table to store duplicate data", "Removing unnecessary columns from a table", "Creating new tables with specific attributes inherited from a parent table", "Combining multiple tables into a single table"], "a": 2, "e": "Specialization defines subclasses with specific attributes while inheriting from the superclass.", "s": false, "n": 23}, {"t": "mcq", "q": "The term ______ is used to refer to the process of defining a generalized entity type from the given entity types.", "o": ["Generalization", "Specialization", "Polymorphism", "Encapsulation"], "a": 0, "e": "Generalization defines a generalized entity type from given types.", "s": false, "n": 24}, {"t": "mcq", "q": "The term generalization is used to refer to the process of defining a generalized ______ type from the given ______ types.", "o": ["Class", "Entity", "Superclass", "Subclass"], "a": 1, "e": "Generalization defines a general entity type from several entity types.", "s": false, "n": 25}, {"t": "mcq", "q": "A reverse process of abstraction in which we suppress the differences among several entity types, identify their common features, and generalize them into a single superclass is called:", "o": ["Subclass", "Superclass", "Class", "Generalization"], "a": 3, "e": "Generalization is the reverse of specialization: it merges common features into a superclass.", "s": false, "n": 26}, {"t": "mcq", "q": "The specialization process can be viewed as being functionally the inverse of the ______ process.", "o": ["Generalization", "Specialization", "Polymorphism", "Encapsulation"], "a": 0, "e": "Specialization is the inverse of generalization.", "s": false, "n": 27}, {"t": "mcq", "q": "In a diagram, an arrow pointing to the generalized ______ represents a generalization process, while arrows pointing to the specialized subclasses represent a specialization process.", "o": ["Subclass", "Superclass", "Class", "Generalization"], "a": 1, "e": "An arrow toward the superclass shows generalization; arrows toward subclasses show specialization.", "s": false, "n": 28}, {"t": "mcq", "q": "The subclasses that define a specialization are attached by lines to a circle that represents the specialization, which is connected in turn to the ______.", "o": ["Subclass", "Superclass", "Class", "Polymorphism"], "a": 1, "e": "Subclasses attach to a circle that connects to the superclass.", "s": false, "n": 29}, {"t": "mcq", "q": "An entity that is a member of a subclass ______ all the attributes of the entity as a member of the superclass.", "o": ["Polymorphic", "Abstract", "Inherits", "Encapsulates"], "a": 2, "e": "A subclass member inherits all attributes of the superclass.", "s": false, "n": 30}, {"t": "mcq", "q": "Which of the following is a correct relationship between an object and its parts; displayed as lines with a small diamond at the object end?", "o": ["Dependency", "Association", "Aggregation", "Generalization"], "a": 2, "e": "Aggregation is object-to-parts with a small diamond at the object end.", "s": false, "n": "X1"}, {"t": "mcq", "q": "What is the best description of an aggregation relationship?", "o": ["Relationship between two independent objects; displayed as lines.", "Relationship between two independent objects; displayed as diamond with a small line at the object end.", "Relationship between object and its parts; displayed as lines with a small diamond at the object end.", "Relationship between two independent objects; displayed as diamond."], "a": 2, "e": "Aggregation links an object to its parts, drawn with a small diamond at the object end.", "s": false, "n": "X2"}, {"t": "mcq", "q": "In a UML class diagram, the class has three sections; the second section includes ______.", "o": ["entity name", "class operations", "constraints", "attributes"], "a": 3, "e": "The second section of a UML class lists its attributes.", "s": false, "n": "X3"}, {"t": "open", "q": "Explain the two main structural constraints on binary relationships in detail, including how they are specified in the ER diagram.", "a": "Two main constraints on binary relationships: Cardinality ratio (specifies maximum participation): one-to-one (1:1), one-to-many (1:N) or many-to-one (N:1), many-to-many (M:N). It is shown by writing 1, M or N on the relationship lines in the ER diagram. Existence dependency constraint (specifies minimum participation, also called participation constraint): zero means optional participation (not existence-dependent); one or more means mandatory participation (existence-dependent). It is shown by a double line for total participation and a single line for partial participation. Some notations specify both together using (min, max) constraints.", "s": false, "n": "S1"}, {"t": "open", "q": "Explain the EER concepts of specialization and generalization. For each, provide an illustrative example.", "a": "Specialization: the process of defining a set of subclasses of a superclass, based on some distinguishing characteristic of the entities in the superclass. Example: {SECRETARY, ENGINEER, TECHNICIAN} is a specialization of EMPLOYEE based on job type. Generalization: the reverse of specialization. Several classes with common features are generalized into a superclass, and the original classes become its subclasses. Example: CAR and TRUCK are generalized into VEHICLE because they have several common attributes. Notes Only Q31 has an image (it is shown in the question as Question 5 of the exam file; I do not have its page number in the compilations). The module's own diagrams are in the slides: Fig. 7.15 COMPANY ER schema with (min, max) notation (slide 9), UML class diagram of COMPANY (slide 14), and EER Fig. 8.1 with the \"d\" circles (slides 31 and 39, the figure Q31 is based on), generalization Fig. 8.3 (slide 41). Questions about the constraints on specialization (disjoint/overlapping, total/partial, attribute- defined/user-defined), shared subclasses, lattices and categories are not explained in this module's slides (the \"d\" symbol only appears in the figures), so I left them out. They are probably part of the next EER module. Answers to Q10 and Q29 are my own reading, since the compilation text for those questions is partly garbled.", "s": false, "n": "S2"}, {"t": "mcq", "q": "In the figure (an EER diagram of EMPLOYEE with a disjoint specialization by Job_type), an employee ______.", "o": ["Can be only technician", "Can be a secretary and technician", "Can be only an engineer", "Cannot be secretary and engineer at the same time"], "a": 3, "e": "The circle is \"d\" = disjoint, so an employee belongs to at most one of the subclasses (secretary, technician, engineer).", "s": false, "n": "Q31", "fig": "<svg viewBox=\"0 0 500 270\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" font-size=\"12\" font-family=\"sans-serif\"><g fill=\"currentColor\" stroke=\"none\" opacity=\"0\"><\/g><rect x=\"200\" y=\"70\" width=\"100\" height=\"30\"/><text fill=\"currentColor\" stroke=\"none\" x=\"250.0\" y=\"89.0\" text-anchor=\"middle\">EMPLOYEE<\/text><ellipse cx=\"40\" cy=\"20\" rx=\"26\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"40\" y=\"24\" text-anchor=\"middle\" font-size=\"10\">Name<\/text><ellipse cx=\"40\" cy=\"48\" rx=\"22\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"40\" y=\"52\" text-anchor=\"middle\" font-size=\"10\">Ssn<\/text><ellipse cx=\"125\" cy=\"20\" rx=\"38\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"125\" y=\"24\" text-anchor=\"middle\" font-size=\"10\">Birth_date<\/text><ellipse cx=\"200\" cy=\"20\" rx=\"30\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"200\" y=\"24\" text-anchor=\"middle\" font-size=\"10\">Address<\/text><ellipse cx=\"280\" cy=\"20\" rx=\"32\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"280\" y=\"24\" text-anchor=\"middle\" font-size=\"10\">Job_type<\/text><line x1=\"66\" y1=\"22\" x2=\"200\" y2=\"72\"/><line x1=\"62\" y1=\"48\" x2=\"200\" y2=\"78\"/><line x1=\"140\" y1=\"30\" x2=\"230\" y2=\"70\"/><line x1=\"215\" y1=\"30\" x2=\"240\" y2=\"70\"/><line x1=\"280\" y1=\"31\" x2=\"270\" y2=\"70\"/><line x1=\"250\" y1=\"100\" x2=\"250\" y2=\"128\"/><circle cx=\"250\" cy=\"138\" r=\"10\"/><text fill=\"currentColor\" stroke=\"none\" x=\"250\" y=\"142\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">d<\/text><text fill=\"currentColor\" stroke=\"none\" x=\"262\" y=\"122\" font-size=\"11\" font-weight=\"700\">Job_type<\/text><line x1=\"250\" y1=\"148\" x2=\"100\" y2=\"190\"/><rect x=\"50\" y=\"190\" width=\"100\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"100.0\" y=\"208.0\" text-anchor=\"middle\">SECRETARY<\/text><ellipse cx=\"85\" cy=\"250\" rx=\"38\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"85\" y=\"254\" text-anchor=\"middle\" font-size=\"10\">Typing_speed<\/text><line x1=\"100\" y1=\"218\" x2=\"85\" y2=\"239\"/><line x1=\"250\" y1=\"148\" x2=\"250\" y2=\"190\"/><rect x=\"200\" y=\"190\" width=\"100\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"250.0\" y=\"208.0\" text-anchor=\"middle\">TECHNICIAN<\/text><ellipse cx=\"250\" cy=\"250\" rx=\"38\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"250\" y=\"254\" text-anchor=\"middle\" font-size=\"10\">Tgrade<\/text><line x1=\"250\" y1=\"218\" x2=\"250\" y2=\"239\"/><line x1=\"250\" y1=\"148\" x2=\"400\" y2=\"190\"/><rect x=\"350\" y=\"190\" width=\"100\" height=\"28\"/><text fill=\"currentColor\" stroke=\"none\" x=\"400.0\" y=\"208.0\" text-anchor=\"middle\">ENGINEER<\/text><ellipse cx=\"400\" cy=\"250\" rx=\"38\" ry=\"11\"/><text fill=\"currentColor\" stroke=\"none\" x=\"400\" y=\"254\" text-anchor=\"middle\" font-size=\"10\">Eng_type<\/text><line x1=\"400\" y1=\"218\" x2=\"400\" y2=\"239\"/><\/svg>"}]}, "summary": {"1": {"book": "Elmasri ch. 1 · Databases and Database Users", "pts": ["Database — collection of related data about a mini-world; DBMS — software to define, construct, manipulate and share it; database system = database + DBMS + applications.", "Meta-data — the description of the database structure, stored in the catalog; it makes the database self-describing.", "Program-data independence — change data structure without changing programs; data abstraction hides storage details.", "Multiple views and sharing — different users see different parts; concurrency control keeps multiuser transactions correct.", "Database users — DBA (security, efficiency, privileges), designers (structure, constraints, transactions), end users (casual, parametric/naive, sophisticated, standalone).", "Advantages — control redundancy, restrict unauthorized access, persistent storage, efficient queries (indexes), backup/recovery, enforce integrity constraints and standards, faster application development.", "File-based problems — redundancy, inconsistency, isolation of data, hard access.", "When NOT to use a DBMS — simple, stable applications; high overhead costs not justified; hard real-time needs; no multiuser access needed.", "Data model history — hierarchical (tree) → network (graph) → relational (today's standard) → object-oriented / XML / NoSQL."]}, "2": {"book": "Elmasri ch. 2 · Database System Concepts and Architecture", "pts": ["Data model — concepts that describe database structure and operations: conceptual (high-level, e.g. ER), representational/implementation (e.g. relational), physical (low-level, how data is stored).", "Schema vs state — schema is the description (changes rarely); state/instance/snapshot is the actual data at one moment (changes constantly). Valid state satisfies all constraints.", "Three-schema architecture — internal (physical storage, access paths), conceptual (whole database for a community of users), external (views for user groups).", "Logical data independence — change the conceptual schema without changing external schemas. Physical data independence — change the internal schema without changing the conceptual one.", "Languages — DDL defines schemas, SDL storage, VDL views, DML retrieves/inserts/deletes/modifies data.", "Interfaces — menus, forms, GUI, natural language, keyword search, parametric (for naive users), DBA interfaces.", "Utilities — loading, backup, file reorganization, performance monitoring; the catalog/data dictionary stores the meta-data.", "Architectures — centralized, 2-tier client/server, 3-tier (client → application/web server → database server).", "Classification — by data model, number of users, number of sites (centralized/distributed; homogeneous/heterogeneous), cost, purpose."]}, "3": {"book": "Elmasri ch. 5 · The Relational Data Model and Constraints", "pts": ["Terms — relation = table, tuple = row, attribute = column, domain = set of atomic (indivisible) values.", "Relation schema R(A1…An); degree = number of attributes; cardinality = number of tuples; relation state = set of tuples now.", "Characteristics — tuples are a set (order does not matter), values are atomic, NULL means unknown / not applicable.", "Superkey — attributes that uniquely identify a tuple. Key — minimal superkey. Several keys = candidate keys; the chosen one is the primary key.", "Foreign key — attribute(s) referring to the primary key of another relation; links tables.", "Domain constraint — values must be in the attribute's domain. Key constraint — key values are unique. Entity integrity — primary key cannot be NULL. Referential integrity — a foreign key is NULL or matches an existing primary key.", "INSERT can violate domain, key, entity and referential integrity.", "DELETE can violate only referential integrity — actions: RESTRICT (reject), CASCADE (delete referencing tuples), SET NULL (if FK allows NULL).", "UPDATE — changing an ordinary attribute can violate domain/NOT NULL; changing a PK or FK can violate key, entity or referential integrity."]}, "4": {"book": "Elmasri ch. 3 · Data Modeling Using the ER Model", "pts": ["ER model — high-level conceptual data model built from entities, attributes and relationships.", "Entity — a thing in the mini-world; entity type — entities with the same attributes (rectangle).", "Attributes — simple (atomic), composite (sub-parts, e.g. Address), multivalued (several values, double oval), derived (dashed oval), stored.", "Key attribute — unique for each entity, underlined.", "Relationship — association between entities (diamond); degree = number of participating entity types (binary, ternary…).", "Role names — the function an entity plays; required for recursive relationships (same entity type in two roles).", "Weak entity — no key of its own; depends on an owner (identifying) entity through an identifying relationship (double diamond); identified by owner key + partial key (dashed underline); double rectangle.", "Strong entity — has its own key attribute."]}, "5": {"book": "Elmasri ch. 3 (cont.) & 4 · Structural constraints, UML and EER", "pts": ["Cardinality ratio — maximum participation: 1:1, 1:N, N:1, M:N.", "Participation (existence dependency) — minimum participation: total/mandatory (double line, min ≥ 1) or partial/optional (single line, min = 0).", "(min, max) notation — specifies both together, e.g. (1,1) = exactly one, (0,n) = any number.", "Relationships can have attributes; higher-degree (ternary) relationships connect three or more entity types.", "UML class diagram — class box with three sections: name, attributes, operations. Aggregation = object and its parts (small diamond at the object end).", "EER — extends ER with subclasses and superclasses; subclass entities inherit all attributes of the superclass.", "Specialization — top-down: define subclasses of an entity type by a distinguishing characteristic (e.g. EMPLOYEE → SECRETARY, TECHNICIAN, ENGINEER).", "Generalization — bottom-up, the reverse: generalize common features of several types into one superclass (CAR, TRUCK → VEHICLE).", "In EER diagrams the circle with \"d\" means disjoint — an entity belongs to at most one subclass."]}}}, "CS351": {"name": "Operating Systems", "chapters": {"1": [{"t": "mcq", "q": "Which is NOT a primary goal of an operating system?", "o": ["Execute user programs and make solving user problems easier", "Make the computer system convenient to use", "Use hardware efficiently", "Maximize the cost of using the computer system "], "a": 3, "e": "An OS aims to make the computer convenient and to use hardware efficiently, never to maximize cost.", "s": true, "n": 1}, {"t": "mcq", "q": "In what way is an operating system like a government?", "o": ["It seldom functions correctly", "It creates an environment within which other programs can do useful work", "It performs most useful functions by itself", "It is always concerned primarily with the individual's needs "], "a": 1, "e": "Like a government, the OS does no useful work by itself; it provides the environment in which other programs can do useful work.", "s": false, "n": 2}, {"t": "mcq", "q": "What is the primary role of an operating system?", "o": ["To provide a platform for playing video games only", "To compile high-level programming languages", "To manufacture computer hardware components", "To act as an intermediary between the user and the computer hardware "], "a": 3, "e": "The OS sits between the user (and applications) and the hardware and manages the hardware for them.", "s": false, "n": 3}, {"t": "mcq", "q": "Program that acts as an intermediary between a user and the computer hardware:", "o": ["Device drivers", "Ports", "Operating System", "Device controller "], "a": 2, "e": "By definition the operating system is the intermediary between user and hardware.", "s": false, "n": 4}, {"t": "mcq", "q": "______ is used to allow users to interact with computers.", "o": ["Program", "Database ", "Compiler", "Operating System "], "a": 3, "e": "The operating system provides the interface through which users interact with the computer.", "s": false, "n": 5}, {"t": "mcq", "q": "______ operating systems are designed primarily to maximize resource utilization.", "o": ["PC", "Handheld computer", "Mainframe", "Network "], "a": 2, "e": "Mainframe OSs focus on maximizing resource utilization, while PCs focus on user convenience and mobile OSs on battery and usability.", "s": false, "n": 6}, {"t": "mcq", "q": "The one program that runs at all times on the computer is part of the operating system and is known as:", "o": ["System Program", "Application Program", "Device Driver", "Kernel "], "a": 3, "e": "The kernel is the one program running at all times; everything else is a system or application program.", "s": false, "n": 7}, {"t": "mcq", "q": "A set of software frameworks that provides additional services to application developers is:", "o": ["Middleware", "System software", "Application program", "Firmware "], "a": 0, "e": "Middleware is a set of software frameworks that give extra services to application developers (e.g. databases, multimedia).", "s": true, "n": 8}, {"t": "mcq", "q": "The operating system kernel consists of all system and application programs in a computer.", "o": ["True", "False"], "a": 1, "e": "the kernel is the one program always running; system and application programs are separate.", "s": false, "n":
