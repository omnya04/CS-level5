<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS Level 5 · Study Hub</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--ink:#1d2160;--mut:#656a9a;--line:#d9dcf0;--acc:#4a52d6;--acc2:#7a5af8;--ok:#1f9d63;--okb:#e3f6ec;--no:#d64545;--nob:#fde8e8;--warn:#b7791f;--warnb:#fff4d6;--sh:0 6px 20px rgba(40,44,120,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1028;--card:#181b44;--ink:#e8eaff;--mut:#9aa0d6;--line:#32377a;--acc:#8b93ff;--acc2:#b39dff;--ok:#4cd68f;--okb:#12382a;--no:#ff7b7b;--nob:#3d1a24;--warn:#ffcf66;--warnb:#3b3115;--sh:0 6px 20px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0e1028;--card:#181b44;--ink:#e8eaff;--mut:#9aa0d6;--line:#32377a;--acc:#8b93ff;--acc2:#b39dff;--ok:#4cd68f;--okb:#12382a;--no:#ff7b7b;--nob:#3d1a24;--warn:#ffcf66;--warnb:#3b3115;--sh:0 6px 20px rgba(0,0,0,.35)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
main{max-width:780px;margin:0 auto;padding:16px 16px 70px}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:22px;padding:26px 22px;margin-bottom:20px;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0 0;opacity:.9}
.sub{color:var(--mut);margin:0 0 16px}
.bar0{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:8px 0 6px}
.top{display:flex;align-items:center;gap:10px}
.top .t{flex:1;font-weight:800;font-size:17px;min-width:0}.top .t small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.back{background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
.score{font-weight:800;font-size:18px;color:var(--acc);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 12px}
.bar{height:6px;background:var(--line);border-radius:4px;margin:8px 0 6px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px 12px;text-align:center;font-weight:800;font-size:20px;cursor:pointer;color:var(--ink);font-family:inherit;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.box:hover{transform:translateY(-2px);border-color:var(--acc)}
.box small{display:block;font-weight:500;color:var(--mut);font-size:12.5px;margin-top:4px;line-height:1.35}
.box .ic{font-size:26px;display:block;margin-bottom:4px}
.box.dis{opacity:.5;cursor:default;box-shadow:none}.box.dis:hover{transform:none;border-color:var(--line)}
.box.all{border-color:var(--acc);color:var(--acc)}
.tabs{display:flex;gap:8px;margin:4px 0 14px;background:var(--card);padding:5px;border-radius:16px;border:1.5px solid var(--line)}
.tab{flex:1;padding:10px 4px;border:0;border-radius:12px;background:none;color:var(--mut);font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin:0 0 16px;box-shadow:var(--sh)}
.q .n{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:12.5px;margin-bottom:6px;font-weight:700}
.tag{border-radius:8px;padding:1px 8px;background:var(--bg);border:1px solid var(--line)}.tag.w{background:var(--warnb);color:var(--warn);border-color:var(--warn)}
.q .tx{font-weight:650;margin-bottom:12px}
.fig{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px;margin:0 0 12px;overflow-x:auto;color:var(--ink)}.fig svg{display:block;width:100%;min-width:340px;max-width:620px;margin:auto;height:auto}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:1.5px solid var(--line);border-radius:14px;padding:11px;margin:7px 0;color:var(--ink);font:inherit;cursor:pointer}
.opt i{flex:none;width:20px;height:20px;border:2px solid var(--mut);border-radius:50%;margin-top:2px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok i{background:var(--ok);border-color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no)}.opt.no i{background:var(--no);border-color:var(--no)}
.exp{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14.5px}
.exp.ai{border-color:var(--acc)}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:14px;padding:13px;font-size:16.5px;font-weight:800;cursor:pointer;margin:12px 0;font-family:inherit}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.btn.sm{padding:9px;font-size:14.5px;margin:8px 0 0}
textarea{width:100%;min-height:90px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:vertical}
.model{margin-top:10px;padding:12px;border-radius:12px;background:var(--okb);border:1.5px solid var(--ok);white-space:pre-wrap}
.fc{min-height:240px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:19px;font-weight:650;background:var(--card);border:2px solid var(--line);border-radius:22px;cursor:pointer;margin:12px 0;box-shadow:var(--sh)}
.fc.back{color:var(--ok);font-weight:500;font-size:17px;border-color:var(--ok)}
.row{display:flex;gap:10px}.row .btn{margin:6px 0}
.res{text-align:center;padding:18px;background:var(--card);border-radius:20px;border:1.5px solid var(--line);margin-bottom:16px}.res b{font-size:46px;color:var(--acc)}
.soon{text-align:center;padding:50px 16px;background:var(--card);border:2px dashed var(--line);border-radius:22px}.soon b{font-size:26px}
</style></head><body><main id="app"></main>
<script>
const D={"CS353": {"name": "Design & Analysis of Algorithms", "chapters": {"1": [{"t": "mcq", "q": "Which of the following is NOT one of the characteristics of an algorithm?", "o": ["Definiteness", "Head Section", "Finiteness", "Efficiency"], "a": 1, "e": "Head section is a part of how an algorithm is written, not a property. The characteristics are definiteness, finiteness, effectiveness/efficiency, input and output.", "s": false, "n": "1"}, {"t": "mcq", "q": "Which of the following is NOT part of the head section of an algorithm?", "o": ["Keyword Algorithm and Name", "Problem Description", "Input and Output", "If, for, while and statements like assignments"], "a": 3, "e": "The head section holds the name, problem description, input and output. Statements like if, for, while and assignments belong to the body section.", "s": false, "n": "2"}, {"t": "mcq", "q": "It is very simple and easy to specify an algorithm using:", "o": ["Pseudocode", "Artificial Intelligence", "Flowchart", "Natural Language"], "a": 3, "e": "Natural language is the easiest way to specify an algorithm (just write the steps in plain words), though it can be ambiguous. Pseudocode and flowcharts need more structure; AI is not a specification method.", "s": false, "n": "3"}, {"t": "mcq", "q": "Which of the following is NOT one of the methods to specify an algorithm?", "o": ["Pseudocode", "Natural Language", "Flowchart", "Binary Code"], "a": 3, "e": "The ways to specify an algorithm are natural language, pseudocode and flowchart. Binary code is machine language, not an algorithm specification method.", "s": false, "n": "4"}, {"t": "mcq", "q": "Input and Output can be done using:", "o": ["read", "combine", "read and write", "write"], "a": 2, "e": "Input is done with read and output with write, so input and output together need read and write.", "s": false, "n": "5"}, {"t": "mcq", "q": "Correct algorithm is not one that works most of the time, but one that works:", "o": ["easily", "quickly", "correctly for all inputs", "slowly"], "a": 2, "e": "A correct algorithm must give the right output for every legal input, not just most of them. Speed is a separate property (efficiency).", "s": false, "n": "6"}, {"t": "mcq", "q": "Common technique for proving correctness of an algorithm is:", "o": ["approximation algorithms", "paper and pencil", "correct algorithm", "mathematical induction"], "a": 3, "e": "Correctness is usually proved by mathematical induction. Paper and pencil is not a proof technique, and approximation algorithms are a different topic.", "s": false, "n": "7"}, {"t": "mcq", "q": "Which of the following is NOT among the ways to express algorithm specifications?", "o": ["Natural language", "Pseudocode", "Drawing use cases", "Flowchart"], "a": 2, "e": "Natural language, pseudocode and flowcharts specify algorithms. Use-case drawings describe system requirements, not algorithm steps.", "s": false, "n": "8"}, {"t": "mcq", "q": "The best definition of Pseudocode is:", "o": ["Complete program written in programming language such as Python or C++", "A mixture of a natural language and programming language constructs", "Using everyday spoken or written human language to describe algorithm steps", "A graphical representation using connected geometric shapes"], "a": 1, "e": "Pseudocode mixes natural language with programming-language constructs. It is not a complete program, plain everyday language only, or a graphical diagram (that is a flowchart).", "s": false, "n": "9"}, {"t": "mcq", "q": "Which of the following statements is true?", "o": ["An algorithm should have one or more inputs and produce one or more outputs.", "An algorithm may or may not terminate after a finite number of steps", "To analyze an algorithm means to determine the number of resources to execute it", "Procedure, function and subroutine are synonyms for an algorithm"], "a": 0, "e": "An algorithm must have one or more inputs and produce output. It must terminate (finiteness), so \"may not terminate\" is false. Analysis means finding time and space efficiency, and procedure, function and subroutine are not exactly synonyms.", "s": false, "n": "10"}, {"t": "mcq", "q": "An ________ is defined as a set of well-defined instructions used to accomplish a task.", "o": ["Function", "Program", "Procedure", "Algorithm"], "a": 3, "e": "An algorithm is a set of well-defined instructions that accomplishes a task. A program is just one implementation of it.", "s": false, "n": "11"}, {"t": "mcq", "q": "Input size measure for searching for a key in a list of n items is:", "o": ["Number of vertices and/or edges", "Matrix dimensions or total number of elements", "Number of digits (in binary representation)", "Number of the items in the list"], "a": 3, "e": "For searching a list, input size is the number of items n. Digit counts are used for numbers (e.g. gcd), and vertices/edges for graphs.", "s": false, "n": "12"}, {"t": "mcq", "q": "Sequential search best-case running time Cbest(n) = 1 means:", "o": ["The element is in the middle of the list", "The element is the last element of the list", "The element is the first element of the list", "The element is not found in the list"], "a": 2, "e": "Best case for sequential search is finding the key at the first position, so only 1 comparison is needed.", "s": false, "n": "13"}, {"t": "mcq", "q": "Sequential search worst-case Cworst(n) = n means:", "o": ["The element is in the middle of the list", "The element is either in the last position or there is no match", "The element is the last element of the list", "The element is not found in the list"], "a": 1, "e": "Worst case needs n comparisons: the key is in the last position or not in the list at all.", "s": false, "n": "14"}, {"t": "mcq", "q": "Time efficiency indicates:", "o": ["How large memory does an algorithm need", "The amount of memory units required by the algorithm", "How simplicity of an algorithm is", "How fast an algorithm runs"], "a": 3, "e": "Time efficiency measures how fast the algorithm runs. Memory usage is space efficiency.", "s": false, "n": "15"}, {"t": "open", "q": "Explain the two kinds of algorithm efficiency.", "a": "1. Time Efficiency (Time Complexity): Indicates how fast the algorithm runs. Measured by counting\nthe number of times the algorithm's basic operation is executed. Example: for sequential search the\nbasic operation is the key comparison.\n2. Space Efficiency (Space Complexity): Indicates how much extra memory the algorithm uses\nbeyond what is needed for input and output. Measured by counting the number of extra memory\nunits consumed.", "s": false, "n": "E1"}], "2": [{"t": "mcq", "q": "Big-Theta notation Θ is:", "o": ["Asymptotic tight bound – useful for average case analysis", "Asymptotic lower bound – useful for best case analysis", "Asymptotic lower bound – useful for worst case analysis", "Asymptotic upper bound – useful for worst case analysis"], "a": 0, "e": "Θ is the tight bound (both upper and lower), so it describes the exact order of growth. O is the upper bound and Ω the lower bound.", "s": false, "n": "16"}, {"t": "mcq", "q": "The measure of the longest amount of time possibly taken to complete an algorithm is expressed as:", "o": ["Little-O", "Little-Omega", "Big-Omega", "Big-O"], "a": 3, "e": "Big-O gives an upper bound: the longest time an algorithm can take, i.e. the worst case.", "s": false, "n": "17"}, {"t": "mcq", "q": "The _____ bounds the running time from above, guaranteeing it will not exceed this time for any input of size n:", "o": ["average-case analysis", "best-case analysis", "mathematical analysis", "worst-case analysis"], "a": 3, "e": "Worst-case analysis gives an upper limit that no input of size n can exceed.", "s": false, "n": "18"}, {"t": "mcq", "q": "The _____ is performed by running a program on a sample of inputs and analyzing the observed data:", "o": ["Mathematical analysis", "Asymptotic analysis", "Empirical analysis", "Theoretical analysis"], "a": 2, "e": "Empirical analysis means running the program on sample inputs and studying the measured results. Mathematical analysis uses formulas without running.", "s": false, "n": "19"}, {"t": "mcq", "q": "For analyzing an algorithm, which is the worst computing time using Big-O?", "o": ["O(n log n)", "O(n²)", "O(n!)", "O(2ⁿ)"], "a": 2, "e": "Order of growth: log n < n < n log n < n² < 2ⁿ < n!. Factorial grows fastest, so O(n!) is the worst.", "s": false, "n": "20"}, {"t": "mcq", "q": "Time complexity of: f(n) = (n² + 1)(5n⁴ + n² + 2n)", "o": ["O(n⁴)", "O(n⁵)", "O(n⁶)", "O(log n)"], "a": 2, "e": "Multiply the highest terms: n² · 5n⁴ = 5n⁶. Constants are dropped, so the complexity is O(n⁶).", "s": false, "n": "21"}, {"t": "mcq", "q": "Which operation has the greatest impact on time complexity?", "o": ["Single line operations", "Loop (repetition) operations", "If-statement operations", "Comment-line operations"], "a": 1, "e": "Loops run their body many times, so they dominate running time. Single lines run once and comments do not run.", "s": false, "n": "22"}, {"t": "mcq", "q": "Which is NOT a reason to perform empirical analysis?", "o": ["To check the accuracy of the algorithm", "To reduce the use of mathematical analysis and algorithm visualization", "To compare the efficiencies of different algorithms", "To develop the algorithm's efficiency class"], "a": 1, "e": "Empirical analysis does not replace mathematical analysis; it complements it. It is used to check accuracy, compare algorithms and find efficiency classes.", "s": false, "n": "23"}, {"t": "open", "q": "Which assertions are true? n ∈ O(n²), 100n+5 ∈ O(n²), n⁴+n+1 ∈ O(n²)", "a": "First two are TRUE (lower-order polynomials are bounded by n²). The last is FALSE —\nn⁴+n+1 is 4th degree, higher order than n².", "s": false, "n": "24"}, {"t": "open", "q": "Explain the three asymptotic notations: Big-O, Big-Omega, and Big-Theta.", "a": "1. Big-O O(g(n)) — Asymptotic UPPER bound. Used for WORST-case. t(n) grows no faster than\ng(n). Example: O(n²) means at most n² operations.\n2. Big-Omega Ω(g(n)) — Asymptotic LOWER bound. Used for BEST-case. t(n) grows at least as\nfast as g(n). Example: Ω(n) means at least n operations.\n3. Big-Theta Θ(g(n)) — Asymptotic TIGHT bound. Used for AVERAGE-case. t(n) grows at exactly\nthe same rate as g(n). Example: Θ(nlogn) means exactly nlogn rate.", "s": false, "n": "E2"}], "3": [{"t": "mcq", "q": "A straightforward approach for solving a problem is:", "o": ["Backtracking", "Divide-and-conquer", "Greedy technique", "Brute force"], "a": 3, "e": "Brute force solves the problem directly from the problem statement without any optimization.", "s": false, "n": "25"}, {"t": "mcq", "q": "________ generates each and every element of the problem domain, selects those satisfying all constraints, then finds the desired element.", "o": ["Brute force", "Binary search", "Selection sort", "Exhaustive search"], "a": 3, "e": "Exhaustive search generates every element of the problem domain, filters those that meet the constraints, then picks the best.", "s": false, "n": "26"}, {"t": "mcq", "q": "Which is NOT true about the Brute force approach?", "o": ["It is inefficient but useful for solving small-size instances", "It is a straightforward approach to solving a problem", "It is one of the easiest strategies", "It is an approximation search approach"], "a": 3, "e": "Brute force is simple but inefficient. It always finds exact answers, so it is not an approximation approach.", "s": false, "n": "27"}, {"t": "mcq", "q": "Which is true about exhaustive search?", "o": ["It is a sequential search approach to combinatorial problems", "It is a brute force approach to combinatorial problems", "It is an approximation algorithm", "It generates small subset elements of the problem domain"], "a": 1, "e": "Exhaustive search is the brute-force approach applied to combinatorial problems (all permutations, subsets, assignments).", "s": false, "n": "28"}, {"t": "mcq", "q": "Which is NOT an example of a combinatorial problem?", "o": ["Traveling salesman problem", "Knapsack problem", "Assignment problem", "Sequential search"], "a": 3, "e": "TSP, knapsack and assignment are combinatorial problems. Sequential search just scans a list.", "s": false, "n": "29"}, {"t": "mcq", "q": "Applying exhaustive search for the Knapsack problem yields:", "o": ["n² subsets", "n-1 subsets", "2ⁿ subsets", "n³ subsets"], "a": 2, "e": "A set of n items has 2ⁿ subsets, and exhaustive search for knapsack checks all of them.", "s": false, "n": "30"}, {"t": "mcq", "q": "Total number of permutations needed for Travelling Salesman problem:", "o": ["1/2(n-1)!", "2log(n²)", "2(n-1)", "log(n-1)"], "a": 0, "e": "TSP tours start at a fixed city, giving (n−1)! permutations. Each tour and its reverse are the same, so 1/2 (n−1)! are needed.", "s": false, "n": "31"}, {"t": "mcq", "q": "_________ can be modeled by a weighted graph where vertices = cities and edges = distances.", "o": ["Knapsack problem", "Assignment problem", "Traveling salesman problem", "Binary search problem"], "a": 2, "e": "TSP is modeled as a weighted graph where vertices are cities and edge weights are distances.", "s": false, "n": "32"}, {"t": "mcq", "q": "Brute-force Closest-pair problem: computes distances between all distinct points and finds the pair with:", "o": ["The largest size", "The largest distance", "The smallest size", "The smallest distance"], "a": 3, "e": "Closest-pair finds the pair of points with the smallest distance, by checking all pairs.", "s": false, "n": "33"}, {"t": "mcq", "q": "In statistics, one important application of the closest-pair problem is:", "o": ["nonnumerical data", "numerical data", "cluster analysis", "critical analysis"], "a": 2, "e": "Closest-pair is used in cluster analysis: grouping nearby points together.", "s": false, "n": "34"}, {"t": "mcq", "q": "Efficiency of element uniqueness with pre-sorting using Brute force:", "o": ["O(n²)", "O(2ⁿ)", "O(logn)", "Θ(nlogn)"], "a": 0, "e": "Brute-force uniqueness compares every pair of elements, which takes O(n²). (Sorting first brings it down to Θ(n log n).)", "s": false, "n": "35"}, {"t": "mcq", "q": "Brute force string matching worst-case time complexity:", "o": ["O(mn)", "O(logn)", "O(nlogn)", "O(logn!)"], "a": 0, "e": "Brute-force string matching can compare all m pattern characters at each of about n text positions: O(mn).", "s": false, "n": "36"}, {"t": "mcq", "q": "Which sorting algorithm takes least time on a nearly sorted list?", "o": ["Insertion sort", "Bubble sort", "Selection sort", "Both bubble sort and selection sort"], "a": 0, "e": "Insertion sort does very little work on nearly sorted input (close to O(n)). Bubble and selection sort still do about n² comparisons.", "s": false, "n": "37"}, {"t": "mcq", "q": "Worst-case time complexity of Quicksort:", "o": ["O(N)", "O(NlogN)", "O(N²)", "O(logN)"], "a": 2, "e": "Quicksort degrades to O(n²) when pivots split badly, e.g. an already sorted array with the first element as pivot.", "s": false, "n": "38"}, {"t": "mcq", "q": "Worst-case time complexity of Merge sort:", "o": ["O(N²)", "O(N)", "O(logN)", "O(NlogN)"], "a": 3, "e": "Mergesort always splits in half and merges in linear time, so it is O(n log n) in every case.", "s": false, "n": "39"}, {"t": "mcq", "q": "Average-case insertion sort comparisons on a random array:", "o": ["Cavg(n) ∈ O(log₂n)", "Cavg(n) ∈ O(nlog₂n)", "Cavg(n) ∈ O(n²)", "Cavg(n) ∈ O(nlog₂n!)"], "a": 2, "e": "On a random array insertion sort shifts about half the elements on average, giving about n²/4 comparisons, so O(n²).", "s": false, "n": "40"}, {"t": "mcq", "q": "Merge sort: after two recursive calls but before the merge step, which is true?", "o": ["The array elements form a heap", "Elements in each half are sorted amongst themselves", "Elements in the first half are ≤ elements in the second half", "The array elements are fully sorted"], "a": 1, "e": "After the two recursive calls each half is sorted on its own. The merge step is what combines them into one sorted array.", "s": false, "n": "41"}, {"t": "open", "q": "Show divide/conquer/combine steps for Merge sort on A=[7,1,4,10,2,15,3,5]:", "a": "Divide: [7,1,4,10] [2,15,3,5]\nConquer: [1,4,7,10] [2,3,5,15]\nCombine: [1,2,3,4,5,7,10,15]", "s": false, "n": "42"}, {"t": "open", "q": "What is Brute Force? Define it and explain its main types with examples.", "a": "Definition: Brute Force is a straightforward approach to solving a problem, directly based on the\nproblem statement without any optimization. It applies the simplest and most direct strategy.\nMain Types:\n1. Sequential Search: Compares a key with each list element one by one until a match is found or\nthe list is exhausted. Time: Best O(1), Worst O(n).\n2. Bubble Sort: Repeatedly compares adjacent elements and swaps them if out of order. Time:\nO(n²).\n3. Selection Sort: Scans the list to find the minimum element, swaps it to the front, repeats. Time:\nO(n²).\n4. Brute-Force String Matching: Tries every position in the text to match the pattern. Time: O(mn).\n5. Closest-Pair (Brute Force): Computes the Euclidean distance between every pair of points and\nreturns the minimum. Time: O(n²).", "s": false, "n": "E3A"}, {"t": "open", "q": "What is Exhaustive Search? Define it and explain its main problem types.", "a": "Definition: Exhaustive Search is a brute-force approach applied to combinatorial problems. It\ngenerates every element of the problem domain, selects those that satisfy all constraints, and finds\nthe desired element (minimum cost or maximum value). Guarantees optimal solution but is only\npractical for small inputs.\nMain Problem Types:\n1. Traveling Salesman Problem (TSP): Find the shortest Hamiltonian circuit visiting every city\nexactly once and returning to start. Generates all (n-1)!/2 permutations. Time: O(n!).\n2. Knapsack Problem: Find a subset of n items (each with weight and value) that maximizes total\nvalue without exceeding capacity W. Generates all 2ⁿ subsets. Time: O(2ⁿ).\n3. Assignment Problem: Assign n jobs to n workers to minimize total cost. Generates all n!\nassignments. Time: O(n!).\nKey characteristic: all three are NP-hard — no known polynomial-time algorithm exists.", "s": false, "n": "E3B"}], "4": [{"t": "mcq", "q": "This algorithm is based on the relationship between a solution to an instance and a solution to its smaller instance:", "o": ["Decrease-and-conquer", "Greedy", "Brute force", "Transform-and-conquer"], "a": 0, "e": "Decrease-and-conquer solves a problem by relating its solution to the solution of a smaller instance of the same problem.", "s": false, "n": "43"}, {"t": "mcq", "q": "Which is NOT among major variations of decrease-and-conquer?", "o": ["Decrease by a constant", "Decrease by a constant factor", "Exhaustive approach", "Variable size decrease"], "a": 2, "e": "The three variations are decrease by a constant, by a constant factor, and variable-size decrease. \"Exhaustive approach\" is not one of them.", "s": false, "n": "44"}, {"t": "mcq", "q": "The major types of Decrease-and-conquer do NOT include:", "o": ["Decrease-by-a-constant", "Decrease-by-a-constant-factor", "Variable-size-decrease", "Infinite-size-decrease"], "a": 3, "e": "The variations are constant, constant factor and variable size. \"Infinite size decrease\" does not exist.", "s": false, "n": "45"}, {"t": "mcq", "q": "In decrease-and-conquer (decrease by constant), the recurrence relation is:", "o": ["an = an-2 · f(n-2)", "an = an-1 · f(n)", "an = an-4 · f(n-4)", "an = an-1"], "a": 1, "e": "Decrease by a constant (1) relates size n to n−1: a^n = a^(n−1) · a, i.e. f(n) = f(n−1) · a.", "s": false, "n": "46"}, {"t": "mcq", "q": "Binary search is an example of:", "o": ["Decrease-by-a-constant of 3", "Variable size decrease", "Decrease-by-a-constant factor = n/2", "Decrease constant factor = n/n-2/n-3"], "a": 2, "e": "Binary search halves the problem each step, so it is decrease by a constant factor (n/2).", "s": false, "n": "47"}, {"t": "mcq", "q": "Which of the following is incorrect about Binary Search?", "o": ["Binary search is based on decrease-by-conquer", "Binary search is an example of divide-and-conquer", "Binary search is used on pre-sorted data", "Binary search is an example of decrease-by-a-constant factor = n/2"], "a": 1, "e": "Binary search is decrease-and-conquer: it keeps only one half. Divide-and-conquer would solve both halves.", "s": false, "n": "48"}, {"t": "mcq", "q": "Worst-case number of key comparisons for binary search:", "o": ["Cworst(n) = ⌊log₂n⌋ + 1", "Cworst(n) = nlog₂n + 1", "Cworst(n) = n²log₂n + 1", "Cworst(n) = log₂n!"], "a": 0, "e": "Each comparison halves the range, so at most ⌊log₂ n⌋ + 1 comparisons are needed in the worst case.", "s": false, "n": "49"}, {"t": "mcq", "q": "In Depth First Search, how many times is a node visited?", "o": ["Once", "Thrice", "Twice", "Equal to the number of indegrees of the node"], "a": 0, "e": "DFS marks a node as visited the first time it reaches it and never visits it again, so each node is visited once.", "s": false, "n": "50"}, {"t": "mcq", "q": "Data structure used in standard implementation of Depth First Search:", "o": ["Queue", "Linked list", "Tree", "Stack"], "a": 3, "e": "DFS goes as deep as possible and backtracks, which is what a stack (or recursion) does.", "s": false, "n": "51"}, {"t": "mcq", "q": "Data structure used in standard implementation of Breadth First Search:", "o": ["Linked list", "Tree", "Queue", "Stack"], "a": 2, "e": "BFS visits nodes level by level, so it uses a queue (first in, first out).", "s": false, "n": "52"}, {"t": "mcq", "q": "Breadth-first search has the same efficiency as:", "o": ["Depth-first search", "Binary search", "Insertion sort", "Exhaustive search"], "a": 0, "e": "BFS and DFS both visit every vertex and edge once, so both run in Θ(V+E) with adjacency lists.", "s": false, "n": "53"}, {"t": "mcq", "q": "Which is NOT an application of Breadth First Search?", "o": ["Finding shortest path between two nodes", "Path finding", "GPS navigation system", "Finding bipartiteness of a graph"], "a": 1, "e": "BFS finds shortest paths (in unweighted graphs), is used in GPS and for bipartiteness checks. \"Path finding\" is not a specific BFS application in the course material.", "s": false, "n": "54"}, {"t": "mcq", "q": "Time complexity of BFS (V = vertices, E = edges):", "o": ["O(V)", "O(V·E)", "O(V+E)", "O(E)"], "a": 2, "e": "BFS visits each vertex once and examines each edge once: O(V+E).", "s": false, "n": "55"}, {"t": "mcq", "q": "Which edge type is NOT in a DFS forest of a directed graph?", "o": ["Tree edges", "Edges without direction", "Forward edges", "Back edges"], "a": 1, "e": "A DFS forest of a directed graph has tree, back, forward and cross edges. \"Edges without direction\" are not a DFS edge type.", "s": false, "n": "56"}, {"t": "mcq", "q": "Which is NOT true about a directed graph (digraph)?", "o": ["Adjacency matrix and lists are two principal representation means", "Traversal algorithms are DFS and BFS", "It might not have directions on all edges", "It is a graph with directions specified for all its edges"], "a": 2, "e": "In a digraph every edge has a direction, so \"might not have directions on all edges\" is false.", "s": false, "n": "57"}, {"t": "mcq", "q": "[Image] The graph below represents which variation of decrease-and-conquer? (GCD – Euclid's algorithm)", "o": ["decrease-by-a-constant 6", "decrease-by-a-constant factor = 106/6", "decrease constant factor = 16/10", "variable size decrease"], "a": 3, "e": "Euclid's gcd(m,n) = gcd(n, m mod n) shrinks the instance by a different amount at each step, which is variable-size decrease.", "s": false, "n": "58"}, {"t": "mcq", "q": "[Image] The graph below represents which variation of decrease-and-conquer? (problem of size n → subproblem of size n-1)", "o": ["decrease-by-a-constant factor", "decrease constant = n·(n-1)·(n-2)", "decrease-by-a-constant", "variable size decrease"], "a": 2, "e": "Reducing a problem of size n to one of size n−1 is decrease by a constant (1).", "s": false, "n": "59"}, {"t": "mcq", "q": "[Image] BFS traversal stack for the graph below (start with 'a' for inner component, 'h' for outer):", "o": ["a1e2d3c4f5b6, g7j8i9h10", "a1c2d3e4f5b6, h7g8i9j10", "c1e2d3c4f5a6, j7h8i9g10", "e1a2d3c4f5b6, h7j8i9g10"], "a": 1, "e": "BFS uses a queue and visits level by level, so the numbering in option B is the order a BFS from a (and then from h in the other component) would give. The figure is not shown here, so check it against your copy.", "s": false, "n": "60", "v": 1}, {"t": "mcq", "q": "[Image] Which type of edges is NOT possible for the following diagram?", "o": ["cross edges (dc)", "forward edges (ac)", "back edges (ba)", "tree edges (ac, bcd, cde)"], "a": 3, "e": "In a DFS forest, tree edges form the forest itself, so the listed tree-edge set cannot be the one that is impossible by definition of the others. Check this one against the figure in your copy.", "s": false, "n": "61", "v": 1}, {"t": "open", "q": "Explain the three variations of Decrease-and-Conquer with an example for each.", "a": "1. Decrease by a Constant (usually by 1): Problem size reduced by 1 each step. Recurrence: an =\nan-1 · f(n). Examples: Insertion Sort, DFS, BFS, computing n! recursively.\n2. Decrease by a Constant Factor (usually by 2): Problem size divided by a fixed factor k each step.\nExamples: Binary Search (halves the range each time), Russian Peasant Multiplication.\n3. Variable-Size Decrease: Size reduction varies each step. Example: Euclid's GCD —\ngcd(106,16)→gcd(16,10)→gcd(10,6)→gcd(6,4)→gcd(4,2)=2. The decrease equals the remainder,\nwhich is variable.", "s": false, "n": "E4"}], "5": [{"t": "mcq", "q": "Which is NOT true about divide-and-conquer?", "o": ["suited for parallel computations", "more efficient than even a brute-force", "not suited for sequential computation", "its plan consists of divide, conquer, and combine"], "a": 2, "e": "Divide-and-conquer follows divide, conquer, combine. It suits parallel computation, and is also fine sequentially, so \"not suited for sequential\" is false.", "s": false, "n": "62"}, {"t": "mcq", "q": "Which is NOT true about divide-and-conquer?", "o": ["It is based on recursion", "A problem is divided into several subproblems of the same type", "A divide-and-conquer algorithm is necessarily more efficient than brute force", "A divide-and-conquer algorithm is less efficient than brute force"], "a": 2, "e": "A divide-and-conquer algorithm is not necessarily more efficient than brute force; it often is, but not always. It is based on recursion and splits the problem into subproblems.", "s": false, "n": "63"}, {"t": "mcq", "q": "Running time formula for divide-and-conquer of size n divided into b instances of size n/b (a ≥ 1, b > 1): [Master Theorem]", "o": ["T(n) = aT(n/b)", "T(n) = aT(b) + f(n)", "T(n) = aT(n/b) + f(n)", "T(n) = aT(n) + f(n)"], "a": 2, "e": "The general form is T(n) = aT(n/b) + f(n): solve a subproblems of size n/b and pay f(n) for dividing and combining.", "s": false, "n": "64"}, {"t": "mcq", "q": "The term f(n) in the formula T(n) = aT(n/b) + f(n) represents: [Master Theorem]", "o": ["time spent dividing into instances of size b", "time spent dividing into instances of size b/n", "time spent dividing instance of size n² into size n/b", "time spent dividing an instance of size n into instances of size n/b and combining solutions"], "a": 3, "e": "f(n) is the time spent dividing an instance of size n and combining the results of the subproblems.", "s": false, "n": "65"}, {"t": "mcq", "q": "In divide-and-conquer, the order of growth T(n) depends on: [Master Theorem]", "o": ["values of constants a and b only", "values of constants a and b AND the order of growth of f(n)", "the order of growth of f(n) only", "the value of constant a only"], "a": 1, "e": "By the Master theorem, T(n) depends on a, b and the order of growth of f(n), not on one of them alone.", "s": false, "n": "66"}, {"t": "mcq", "q": "Efficiency of solving multiplication of two large numbers using Divide-and-conquer: [Master Theorem]", "o": ["T(n) = 4T(n/4)", "T(n) = 4T(n/2)", "T(n) = 3T(n/2)", "T(n) = 3T(n/4)"], "a": 2, "e": "Karatsuba multiplication uses 3 multiplications of half-size numbers: T(n) = 3T(n/2), giving Θ(n^1.585).", "s": false, "n": "67"}, {"t": "mcq", "q": "Time complexity of Strassen's matrix multiplication algorithm: [Master Theorem]", "o": ["O(n²)", "O(n^log₂7)  [ = T(n) = 7T(n/2) ]", "O(n³)", "O(n log n)"], "a": 1, "e": "Strassen uses 7 multiplications of half-size matrices: T(n) = 7T(n/2) = O(n^log₂7) ≈ O(n^2.807), better than n³.", "s": false, "n": "68"}, {"t": "mcq", "q": "In mergesort when n > 1, the recurrence relation for key comparisons: [Master Theorem]", "o": ["C(n) = C(n-1) + n", "C(n) = n²", "C(n) = 2C(n/2) + n - 1", "C(n) = log 1"], "a": 2, "e": "Mergesort solves two halves (2C(n/2)) and merges with at most n−1 comparisons.", "s": false, "n": "69"}, {"t": "mcq", "q": "It is more efficient to solve multiplication of two large numbers using:", "o": ["Brute force", "Divide-and-conquer", "Exhaustive search", "Grade-school algorithm"], "a": 1, "e": "Divide-and-conquer (Karatsuba) multiplies large numbers faster than the grade-school Θ(n²) method.", "s": false, "n": "70"}, {"t": "mcq", "q": "Strassen's matrix multiplication is an application of:", "o": ["Sequential search", "Brute force", "Exhaustive search", "Divide-and-conquer"], "a": 3, "e": "Strassen's algorithm splits matrices into blocks and combines results, which is divide-and-conquer.", "s": false, "n": "71"}, {"t": "mcq", "q": "If a problem can be solved by combining solutions to non-overlapping sub-problems, the strategy is:", "o": ["Dynamic programming", "Greedy", "Divide and conquer", "Brute force"], "a": 2, "e": "Divide-and-conquer fits when subproblems do not overlap. Dynamic programming is used when they overlap.", "s": false, "n": "72"}, {"t": "mcq", "q": "Breaking the problem into smaller sub-problems is the responsibility of the _____ step.", "o": ["divide", "sort", "conquer", "combine"], "a": 0, "e": "The divide step breaks the problem into smaller subproblems. Conquer solves them and combine merges the answers.", "s": false, "n": "73"}, {"t": "mcq", "q": "Runtime efficiency of divide-and-conquer for the closest-pair problem:", "o": ["O(N)", "O(NlogN)", "O(N²)", "O(N³logN)"], "a": 1, "e": "The divide-and-conquer closest-pair algorithm runs in O(n log n), better than the brute-force O(n²).", "s": false, "n": "74"}, {"t": "mcq", "q": "Θ(nlogn) + O(n) for element uniqueness with presorting represents:", "o": ["space consumed for checking consecutive elements", "sum of sorting time and memory space", "sum of sorting time and checking consecutive elements time", "time spent on sorting only"], "a": 2, "e": "Θ(n log n) is the sorting time and O(n) is the pass that checks consecutive elements, so the total is the sum of both.", "s": false, "n": "75"}, {"t": "mcq", "q": "Efficiency of element uniqueness with pre-sorting using Merge sort:", "o": ["O(n²)", "O(2ⁿ)", "Θ(nlogn)", "O(n!)"], "a": 2, "e": "Presorting with mergesort costs Θ(n log n), and the extra O(n) scan is dominated by it, so the total is Θ(n log n).", "s": false, "n": "76"}, {"t": "mcq", "q": "Which algorithm has worst-case quadratic time among divide-and-conquer?", "o": ["Mergesort", "Strassen's", "Closest-pair", "Quicksort"], "a": 3, "e": "Quicksort has Θ(n²) worst case. Mergesort, Strassen and closest pair stay below that.", "s": false, "n": "77"}, {"t": "mcq", "q": "Best-case complexity of Quicksort:", "o": ["O(log n)", "O(n)", "O(n²)", "O(nlogn)"], "a": 3, "e": "Best case happens when partitions are balanced each time: Θ(n log n).", "s": false, "n": "78"}, {"t": "mcq", "q": "Partitioning scheme used in Quicksort:", "o": ["Bellman-Ford's", "Hoare's", "Dijkstra's", "Kruskal's"], "a": 1, "e": "Quicksort in Levitin uses Hoare's partitioning with two scans from both ends.", "s": false, "n": "79"}, {"t": "mcq", "q": "The ____________ technique can be used for parallel computations.", "o": ["decrease and conquer", "greedy", "divide and conquer", "brute force"], "a": 2, "e": "Divide-and-conquer subproblems are independent, so they can be solved in parallel.", "s": false, "n": "80"}, {"t": "mcq", "q": "In knapsack problem, the goal is to _______ total weight and _______ total value.", "o": ["Minimizes, Minimizes", "Maximizes, Maximizes", "Maximizes, Minimizes", "Minimizes, Maximizes"], "a": 3, "e": "Knapsack: choose items to minimize total weight and maximize total value.", "s": false, "n": "81"}, {"t": "mcq", "q": "In postorder traversal, the root is visited:", "o": ["Only if it is a leaf", "After left and right subtrees", "Between subtrees", "First"], "a": 1, "e": "Postorder traversal visits the left subtree, then the right subtree, then the root.", "s": false, "n": "82"}, {"t": "mcq", "q": "Which algorithm is NOT divide-and-conquer?", "o": ["Binary tree traversals", "Mergesort", "Strassen's algorithm", "Dijkstra's algorithm"], "a": 3, "e": "Dijkstra's algorithm is greedy. Tree traversals, mergesort and Strassen divide the problem and combine results.", "s": false, "n": "83"}, {"t": "mcq", "q": "Which is NOT a suitable candidate for decrease-and-conquer?", "o": ["Insertion into a sorted list", "Searching in a sorted array", "Selection sort", "Multiplying two matrices"], "a": 2, "e": "The source key says selection sort, but Levitin classifies it as brute force. Multiplying two matrices is also not a natural decrease-and-conquer problem, so double-check this one with your instructor.", "s": false, "n": "84", "v": 1}, {"t": "mcq", "q": "[Image] Which algorithm does the following figure represent?", "o": ["Divide-and-conquer", "Transform-and-conquer", "Decrease-and-conquer", "Greedy algorithm"], "a": 0, "e": "The figure splits the problem into subproblems that are solved separately and then combined, the divide-and-conquer pattern (answer taken from the source key).", "s": false, "n": "85"}, {"t": "mcq", "q": "Which algorithm does the following figure represent? (Q23 from exam paper)", "o": ["Decrease-and-conquer", "Divide-and-conquer", "Transform-and-conquer", "Greedy algorithm"], "a": 1, "e": "The figure divides the instance into parts, solves each, and combines them: divide-and-conquer (answer taken from the source key).", "s": false, "n": "86"}, {"t": "open", "q": "What is the Master Theorem? State its three cases and give an example for each.", "a": "[Master Theorem]\nAnswer:\nThe Master Theorem provides a closed-form solution for recurrences of the form\nT(n) = aT(n/b) + f(n), where a ≥ 1 and b > 1 are constants and f(n) is a function.", "s": false, "n": "E5A"}, {"t": "open", "q": "Explain the Divide-and-Conquer technique – its steps and compare it with Decrease-and-Conquer.", "a": "Three steps of Divide-and-Conquer:\n1. DIVIDE: Split the problem into multiple subproblems of the same type (usually 2 of size n/2).\n2. CONQUER: Solve each subproblem recursively until base case is reached.\n3. COMBINE: Merge subproblem solutions to form the answer to the original problem.\nRecurrence: T(n) = aT(n/b) + f(n) — solved using the Master Theorem.\nComparison with Decrease-and-Conquer:\nDivide-and-Conquer: splits into MULTIPLE subproblems, solves ALL, then combines. Suits parallel\ncomputation.\nDecrease-and-Conquer: reduces to ONE smaller instance, no combining step. Suits sequential\ncomputation.", "s": false, "n": "E5B"}]}, "summary": {"1": {"book": "Levitin ch. 1 · Introduction", "pts": ["Algorithm — finite, unambiguous sequence of steps that turns input into output.", "Problem types — sorting, searching, string processing, graph, combinatorial, geometric, numerical.", "Euclid's algorithm — gcd(m,n) = gcd(n, m mod n), O(log n).", "Sequential search — best O(1), worst O(n).", "Fundamental data structures — arrays, linked lists, stacks, queues, trees, graphs."]}, "2": {"book": "Levitin ch. 2 · Analysis of Algorithm Efficiency", "pts": ["Basic operation — the most time-consuming operation; count how often it runs as input size n grows.", "O (upper bound, worst), Ω (lower bound, best), Θ (tight bound).", "Growth order — 1 < log n < n < n log n < n² < n³ < 2ⁿ < n!", "Non-recursive analysis — set up a sum for the basic operation and simplify.", "Recursive analysis — write a recurrence and solve by backward substitution: factorial Θ(n), Tower of Hanoi Θ(2ⁿ), binary digits Θ(log n).", "Best, worst and average cases can differ for the same algorithm."]}, "3": {"book": "Levitin ch. 3 · Brute Force and Exhaustive Search", "pts": ["Brute force — solve directly from the problem definition; simple but slow.", "Selection sort Θ(n²) (at most n swaps), bubble sort Θ(n²), sequential search O(n).", "String matching Θ(mn) with m = pattern length, n = text length.", "Closest pair Θ(n²); convex hull O(n³).", "Exhaustive search — generate every candidate and pick the best.", "TSP Θ(n!), knapsack Θ(2ⁿ), assignment Θ(n!) — all NP-hard.", "DFS (stack) and BFS (queue) — Θ(V+E) with adjacency lists."]}, "4": {"book": "Levitin ch. 4 · Decrease-and-Conquer", "pts": ["Idea — reduce to a smaller instance, solve it, extend the solution.", "By a constant (1) — insertion sort (worst Θ(n²), best Θ(n)), DFS/BFS Θ(V+E), topological sort Θ(V+E).", "By a constant factor (half) — binary search Θ(log n), fake-coin problem, Russian peasant multiplication.", "Variable size — Euclid's gcd O(log n), quickselect (avg Θ(n), worst Θ(n²)), interpolation search.", "Binary search needs a sorted array and halves the range each step."]}, "5": {"book": "Levitin ch. 5 · Divide-and-Conquer", "pts": ["Idea — divide into smaller instances, solve recursively, combine the results: T(n) = aT(n/b) + f(n).", "Master theorem (f(n) ∈ Θ(nᵈ)) — a < bᵈ: Θ(nᵈ); a = bᵈ: Θ(nᵈ log n); a > bᵈ: Θ(n^(log_b a)).", "Mergesort Θ(n log n) in all cases (Master theorem case 2); needs extra space.", "Quicksort — average Θ(n log n), worst Θ(n²) (already sorted input with a bad pivot).", "Binary tree traversals Θ(n); closest pair Θ(n log n).", "Karatsuba Θ(n^1.585) and Strassen Θ(n^2.807) beat the brute-force Θ(n²) / Θ(n³)."]}}}, "CS350": {"name": "Introduction to Database", "chapters": {"1": [{"t": "mcq", "q": "Which term is used to define the computerized system that enables users to create and maintain a database?", "o": ["Database", "Database system", "Meta-data", "Database Management System (DBMS)"], "a": 3, "e": "A DBMS is the computerized system (software) that lets users create, maintain and control a database.", "s": false, "n": 1}, {"t": "mcq", "q": "A database is a collection of:", "o": ["Programs", "Modules", "Sets", "Data"], "a": 3, "e": "A database is a collection of related data.", "s": false, "n": 2}, {"t": "mcq", "q": "______ is a collection of interrelated data and a set of programs to access them.", "o": ["Data structure", "Database management system", "Programming language", "Database"], "a": 1, "e": "A DBMS is a collection of interrelated data (the database) plus programs to access and manage it.", "s": false, "n": 3}, {"t": "mcq", "q": "Before the use of DBMSs, information was stored using:", "o": ["Cloud storage", "Data system", "File management system", "Data structure"], "a": 2, "e": "Before DBMSs, information was kept in file-processing (file management) systems.", "s": false, "n": 4}, {"t": "mcq", "q": "Which of the following is NOT a basic component of a database system?", "o": ["Database", "User", "ERD", "DBMS", "Database applications"], "a": 2, "e": "A database system consists of the database, DBMS, users and applications. An ERD is only a design diagram.", "s": false, "n": 5}, {"t": "mcq", "q": "Microsoft SQL Server is an example of a:", "o": ["Database", "Database management system", "Data manipulation system", "Table", "List manager"], "a": 1, "e": "SQL Server is a DBMS: software that manages databases. The database itself is the stored data.", "s": false, "n": 6}, {"t": "mcq", "q": "A database may be used to help people:", "o": ["Track which student is assigned to a particular advisor", "Know the current inventory levels of products their company sells", "Check the estimated arrival time of an incoming flight", "Look up their checking account balance over the Internet", "All of the above"], "a": 4, "e": "Databases serve all of these: tracking students, inventory, flight data and bank balances.", "s": false, "n": 7}, {"t": "mcq", "q": "Which operation causes data to be retrieved from the database?", "o": ["Transaction", "Security", "Query", "Manipulation"], "a": 2, "e": "A query asks the DBMS to retrieve data from the database.", "s": false, "n": 8}, {"t": "mcq", "q": "Which of the following is NOT one of the manipulation functions of a DBMS?", "o": ["Modification: insertions, deletions and updates to its content", "Retrieval: querying and generating reports", "Organizing: sorting data in tables following sequential logic", "Accessing and changing the database through Web applications"], "a": 2, "e": "DBMS manipulation covers modification, retrieval and accessing through applications. Sorting tables is not listed as a manipulation function.", "s": false, "n": 9}, {"t": "mcq", "q": "Which of the following is not a component of a database management system?", "o": ["File manager", "Query language", "Database manager", "MS Office"], "a": 3, "e": "File manager, query language and database manager are DBMS components. MS Office is an unrelated application suite.", "s": false, "n": 10}, {"t": "mcq", "q": "The creation of a database and its tables is a function of which component of the database system?", "o": ["Users", "Application", "DBMS", "Database", "Web server"], "a": 2, "e": "Creating the database and its tables is a DBMS function (via DDL).", "s": false, "n": 11}, {"t": "mcq", "q": "Which of the following is a function of the DBMS in a database system?", "o": ["Create and transmit queries", "Control applications", "Create and process forms", "Perform backup and recovery", "Process Web page requests"], "a": 3, "e": "The DBMS performs backup and recovery; creating forms and web requests are done by applications or servers.", "s": false, "n": 12}, {"t": "mcq", "q": "The descriptive information about a database, stored by the DBMS in the form of a catalog or dictionary, is:", "o": ["A tuple", "A database", "Defining a database", "Meta-data"], "a": 3, "e": "Meta-data is data about the database, stored by the DBMS in its catalog.", "s": false, "n": 13}, {"t": "mcq", "q": "The database system contains the database itself and a complete definition of its structure and constraints. This definition is stored in the form of a:", "o": ["DBMS audit log", "DBMS journal", "DBMS catalog", "DBMS archive"], "a": 2, "e": "The DBMS catalog stores the complete definition of the database structure and constraints.", "s": false, "n": 14}, {"t": "mcq", "q": "The component that makes a database self-describing is the:", "o": ["Related tables", "Applications", "Library", "Data set", "Meta-data"], "a": 4, "e": "Meta-data in the catalog is what makes a database self-describing.", "s": false, "n": 15}, {"t": "mcq", "q": "Which of the following is NOT an example of database meta-data?", "o": ["Names of tables in a database", "Properties of tables", "Names of columns and their associated tables", "Properties of columns", "Queries against records in the database tables"], "a": 4, "e": "Meta-data describes tables, columns and their properties. Queries against records are not meta-data.", "s": false, "n": 16}, {"t": "mcq", "q": "______ is one kind of data dictionary that can be accessed by the DBMS software and by the user/DBA.", "o": ["Active data dictionary", "Inter-active data dictionary", "Pro-active data dictionary", "Passive data dictionary"], "a": 0, "e": "An active data dictionary is managed automatically by the DBMS and can be accessed by the DBMS and users.", "s": false, "n": 17}, {"t": "mcq", "q": "A relational database is:", "o": ["A self-describing collection of related tables", "A collection of forms and reports that support a given purpose", "A library of queries and data files for querying", "A set of applications and the data sets for those applications", "A set of meta-data"], "a": 0, "e": "A relational database is a self-describing collection of related tables.", "s": false, "n": 18}, {"t": "mcq", "q": "What does \"program-data independence\" refer to in a DBMS?", "o": ["The programming language used to interact with the database", "The link between an application and its source code", "The ability to change data structures without modifying the application programs", "The method of encrypting program data"], "a": 2, "e": "Program-data independence means data structures can change without changing the programs.", "s": false, "n": 19}, {"t": "mcq", "q": "A collection of concepts that can be used to describe the structure of a database is called a:", "o": ["Database", "Data schema", "Data basic", "Data model"], "a": 3, "e": "A data model is a collection of concepts describing the structure of a database.", "s": false, "n": 20}, {"t": "mcq", "q": "Duplication of data at several locations is called the ______ problem.", "o": ["Data redundancy", "Data isolation", "Atomicity", "Data inconsistency"], "a": 0, "e": "Duplicating the same data in several places is data redundancy.", "s": false, "n": 21}, {"t": "mcq", "q": "In file-based systems, when common fields do not match across duplicated files, the result is the ______ problem.", "o": ["Data inconsistency", "Atomicity", "Data redundancy", "Data isolation"], "a": 0, "e": "When duplicated copies disagree, the result is data inconsistency.", "s": false, "n": 22}, {"t": "mcq", "q": "Which of the following problems of storing data in a list is avoided by storing data in a relational database?", "o": ["Maintaining the data may require changing the same data value in many locations", "Inconsistency when a data item is used multiple times", "Inability to store partial data", "Duplication of data items", "All of the above"], "a": 4, "e": "A relational database avoids repeated updates, inconsistency, partial data problems and duplication, so all apply.", "s": false, "n": 23}, {"t": "mcq", "q": "Which type of database user is responsible for security and efficiency?", "o": ["Database administrators", "End-users", "Database designers", "Parametric end-users"], "a": 0, "e": "The DBA is responsible for security, authorization and efficiency of the database.", "s": false, "n": 24}, {"t": "mcq", "q": "The main responsibility of the database designers is to:", "o": ["Coordinate and monitor database users", "Use the database to print reports", "Authorize and control access to the database", "Define the database structure, constraints and transactions by communicating with users to understand their needs"], "a": 3, "e": "Designers define the structure, constraints and transactions by talking with users.", "s": false, "n": 25}, {"t": "mcq", "q": "What is the role of the database administrator (DBA)?", "o": ["Monitoring database efficiency", "Designing database structures", "Writing SQL queries", "Developing application programs"], "a": 0, "e": "The DBA monitors and tunes database efficiency (also security and access).", "s": false, "n": 26}, {"t": "mcq", "q": "Which of the following is NOT one of the types of database users?", "o": ["Database administrators", "Database trainer", "Database designers", "Database end-users"], "a": 1, "e": "Database users are administrators, designers and end users. \"Database trainer\" is not a category.", "s": false, "n": 27}, {"t": "mcq", "q": "Which of the following is a key advantage of a DBMS over a traditional file processing system?", "o": ["Increased data redundancy", "Tight coupling between programs and data", "Controlling data redundancy and enforcing integrity constraints", "Restricting concurrent access to one user at a time"], "a": 2, "e": "A DBMS controls redundancy and enforces integrity constraints, which file systems cannot do well.", "s": false, "n": 28}, {"t": "mcq", "q": "Which of the following is NOT an advantage of using a DBMS?", "o": ["Providing storage structures for efficient query processing", "Enforcing integrity constraints", "High initial investment in hardware, software and training", "Providing backup and recovery facilities"], "a": 2, "e": "High initial investment is a cost of using a DBMS, not an advantage.", "s": false, "n": 29}, {"t": "mcq", "q": "What is NOT an implication of using the database approach?", "o": ["Conflict in updating the information", "Availability of up-to-date information", "Reduced application development time", "Economies of scale"], "a": 0, "e": "The database approach prevents conflicting updates. Conflicts are not an implication of it.", "s": false, "n": 30}, {"t": "mcq", "q": "When should you NOT use a DBMS?", "o": ["When you need to improve performance", "When the overhead costs (inhibitors) of using a DBMS are not justified", "When you want to reduce application development time", "When there is a potential for enforcing standards"], "a": 1, "e": "Do not use a DBMS when its overhead costs are not justified for a simple, stable application.", "s": false, "n": 31}, {"t": "mcq", "q": "Which of the following is considered an ongoing, operational cost of a DBMS?", "o": ["Acquisition of hardware", "Maintenance and software licensing fees", "Initial database design and conversion", "Training of development staff"], "a": 1, "e": "Maintenance and licensing are ongoing costs. Hardware, design, conversion and training are mostly initial costs.", "s": false, "n": 32}, {"t": "mcq", "q": "Which model has emerged as a standard for exchanging data over the Web?", "o": ["XML model", "Relational model", "Network model", "Hierarchical model"], "a": 0, "e": "The XML model became the standard for exchanging data over the Web.", "s": false, "n": 33}, {"t": "mcq", "q": "In a hierarchical model, records are organized as a:", "o": ["Tree", "Link", "Graph", "List"], "a": 0, "e": "In the hierarchical model records form a tree.", "s": false, "n": 34}, {"t": "mcq", "q": "Which of the following describes the hierarchical model?", "o": ["A combination of an object-oriented and a relational model", "Represents data as a hierarchical tree structure", "Represents data as record types", "Represents data as objects"], "a": 1, "e": "The hierarchical model represents data as a tree structure.", "s": false, "n": 35}, {"t": "mcq", "q": "Difficulty in storing data where multiple relationships exist among the data records is a disadvantage of the:", "o": ["Relational model", "Hierarchical model", "Object-relational model", "Object-oriented model"], "a": 1, "e": "The hierarchical model struggles when records have multiple relationships (it allows one parent only).", "s": false, "n": 36}, {"t": "mcq", "q": "Today almost every commercial database is based on:", "o": ["Lists", "The hierarchical model", "The linked-list model", "The relational model", "The object-oriented model"], "a": 3, "e": "Almost every commercial database today is relational.", "s": false, "n": 37}, {"t": "mcq", "q": "What is the role of Database Administrators (DBAs)?", "o": ["Developing application programs", "Writing SQL queries", "Monitoring database efficiency", "Designing database structures"], "a": 2, "e": "The DBA monitors efficiency and manages security and access; designing structures is the designer's job.", "s": false, "n": "X1"}, {"t": "mcq", "q": "Which of the following is NOT a term used in Database?", "o": ["Relation", "Entities", "Relationships", "Activity"], "a": 3, "e": "Relation, entities and relationships are database terms; \"activity\" is not.", "s": false, "n": "X2"}, {"t": "mcq", "q": "Which of the following is NOT one of the main components found in a DBMS?", "o": ["Relationships", "Attributes", "Entities", "Algorithms"], "a": 3, "e": "DBMS data-model components are entities, attributes and relationships. Algorithms are not.", "s": false, "n": "X3"}, {"t": "mcq", "q": "Which of the following is NOT one of the Manipulating of DBMS Functionality?", "o": ["Modification: Insertions, deletions and updates to its content.", "Retrieval: Querying, generating reports.", "Organizing: Sorting data in tables following sequential logic.", "Accessing/changing the database through Web applications."], "a": 2, "e": "Manipulation means modification and retrieval (and access through applications). Sorting/organizing is not one of its functions.", "s": false, "n": "X4"}, {"t": "mcq", "q": "When NOT to use a DBMS?", "o": ["When you need to improve performance.", "When there is inhibitor (costs) of using a DBMS.", "When you want to reduce application development time.", "When there is a potential for enforcing standards."], "a": 2, "e": "Reducing development time is a reason to use a DBMS. You avoid it when its costs are not justified.", "s": false, "n": "X5"}, {"t": "mcq", "q": "A transaction is a collection of operations that performs a single logical function in a database application.", "o": ["True", "False"], "a": 0, "e": "True: a transaction groups operations into one logical unit of work (e.g. a money transfer).", "s": false, "n": "TF1"}, {"t": "mcq", "q": "In the early days, database applications were built directly on top of file systems.", "o": ["True", "False"], "a": 0, "e": "True: early database applications were built directly on file systems.", "s": false, "n": "TF2"}, {"t": "mcq", "q": "Data redundancy decreases the cost of storing and retrieving data.", "o": ["True", "False"], "a": 1, "e": "False: redundancy increases storage and update costs and risks inconsistency.", "s": false, "n": "TF3"}, {"t": "mcq", "q": "It is more difficult to access data in a conventional file system than in a database system.", "o": ["True", "False"], "a": 0, "e": "True: files need custom programs and have no shared query language, so access is harder.", "s": false, "n": "TF4"}, {"t": "open", "q": "The purpose of a database is to help people ________.", "a": "Keep track of things", "s": false, "n": "C1"}, {"t": "open", "q": "Data that the database keeps about its own structure is called ________.", "a": "Meta-data", "s": false, "n": "C2"}, {"t": "open", "q": "The purpose of the ________ in a database system is to receive requests from applications and translate those requests into reads and writes on the database files.", "a": "DBMS", "s": false, "n": "C3"}, {"t": "open", "q": "The DBMS controls ________ by ensuring that one user's work does not inappropriately interfere with another user's work.", "a": "Concurrency", "s": false, "n": "C4"}, {"t": "open", "q": "A(n) ________ is a set of one or more computer programs that serves as an intermediary between the user and the DBMS.", "a": "Database application", "s": false, "n": "C5"}, {"t": "open", "q": "In a database system, the ________ creates and processes forms.", "a": "Database application", "s": false, "n": "C6"}, {"t": "open", "q": "List four advantages of using a DBMS.", "a": "Advantages of using a DBMS (any four): Controlling redundancy: storing each data item in only one place. Restricting unauthorized access: providing security and authorization subsystems. Providing persistent storage: program objects survive after the program ends. Efficient query processing: using indexes and query optimization to speed up access.", "s": false, "n": "D1"}, {"t": "open", "q": "Explain the role and responsibilities of the database administrator (DBA).", "a": "The database administrator (DBA): The DBA is the central authority for managing a database system. Responsibilities include granting privileges to users who need to use the system, and classifying users and data in accordance with the organization's policy. The DBA has a DBA account (system or superuser account) with powerful capabilities: account creation, privilege granting, privilege revocation, and security level assignment.", "s": false, "n": "D2"}], "2": [{"t": "mcq", "q": "Which term describes the concepts used to describe the structure and operations of a database?", "o": ["Database", "Data schema", "Data basic", "Data model"], "a": 3, "e": "A data model is the set of concepts for describing database structure and operations.", "s": false, "n": 1}, {"t": "mcq", "q": "The Entity-Relationship model is a/an ______ data model for database design.", "o": ["Physical", "Conceptual", "Application program", "Logical"], "a": 1, "e": "The ER model is a conceptual (high-level) model for design.", "s": false, "n": 2}, {"t": "mcq", "q": "Which of the following is the physical (low-level, internal) data model?", "o": ["Provides concepts that are close to the way many users perceive data", "Provides concepts that describe details of how data is stored in the computer", "Provides concepts that are used by many commercial DBMS implementations", "Provides concepts that are only available for the database users"], "a": 1, "e": "The physical model describes how data is actually stored in the computer.", "s": false, "n": 3}, {"t": "mcq", "q": "______ provide concepts that describe details of how data is stored in the computer.", "o": ["Physical (low-level) data model", "Physical (high-level) data model", "Implementation data model", "Conceptual (high-level) data model"], "a": 0, "e": "Physical (low-level) data models describe storage details such as files and indexes.", "s": false, "n": 4}, {"t": "mcq", "q": "Which level of data abstraction describes exactly how the data is actually stored?", "o": ["Physical level", "Conceptual level", "File level", "Logical level"], "a": 0, "e": "The physical level describes exactly how data is stored.", "s": false, "n": 5}, {"t": "mcq", "q": "There are ______ levels of data abstraction.", "o": ["1", "2", "3", "4"], "a": 2, "e": "There are three levels of abstraction: physical, logical and view.", "s": false, "n": 6}, {"t": "mcq", "q": "The ______ level is the lowest level in data abstraction.", "o": ["Physical", "Application", "Logical", "View"], "a": 0, "e": "The physical level is the lowest level of abstraction.", "s": false, "n": 7}, {"t": "mcq", "q": "The ______ level of data abstraction hides details of data types and information for security purposes.", "o": ["Application", "View", "Logical", "Physical"], "a": 1, "e": "The view level hides details of data types and parts of the database, for simplicity and security.", "s": false, "n": 8}, {"t": "mcq", "q": "The database architecture level that describes how the data is actually stored on physical media is the:", "o": ["External level", "Physical level (internal level)", "Conceptual level", "Logical level"], "a": 1, "e": "The physical (internal) level describes storage on physical media.", "s": false, "n": 9}, {"t": "mcq", "q": "In the three-schema architecture, the level that hides physical storage details and describes the structure of the whole database for a community of users is the:", "o": ["Internal level", "External level", "Conceptual level", "Physical level"], "a": 2, "e": "The conceptual level hides physical storage and describes the whole database for a community of users.", "s": false, "n": 10}, {"t": "mcq", "q": "Which schema describes physical storage structures?", "o": ["Internal schema", "Operational schema", "Conceptual schema", "External schema"], "a": 0, "e": "The internal schema describes physical storage structures and access paths.", "s": false, "n": 11}, {"t": "mcq", "q": "The internal level has a schema that describes the ______ storage structure of the database.", "o": ["Network", "Virtual", "Logical", "Physical"], "a": 3, "e": "The internal level describes the physical storage structure.", "s": false, "n": 12}, {"t": "mcq", "q": "An ______ is an example of an access path that allows direct access to data using an index term or keyword.", "o": ["Catalog", "Key", "Index", "Table"], "a": 2, "e": "An index is an access path that gives direct access using a key term.", "s": false, "n": 13}, {"t": "mcq", "q": "The ______ is the description of the database structure, relationships, data types and constraints.", "o": ["Database schema", "Database description", "Database diagram", "Database state"], "a": 0, "e": "The database schema describes structure, relationships, data types and constraints.", "s": false, "n": 14}, {"t": "mcq", "q": "The actual data stored in a database at a particular moment in time is known as the:", "o": ["Database state", "Schema diagram", "Schema construct", "Database schema"], "a": 0, "e": "The actual data at a moment in time is the database state.", "s": false, "n": 15}, {"t": "mcq", "q": "The difference between database schema and database state is that:", "o": ["The schema changes frequently; the state is relatively stable", "The schema refers to the initial loading of data; the state refers to ongoing updates", "The schema describes the database structure; the state is the actual data stored at any point", "There is no significant difference between the two"], "a": 2, "e": "The schema is the structure (changes rarely); the state is the current data (changes constantly).", "s": false, "n": 16}, {"t": "mcq", "q": "What is a database instance?", "o": ["The state of the database system at any given point of time", "The initial values inserted into the database immediately after its creation", "The database system's logical structure", "A single relation that contains all of the database's attributes"], "a": 0, "e": "A database instance is the state of the database at a particular time.", "s": false, "n": 17}, {"t": "mcq", "q": "If all constraints are satisfied by a database state, it is called a:", "o": ["Valid state", "Ordered state", "Recovered state", "Invalid state"], "a": 0, "e": "A state that satisfies all constraints is a valid state.", "s": false, "n": 18}, {"t": "mcq", "q": "The DBMS stores the description of the schema constructs and constraints, which is referred to as:", "o": ["Intension", "Meta-data", "Data management", "Extension"], "a": 1, "e": "Meta-data stores the descriptions of schema constructs and constraints in the catalog.", "s": false, "n": 19}, {"t": "mcq", "q": "Physical data independence is the capacity to change the internal schema without having to change the ______ schema.", "o": ["Conceptual", "Meta-data", "Partial", "Virtual"], "a": 0, "e": "Physical independence: change the internal schema without changing the conceptual schema.", "s": false, "n": 20}, {"t": "mcq", "q": "Allowing internal schema changes without requiring conceptual schema changes is known as:", "o": ["External data independence", "Physical data independence", "Conceptual data independence", "Logical data independence"], "a": 1, "e": "Changing the internal schema without touching the conceptual one is physical data independence.", "s": false, "n": 21}, {"t": "mcq", "q": "Logical data independence is defined as:", "o": ["The capacity to change the conceptual schema without having to change external schemas", "The capacity to change the internal schema without having to change external schemas", "The capacity to change the conceptual schema without having to change internal schemas", "The capacity to change the internal schema without having to change conceptual schemas"], "a": 0, "e": "Logical independence means changing the conceptual schema without changing external schemas.", "s": false, "n": 22}, {"t": "mcq", "q": "Which of the following is generally used for creating the structure of relations or deleting relations?", "o": ["Relational schema", "DML (Data Manipulation Language)", "Query", "DDL (Data Definition Language)"], "a": 3, "e": "DDL creates and deletes the structure (tables, schemas).", "s": false, "n": 23}, {"t": "mcq", "q": "Which of the following is the full form of DDL?", "o": ["Data Definition Language", "Detailed Data Language", "Data Derivation Language", "Dynamic Data Language"], "a": 0, "e": "DDL = Data Definition Language.", "s": false, "n": 24}, {"t": "mcq", "q": "The database schema is written in:", "o": ["DDL", "HLL", "DML", "DCL"], "a": 0, "e": "The database schema is written in DDL.", "s": false, "n": 25}, {"t": "mcq", "q": "Which language defines the conceptual schema?", "o": ["DDL", "IDL", "DML", "VDL"], "a": 0, "e": "DDL defines the conceptual schema.", "s": false, "n": 26}, {"t": "mcq", "q": "The database language used to specify the internal schema is:", "o": ["Data definition language", "View definition language", "Data manipulation language", "Storage definition language"], "a": 3, "e": "Storage definition language (SDL) specifies the internal schema.", "s": false, "n": 27}, {"t": "mcq", "q": "The database language used by end-users and programmers to retrieve, insert, delete and modify data is:", "o": ["VDL (View Definition Language)", "DML (Data Manipulation Language)", "DDL (Data Definition Language)", "SDL (Storage Definition Language)"], "a": 1, "e": "DML retrieves, inserts, deletes and modifies data.", "s": false, "n": 28}, {"t": "mcq", "q": "DBMSs may include many user-friendly interfaces. Which of the following can NOT be considered an interface for a database?", "o": ["Universal serial bus interface", "Natural language interface", "Graphical user interface", "Forms-based interface"], "a": 0, "e": "Menus, forms, GUIs and natural language are database interfaces; a USB interface is hardware, not a DB interface.", "s": false, "n": 29}, {"t": "mcq", "q": "The following are approaches of interfaces for embedding DML in a programming language, except:", "o": ["Embedded approach", "Programming approach", "Procedure call approach", "Database programming language approach"], "a": 1, "e": "The DML embedding approaches are embedded, procedure call and database programming language; \"programming approach\" is not one.", "s": false, "n": 30}, {"t": "mcq", "q": "Which standard provides an application programming interface (API) that allows client-side programs to call the DBMS?", "o": ["Open Database Call (ODBC)", "Open Database Collection (ODBC)", "Open Database Connectivity (ODBC)", "Open Database Commit (ODBC)"], "a": 2, "e": "ODBC (Open Database Connectivity) is the API standard that lets client programs call the DBMS.", "s": false, "n": 31}, {"t": "mcq", "q": "In an RDBMS, the server is also often called an ______ server.", "o": ["Data", "JDBC", "XML", "SQL"], "a": 3, "e": "The relational server is often called the SQL server.", "s": false, "n": 32}, {"t": "mcq", "q": "Reorganizing database file structures, report generation and performance monitoring are all examples of:", "o": ["SQL", "Database internal schema", "DBMS", "Database system utilities"], "a": 3, "e": "Reorganization, report generation and monitoring are database system utilities.", "s": false, "n": 33}, {"t": "mcq", "q": "The utility that observes database usage and provides statistics to the DBA is called the:", "o": ["Database storage reorganization utility", "Performance monitoring utility", "Loading utility", "Backup utility"], "a": 1, "e": "The performance monitoring utility tracks usage and gives statistics to the DBA.", "s": false, "n": 34}, {"t": "mcq", "q": "______ is one kind of data dictionary that can be accessed by the DBMS software and by the user/DBA.", "o": ["Active data dictionary", "Inter-active data dictionary", "Pro-active data dictionary", "Passive data dictionary"], "a": 0, "e": "An active dictionary is accessible to the DBMS software as well as to users and the DBA.", "s": false, "n": 35}, {"t": "mcq", "q": "Many DBMSs have their own module to schedule disk read/write. This module is called the:", "o": ["Buffer management module", "Operating system module", "Data definition module", "User interface module"], "a": 0, "e": "The buffer management module schedules disk reads and writes.", "s": false, "n": 36}, {"t": "mcq", "q": "In regard to DBMS components, the query optimizer's function is:", "o": ["The rearrangement of operations, elimination of redundancies and use of efficient search algorithms during execution", "Extracting DML commands from an application program written in a host programming language", "Executing the privileged commands", "Compiling a query into an internal form"], "a": 0, "e": "The query optimizer rearranges operations, removes redundancy and picks efficient search algorithms.", "s": false, "n": 37}, {"t": "mcq", "q": "Which of the following is not a component of a database management system?", "o": ["File manager", "Query language", "Database manager", "MS Office"], "a": 3, "e": "Query language and managers are DBMS components. MS Office is not.", "s": false, "n": 38}, {"t": "mcq", "q": "Which software's main function is to provide access to the database from remote locations through computer terminals, workstations or personal computers?", "o": ["Communications software", "Host software", "Client software", "Spreadsheet software"], "a": 0, "e": "Communications software gives remote access to the database from terminals or PCs.", "s": false, "n": 39}, {"t": "mcq", "q": "The database architecture that combines everything into a single computer system is the:", "o": ["Centralized DBMS architecture", "2-tier client-server architecture", "Many-tier client-server architecture", "3-tier client-server architecture"], "a": 0, "e": "A centralized architecture puts everything in one computer system.", "s": false, "n": 40}, {"t": "mcq", "q": "Three-tier architecture includes:", "o": ["Three client layers", "Two client layers and one server layer", "Three server layers", "A client layer and two server layers"], "a": 3, "e": "Three-tier architecture has a client layer and two server layers (application and database).", "s": false, "n": 41}, {"t": "mcq", "q": "In the three-tier architecture, the intermediate (middle) tier is called the:", "o": ["Application server", "Web server", "Functional server", "Storage server"], "a": 0, "e": "The middle tier is the application server (or web server).", "s": false, "n": 42}, {"t": "mcq", "q": "Which DBMS architecture serves as a conduit for sending partially processed data between the client and the database server?", "o": ["One-tier client-server", "Two-tier client-server", "Three-tier client-server", "A physical centralized architecture"], "a": 2, "e": "In three-tier architecture the middle tier acts as a conduit for partially processed data between client and database server.", "s": false, "n": 43}, {"t": "mcq", "q": "The ______ layer provides a high-level view of data and actions on data.", "o": ["Data access", "Business logic", "Presentation", "User interaction"], "a": 1, "e": "The business-logic layer provides the high-level view of data and actions on it.", "s": false, "n": 44}, {"t": "mcq", "q": "The ______ layer provides the interface between the business-logic layer and the underlying database.", "o": ["Business logic", "Presentation", "User interaction", "Data access"], "a": 3, "e": "The data-access layer interfaces between business logic and the database.", "s": false, "n": 45}, {"t": "mcq", "q": "DBMSs can be classified using the criterion \"number of sites\" into:", "o": ["Single-user systems / multiuser systems", "Centralized systems / distributed systems", "Key-value based systems / graph value storage systems", "Relational database systems / tree-structured database systems"], "a": 1, "e": "By number of sites, DBMSs are centralized or distributed.", "s": false, "n": 46}, {"t": "mcq", "q": "A heterogeneous database management system is defined as:", "o": ["DBMSs that use the same DBMS software at all the sites", "DBMSs that use the same DBMS software for all the users", "DBMSs that can use different DBMS software at each site", "DBMSs that can use one DBMS software from the same vendor at all the sites"], "a": 2, "e": "Heterogeneous means different DBMS software at each site; homogeneous means the same.", "s": false, "n": 47}, {"t": "mcq", "q": "Which of the following is a heterogeneous distr
