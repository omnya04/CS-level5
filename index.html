q", "q": "The primary deliverable from the first part of the planning phase is:", "o": ["A schedule of specific IS development projects", "A completed software application", "A budget report", "A risk assessment document "], "a": 0, "e": "The primary deliverable is a schedule of specific IS development projects.", "s": false, "n": 40}, {"t": "mcq", "q": "The electronic commerce model that involves transactions between businesses is:", "o": ["B2B", "B2C", "C2B", "C2C "], "a": 0, "e": "B2B is electronic commerce between businesses.", "s": false, "n": 41}, {"t": "mcq", "q": "An approach seeking to understand the information system needs of an entire organization, starting from upper management and cascading downwards.", "o": ["Strategic planning", "Lateral planning", "Bottom-up planning", "Top-down planning "], "a": 3, "e": "Top-down planning aims to understand the whole organization's needs, starting with the mission.", "s": false, "n": 42}, {"t": "mcq", "q": "What do Objective Statements represent?", "o": ["Financial reports of the company", "Daily activities of employees", "Technical specifications of systems", "Qualitative and quantitative goals for the future "], "a": 3, "e": "Objective statements are qualitative and quantitative goals for the future.", "s": false, "n": 43}, {"t": "mcq", "q": "What is a characteristic of electronic commerce?", "o": ["Does not require an online presence", "Only supports Business-to-Consumer (B2C) transactions", "Involves Internet-based business activities", "Limited to government transactions "], "a": 2, "e": "E-commerce involves Internet-based business activities.", "s": false, "n": 44}, {"t": "mcq", "q": "Which of the following describes a Function-to-Process matrix?", "o": ["Maps customer requirements", "Identifies which processes support business functions", "Shows the software architecture", "Analyzes financial data "], "a": 1, "e": "A Function-to-Process matrix identifies which processes support each business function.", "s": false, "n": 45}, {"t": "mcq", "q": "What are the main activities in project identification and selection?", "o": ["Coding and testing", "Designing, implementing, and maintaining", "Analysis, integration, and documentation", "Identifying, classifying, and selecting projects "], "a": 3, "e": "The main activities are identifying, classifying and selecting projects.", "s": false, "n": 46}, {"t": "mcq", "q": "Which of the following is an E-Commerce model?", "o": ["Business-to-Consumer (B2C)", "Service-to-Application (S2A)", "Developer-to-Developer (D2D)", "Function-to-Data (F2D) "], "a": 0, "e": "B2C is an e-commerce model.", "s": false, "n": 47}, {"t": "mcq", "q": "Information systems planning is a ________ process.", "o": ["Four steps", "One step", "Three steps", "Two steps "], "a": 2, "e": "ISP is a three-step process.", "s": false, "n": 48}, {"t": "mcq", "q": "Information systems planning must be a:", "o": ["Top-down process", "Bottom-up process", "Priority process", "Hierarchical process "], "a": 0, "e": "ISP must be top-down so projects align with the organization.", "s": false, "n": 49}, {"t": "mcq", "q": "Human Resource Inventory is completed in ________ of information systems planning.", "o": ["Step 1", "Step 2", "Step 4", "Step 3 "], "a": 0, "e": "The human resource inventory is completed in step 1 of ISP.", "s": false, "n": 50}, {"t": "mcq", "q": "Information systems planning must align with:", "o": ["External vendors", "Personal objectives", "Organizational mission and strategy", "Programming schedules "], "a": 2, "e": "ISP must align with the organizational mission and strategy.", "s": false, "n": 51}, {"t": "mcq", "q": "What does a mission statement define?", "o": ["The structure of data", "The training process", "The coding strategy", "The business of the organization "], "a": 3, "e": "A mission statement defines the business of the organization.", "s": false, "n": 52}, {"t": "mcq", "q": "In Strategic and Planning Systems, the Schedule of projects is associated with ________.", "o": ["Current Enterprise", "Past Enterprise", "Future Enterprise", "Strategic Plan "], "a": 3, "e": "Verified in the textbook (Valacich, Modern Systems Analysis and Design). Figure 4-10 pairs Schedule of Projects with the Strategic Plan.", "s": false, "n": 53}, {"t": "mcq", "q": "In Strategic and Planning Systems, Future Situations of the project are associated with ________.", "o": ["Past Enterprise ", "Strategic Plan", "Current Enterprise", "Future Enterprise "], "a": 3, "e": "The future situation corresponds to the future enterprise in strategic planning.", "s": false, "n": 54}, {"t": "mcq", "q": "________ matrix identifies which business functions are being performed at various organizational locations.", "o": ["Unit to Function", "Function to Objective", "Location to Function", "Location to Unit "], "a": 2, "e": "Location-to-Function shows which functions are performed at which locations.", "s": false, "n": 55}, {"t": "mcq", "q": "Technology Blueprint is completed in ________ of information systems planning.", "o": ["Step 4", "Step 1", "Step 2", "Step 3 "], "a": 2, "e": "The technology blueprint is completed in step 2 of ISP.", "s": false, "n": 56}, {"t": "mcq", "q": "The process of determining where value is added to products and services is called:", "o": ["Risk assessment", "System analysis", "Value chain analysis", "Data structuring "], "a": 2, "e": "Value chain analysis determines where value is added to products and services.", "s": false, "n": 57}, {"t": "mcq", "q": "Which approach to IS planning focuses on solving specific operational problems?", "o": ["Critical path method", "Value chain analysis", "Bottom-up planning", "Top-down planning "], "a": 2, "e": "Bottom-up planning focuses on solving specific operational problems.", "s": false, "n": 58}, {"t": "mcq", "q": "Listing of manual and automated processes is completed in ________ of information systems planning.", "o": ["Step 1", "Step 4", "Step 3", "Step 2 "], "a": 0, "e": "Listing manual and automated processes is done in step 1 of ISP.", "s": false, "n": 59}, {"t": "mcq", "q": "Corporate strategic planning begins with which foundation?", "o": ["A mission statement describing the core purpose of the organization", "A list of software vendors ", "A project schedule", "A data dictionary "], "a": 0, "e": "Corporate strategic planning begins with a mission statement describing the organization's core purpose.", "s": false, "n": 60}, {"t": "mcq", "q": "Which statement best describes the multicriteria selection method?", "o": ["Selecting projects at random", "Selecting the cheapest project only", "Selecting the project requested first", "Using weighted evaluation criteria to compare and select new projects "], "a": 3, "e": "Multicriteria selection compares projects using weighted evaluation criteria.", "s": false, "n": 61}, {"t": "mcq", "q": "What is the purpose of using a scoring model in project selection?", "o": ["To evaluate projects based on weighted criteria", "To measure employee performance", "To estimate coding time", "To test the software "], "a": 0, "e": "A scoring model evaluates projects with weighted criteria to rank them.", "s": false, "n": 62}, {"t": "mcq", "q": "Which IS planning approach seeks to understand the entire organization before identifying specific system projects?", "o": ["A bottom-up approach solving operational problems", "An ad hoc approach", "A top-down approach emphasizing alignment with strategic goals", "A reuse approach "], "a": 2, "e": "Top-down planning understands the whole organization first and aligns with strategy.", "s": false, "n": 63}, {"t": "mcq", "q": "________ is a process of considering short- and long-term projects.", "o": ["Project initiation", "Project selection", "Project closedown", "Project scope "], "a": 1, "e": "Project selection considers short- and long-term projects.", "s": false, "n": 64}, {"t": "mcq", "q": "Bottom-up planning identifies IS development projects based on solving specific operational business problems or taking advantage of specific opportunities.", "o": ["True", "False "], "a": 0, "e": "True: bottom-up planning is based on solving operational problems.", "s": false, "n": 65}, {"t": "mcq", "q": "Corporate strategic planning is a strategy in which the project is reviewed after each phase and continuation of the project is re-justified.", "o": ["True", "False "], "a": 1, "e": "False: reviewing after each phase is incremental commitment, not corporate strategic planning.", "s": false, "n": 66}, {"t": "mcq", "q": "A project identified by the top manager has a greater strategic focus (a top-down project).", "o": ["True", "False "], "a": 0, "e": "True: top-management projects have a broader, strategic focus.", "s": false, "n": 67}, {"t": "mcq", "q": "Analyzing an organization's activities to determine where value is added to products and/or services and the costs incurred for doing so is known as value chain analysis.", "o": ["True", "False "], "a": 0, "e": "True: this describes value chain analysis.", "s": false, "n": 68}, {"t": "mcq", "q": "The process of arranging planning matrix information so that clusters of information with a predetermined level or type of affinity are placed next to each other on a matrix report.", "o": ["Value chain analysis", "Affinity clustering", "Multicriteria analysis", "Incremental commitment "], "a": 1, "e": "Affinity clustering arranges matrix information so related items form clusters.", "s": false, "n": 69}, {"t": "mcq", "q": "Electronic commerce between business partners, such as suppliers and intermediaries.", "o": ["Business-to-business (B2B)", "Business-to-consumer (B2C)", "Business-to-employee (B2E)", "Consumer-to-consumer (C2C) "], "a": 0, "e": "B2B is e-commerce between business partners such as suppliers.", "s": false, "n": 70}, {"t": "mcq", "q": "Electronic commerce between business and consumers.", "o": ["Business-to-business (B2B)", "Business-to-employee (B2E)", "Business-to-consumer (B2C)", "Government-to-business (G2B) "], "a": 2, "e": "B2C is e-commerce between businesses and consumers.", "s": false, "n": 71}, {"t": "mcq", "q": "Electronic commerce between businesses and their employees.", "o": ["Business-to-consumer (B2C)", "Business-to-business (B2B)", "Business-to-government (B2G)", "Business-to-employee (B2E) "], "a": 3, "e": "B2E is e-commerce between a business and its employees.", "s": false, "n": 72}, {"t": "mcq", "q": "A broad class of physical objects that feature an Internet address and connectivity, and communicate with other Internet-enabled devices and systems.", "o": ["Internet", "Internet of Things (IoT)", "Electronic commerce", "Intranet "], "a": 1, "e": "The Internet of Things is physical objects with an Internet address that communicate.", "s": false, "n": 73}, {"t": "mcq", "q": "Analyzing an organization's activities to determine where value is added to products and/or services and the costs incurred for doing so.", "o": ["Value chain analysis", "Multicriteria analysis", "Competitive strategy", "Affinity clustering "], "a": 0, "e": "Value chain analysis shows where value is added to products and services.", "s": false, "n": 74}, {"t": "mcq", "q": "A generic ISP methodology that attempts to gain a broader understanding of the information systems needs of the entire organization.", "o": ["Bottom-up planning", "Top-down planning", "Incremental commitment", "Mission statement "], "a": 1, "e": "Top-down planning gains a broad understanding of the organization's information needs.", "s": false, "n": 75}, {"t": "open", "q": "As an analyst, which type of project would you most likely have contact with in the beginning of your career?", "a": "Bottom-up projects.", "s": false, "n": 76}, {"t": "open", "q": "Considering evaluation criteria for classifying and ranking projects, which criterion concerns improving profits and customer service?", "a": "Potential benefits.", "s": false, "n": 77}, {"t": "open", "q": "How have organizations traditionally allocated IS resources?", "a": "Through attempts to solve isolated organizational problems.", "s": false, "n": 78}, {"t": "open", "q": "How should one think about an organization when conducting a value chain analysis?", "a": "Consider the organization in terms of inputs/outputs.", "s": false, "n": 79}, {"t": "open", "q": "If a project is selected, what is the most likely next step?", "a": "The project will be funded.", "s": false, "n": 80}, {"t": "open", "q": "The SDLC planning phase consists of which activity?", "a": "Project selection.", "s": false, "n": 81}, {"t": "open", "q": "The second activity in the ISP process is ________.", "a": "Describe the target situation, trends, and constraints.", "s": false, "n": 82}, {"t": "open", "q": "What is the final activity in the project identification and selection process?", "a": "Selecting an IS project.", "s": false, "n": 83}, {"t": "open", "q": "What is the first phase of the SDLC method?", "a": "Planning.", "s": false, "n": 84}, {"t": "open", "q": "What is the second major activity in the project identification and selection process?", "a": "Classifying IS development projects.", "s": false, "n": 85}, {"t": "open", "q": "What kind of statement is \"We are in the business of designing, fabricating, and selling to retail stores high-quality wood furniture\"?", "a": "Mission statement.", "s": false, "n": 86}, {"t": "open", "q": "What refers to a broad and timeless goal for the organization?", "a": "The objective statements.", "s": false, "n": 87}, {"t": "open", "q": "When choosing a weighted system to determine project viability, what should the organization keep in mind?", "a": "Weights are subjective.", "s": false, "n": 88}, {"t": "open", "q": "When do executives develop a mission statement?", "a": "During corporate strategic planning.", "s": false, "n": 89}, {"t": "open", "q": "Which approach to planning begins with an analysis of an organization's mission?", "a": "Top-down planning.", "s": false, "n": 90}, {"t": "open", "q": "Which evaluation criterion for classifying and ranking projects deals with the level of difficulty of the project?", "a": "Technical difficulty.", "s": false, "n": 91}, {"t": "open", "q": "Which group chooses projects that most often reflect the larger needs of the organization?", "a": "Steering committee.", "s": false, "n": 92}, {"t": "open", "q": "Which of the following is an example of a project coming from a top-down source?", "a": "A project identified by a steering committee.", "s": false, "n": 93}, {"t": "open", "q": "Which of the following is NOT a general class of Internet electronic commerce?", "a": "G2B.", "s": false, "n": 94}, {"t": "open", "q": "Which of the following is NOT a source for IS development requests?", "a": "Customers.", "s": false, "n": 95}, {"t": "open", "q": "What are the advantages of the top-down planning approach?", "a": "Broader perspective, improved integration, improved management support, and better understanding.", "s": false, "n": 96}, {"t": "open", "q": "What are the steps involved in information systems planning?", "a": "Step 1 – Current situation: listing of manual and automated processes, listing of manual and automated data, technology inventory, human resources inventory. Step 2 – Future (target) situation: blueprints of manual and automated processes, blueprints of manual and automated data, technology blueprints, human resources blueprints. Step 3 – Schedule of projects.", "s": false, "n": 97}, {"t": "open", "q": "Explain the electronic commerce models.", "a": "Business-to-Business (B2B): transactions between businesses. Business-to-Consumer (B2C): transactions between a business and individual consumers. Consumer-to-Consumer (C2C): transactions between consumers (for example eBay). Consumer-to-Business (C2B): individuals sell products or services to businesses. Business-to-Government (B2G): transactions between businesses and government entities. Government-to-Business (G2B): government services provided to businesses. Government-to-Citizen (G2C): government services provided to individual citizens. Thing-to-Thing (T2T): communication between smart devices (Internet of Things).", "s": false, "n": 98}, {"t": "open", "q": "What are the three primary activities of project identification and selection?", "a": "(1) Identifying potential development projects (from top-down and bottom-up sources); (2) classifying and ranking IS development projects (assessing their relative merit); (3) selecting IS development projects (the actual selection for further development).", "s": false, "n": 99}, {"t": "open", "q": "What are some of the project evaluation criteria?", "a": "Value chain analysis, strategic alignment, potential benefits, resource availability, project size/duration, and technical difficulty/risks.", "s": false, "n": 100}, {"t": "open", "q": "What are the three generic competitive strategies?", "a": "Low-cost producer, product differentiation, and product focus or niche focus.", "s": false, "n": 101}, {"t": "open", "q": "Describe the following planning matrices used in ISP and project identification and selection: Location-to-Function, Location-to-Unit, and Unit-to-Function (and Function-to- Objective).", "a": "Location-to-Function matrix: identifies which business functions are being performed at various organizational locations. Location-to-Unit matrix: identifies which organizational units are located in or interact with a specific business location. Unit-to-Function matrix: identifies the relationships between organizational units and each business function. Function-to-Objective matrix: identifies which functions are essential or desirable in achieving each organizational objective.", "s": false, "n": 102}], "4": [{"t": "mcq", "q": "A cost associated with project start-up and development, or system start-up, is the definition of:", "o": ["Tangible cost", "One-time cost", "Recurring cost", "Total cost of ownership "], "a": 1, "e": "A one-time cost is incurred at project or system start-up and development.", "s": false, "n": 1}, {"t": "mcq", "q": "One of the main outcomes from the project initiation and planning phase, which contains the best estimate of a project's scope, benefits, costs, risks, and resource requirements, is the:", "o": ["Business case", "Project Scope Statement", "Break-even analysis", "Baseline Project Plan "], "a": 3, "e": "The Baseline Project Plan (BPP) holds the best estimate of scope, benefits, costs and risks, and is the main outcome of initiation and planning.", "s": false, "n": 2}, {"t": "mcq", "q": "The process of evaluating how key stakeholders within the organization view the proposed system is:", "o": ["Legal and contractual feasibility", "Political feasibility", "Economic feasibility", "Schedule feasibility "], "a": 1, "e": "Political feasibility evaluates how key stakeholders view the proposed system.", "s": false, "n": 3}, {"t": "mcq", "q": "A document prepared for the customer that describes what the project will deliver and outlines generally at a high level all work required to complete the project is the:", "o": ["Business case", "Break-even analysis", "Baseline Project Plan", "Project Scope Statement "], "a": 3, "e": "The project scope statement describes what the project will deliver and outlines the work to do.", "s": false, "n": 4}, {"t": "mcq", "q": "The Baseline Project Plan is a major outcome and deliverable from:", "o": ["Implementation phase", "Project execution", "The project initiation and planning phase", "Analysis phase "], "a": 2, "e": "The BPP is the major deliverable of the project initiation and planning phase.", "s": false, "n": 5}, {"t": "mcq", "q": "The total cost of ownership is:", "o": ["The cost associated with project start-up", "The cost of owning and operating the system excluding maintenance cost", "The cost of owning and operating the system including maintenance cost", "The total cost of acquisition only "], "a": 2, "e": "TCO is the cost of owning and operating a system over its life, including acquisition.", "s": false, "n": 6}, {"t": "mcq", "q": "Which of the following is NOT related to the project initiation tasks and activities?", "o": ["Relationship with customers", "Develop communication plan", "Project workbook", "Initiation team "], "a": 1, "e": "Developing a communication plan belongs to planning, not to initiation tasks.", "s": false, "n": 7}, {"t": "mcq", "q": "\"If you own $1000 today it will not be worth the same in five years' time.\" Which of the following terms represents this statement?", "o": ["Break-even analysis", "Return on investment", "One-time cost", "Net present value "], "a": 3, "e": "Money today is worth more than the same amount later; net present value accounts for this time value.", "s": false, "n": 8}, {"t": "mcq", "q": "Cost reduction and avoidance is one of the ______ categories.", "o": ["Intangible cost", "Tangible benefit", "Tangible cost", "Intangible benefit "], "a": 1, "e": "Cost reduction and avoidance is a category of tangible benefits.", "s": false, "n": 9}, {"t": "mcq", "q": "______ is a cost associated with an information system that cannot be easily measured in terms of dollars or with certainty.", "o": ["One-time cost", "Intangible cost", "Recurring cost", "Tangible cost "], "a": 1, "e": "An intangible cost cannot be easily measured in dollars.", "s": false, "n": 10}, {"t": "mcq", "q": "The ______ uses a discount rate determined from the company's cost of capital to establish the present value of the project.", "o": ["Break-Even Analysis (BEA)", "Discount Analysis (DA)", "Return on Investment (ROI)", "Net Present Value (NPV) "], "a": 3, "e": "NPV discounts future cash flows using a discount rate based on the company's cost of capital.", "s": false, "n": 11}, {"t": "mcq", "q": "The project feasibility that includes the process of assessing the development organization's ability to construct a proposed system, and takes into account various project risk factors, is called:", "o": ["Political feasibility", "Economic feasibility", "Operational feasibility", "Technical feasibility "], "a": 3, "e": "Technical feasibility assesses whether the organization can build the proposed system with its skills and technology.", "s": false, "n": 12}, {"t": "mcq", "q": "Operational feasibility is the process of assessing:", "o": ["The degree to which a proposed system solves business problems or takes advantage of business opportunities", "The degree to which the potential time frame and completion dates for all major activities within a project meet organizational deadlines and constraints", "How key stakeholders within the organization view the proposed system", "Potential legal and contractual ramifications due to the construction of a system "], "a": 0, "e": "Operational feasibility asks how well the proposed system solves the problems and fits organizational needs.", "s": false, "n": 13}, {"t": "mcq", "q": "The cost of owning and operating a system, including the total cost of acquisition, as well as all costs associated with its ongoing use and maintenance, is:", "o": ["Discount rate", "Present value", "Time value of money (TVM)", "Total cost of ownership (TCO) "], "a": 3, "e": "TCO covers the cost of owning and operating the system, including acquisition.", "s": false, "n": 14}, {"t": "mcq", "q": "In the third phase of project management (executing the project), we execute and monitor the project progress against the ______.", "o": ["System Service Request", "Request for proposal (RFP)", "Workbook", "Baseline Project Plan "], "a": 3, "e": "During execution the project is run and monitored against the Baseline Project Plan.", "s": false, "n": 15}, {"t": "mcq", "q": "The cost resulting from the ongoing evolution and use of a system is called:", "o": ["Possible cost", "One-time cost", "Recurring cost", "Total cost of ownership "], "a": 2, "e": "Costs from ongoing use and evolution of a system are recurring costs.", "s": false, "n": 16}, {"t": "mcq", "q": "______ is often referred to as cost-benefit analysis.", "o": ["Political feasibility", "Operational feasibility", "Economic feasibility "], "a": 2, "e": "Economic feasibility is also called cost-benefit analysis.", "s": false, "n": 17}, {"t": "mcq", "q": "A peer group review of any product created during the systems development process, also called a structured walk-through, is called a:", "o": ["Roles", "Walk-through "], "a": 1, "e": "A walk-through is a peer review of a development product.", "s": false, "n": 18}, {"t": "mcq", "q": "All the information collected during project initiation and planning is collected and organized into a document called the:", "o": ["Scope Statement", "Baseline Project Plan "], "a": 1, "e": "Information collected during initiation and planning is organized into the BPP.", "s": false, "n": 19}, {"t": "mcq", "q": "A type of cost-benefit analysis to identify at what point (if ever) benefits equal costs is:", "o": ["Break-even analysis", "Net Present Value "], "a": 0, "e": "Break-even analysis finds when (if ever) benefits equal costs.", "s": false, "n": 20}, {"t": "mcq", "q": "The ratio of cash receipts to cash outlays is:", "o": ["Net Present Value (NPV)", "Return on Investment (ROI)", "Break-Even Analysis (BEA) "], "a": 1, "e": "ROI is the ratio of cash receipts to cash outlays.", "s": false, "n": 21}, {"t": "mcq", "q": "The sum of PVs across years, which calculates the time value of money, is:", "o": ["NPV", "ROI", "PVn "], "a": 0, "e": "NPV is the sum of present values across years, accounting for time value of money.", "s": false, "n": 22}, {"t": "mcq", "q": "The present value of Y dollars n years from now based on a discount rate of i is:", "o": ["PVn", "NPV", "ROI "], "a": 0, "e": "PVn = Y / (1 + i)^n: the present value of Y dollars n years from now at discount rate i.", "s": false, "n": 23}, {"t": "mcq", "q": "The amount of time required for cumulative cash flow to equal initial and ongoing investment is:", "o": ["Return on Investment (ROI)", "Break-Even Analysis (BEA)", "Net Present Value (NPV) "], "a": 1, "e": "BEA gives the time for cumulative cash flow to equal the initial and ongoing investment.", "s": false, "n": 24}, {"t": "mcq", "q": "Which walk-through role reviews the work product in terms of future maintenance activities?", "o": ["Secretary", "Presenter", "Maintenance oracle "], "a": 2, "e": "The maintenance oracle reviews the work product for future maintenance concerns.", "s": false, "n": 25}, {"t": "mcq", "q": "The justification for an information system, presented in terms of the tangible and intangible economic benefits, is the:", "o": ["Project Scope Statement (PSS)", "Business case", "Baseline Project Plan (BPP) "], "a": 1, "e": "A business case justifies an IS in terms of its tangible and intangible benefits and costs.", "s": false, "n": 26}, {"t": "mcq", "q": "The process of assessing potential legal and contractual ramifications due to the construction of a system is:", "o": ["Schedule feasibility", "Political feasibility", "Operational feasibility", "Legal and contractual feasibility "], "a": 3, "e": "Legal and contractual feasibility assesses legal and contractual consequences of building the system.", "s": false, "n": 27}, {"t": "mcq", "q": "System specifications, logical and physical designs, program code, test procedures, manuals and documentation: a walk-through:", "o": ["Roles", "Can be applied to BPP", "Is a walk-through "], "a": 1, "e": "Walk-throughs can be applied to specifications, designs, code, test procedures, manuals and the BPP.", "s": false, "n": 28}, {"t": "mcq", "q": "Which walk-through role describes the work product to the group? The role is usually filled by an analyst.", "o": ["Secretary", "Coordinator", "Presenter", "User "], "a": 2, "e": "The presenter describes the work product to the group, usually its author.", "s": false, "n": 29}, {"t": "mcq", "q": "Which walk-through role plans the meeting and facilitates it, and could be the project leader or a lead analyst?", "o": ["User", "Presenter", "Secretary", "Coordinator "], "a": 3, "e": "The coordinator plans the meeting and facilitates it.", "s": false, "n": 30}, {"t": "mcq", "q": "A process of identifying the financial benefits and costs associated with a development project is:", "o": ["Economic feasibility", "Legal and contractual feasibility", "Political feasibility "], "a": 0, "e": "Economic feasibility identifies the financial benefits and costs of a project.", "s": false, "n": 31}, {"t": "mcq", "q": "Which walk-through role makes sure that the work product meets the needs of the project's customers? This person would usually be someone not on the project team.", "o": ["User", "Coordinator", "Standards bearer "], "a": 0, "e": "The user ensures the work product meets the customer's needs.", "s": false, "n": 32}, {"t": "mcq", "q": "Which walk-through role takes notes and records decisions or recommendations made by the group?", "o": ["Standards bearer", "Maintenance oracle", "Secretary", "Presenter "], "a": 2, "e": "The secretary takes notes and records decisions.", "s": false, "n": 33}, {"t": "mcq", "q": "Assessing project feasibility includes: schedule, legal and contractual, economic, political, technical, and operational feasibility.", "o": ["Schedule feasibility only", "Economic and technical feasibility only", "Political feasibility only", "All of the above "], "a": 3, "e": "Feasibility includes schedule, legal/contractual, economic, political, technical and operational, so all apply.", "s": false, "n": 34}, {"t": "mcq", "q": "Which walk-through role ensures that the work product adheres to organizational technical standards?", "o": ["Secretary", "Presenter", "Maintenance oracle ", "Standards bearer "], "a": 3, "e": "The standards bearer checks adherence to organizational technical standards.", "s": false, "n": 35}, {"t": "mcq", "q": "A cost associated with an information system that can be measured in dollars and with certainty is:", "o": ["Tangible cost", "One-time cost", "Intangible cost", "Total cost of ownership (TCO) "], "a": 0, "e": "A tangible cost can be measured in dollars with certainty.", "s": false, "n": 36}, {"t": "mcq", "q": "Coordinator, presenter, user, secretary, standards bearer, maintenance oracle are:", "o": ["Walk-through", "Roles", "Can be applied to BPP "], "a": 1, "e": "These are the roles in a structured walkthrough.", "s": false, "n": 37}, {"t": "mcq", "q": "The process of assessing the degree to which the potential time frame and completion dates for all major activities within a project meet organizational deadlines and constraints for affecting change is:", "o": ["Operational feasibility", "Schedule feasibility", "Political feasibility", "Legal and contractual feasibility "], "a": 1, "e": "Schedule feasibility assesses whether the time frame and completion dates are reasonable.", "s": false, "n": 38}, {"t": "mcq", "q": "Financial measurements for economic feasibility include:", "o": ["Net Present Value (NPV)", "All of the above", "Break-Even Analysis (BEA)", "Return on Investment (ROI) "], "a": 1, "e": "Economic measures include NPV, ROI and break-even analysis, so all apply.", "s": false, "n": 39}, {"t": "mcq", "q": "Which feasibility type takes into account various project risk factors?", "o": ["Technical feasibility", "Economic feasibility", "Political feasibility", "Operational feasibility "], "a": 0, "e": "Technical feasibility accounts for risk factors such as project size, familiarity and technology.", "s": false, "n": 40}, {"t": "mcq", "q": "You invest $2000 today in a project that will give you $1000 in the first year and $1400 in the second year. The interest rate is 20%. Using PVn = Y x 1/(1+i)^n, what is the NPV, and would you go for it?", "o": ["NPV = +$1,416.66; accept the project", "NPV = -$194.45; reject the project ", "NPV = +$194.45; accept the project", "NPV = -$583.33; reject the project "], "a": 1, "e": "A negative NPV means the project returns less than it costs in present value, so reject it.", "s": false, "n": 41}, {"t": "mcq", "q": "A major risk of failing to assess and manage technical risks is:", "o": ["Improved system integration", "Failure to achieve adequate system performance levels", "More accurate cost estimates", "Guaranteed attainment of expected benefits "], "a": 1, "e": "Unmanaged technical risk leads to failure to achieve adequate system performance.", "s": false, "n": 42}, {"t": "mcq", "q": "Total Cost of Ownership (TCO) includes:", "o": ["Only hardware acquisition costs", "Acquisition plus ongoing use and maintenance costs", "Only recurring operating costs", "Only training and consulting costs "], "a": 1, "e": "TCO includes acquisition plus ongoing use and maintenance.", "s": false, "n": 43}, {"t": "mcq", "q": "Break-even analysis (BEA) aims to identify:", "o": ["The number of requirements collected per week", "Which stakeholders oppose the project", "When cumulative cash flow equals initial and ongoing investment", "When the project reaches the design phase "], "a": 2, "e": "BEA identifies when cumulative cash flow equals the initial and ongoing investment.", "s": false, "n": 44}, {"t": "mcq", "q": "In risk assessment, \"number of organizational departments involved\" is an example under:", "o": ["User group", "Project size", "Development group", "Legal feasibility "], "a": 1, "e": "Number of departments involved is part of project size in risk assessment.", "s": false, "n": 45}, {"t": "mcq", "q": "A recommended guideline for better cost estimating is to:", "o": ["Avoid updating estimates once approved", "Record progress but not discrepancies", "Use historical data to improve estimates of costs, risks, schedules, and resources", "Use only new staff to create estimates "], "a": 2, "e": "Better estimates come from using historical data on similar projects.", "s": false, "n": 46}, {"t": "mcq", "q": "Technical feasibility is the process of assessing the organization's ability to:", "o": ["Comply with laws and contracts ", "Reduce all costs to zero", "Gain political support from stakeholders", "Construct the proposed system "], "a": 3, "e": "Technical feasibility is about the ability to construct the proposed system.", "s": false, "n": 47}, {"t": "mcq", "q": "Which pairing is correct?", "o": ["One-time costs = only software; Recurring costs = only hardware", "One-time costs = only intangible costs; Recurring costs = only tangible costs", "One-time costs = ongoing evolution and use; Recurring costs = start-up only", "One-time costs = start-up development; Recurring costs = ongoing use/evolution "], "a": 3, "e": "One-time costs are start-up/development costs; recurring costs are ongoing operation and maintenance.", "s": false, "n": 48}, {"t": "mcq", "q": "Which of the following is a project initiation task?", "o": ["Develop preliminary schedule", "Create preliminary budget", "Establish the project workbook", "Identify and assess risk "], "a": 2, "e": "Establishing the project workbook is an initiation task.", "s": false, "n": 49}, {"t": "mcq", "q": "Net Present Value (NPV) primarily accounts for:", "o": ["Staff availability using a skills matrix", "Time value of money using a discount rate", "Stakeholder politics and influence", "System usability and user satisfaction "], "a": 1, "e": "NPV applies a discount rate to account for the time value of money.", "s": false, "n": 50}, {"t": "mcq", "q": "Which option is a project risk assessment factor category used to evaluate project risk during initiation and planning?", "o": ["Social media engagement", "Development group", "Customer pricing model", "Public relation strategy "], "a": 1, "e": "Risk factors in assessment include project size, structure, and the development group.", "s": false, "n": 51}, {"t": "mcq", "q": "Which set correctly lists the major sections typically included in a Baseline Project Plan (BPP)?", "o": ["Scope; WBS; Sprint backlog; Release notes", "Background; UML diagrams; Coding standards; Maintenance logs", "Introduction; Database design; Testing; Deployment", "Introduction; System description; Feasibility assessment; Management issues "], "a": 3, "e": "A BPP contains an introduction, system description, feasibility, management issues and so on.", "s": false, "n": 52}, {"t": "mcq", "q": "Which role is NOT listed among walk-through roles?", "o": ["Presenter", "Standard-bearer ", "Data scientist", "Maintenance oracle "], "a": 2, "e": "Walk-through roles are coordinator, presenter, user, secretary, standards bearer and maintenance oracle. \"Data scientist\" is not one.", "s": false, "n": 53}, {"t": "mcq", "q": "Return on Investment (ROI) is best described as:", "o": ["A method for estimating staff productivity", "A list of intangible costs and benefits", "The time required for costs to exceed benefits", "A ratio of cash receipts to cash outlays "], "a": 3, "e": "ROI is a ratio of cash receipts to cash outlays.", "s": false, "n": 54}, {"t": "mcq", "q": "The Baseline Project Plan (BPP) is best described as a document that:", "o": ["Is produced after implementation", "Includes only a technical architecture diagram", "Replaces requirements analysis entirely", "Organizes information collected during initiation and planning "], "a": 3, "e": "The BPP organizes information collected during initiation and planning to serve as the project foundation.", "s": false, "n": 55}, {"t": "mcq", "q": "Which type of feasibility assesses the financial benefits and costs associated with a project?", "o": ["Economic Feasibility", "Technical Feasibility", "Operational Feasibility", "Legal Feasibility "], "a": 0, "e": "Economic feasibility evaluates financial benefits and costs.", "s": false, "n": 56}, {"t": "mcq", "q": "The major deliverable from the project initiation and planning phase is:", "o": ["Baseline Project Plan", "Project Schedule", "Project Scope Statement", "Risk Management Plan "], "a": 0, "e": "The major deliverable of initiation and planning is the BPP.", "s": false, "n": 57}, {"t": "mcq", "q": "What does \"Break-Even Analysis (BEA)\" determine in financial analysis?", "o": ["The ratio of cash receipts to cash outlays", "The amount of time required for cumulative cash flow to equal initial and ongoing investment", "The discount rate used to determine present value", "The point at which cumulative cash flow equals initial and ongoing investment costs "], "a": 1, "e": "Verified in the textbook (Valacich, Modern Systems Analysis and Design). BEA finds the time for cumulative cash flow to equal the investment.", "s": false, "n": 58}, {"t": "mcq", "q": "What is economic feasibility concerning a development project?", "o": ["Assessing the environmental impact of the project", "Evaluating the technical requirements of the project", "Determining the project's timeline and milestones ", "Identifying the financial benefits and costs associated with the project "], "a": 3, "e": "Economic feasibility identifies the project's financial benefits and costs.", "s": false, "n": 59}, {"t": "mcq", "q": "What does \"Total Cost of Ownership (TCO)\" encompass regarding a system?", "o": ["The cost of owning and operating a system, including acquisition, ongoing use, and maintenance", "The initial purchase cost of the system", "The cost of hiring personnel to implement the system", "The cost of acquiring new hardware for the system "], "a": 0, "e": "TCO is the cost of owning and operating a system, including acquisition.", "s": false, "n": 60}, {"t": "mcq", "q": "Which type of feasibility measures the extent to which the system will solve identified problems?", "o": ["Operational feasibility", "Technical feasibility", "Legal feasibility", "Political feasibility "], "a": 0, "e": "Operational feasibility measures how well the system solves problems and fits organizational needs.", "s": false, "n": 61}, {"t": "mcq", "q": "Which activity ensures that project deliverables are reviewed formally by peers and stakeholders?", "o": ["User training workshops", "Post-implementation reviews", "Structured walkthroughs", "Technical feasibility analysis "], "a": 2, "e": "Structured walk-throughs are formal peer and stakeholder reviews of deliverables.", "s": false, "n": 62}, {"t": "mcq", "q": "Which of the following roles is NOT typically part of a structured walkthrough?", "o": ["The presenter", "The recorder", "The maintenance operator", "The project manager "], "a": 3, "e": "The project manager is not a defined walk-through role.", "s": false, "n": 63}, {"t": "mcq", "q": "Which document serves as a foundation for the entire project and includes scope, objectives, benefits, and deliverables?", "o": ["Baseline Project Plan (BPP)", "User acceptance report", "Final deployment contract", "System maintenance manual "], "a": 0, "e": "The BPP is the foundation document: scope, objectives, benefits, costs and risks.", "s": false, "n": 64}, {"t": "mcq", "q": "Which financial technique discounts future benefits and costs to their present value?", "o": ["Payback method", "Break-even analysis (BEA) ", "Net Present Value (NPV)", "Return on Investment (ROI) "], "a": 2, "e": "NPV discounts future benefits and costs to present value.", "s": false, "n": 65}, {"t": "mcq", "q": "Which document defines project team responsibilities?", "o": ["Marketing Strategy Document", "Task Responsibility Matrix", "Business Case", "Risk Assessment Report "], "a": 1, "e": "The task responsibility matrix defines who on the project team is responsible for what.", "s": false, "n": 66}, {"t": "mcq", "q": "What is the main purpose of a Baseline Project Plan (BPP)?", "o": ["To outline the project scope, benefits, costs, risks, and resource requirements", "To finalize the project budget", "To provide a detailed schedule for the project", "To assign tasks to team members "], "a": 0, "e": "The BPP outlines project scope, benefits, costs and risks.", "s": false, "n": 67}, {"t": "mcq", "q": "Which feasibility type determines whether a project meets organizational deadlines?", "o": ["Political feasibility", "Technical feasibility", "Schedule feasibility", "Economic feasibility "], "a": 2, "e": "Schedule feasibility checks whether the project can meet deadlines.", "s": false, "n": 68}, {"t": "mcq", "q": "Which of the following is an example of a tangible benefit?", "o": ["Brand reputation improvement", "Employee satisfaction", "Customer perception", "Cost reduction and avoidance "], "a": 3, "e": "Cost reduction and avoidance is a tangible benefit.", "s": false, "n": 69}, {"t": "mcq", "q": "What is a one-time cost?", "o": ["A regular employee salary", "A recurring expense over the project's lifetime", "A customer acquisition expense", "A cost associated with project start-up and development "], "a": 3, "e": "A one-time cost is incurred at project start-up and development.", "s": false, "n": 70}, {"t": "mcq", "q": "Total cost of ownership (TCO) is the cost of owning and operating a system, including the total cost of acquisition, as well as all costs associated with its ongoing use and maintenance.", "o": ["True", "False "], "a": 0, "e": "True: that is the definition of TCO.", "s": false, "n": 71}, {"t": "mcq", "q": "Net Present Value (NPV) is a type of cost-benefit analysis to identify at what point (if ever) benefits equal costs.", "o": ["True", "False "], "a": 1, "e": "False: that describes break-even analysis; NPV measures present value of cash flows.", "s": false, "n": 72}, {"t": "mcq", "q": "One-time cost is a cost resulting from the ongoing evolution and use of a system.", "o": ["True", "False "], "a": 1, "e": "False: that defines recurring costs; one-time costs are start-up costs.", "s": false, "n": 73}, {"t": "mcq", "q": "______ is the process of defining clear activities necessary to complete activities in a single project.", "o": ["Project planning", "Project initiation", "Project execution", "Project closedown "], "a": 0, "e": "Project planning defines clear, discrete activities for the work within a single phase.", "s": false, "n": 74}, {"t": "mcq", "q": "______ need to be managed in order to be minimized.", "o": ["Costs", "Risks", "Benefits", "Deliverables "], "a": 1, "e": "Risks need to be managed so they can be minimized.", "s": false, "n": 75}, {"t": "mcq", "q": "All of the following are categories of feasibility except ______.", "o": ["Economic", "Technical", "Scope", "Political "], "a": 2, "e": "The feasibility categories are economic, technical, operational, schedule, legal/contractual and political. Scope is not one.", "s": false, "n": 76}, {"t": "mcq", "q": "All of the following are included in the baseline project report except ______.", "o": ["Introduction", "System description", "Conclusion", "Feasibility assessment "], "a": 2, "e": "A BPP has introduction, system description, feasibility, management issues and so on; \"conclusion\" is not listed.", "s": false, "n": 77}, {"t": "mcq", "q": "All of the following are tangible benefits except ______.", "o": ["Cost reduction and avoidance ", "Error reduction", "Increased speed of activity", "Decreased flexibility "], "a": 3, "e": "Decreased flexibility is a negative (intangible cost), not a tangible benefit.", "s": false, "n": 78}, {"t": "mcq", "q": "Each organization has to decide its acceptable project mix of ______.", "o": ["Costs", "Staff", "Risks", "Vendors "], "a": 2, "e": "Each organization decides its acceptable mix of project risks.", "s": false, "n": 79}, {"t": "mcq", "q": "Failure to integrate the new system with the old system is an example of ______.", "o": ["Failure to assess and manage risks", "Schedule feasibility", "A tangible benefit", "A one-time cost "], "a": 0, "e": "Failing to integrate with the old system is a risk that was not assessed and managed.", "s": false, "n": 80}, {"t": "mcq", "q": "Which of the following is NOT an example of a type of feasibility study?", "o": ["Technical feasibility", "Operational feasibility", "Resource feasibility", "Schedule feasibility "], "a": 2, "e": "Resource feasibility is not one of the standard feasibility types.", "s": false, "n": 81}, {"t": "mcq", "q": "What is the term that describes the best estimate of a project's scope, benefits, cost, and resources?", "o": ["Business case", "Baseline project plan", "Break-even analysis", "Project charter "], "a": 1, "e": "The Baseline Project Plan is the best estimate of scope, benefits, cost and resources.", "s": false, "n": 82}, {"t": "mcq", "q": "What makes all projects feasible?", "o": ["Unlimited resources and infinite time", "A skilled project team", "Executive approval", "A low budget "], "a": 0, "e": "Only unlimited resources and infinite time would make all projects feasible.", "s": false, "n": 83}, {"t": "mcq", "q": "Which document outlines all work required to complete the project?", "o": ["Business case", "System Service Request ", "Project scope document", "Walk-through review form "], "a": 2, "e": "The project scope document outlines all the work required.", "s": false, "n": 84}, {"t": "mcq", "q": "Which feasibility category deals with identifying financial benefits associated with the project?", "o": ["Economic", "Technical", "Political", "Schedule "], "a": 0, "e": "Economic feasibility deals with financial benefits.", "s": false, "n": 85}, {"t": "mcq", "q": "Which of the following is an example of a tangible benefit?", "o": ["Customer goodwill", "Error reduction in data entry", "Improved employee morale", "Brand image "], "a": 1, "e": "Error reduction in data entry can be measured in dollars, so it is a tangible benefit.", "s": false, "n": 86}, {"t": "mcq", "q": "Which of the following is an example of an intangible cost?", "o": ["Customer goodwill", "Equipment purchase", "Training fees", "Software license "], "a": 0, "e": "Customer goodwill is hard to measure in dollars, so it is an intangible cost.", "s": false, "n": 87}, {"t": "mcq", "q": "Which of the following is NOT a factor in determining legal and contractual feasibility?", "o": ["Intellectual property", "Contract obligations", "Financial budgets", "Software licensing "], "a": 2, "e": "Legal and contractual feasibility is about laws and contracts, not financial budgets.", "s": false, "n": 88}, {"t": "mcq", "q": "Which of the following is NOT a factor in determining schedule feasibility?", "o": ["Organizational deadlines", "Time frame of major activities", "A 45-hour work week", "Completion dates "], "a": 2, "e": "Schedule feasibility looks at deadlines and durations. A 45-hour work week is not a schedule factor in this list.", "s": false, "n": 89}, {"t": "mcq", "q": "Which of the following is NOT a way to manage project risks?", "o": ["Assigning highly skilled project members", "Using proven technology", "Changing the budget ", "Dividing the project into smaller phases "], "a": 2, "e": "Risks are managed by assessing, planning and monitoring them. Changing the budget is not a standard way.", "s": false, "n": 90}, {"t": "mcq", "q": "Which of the following is NOT an example of a recurring cost?", "o": ["Application software maintenance", "Incremental data storage expenses", "System conversion", "Incremental communications "], "a": 2, "e": "System conversion is a one-time cost, not recurring.", "s": false, "n": 91}, {"t": "mcq", "q": "Which of the options below means the organization has the ability to build the requested system?", "o": ["Operational feasibility", "Technical feasibility", "Political feasibility", "Schedule feasibility "], "a": 1, "e": "Technical feasibility: the organization has the ability to build the requested system.", "s": false, "n": 92}, {"t": "mcq", "q": "Which part of the baseline project report contains an outline of the recommended course of action?", "o": ["Introduction", "System description", "Feasibility assessment", "Management issues "], "a": 0, "e": "The introduction of the BPP outlines the recommended course of action.", "s": false, "n": 93}, {"t": "mcq", "q": "Which role in the walk-through normally has done all or some of the work presented?", "o": ["Secretary", "Coordinator", "Presenter", "User "], "a": 2, "e": "The presenter usually did some or all of the work presented.", "s": false, "n": 94}, {"t": "mcq", "q": "Which term means that money available today is worth more than the same amount tomorrow?", "o": ["Time value of money", "Return on investment", "Break-even analysis", "Total cost of ownership "], "a": 0, "e": "Time value of money means money today is worth more than the same amount later.", "s": false, "n": 95}, {"t": "mcq", "q": "Which type of feasibility deals with project duration?", "o": ["Schedule feasibility", "Political feasibility", "Legal feasibility ", "Technical feasibility "], "a": 0, "e": "Schedule feasibility deals with project duration.", "s": false, "n": 96}, {"t": "mcq", "q": "Which type of project should companies not have too many of?", "o": ["High risk", "Low risk", "Small", "Short "], "a": 0, "e": "Companies should not have too many high-risk projects.", "s": false, "n": 97}, {"t": "mcq", "q": "Who must review the baseline project plan before it moves to the next phase in the SDLC?", "o": ["The users, managers, and development group", "Only the CIO", "Only the customer", "External auditors "], "a": 0, "e": "Users, managers and the development group review the BPP before the next phase.", "s": false, "n": 98}, {"t": "mcq", "q": "Which term names an automated software estimation model that uses historical project data and current as well as future project characteristics to estimate project costs?", "o": ["PERT", "COCOMO (Constructive Cost Model)", "NPV", "ROI "], "a": 1, "e": "COCOMO is an automated software estimation model using historical project data.", "s": false, "n": 99}, {"t": "mcq", "q": "The rate of return used to compute the present value of future cash flows is the ________.", "o": ["Discount rate", "Return on investment", "Total cost of ownership", "Slack time "], "a": 0, "e": "The discount rate is the rate of return used to compute present value.", "s": false, "n": 100}, {"t": "mcq", "q": "A benefit derived from the creation of an information system that cannot be easily measured in dollars or with certainty is a(n) ________.", "o": ["Tangible benefit", "Intangible benefit", "Tangible cost", "Recurring cost "], "a": 1, "e": "An intangible benefit cannot be easily measured in dollars.", "s": false, "n": 101}, {"t": "mcq", "q": "The current value of a future cash flow is the ________.", "o": ["Net present value", "Present value", "Discount rate", "Break-even point "], "a": 1, "e": "Present value is the current value of a future cash flow.", "s": false, "n": 102}, {"t": "mcq", "q": "A benefit derived from the creation of an information system that can be measured in dollars and with certainty is a(n) ________.", "o": ["Intangible benefit", "Tangible cost", "Tangible benefit", "One-time cost "], "a": 2, "e": "A tangible benefit can be measured in dollars with certainty.", "s": false, "n": 103}, {"t": "mcq", "q": "A cost resulting from the ongoing evolution and use of a system is a(n) ________.", "o": ["One-time cost", "Recurring cost", "Tangible cost", "Total cost of ownership "], "a": 1, "e": "A cost from ongoing use and evolution of the system is recurring.", "s": false, "n": 104}, {"t": "open", "q": "List any six tasks for project planning.", "a": "Any six of: describe project scope, alternatives, and feasibility; divide the project into tasks; estimate resource requirements and create a resource plan; develop a preliminary schedule; develop a communication plan; determine standards and procedures; identify and assess risk; create a preliminary budget; develop a statement of work; set the baseline project plan.", "s": false, "n": 105}, {"t": "open", "q": "Differentiate between tangible and intangible costs, with examples.", "a": "Tangible cost: a cost associated with an information system that can be measured in dollars and with certainty (for example, purchasing new equipment). Intangible cost: a cost that ca pinions, often anonymously, during requirements work.", "s": false, "n": 7}, {"t": "mcq", "q": "Which of the following belongs to open-ended questions?", "o": ["Non-conversational", "Has no specific answers", "Has limited range of answers", "Structured "], "a": 1, "e": "Open-ended questions have no specific, pre-set answers.", "s": false, "n": 8}, {"t": "mcq", "q": "Which of the following is NOT a contemporary way of requirements determination?", "o": ["Joint Application Design", "Interviewing groups", "CASE tools", "Group Support Systems "], "a": 1, "e": "Interviewing groups is a traditional method; JAD, GSS and prototyping are contemporary.", "s": false, "n": 9}, {"t": "mcq", "q": "The questions in interviews that have pre-specified answers (specified responses) are called:", "o": ["Closed-ended questions", "Open-ended questions", "Leading questions", "Clarifying questions "], "a": 0, "e": "Closed-ended questions have pre-specified answers.", "s": false, "n": 10}, {"t": "mcq", "q": "______ is the way a system actually works in practice.", "o": ["Informal system", "Ideal system", "Current state system", "Formal system "], "a": 0, "e": "The informal system is how a system actually works in practice.", "s": false, "n": 11}, {"t": "mcq", "q": "The scribe is the person who ______ during the JAD session.", "o": ["Makes detailed notes of the happenings", "Contributes his/her ideas on the technical limitations of current systems", "Provides insight into new organizational directions and motivations", "Learns from users and managers, not to run or dominate the process "], "a": 0, "e": "The scribe makes detailed notes of what happens during the JAD session.", "s": false, "n": 12}, {"t": "mcq", "q": "At the beginning of the ______ process, group members work alone to generate ideas that are pooled under the guidance of a trained facilitator.", "o": ["Nominal Group Technique", "Joint Application Design", "Business Process Reengineering", "Key Business Processes "], "a": 0, "e": "In the Nominal Group Technique members first work alone to generate ideas.", "s": false, "n": 13}, {"t": "mcq", "q": "When organizations want to make an essential business change, they use ______ to break the current long-held business rules that prevent this change.", "o": ["Prototyping", "Joint application design", "Business process reengineering", "Disruptive technologies "], "a": 3, "e": "Disruptive technologies let organizations break the rules that hold them back.", "s": false, "n": 14}, {"t": "mcq", "q": "Which of the following is NOT an advantage of the interviewing groups technique?", "o": ["Easier to schedule", "Saving time", "Can hear agreements and disagreements at the same time", "Opportunity for synergies "], "a": 0, "e": "Group interviews are not easier to schedule; scheduling is their main disadvantage.", "s": false, "n": 15}, {"t": "mcq", "q": "Which of the following statements is considered a drawback of prototyping?", "o": ["Managers must make all decisions", "Information can appear in only one place at a time", "Must choose between centralization and decentralization", "Tendency to avoid formal documentation "], "a": 3, "e": "A drawback of prototyping is the tendency to avoid formal documentation.", "s": false, "n": 16}, {"t": "mcq", "q": "Finding synergies and contrasts among system requirements can be achieved by one of the following methods:", "o": ["Interviewing groups", "Studying business documents", "Interviewing individuals", "Observing workers "], "a": 0, "e": "Interviewing groups lets you find synergies and contrasts among requirements.", "s": false, "n": 17}, {"t": "mcq", "q": "______ is one of the traditional methods of collecting system requirements, used to discover reported issues, policies, rules, and directions in the organization.", "o": ["Observing workers", "Studying business documents", "Interviewing groups", "Interviewing individuals "], "a": 1, "e": "Studying business documents is a traditional method for discovering existing procedures and data.", "s": false, "n": 18}, {"t": "mcq", "q": "You are running a group interview to collect system requirements. The participants have different personalities (shy, talkative, etc.) and you need to give equal opportunity to everyone. Which technique will you use?", "o": ["Directly observing users", "Agile usage-centered design", "Business process reengineering", "Nominal Group Technique "], "a": 3, "e": "NGT handles participants with different views by letting each contribute ideas independently.", "s": false, "n": 19}, {"t": "mcq", "q": "A(n) ______ could be used to complement the work done in a typical group interview or as part of a Joint Application Design effort.", "o": ["Nominal Group Technique (NGT) process", "Nominal Group Technique (NGT) exercise "], "a": 1, "e": "An NGT exercise can complement a group interview or replace it.", "s": false, "n": 20}, {"t": "mcq", "q": "Interview transcripts, observation notes, and meeting minutes are deliverables that come from:", "o": ["Existing written documents", "Interviews and observations", "Computerized sources "], "a": 1, "e": "Interviews and observations produce transcripts, observation notes and minutes.", "s": false, "n": 21}, {"t": "mcq", "q": "Mission and strategy statements, business forms, procedure manuals, job descriptions, training manuals, system documentation, and flowcharts are deliverables that come from:", "o": ["Computerized sources", "Interviews and observations", "Existing written documents "], "a": 2, "e": "Mission statements, forms, procedure manuals and job descriptions are existing written documents.", "s": false, "n": 22}, {"t": "mcq", "q": "Intensive group-oriented requirements determination technique:", "o": ["Joint Application Design (JAD)", "System prototypes", "CASE tools", "Group Support Systems "], "a": 0, "e": "JAD is the intensive group-oriented requirements technique.", "s": false, "n": 23}, {"t": "mcq", "q": "JAD session results, CASE repositories, system prototype displays, and reports are deliverables that come from:", "o": ["Computerized sources", "Interviews and observations", "Existing written documents "], "a": 0, "e": "JAD results, CASE repositories, prototypes and reports are computerized sources.", "s": false, "n": 24}, {"t": "mcq", "q": "Which one is Direct Observation?", "o": ["Review of existing business documents", "Can provide more accurate information than self-reporting "], "a": 1, "e": "Direct observation can give more accurate information than self-reporting (interviews or questionnaires).", "s": false, "n": 25}, {"t": "mcq", "q": "Interviewing people informed about the operation and issues of the current system and future system needs is called:", "o": ["Interviewing groups", "Interviewing individuals", "Observing workers "], "a": 1, "e": "Interviewing individuals gathers information from people who know the current system and future needs.", "s": false, "n": 26}, {"t": "mcq", "q": "Which one enables the analyst to work backwards from it to the data that generated it?", "o": ["Report", "Written work procedures", "Business form "], "a": 0, "e": "A report lets the analyst work backwards to the data that produced it.", "s": false, "n": 27}, {"t": "mcq", "q": "Iterative development process:", "o": ["Group Support Systems", "Joint Application Design (JAD)", "System prototypes "], "a": 2, "e": "Prototyping is an iterative development process.", "s": false, "n": 28}, {"t": "mcq", "q": "Which document includes data and information used and created in the process of performing the job or task?", "o": ["Written work procedures", "Description of current information system", "Business form "], "a": 0, "e": "Written work procedures describe the data and information used in performing a job.", "s": false, "n": 29}, {"t": "mcq", "q": "Which document explicitly indicates data flow in or out of a system?", "o": ["Written work procedures", "Description of current information system", "Business form "], "a": 2, "e": "A business form explicitly shows data flowing into or out of a system.", "s": false, "n": 30}, {"t": "mcq", "q": "Refine understanding of system requirements in concrete terms:", "o": ["Group Support Systems", "Joint Application Design (JAD)", "System prototypes "], "a": 2, "e": "Prototypes refine understanding of requirements in concrete terms.", "s": false, "n": 31}, {"t": "mcq", "q": "Which one is Direct Observation?", "o": ["Review of existing business documents", "Watching users do their jobs "], "a": 1, "e": "Direct observation means watching users do their jobs.", "s": false, "n": 32}, {"t": "mcq", "q": "Team members meet in isolation for an extended period of time:", "o": ["Joint Application Design (JAD)", "System prototypes", "CASE tools", "Group Support Systems "], "a": 0, "e": "In JAD, team members meet in isolation (often offsite) for an extended time.", "s": false, "n": 33}, {"t": "mcq", "q": "______ is a document for developing, planning, and conducting an interview.", "o": ["Interview questions", "Interview guide "], "a": 1, "e": "An interview guide is the document used to plan and conduct an interview.", "s": false, "n": 34}, {"t": "mcq", "q": "The official way a system works, as described in the organization's documentation, is the ______ system.", "o": ["Informal", "Formal "], "a": 1, "e": "The formal system is the official way described in organizational documentation.", "s": false, "n": 35}, {"t": "mcq", "q": "Interviews and observation reveal the ______ system.", "o": ["Informal", "Formal "], "a": 0, "e": "Interviews and observation reveal the informal system, how work is really done.", "s": false, "n": 36}, {"t": "mcq", "q": "Assume that anything is possible and eliminate the infeasible:", "o": ["Attention to details", "Relaxing constraints", "Impertinence "], "a": 1, "e": "Relaxing constraints means assuming anything is possible and then eliminating the infeasible.", "s": false, "n": 37}, {"t": "mcq", "q": "Every fact must fit with every other fact:", "o": ["Attention to details", "Relaxing constraints", "Impertinence "], "a": 0, "e": "Attention to details: every fact must fit with every other fact.", "s": false, "n": 38}, {"t": "mcq", "q": "Observe ______ at selected times to see how data are handled and what information people need to do their jobs.", "o": ["Workers", "Individuals (interviewing)", "Business documents (studying) "], "a": 0, "e": "You observe workers to see how data are handled and what information they need.", "s": false, "n": 39}, {"t": "mcq", "q": "One analyst may ask questions while another takes notes, or different analysts might concentrate on different kinds of information. This is called:", "o": ["Interviewing groups", "Studying business documents", "Interviewing individuals", "Observing workers "], "a": 0, "e": "In group interviews one analyst can ask questions while another takes notes.", "s": false, "n": 40}, {"t": "mcq", "q": "Interviewing people with diverse needs to find synergies and contrasts among system requirements is called:", "o": ["Interviewing groups", "Studying business documents", "Interviewing individuals", "Observing workers "], "a": 0, "e": "Group interviews bring in people with diverse needs to find synergies and contrasts.", "s": false, "n": 41}, {"t": "mcq", "q": "You should question everything:", "o": ["Attention to details", "Relaxing constraints", "Impertinence "], "a": 2, "e": "Impertinence means questioning everything.", "s": false, "n": 42}, {"t": "mcq", "q": "Brings together key users, managers, and systems analysts:", "o": ["Joint Application Design (JAD)", "System prototypes", "CASE tools", "Group Support Systems "], "a": 0, "e": "JAD brings key users, managers and analysts together.", "s": false, "n": 43}, {"t": "mcq", "q": "Which one is a pro of individual interviews?", "o": ["Contradictions and inconsistencies between interviewees", "Follow-up discussions are time consuming", "Easier to schedule than group interviews "], "a": 2, "e": "Individual in function quiz(c,tab,ch){let qs=pool(c,ch);if(ch==='all')qs=shuf(qs);S={c,tab,ch,qs,ans:[],shown:[],ai:{}};drawQuiz()}
const stat=()=>{const r=S.qs.filter((q,i)=>q.t==='mcq'&&S.ans[i]===q.a).length,a=S.qs.filter((q,i)=>q.t==='mcq'&&S.ans[i]!=null).length;return {r,a,tot:mcqn(S.c,S.ch)}};
function drawQuiz(keep){const {c,ch,qs,ans,shown}=S,st=stat(),fin=st.a===st.tot&&st.tot>0;
 if(fin)saveBest(c+'mid'+ch,Math.round(st.r/st.tot*100));
 let h=topbar(`location.hash='${c}/mid'`,`${c} · mid · ch${ch}`,`${qs.length} questions`,`<div class="score" id="sc">${st.r}/${st.a}</div>`)+`<div class="bar"><div id="pb" style="width:${st.tot?st.a/st.tot*100:0}%"></div></div>`;
 if(fin)h+=`<div class="res"><b>${st.r}/${st.tot}</b><p class="sub">${Math.round(st.r/st.tot*100)}% — essay questions are not scored</p></div>`;
 qs.forEach((q,i)=>{const rev=ans[i]!=null;
  h+=`<div class="q" id="q${i}"><div class="n"><span class="tag">Q${i+1}</span><span class="tag">ch${q.ch}</span>${q.s?'<span class="tag">★ frequent</span>':''}${q.t==='open'?'<span class="tag">essay</span>':''}${q.v?'<span class="tag w">⚠ verify this answer</span>':''}</div>
  ${q.fig?`<div class="fig">${q.fig}</div>`:''}<div class="tx">${esc(q.q)}</div>`;
  if(q.t==='mcq'){h+=q.o.map((o,k)=>{let cl='';if(rev){if(k===q.a)cl='ok';else if(ans[i]===k)cl='no'}return `<button class="opt ${cl}" onclick="pick(${i},${k})"><i></i><span>${esc(o)}</span></button>`}).join('');
   if(rev){const wrong=ans[i]!==q.a;h+=`<div class="exp">${wrong?`❌ Correct answer: <b>${esc(q.o[q.a])}</b>`:'✅ Correct'}${q.e?`<br>${esc(q.e)}`:''}${q.v?'<br>⚠ The source was not sure about this one — double-check it with your instructor.':''}</div>`;
    if(wrong&&S.ai[i])h+=`<div class="exp ai">${esc(S.ai[i])}</div>`}}
  else h+=`<textarea id="ta${i}" placeholder="Write your answer here (optional)…"></textarea>`+(shown[i]?`<div class="model"><b>Model answer</b>\n${esc(q.a)}${q.v?'\n⚠ verify with your instructor':''}</div>`:`<button class="btn sm" onclick="S.shown[${i}]=1;keepTa();drawQuiz(${i})">Show model answer</button>`);
  h+='</div>'});
 const tas={};qs.forEach((q,i)=>{const e=document.getElementById('ta'+i);if(e&&e.value)tas[i]=e.value});
 const y=scrollY;$.innerHTML=h;for(const i in tas)document.getElementById('ta'+i).value=tas[i];scrollTo(0,y)}
function keepTa(){}
function pick(i,k){if(S.ans[i]!=null)return;S.ans[i]=k;if(k!==S.qs[i].a&&!S.qs[i].e){S.ai[i]='💡 Explaining why this is wrong…';why(i)}drawQuiz()}
async function why(i){const q=S.qs[i];
 try{const sm=await claude.use('sample');if(!sm)throw 0;
  const r=await sm(`You are a friendly university tutor. A student answered a multiple-choice question wrongly.\nQuestion: ${q.q}\nOptions: ${q.o.map((o,k)=>'ABCDEF'[k]+') '+o).join(' | ')}\nStudent chose: ${'ABCDEF'[S.ans[i]]}) ${q.o[S.ans[i]]}\nCorrect: ${'ABCDEF'[q.a]}) ${q.o[q.a]}${q.e?'\nNote from the answer key: '+q.e:''}\nIn 3-4 short sentences: (1) say why the student's choice is wrong, (2) state the correct answer and explain why it is right. Then add one short sentence in Arabic with the key idea. Plain text only.`,{modelTier:'quick'});
  S.ai[i]='💡 '+r.text}catch(e){S.ai[i]='💡 The live explanation is not available here (it works on the published Claude page). Correct answer: '+q.o[q.a]+(q.e?' — '+q.e:'')}
 drawQuiz()}
function review(c,ch){const ks=ch==='all'?Object.keys(D[c].summary):[ch];
 $.innerHTML=topbar(`location.hash='${c}/review'`,`${c} · review · ${ch==='all'?'all chapters':'ch'+ch}`,esc(D[c].name))+ks.map(k=>{const s=D[c].summary[k];return `<section class="q"><div class="n"><span class="tag">ch${k}</span><span class="tag">${esc(s.book)}</span></div>`+s.pts.map(p=>{const j=p.indexOf(' — ');return `<div class="exp" style="margin:8px 0">${j>0?`<b>${esc(p.slice(0,j))}</b> — ${esc(p.slice(j+3))}`:esc(p)}</div>`}).join('')+`</section>`}).join('')+`<button class="btn" onclick="location.hash='${c}/mid/${ch}'">Practice this chapter →</button>`}
route();
</script></body></html>
