3 = 7, P4 = 3. Draw the SJF Gantt chart and compute the average waiting time.", "a": "P4 (0–3), P1 (3–9), P3 (9–16), P2 (16–24). Waiting times: P4 = 0, P1 = 3, P3 = 9, P2 = 16; average = 28/4 = 7.", "s": false, "n": 56}, {"t": "open", "q": "(Shortest-remaining-time-first) P1 (arrival 0, burst 8), P2 (1, 4), P3 (2, 9), P4 (3, 5). Draw the preemptive SJF Gantt chart and compute the average waiting time.", "a": "P1 (0–1), P2 (1–5), P4 (5–10), P1 (10–17), P3 (17–26). Waiting times: P1 = 10−1 = 9, P2 = 0, P3 = 17−2 = 15, P4 = 5−3 = 2; average = 26/4 = 6.5.", "s": false, "n": 57}, {"t": "open", "q": "Burst times: P1 = 24, P2 = 3, P3 = 3, time quantum = 4. Draw the Gantt chart and compute the average waiting time.", "a": "P1 (0–4), P2 (4–7), P3 (7–10), then P1 runs 10–14, 14–18, 18–22, 22–26, 26–30. Waiting times: P1 = 6, P2 = 4, P3 = 7; average = 17/3 ≈ 5.67.", "s": false, "n": 58}, {"t": "open", "q": "P1 (burst 10, priority 3), P2 (1, 1), P3 (2, 4), P4 (1, 5), P5 (5, 2). A smaller number means higher priority. Draw the Gantt chart and compute the average waiting time.", "a": "P2 (0–1), P5 (1–6), P1 (6–16), P3 (16–18), P4 (18–19). Waiting times: 0, 1, 6, 16, 18 for P2, P5, P1, P3, P4; average = 41/5 = 8.2.", "s": false, "n": 59}, {"t": "open", "q": "Using α = 1/2 and an initial guess τ₀ = 10, with the formula τ(n+1) = α·t(n) + (1−α)·τ(n), predict the next CPU burst for the measured bursts 6, 4, 6, 4, 13, 13, 13.", "a": "The predictions are τ = 10, 8, 6, 6, 5, 9, 11, 12 (each new guess is the average of the last actual burst and the previous guess).", "s": false, "n": 60}], "4": [{"t": "mcq", "q": "A race condition ____.", "o": ["results when several threads try to access the same data concurrently", "results when several threads try to access and modify the same data concurrently", "will result only if the outcome of execution does not depend on the order in which instructions are executed", "None of the above "], "a": 1, "e": "A race condition happens when several threads access and modify the same data at once.", "s": true, "n": 1}, {"t": "mcq", "q": "A race condition occurs when:", "o": ["A deadlock happens", "Only one thread executes", "Processes run too fast", "The outcome depends on execution order "], "a": 3, "e": "In a race condition the outcome depends on the order of execution.", "s": false, "n": 2}, {"t": "open", "q": "In the context of synchronization, what is a \"race condition\"?", "a": "Two processes access shared data concurrently, leading to inconsistency (the result depends on the order in which the accesses happen).", "s": false, "n": 3}, {"t": "mcq", "q": "What is the fundamental problem that synchronization tools aim to solve?", "o": ["The Race Condition Problem", "The I/O Blocking Problem", "The Memory Allocation Problem", "The Deadlock Problem "], "a": 0, "e": "Synchronization tools solve the race condition problem.", "s": false, "n": 4}, {"t": "mcq", "q": "The main goal of synchronization is to:", "o": ["Reduce RAM size", "Increase CPU speed ", "Delete processes", "Maintain data consistency "], "a": 3, "e": "The main goal is data consistency.", "s": false, "n": 5}, {"t": "mcq", "q": "Race conditions are prevented by requiring that critical regions be protected by locks.", "o": ["True", "False"], "a": 0, "e": "True: locks around critical regions prevent race conditions.", "s": false, "n": 6}, {"t": "mcq", "q": "The segment of code where processes modify shared variables is called:", "o": ["Non-Critical section", "Synchronization", "Critical section", "Program "], "a": 2, "e": "The code where processes modify shared variables is the critical section.", "s": false, "n": 7}, {"t": "mcq", "q": "The critical section refers to:", "o": ["A CPU instruction", "A part of code accessing shared data", "A disk operation", "A section of memory "], "a": 1, "e": "The critical section is the part of code accessing shared data.", "s": false, "n": 8}, {"t": "mcq", "q": "A(n) _______ refers to where a process is accessing/updating shared data.", "o": ["critical section", "entry section", "mutex", "test-and-set "], "a": 0, "e": "The critical section is where a process accesses or updates shared data.", "s": false, "n": 9}, {"t": "mcq", "q": "The critical-section problem occurs when:", "o": ["No shared memory exists", "Only one process runs at a time", "Processes execute sequentially", "Multiple processes access shared data concurrently "], "a": 3, "e": "The critical-section problem arises when several processes access shared data concurrently.", "s": false, "n": 10}, {"t": "mcq", "q": "Which of the following is a requirement for the critical section problem?", "o": ["Mutual exclusion, progress, and bounded waiting", "Critical sections must be identical in all processes ", "Progress must be guaranteed", "No process can enter the critical section "], "a": 0, "e": "A solution must satisfy mutual exclusion, progress and bounded waiting.", "s": true, "n": 11}, {"t": "mcq", "q": "A solution to the critical section problem does NOT have to satisfy which of the following requirements?", "o": ["mutual exclusion", "progress", "atomicity", "bounded waiting "], "a": 2, "e": "Atomicity is not one of the three requirements.", "s": false, "n": 12}, {"t": "mcq", "q": "If process Pi is executing in its critical section, then no other process can be executing in its critical section. This requirement is called:", "o": ["Progress", "Mutual Exclusion", "Bounded Waiting", "Program "], "a": 1, "e": "Mutual exclusion: only one process may be in its critical section at a time.", "s": true, "n": 13}, {"t": "mcq", "q": "Which requirement ensures that if no process is in its critical section and some processes wish to enter, the selection cannot be postponed indefinitely?", "o": ["Progress", "Mutual Exclusion", "Atomic Operation", "Bounded Waiting "], "a": 0, "e": "Progress: the choice of who enters next cannot be postponed forever.", "s": false, "n": 14}, {"t": "mcq", "q": "Progress means:", "o": ["Interrupts are disabled", "A process waiting to enter the critical section should eventually proceed", "Memory size grows", "CPU speed increases "], "a": 1, "e": "Progress means a waiting process will eventually be able to proceed.", "s": false, "n": 15}, {"t": "mcq", "q": "Mutual exclusion means:", "o": ["Multiple processes execute together", "Only one process accesses shared data at a time", "CPU scheduling stops", "Memory becomes shared "], "a": 1, "e": "Mutual exclusion means only one process accesses the shared data at a time.", "s": false, "n": 16}, {"t": "open", "q": "What three conditions must be satisfied in order to solve the critical-section problem?", "a": "(1) Mutual exclusion – if a process is executing in its critical section, no other process can be executing in theirs. (2) Progress – if no process is in its critical section and some wish to enter, only the processes not in their remainder sections take part in deciding who enters next, and this decision cannot be postponed indefinitely. (3) Bounded waiting – a bound exists on the number of times other processes may enter their critical sections after a process has requested entry and before that request is granted.", "s": false, "n": 17}, {"t": "mcq", "q": "In Peterson's solution, the variable that indicates whether a process is ready to enter its critical section is:", "o": ["turn", "lock", "flag[i]", "turn[i] "], "a": 2, "e": "flag[i] says whether process i is ready to enter its critical section; turn says whose turn it is.", "s": true, "n": 18}, {"t": "mcq", "q": "Peterson's algorithm uses two variables:", "o": ["flag and turn", "mutex and semaphore", "counter and lock", "page and frame "], "a": 0, "e": "Peterson's algorithm uses the variables flag and turn.", "s": false, "n": 19}, {"t": "mcq", "q": "Peterson's solution is designed for:", "o": ["Four processes", "Two processes", "Unlimited processes", "One process "], "a": 1, "e": "Peterson's solution is designed for exactly two processes.", "s": false, "n": 20}, {"t": "mcq", "q": "Which synchronization solution is generally considered too inefficient on multiprocessor systems due to potential instruction reordering?", "o": ["Mutex Lock", "Atomic Variables", "Peterson's Solution", "Semaphores "], "a": 2, "e": "processors and compilers may reorder operations that have no dependencies, so Peterson's solution is not guaranteed to work on modern architectures.", "s": false, "n": 21}, {"t": "mcq", "q": "An instruction that executes atomically ____.", "o": ["must consist of only one machine instruction", "executes as a single, uninterruptible unit", "cannot be used to solve the critical section problem", "All of the above "], "a": 1, "e": "An atomic instruction executes as one uninterruptible unit.", "s": false, "n": 22}, {"t": "open", "q": "What does the test_and_set instruction do?", "a": "It atomically sets the target variable to true and returns its original value.", "s": false, "n": 23}, {"t": "mcq", "q": "How does the test_and_set instruction help solve the critical-section problem?", "o": ["By atomically checking and setting a lock", "It only works on uniprocessor systems", "It requires explicit synchronization", "It ensures atomic updates to a shared variable "], "a": 0, "e": "test_and_set atomically reads and sets a lock, so only one process can take it.", "s": false, "n": 24}, {"t": "mcq", "q": "What hardware instruction is often used as a building block for implementing atomic operations?", "o": ["Compare-and-Swap instruction", "MOV instruction", "ADD instruction", "JUMP instruction "], "a": 0, "e": "Compare-and-swap is the standard hardware building block for atomic operations.", "s": false, "n": 25}, {"t": "mcq", "q": "Which of the following statements is true?", "o": ["Operations on atomic integers do not require locking", "Operations on atomic integers do require additional locking", "Linux only provides the atomic_inc() and atomic_sub() operations", "Operations on atomic integers can be interrupted "], "a": 0, "e": "Atomic integer operations complete without interruption, so they need no extra lock.", "s": false, "n": 26}, {"t": "mcq", "q": "A mutex lock ____.", "o": ["is exactly like a counting semaphore", "is essentially a boolean variable", "is not guaranteed to be atomic", "can be used to eliminate busy waiting "], "a": 1, "e": "A mutex lock is essentially a boolean variable (available or not).", "s": false, "n": 27}, {"t": "mcq", "q": "Which synchronization tool is used to protect critical sections and ensure exclusive access to shared resources?", "o": ["Mutex locks", "Compare-and-swap operations", "Memory barriers", "Race condition "], "a": 0, "e": "Mutex locks protect critical sections and give exclusive access.", "s": false, "n": 28}, {"t": "mcq", "q": "What is the primary function of a mutex lock in process synchronization?", "o": ["To implement device drivers", "To provide ways for processes to synchronize their activities", "To handle virtual memory paging", "To manage file access only "], "a": 1, "e": "A mutex lets processes synchronize their activities by guarding shared resources.", "s": false, "n": 29}, {"t": "mcq", "q": "A mutex lock allows:", "o": ["Unlimited access", "Only one process in the critical section", "No synchronization", "Multiple processes in the critical section "], "a": 1, "e": "A mutex allows only one process in the critical section.", "s": false, "n": 30}, {"t": "mcq", "q": "What is the correct order of operations for protecting a critical section using mutex locks?", "o": ["release() followed by acquire()", "acquire() followed by release()", "wait() followed by signal()", "signal() followed by wait() "], "a": 1, "e": "Acquire the lock, run the critical section, then release it.", "s": false, "n": 31}, {"t": "open", "q": "Assume you had a function named update() that updates shared data. Illustrate how a mutex lock named mutex might be used to prevent a race condition in update().", "a": "void update() { mutex.acquire(); /* update shared data */ mutex.release(); }", "s": false, "n": 32}, {"t": "mcq", "q": "Mutex locks and counting semaphores are essentially the same thing.", "o": ["True", "False"], "a": 1, "e": "False: a counting semaphore has many values, a mutex only two.", "s": false, "n": 33}, {"t": "mcq", "q": "Mutex locks and binary semaphores are essentially the same thing.", "o": ["True", "False"], "a": 0, "e": "True: a mutex behaves like a binary semaphore.", "s": false, "n": 34}, {"t": "mcq", "q": "Which synchronization tool provides more sophisticated ways for processes to synchronize their activities?", "o": ["Mutex Lock", "Test-and-Set instruction", "Race Condition", "Semaphore "], "a": 3, "e": "Semaphores give richer synchronization than mutex locks.", "s": true, "n": 35}, {"t": "mcq", "q": "What synchronization tool is defined by an integer variable that can range over an unrestricted domain?", "o": ["Binary semaphore", "Atomic Variable", "Mutex Lock", "Counting semaphore "], "a": 3, "e": "A counting semaphore is an integer with an unrestricted domain.", "s": false, "n": 36}, {"t": "mcq", "q": "A counting semaphore ____.", "o": ["is essentially an integer variable", "is accessed through only one standard operation", "can be modified simultaneously by multiple threads", "cannot be used to control access to a thread's critical sections "], "a": 0, "e": "A counting semaphore is essentially an integer variable changed only by wait() and signal().", "s": false, "n": 37}, {"t": "mcq", "q": "A binary semaphore's value ranges between:", "o": ["0 and 1", "0 and 2", "1 and 2", "1 and 3 "], "a": 0, "e": "A binary semaphore is 0 or 1.", "s": false, "n": 38}, {"t": "mcq", "q": "The value of a counting semaphore can range only between 0 and 1.", "o": ["True", "False"], "a": 1, "e": "False: counting semaphores can take any non-negative value.", "s": false, "n": 39}, {"t": "mcq", "q": "The wait() operation on a semaphore:", "o": ["Resets the semaphore", "Decrements the semaphore", "Increments the semaphore", "Deletes the semaphore "], "a": 1, "e": "wait() decrements the semaphore and blocks if it becomes negative.", "s": false, "n": 40}, {"t": "mcq", "q": "Which of the following must guarantee mutual exclusion on a semaphore?", "o": ["wait(0) and signal(0)", "stop(0) and wait(0)", "hold(0) and signal(0)", "stop(0) and signal(0) "], "a": 0, "e": "the wait() and signal() operations must each execute atomically.", "s": false, "n": 41}, {"t": "mcq", "q": "What is the correct order of operations for protecting a critical section using a binary semaphore?", "o": ["release() followed by acquire()", "acquire() followed by release()", "wait() followed by signal()", "signal() followed by wait() "], "a": 2, "e": "Binary semaphore usage: wait() before the critical section, signal() after.", "s": false, "n": 42}, {"t": "mcq", "q": "When using semaphores, a process invokes wait() before accessing its critical section, followed by signal() upon completion. If the order of these two operations is reversed (signal() first, then wait()), what would be a possible outcome?", "o": ["Starvation is possible", "Several processes could be active in their critical sections at the same time", "Mutual exclusion is still assured", "Deadlock is possible "], "a": 1, "e": "With signal() first, a process enters without waiting, so several can be in the critical section together.", "s": false, "n": 43}, {"t": "mcq", "q": "____ can be used to prevent busy waiting when implementing a semaphore.", "o": ["Spinlocks", "Waiting queues", "Mutex lock", "Allowing the wait() operation to succeed "], "a": 1, "e": "with a waiting queue, a process is blocked and later woken up instead of spinning.", "s": false, "n": 44}, {"t": "mcq", "q": "Which of the following statements is true?", "o": ["A counting semaphore can never be used as a binary semaphore", "A binary semaphore can never be used as a counting semaphore", "Spinlocks can be used to prevent busy waiting in the implementation of a semaphore", "Counting semaphores can be used to control access to a resource with a finite number of instances "], "a": 3, "e": "the source answer key says C, but that is a mistake: a spinlock is busy waiting.", "s": false, "n": 45}, {"t": "open", "q": "Write two short methods that implement the simple semaphore wait() and signal() operations on a global variable S.", "a": "wait(S) { while (S <= 0) ; /* busy wait */ S--; } and signal(S) { S++; } . Both operations must execute atomically.", "s": false, "n": 46}, {"t": "mcq", "q": "In the bounded-buffer problem, what is the initial value of the semaphore 'full'?", "o": ["-1", "n (the number of buffers)", "1", "0 "], "a": 3, "e": "full = 0 initially because the buffer starts with no filled slots.", "s": true, "n": 47}, {"t": "mcq", "q": "In the bounded-buffer problem, the semaphore mutex is initialized to:", "o": ["1", "0", "-1", "n "], "a": 0, "e": "mutex = 1 so exactly one process can access the buffer at a time.", "s": false, "n": 48}, {"t": "mcq", "q": "What is the purpose of the mutex semaphore in the implementation of the bounded- buffer problem using semaphores?", "o": ["It indicates the number of empty slots in the buffer", "It indicates the number of occupied slots in the buffer", "It controls access to the shared buffer", "It ensures mutual exclusion "], "a": 3, "e": "mutex ensures mutual exclusion on the buffer; empty and full count the slots.", "s": false, "n": 49}, {"t": "open", "q": "The purpose of using the empty semaphore in solving the bounded-buffer problem is to:", "a": "Count the number of free slots in the buffer.", "s": false, "n": 50}, {"t": "mcq", "q": "In the bounded-buffer problem, what does the producer do when the 'empty' semaphore reaches 0?", "o": ["Signals the consumer immediately", "Increments the 'full' semaphore", "Overrides the buffer", "Goes to sleep (blocks) "], "a": 3, "e": "When empty is 0 the buffer is full, so the producer blocks.", "s": false, "n": 51}, {"t": "mcq", "q": "In the bounded-buffer consumer process, which semaphore is signaled LAST after consuming an item?", "o": ["mutex", "full", "rw_mutex", "empty "], "a": 3, "e": "The consumer ends with signal(empty), freeing the slot it just emptied.", "s": false, "n": 52}, {"t": "mcq", "q": "The bounded-buffer problem is an example of a synchronization problem that involves:", "o": ["Race conditions between multiple writers", "Coordinating the limited buffer space between producers and consumers", "Resolving priority conflicts between readers and writers", "Deadlock situations in the producer-consumer scenario "], "a": 1, "e": "Bounded buffer coordinates limited buffer space between producers and consumers.", "s": false, "n": 53}, {"t": "open", "q": "Explain the bounded-buffer problem. Describe the roles of the three semaphores used in the solution (mutex, full and empty) and explain how the producer and consumer use them to avoid race conditions.", "a": "A producer and a consumer share a buffer of n slots, each holding one item. mutex (initialized to 1) gives mutual exclusion on access to the buffer. full (initialized to 0) counts the occupied slots. empty (initialized to n) counts the free slots. The producer does wait(empty), wait(mutex), adds the item, then signal(mutex), signal(full); it blocks when the buffer is full. The consumer does wait(full), wait(mutex), removes the item, then signal(mutex), signal(empty); it blocks when the buffer is empty. Together they prevent the race condition on the buffer.", "s": false, "n": 54}, {"t": "mcq", "q": "In the readers-writers problem, the primary objective is to:", "o": ["Allow multiple writers to access the shared data", "Enable multiple readers to access the shared data concurrently", "Ensure only one reader can access the shared data", "Restrict readers from accessing the shared data "], "a": 1, "e": "The aim is to let multiple readers read at the same time while writers get exclusive access.", "s": false, "n": 55}, {"t": "mcq", "q": "In the readers-writers problem, multiple readers can:", "o": ["Read simultaneously", "Write simultaneously", "Access without synchronization", "Modify data "], "a": 0, "e": "Many readers can read simultaneously, because reading does not change the data.", "s": false, "n": 56}, {"t": "mcq", "q": "In the readers-writers problem, the variable 'read_count' is used to:", "o": ["Indicate the size of the shared data", "Store the number of available buffers", "Track how many readers are currently reading", "Count how many writers are waiting "], "a": 2, "e": "read_count tracks how many readers are currently reading.", "s": false, "n": 57}, {"t": "mcq", "q": "The 'First readers-writers' problem refers to a situation where:", "o": ["Writers can proceed even while readers are active", "Only one reader is allowed at a time", "Readers are always given higher priority, which can starve writers", "The first writer always gets priority over all readers "], "a": 2, "e": "The first problem favors readers, so writers can starve.", "s": false, "n": 58}, {"t": "mcq", "q": "The first readers-writers problem ____.", "o": ["requires that, once a writer is ready, that writer performs its write as soon as possible", "is not used to test synchronization primitives", "requires that no reader will be kept waiting unless a writer has already obtained permission to use the shared database", "requires that no reader will be kept waiting unless a reader has already obtained permission to use the shared database "], "a": 2, "e": "In the first problem no reader waits unless a writer already holds the data.", "s": false, "n": 59}, {"t": "mcq", "q": "In the readers-writers problem, the 'Second readers-writers' variation ensures that:", "o": ["The mutex semaphore is never used", "Multiple writers can write at the same time", "Once a writer is ready, no newly arrived reader is allowed to read", "Readers always have priority over writers "], "a": 2, "e": "In the second problem, once a writer is ready no new reader may start.", "s": false, "n": 60}, {"t": "open", "q": "Explain the difference between the first readers–writers problem and the second readers–writers problem.", "a": "In the first problem, no reader is kept waiting unless a writer has already obtained permission to use the shared data, so readers have priority and a writer may starve. In the second problem, once a writer is ready, no newly arrived reader is allowed to start reading, so the writer goes as soon as possible. Both can cause starvation.", "s": false, "n": 61}, {"t": "open", "q": "Describe a scenario when using a reader–writer lock is more appropriate than another synchronization tool such as a semaphore.", "a": "A semaphore lets only one process access shared data at a time. A reader–writer lock is useful when it is easy to tell read-only processes from read/write processes: readers can access the data concurrently, so with many readers it is much more efficient.", "s": false, "n": 62}, {"t": "mcq", "q": "In the dining philosophers problem with 5 philosophers, the semaphore array 'chopstick' is initialized to:", "o": ["All 1s", "All 5s", "All zeros", "Random values "], "a": 0, "e": "Each chopstick semaphore starts at 1 (available).", "s": false, "n": 63}, {"t": "mcq", "q": "How many philosophers may eat simultaneously in the Dining Philosophers problem with 5 philosophers?", "o": ["1", "2", "3", "5 "], "a": 1, "e": "With 5 philosophers and 5 chopsticks at most 2 can eat at once (each needs 2).", "s": false, "n": 64}, {"t": "mcq", "q": "The dining philosophers algorithm (basic semaphore solution) may lead to:", "o": ["Starvation", "Deadlock", "Race condition", "Priority inversion "], "a": 1, "e": "if every philosopher picks up one chopstick, all wait forever for the other.", "s": true, "n": 65}, {"t": "mcq", "q": "The dining-philosophers problem involves a scenario where philosophers:", "o": ["Compete to acquire the largest portion of food from a shared bowl", "Alternate between thinking and eating using chopsticks", "Collaborate to solve a complex mathematical puzzle", "Engage in philosophical discussions while seated around a table "], "a": 1, "e": "Philosophers alternate between thinking and eating, needing two chopsticks to eat.", "s": false, "n": 66}, {"t": "open", "q": "Describe the dining-philosophers problem and how it relates to operating systems. What is the main problem in the basic algorithm?", "a": "Five philosophers sit at a round table with a bowl of rice and five chopsticks, one between each adjacent pair. They alternate between thinking and eating, and need both neighboring chopsticks to eat, so two adjacent philosophers cannot eat at the same time. It is like scheduling processes that need a limited number of resources. The main problem of the basic semaphore solution (wait on chopstick[i], then chopstick[(i+1) % 5]) is deadlock: if all philosophers pick up their left chopstick at once, each waits forever for the other.", "s": false, "n": 67}, {"t": "mcq", "q": "How does the Windows kernel handle synchronization on uniprocessor systems?", "o": ["By using spinlocks", "By using mutex locks", "By using interrupt masks", "By using condition variables "], "a": 2, "e": "On uniprocessors Windows protects shared data by masking interrupts.", "s": false, "n": 68}, {"t": "mcq", "q": "On Windows, which kernel synchronization mechanism is used on multiprocessor systems to protect shared resources?", "o": ["Spinlocks", "Mutex dispatcher object only", "Condition variables", "Interrupt masks "], "a": 0, "e": "On multiprocessors Windows uses spinlocks.", "s": true, "n": 69}, {"t": "open", "q": "When a dispatcher object is in the signaled state, it means that:", "a": "The object is available (a thread that waits on it will not block).", "s": false, "n": 70}, {"t": "mcq", "q": "A thread will immediately acquire a dispatcher lock that is in the signaled state.", "o": ["True", "False"], "a": 0, "e": "True: a thread acquires a signaled dispatcher object immediately and it becomes nonsignaled.", "s": false, "n": 71}]}, "summary": {"1": {"book": "Silberschatz ch. 1–2 · Introduction & OS Structures", "pts": ["Operating system — manager between users/applications and hardware; allocates resources and controls programs; the kernel is the always-running core.", "Interrupts — signal the CPU that an event needs attention; hardware and software (traps, system calls).", "Dual-mode operation — user mode vs kernel mode protects the OS; privileged instructions run only in kernel mode.", "Multiprocessor systems — SMP (each processor self-scheduling), multicore, clustered; benefits: throughput, economy of scale, reliability.", "Multiprogramming and time sharing keep the CPU busy and give interactive response.", "OS services — program execution, I/O, file system, communication, error detection, resource allocation, protection and security.", "System calls — the interface to OS services, usually accessed through an API; kinds: process control, file, device, information, communication, protection.", "OS structures — simple, layered, microkernel (small kernel, services in user space), modules, hybrid."]}, "2": {"book": "Silberschatz ch. 3–4 · Processes and Threads", "pts": ["Process — a program in execution (active) vs program (passive). Memory layout: text, data, heap, stack.", "States — new, ready, running, waiting, terminated. Only one process runs per core.", "PCB — process control block: state, program counter, CPU registers, scheduling and memory info, I/O status.", "Scheduling queues — ready queue, device queues; long-term (controls degree of multiprogramming), short-term (CPU scheduler, runs very often).", "Context switch — save the old process state in its PCB and load the new one; pure overhead.", "Operations — fork() creates a child, exec() replaces its program, wait() lets the parent wait; zombie = terminated but not yet waited for; orphan = parent ended (adopted by init).", "IPC — shared memory (fast) vs message passing (better for distributed); blocking send + receive = rendezvous.", "Threads — share code, data, heap and files; each has own registers, stack and program counter. Benefits: responsiveness, resource sharing, economy, scalability.", "Parallelism — data parallelism (same operation on data subsets) vs task parallelism (different tasks). Concurrency can exist without parallelism.", "Models — many-to-one (no parallelism), one-to-one (Windows, Linux), many-to-many.", "Threading issues — fork/exec semantics, signal handling, cancellation (asynchronous vs deferred), thread-local storage."]}, "3": {"book": "Silberschatz ch. 6 · CPU Scheduling", "pts": ["CPU–I/O burst cycle — a process alternates CPU bursts and I/O bursts.", "Dispatcher — gives the CPU to the process chosen by the scheduler; dispatch latency = time to stop one process and start another.", "Preemptive vs nonpreemptive — nonpreemptive: process keeps CPU until it terminates or waits. Modern OSs are preemptive (can cause race conditions on shared data).", "Criteria — maximize CPU utilization and throughput; minimize turnaround, waiting and response time.", "FCFS — simplest, nonpreemptive; convoy effect when a long job is first.", "SJF — shortest next burst first; minimum average waiting time; next burst predicted by exponential averaging τ(n+1) = α·t(n) + (1−α)·τ(n). Preemptive SJF = shortest-remaining-time-first.", "Round Robin — time quantum; large quantum behaves like FCFS, tiny quantum causes too many context switches.", "Priority scheduling — starvation of low priority processes; fix with aging.", "Multilevel queue (each queue has its own algorithm) vs multilevel feedback queue (processes move between queues, most general).", "Thread scheduling — PCS (user threads compete inside a process) vs SCS (kernel threads compete system-wide).", "Multiprocessor — asymmetric vs SMP; processor affinity (soft/hard); load balancing with push and pull migration; NUMA-aware allocation; multithreaded cores."]}, "4": {"book": "Silberschatz ch. 5 · Process Synchronization", "pts": ["Race condition — outcome depends on the order of access to shared data.", "Critical-section problem — code that modifies shared data (entry, critical, exit, remainder sections).", "Three requirements — mutual exclusion, progress, bounded waiting.", "Peterson's solution — two processes, variables flag[i] and turn; not guaranteed on modern hardware (instruction reordering).", "Hardware support — test_and_set and compare_and_swap are atomic; atomic variables.", "Mutex lock — acquire() then release(); spinlock = busy waiting; same as a binary semaphore.", "Semaphore — integer used with wait() (decrement) and signal() (increment); counting vs binary; waiting queue avoids busy waiting; reversing wait/signal breaks mutual exclusion.", "Bounded buffer — mutex = 1, full = 0, empty = n.", "Readers–writers — read_count tracks readers; first problem favors readers (writers may starve), second favors writers.", "Dining philosophers — one semaphore per chopstick; the simple solution can deadlock.", "Windows kernel — interrupt masks on uniprocessors, spinlocks on multiprocessors, dispatcher objects (signaled = available)."]}}}, "CS352": {"name": "Systems Analysis & Design", "chapters": {"1": [{"t": "mcq", "q": "The correct order of the phases of the system development life cycle is ________.", "o": ["Planning, analysis, design, implementation, maintenance", "Planning, design, analysis, implementation, maintenance", "Analysis, planning, design, implementation, maintenance", "Design, planning, analysis, implementation, maintenance "], "a": 0, "e": "The SDLC phases in order are planning, analysis, design, implementation, maintenance.", "s": false, "n": 1}, {"t": "mcq", "q": "In the ______ phase of the SDLC, system requirements are studied and structured.", "o": ["Planning", "Design", "Analysis", "Implementation "], "a": 2, "e": "Analysis is the phase where system requirements are studied and structured.", "s": false, "n": 2}, {"t": "mcq", "q": "Which of the following is NOT an approach to software reuse?", "o": ["Ad hoc reuse", "Managed reuse", "Analyzed reuse", "Designed reuse "], "a": 2, "e": "The reuse approaches are ad hoc, record-keeping, hierarchical and others; \"analyzed reuse\" is not one.", "s": false, "n": 3}, {"t": "mcq", "q": "The part of the design phase in which the logical specifications are transformed into technology-specific details is ________.", "o": ["Logical design", "Physical design", "Analysis design", "Maintenance "], "a": 1, "e": "Physical design turns logical specifications into technology-specific details (hardware, software, code).", "s": false, "n": 4}, {"t": "mcq", "q": "________ is the traditional methodology used to develop, maintain, and replace information systems.", "o": ["System development life cycle ", "Physical", "System development methodology", "Object-oriented analysis and design "], "a": 0, "e": "The SDLC is the traditional methodology to develop, maintain and replace information systems.", "s": false, "n": 5}, {"t": "mcq", "q": "________ is the second phase of the SDLC, in which system requirements are studied and structured.", "o": ["Implementation", "Analysis", "Planning", "Design "], "a": 1, "e": "Analysis is the second SDLC phase: requirements are studied and structured.", "s": false, "n": 6}, {"t": "mcq", "q": "________ is the final phase of the SDLC, in which an information system is systematically repaired and improved.", "o": ["Maintenance", "Analysis", "Planning", "Design "], "a": 0, "e": "Maintenance is the final phase: the system is repaired and improved.", "s": false, "n": 7}, {"t": "mcq", "q": "Who has the primary responsibility for the analysis and design of information systems?", "o": ["Maintenance team", "Systems analyst", "User", "Programmer "], "a": 1, "e": "The systems analyst is mainly responsible for analysis and design of information systems.", "s": false, "n": 8}, {"t": "mcq", "q": "________ is the part of the design phase in which the logical specifications are transformed into technology-specific details from which all programming and system construction can be accomplished.", "o": ["Physical design", "Logical design", "Analysis design", "Maintenance design "], "a": 0, "e": "Physical design converts logical specifications into technology-specific details.", "s": false, "n": 9}, {"t": "mcq", "q": "________ represents the first step of the SDLC.", "o": ["Analysis", "Planning", "Maintenance", "Implementation "], "a": 1, "e": "Planning (identifying and selecting the project) is the first SDLC step.", "s": false, "n": 10}, {"t": "mcq", "q": "In the logical design ________.", "o": ["Coding and testing are conducted.", "Technology-specific details are specified from which all programming and system construction can be accomplished.", "The requirements of the system are structured.", "All functional features of the system chosen for development in analysis are described independently of any computer platform. "], "a": 3, "e": "Logical design describes the functional features chosen for development, independent of technology.", "s": false, "n": 11}, {"t": "mcq", "q": "The description of the recommended solution is converted into logical and then physical system specifications in the ________ phase of the SDLC.", "o": ["Maintenance", "Analysis", "Planning", "Design "], "a": 3, "e": "In the design phase the recommended solution is turned into logical and then physical specifications.", "s": false, "n": 12}, {"t": "mcq", "q": "In which methodology of systems development does one phase begin when another completes, with little backtracking and looping?", "o": ["Traditional Waterfall", "eXtreme Programming", "Planning "], "a": 0, "e": "The traditional waterfall moves to the next phase only when the previous one finishes, with little backtracking.", "s": false, "n": 13}, {"t": "mcq", "q": "When an organization needs a customized information system but does not have the required expertise, and no off-the-shelf system is available, it is better to request ________.", "o": ["IT services firms", "In-house developers", "Cloud computing", "Packaged software producers "], "a": 0, "e": "IT services firms supply expertise and develop custom systems for organizations that lack it.", "s": false, "n": 14}, {"t": "mcq", "q": "In the ________ phase of the SDLC, an organization's total information system needs are identified, analyzed, prioritized, and arranged.", "o": ["Implementation", "Planning", "Analysis", "Design "], "a": 1, "e": "In planning the organization's total information system needs are identified, analyzed and prioritized.", "s": false, "n": 15}, {"t": "mcq", "q": "The phase of the project management process in which activities are performed to assess the size, scope, and complexity of the project is called ________.", "o": ["Project planning", "Project executing ", "Project determination", "Project initiation "], "a": 3, "e": "Project initiation assesses the size, scope and complexity of the project and sets up the project team.", "s": false, "n": 16}, {"t": "mcq", "q": "When an organization needs to develop a special system and has its own infrastructure, sufficient system development expertise, and no budget constraints, it is better to use ________.", "o": ["Cloud computing", "In-house developers", "Packaged software producers", "IT services firms "], "a": 1, "e": "In-house developers fit when the organization has its own infrastructure, enough resources and skilled staff.", "s": false, "n": 17}, {"t": "mcq", "q": "________ refers to the tasks the software can perform and the mandatory, essential, and desired system features.", "o": ["Functionality", "Reuse "], "a": 0, "e": "Functionality is what the software can do, including mandatory, essential and desired requirements.", "s": false, "n": 18}, {"t": "mcq", "q": "________ is the software reuse step that involves the design of a reusable piece of software, starting from existing software assets or from scratch.", "o": ["Designed reuse", "Storage", "Abstraction", "Facilitated reuse "], "a": 2, "e": "Abstraction is the first reuse step: designing a reusable piece of software starting from an existing one.", "s": false, "n": 19}, {"t": "mcq", "q": "What is the practice of a company running a computer application for another organization?", "o": ["Outsourcing", "Information technology development", "In-house payroll system", "Reusing "], "a": 0, "e": "Outsourcing is having another organization run an application or function for you.", "s": false, "n": 20}, {"t": "mcq", "q": "If an organization is using applications rented from a third-party vendor running in a remote location, which type of software system are they most likely using?", "o": ["Pre-packaged software", "Nearshoring", "Cloud computing "], "a": 2, "e": "Renting applications run by a vendor in a remote location is cloud computing.", "s": false, "n": 21}, {"t": "mcq", "q": "Intuit's QuickBooks is an example of what type of software?", "o": ["Pre-packaged software", "Nearshoring ", "Cloud computing "], "a": 0, "e": "QuickBooks is pre-packaged (off-the-shelf) software.", "s": false, "n": 22}, {"t": "mcq", "q": "Which phase contains the determination of the requirements that the users want from a proposed system?", "o": ["Planning", "Implementation", "Analysis", "Maintenance "], "a": 2, "e": "Determining what users want from a proposed system is done in analysis.", "s": false, "n": 23}, {"t": "mcq", "q": "________ is an agile method in which coding is conducted in teams of two people.", "o": ["Evolutionary model", "Scrum", "Rational Unified Process (RUP)", "eXtreme Programming "], "a": 3, "e": "eXtreme Programming uses pair programming: coding in teams of two.", "s": false, "n": 24}, {"t": "mcq", "q": "When the task requires custom support and internal staff is not available, it is recommended to use ________.", "o": ["Open-source software", "Enterprise-wide solution", "IT services firms", "In-house developers "], "a": 2, "e": "When custom support is needed and no internal staff exists, use an IT services firm.", "s": false, "n": 25}, {"t": "mcq", "q": "Which of the following is a reason why a company may outsource certain operations?", "o": ["Keep the IT staff from being bored", "Decrease process efficiencies", "Increase time to market", "Outsource noncore activities "], "a": 3, "e": "Companies outsource noncore activities so they can focus on their main business.", "s": false, "n": 26}, {"t": "mcq", "q": "A document provided to vendors that asks them to propose hardware and system software that will meet the requirements of a new system is called a ________.", "o": ["ERP", "Reuse", "Request for proposal "], "a": 2, "e": "A request for proposal (RFP) asks vendors to propose hardware and software to meet requirements.", "s": false, "n": 27}, {"t": "mcq", "q": "Which of the following activities happens during the SDLC planning phase?", "o": ["System requirements are studied and structured.", "A presentation of why the system should or should not be developed by the organization is given. "], "a": 1, "e": "In planning, a presentation justifies why the system should or should not be built.", "s": false, "n": 28}, {"t": "mcq", "q": "Which of the following is NOT a basic software reuse step?", "o": ["Recontextualization", "Storage", "Testing "], "a": 2, "e": "The reuse steps are abstraction, storage and recontextualization. Testing is not one.", "s": false, "n": 29}, {"t": "mcq", "q": "Which of the following is NOT a major category of sources of software?", "o": ["Packaged software", "Offshore", "Cloud computing vendors", "In-house developers "], "a": 1, "e": "Main sources of software are IT services firms, packaged software, vendors of enterprise solutions, open source, outsourcing and in-house. Offshore is not a category.", "s": false, "n": 30}, {"t": "mcq", "q": "________ is/are the process(es) that an analyst will follow to help ensure that his work is complete, well done, and understood by project team members.", "o": ["Result", "Role", "Techniques "], "a": 2, "e": "Techniques are the processes an analyst follows to make sure work is complete, accurate and consistent.", "s": false, "n": 31}, {"t": "mcq", "q": "________ is the practice of turning over responsibility for some or all of an organization's information systems applications and operations to an outside firm.", "o": ["Time to market", "Outsourcing", "Reuse", "Nearshoring "], "a": 1, "e": "Outsourcing means turning over some or all IS functions to an outside firm.", "s": false, "n": 32}, {"t": "mcq", "q": "________ solutions integrate individual traditional business functions into a series of modules so that a single transaction occurs seamlessly within a single information system rather than several separate systems.", "o": ["Reuse", "ERP", "Request for proposal "], "a": 1, "e": "ERP integrates traditional business functions into modules sharing a common database.", "s": false, "n": 33}, {"t": "mcq", "q": "________ is designed to support organizational functions or processes.", "o": ["Systems analyst", "Information systems analysis and design", "Application software "], "a": 2, "e": "Application software supports organizational functions and processes.", "s": false, "n": 34}, {"t": "mcq", "q": "________ is the software reuse step that involves making software assets available for others to use.", "o": ["Storage", "Abstraction ", "Component-based development "], "a": 0, "e": "Storage is the reuse step of making software assets available for others to use.", "s": false, "n": 35}, {"t": "mcq", "q": "________ is/are off-the-shelf software systems that cannot be modified to meet the specific, individual needs of a particular organization.", "o": ["Reuse", "Turnkey systems", "Functionality "], "a": 1, "e": "Turnkey systems are off-the-shelf systems that cannot be modified for individual needs.", "s": false, "n": 36}, {"t": "mcq", "q": "________ is the software reuse step that involves making the reusable asset understandable to developers who want to use it in their systems.", "o": ["Storage", "Recontextualization", "Component reuse library", "Object class "], "a": 1, "e": "Recontextualization makes the reusable asset understandable to developers in a new context.", "s": false, "n": 37}, {"t": "mcq", "q": "Because computers were so expensive, computer memory was also at a premium, so system developers conserved as much memory as possible for ________.", "o": ["Implementation", "Logical design", "Physical design", "Data storage "], "a": 3, "e": "Early computers made memory expensive, so developers focused on saving data storage.", "s": false, "n": 38}, {"t": "mcq", "q": "Which of the following is a drawback of the traditional waterfall SDLC approach?", "o": ["Users are locked into requirements", "Physical design "], "a": 0, "e": "Waterfall locks users into the requirements early, making changes hard.", "s": false, "n": 39}, {"t": "mcq", "q": "________ refers to the use of previously written software resources, especially objects and components, in new applications.", "o": ["Functionality", "Reuse "], "a": 1, "e": "Reuse is using previously written software resources, objects and components.", "s": false, "n": 40}, {"t": "mcq", "q": "Which of the following is a reason why an organization might get rid of its entire information processing unit?", "o": ["Because of political reasons", "To hire better IT staff", "Because management does not like the IT department", "Because the old system does not work anymore "], "a": 0, "e": "The textbook says an organization may outsource and dissolve its entire information processing unit for political reasons (e.g. to overcome operating problems in the IS unit). The earlier answer key (D) was wrong. Verified in the textbook (Valacich, Modern Systems Analysis and Design).", "s": false, "n": 41}, {"t": "mcq", "q": "Abstraction, storage, and recontextualization are three steps of ________.", "o": ["Cloud computing ", "In-house development", "Software reuse", "Packaged software "], "a": 2, "e": "Abstraction, storage and recontextualization are the steps of software reuse.", "s": false, "n": 42}, {"t": "mcq", "q": "Which of the following SDLC phases is the most expensive and time-consuming?", "o": ["Implementation", "Planning", "Design", "Analysis "], "a": 0, "e": "Implementation is usually the most expensive and time-consuming phase.", "s": false, "n": 43}, {"t": "mcq", "q": "Documentation is the deliverable from the ________ phase.", "o": ["Planning", "Analysis", "Design", "Implementation "], "a": 3, "e": "Documentation is a deliverable of implementation (along with coded, tested software).", "s": false, "n": 44}, {"t": "mcq", "q": "________ is a cloud computing model in which a service provider offers an application via a cloud infrastructure.", "o": ["Software as a service (SaaS)", "Platform as a service (PaaS)", "Infrastructure as a service (IaaS)", "Work as a service (WaaS) "], "a": 0, "e": "SaaS offers an application through the cloud so customers need not install or maintain it.", "s": false, "n": 45}, {"t": "mcq", "q": "The requirements structuring is part of which phase?", "o": ["Implementation", "Analysis", "Planning", "Design "], "a": 1, "e": "Requirements structuring is part of analysis.", "s": false, "n": 46}, {"t": "mcq", "q": "________ is a software implementation activity where the physical design specifications created by the analysis team are turned into working computer code by the programming team.", "o": ["Installation", "Training", "Coding "], "a": 2, "e": "Coding turns the physical design specifications into working computer code.", "s": false, "n": 47}, {"t": "open", "q": "What are the 5 phases of the SDLC?", "a": "Planning, Analysis, Design, Implementation, and Maintenance.", "s": false, "n": 48}, {"t": "open", "q": "What is the SDLC?", "a": "The traditional methodology used to develop, maintain, and replace information systems (systems development life cycle).", "s": false, "n": 49}, {"t": "open", "q": "What is a systems development methodology?", "a": "A standard process followed in an organization to conduct all the steps necessary to analyze, design, implement, and maintain information systems.", "s": false, "n": 50}, {"t": "open", "q": "Describe the Planning phase of the SDLC.", "a": "The first phase of the SDLC, in which an organization's total information system needs are identified, analyzed, prioritized, and arranged.", "s": false, "n": 51}, {"t": "open", "q": "Describe the Analysis phase of the SDLC.", "a": "The second phase of the SDLC, in which system requirements are studied and structured.", "s": false, "n": 52}, {"t": "open", "q": "Describe the Design phase of the SDLC.", "a": "The third phase of the SDLC, in which the description of the recommended solution is converted into logical and then physical system specifications.", "s": false, "n": 53}, {"t": "open", "q": "Describe the Implementation phase of the SDLC.", "a": "The fourth phase of the SDLC, in which the information system is coded, tested, installed, and supported in the organization.", "s": false, "n": 54}, {"t": "open", "q": "Describe the Maintenance phase of the SDLC.", "a": "The final phase of the SDLC, in which an information system is systematically repaired and improved.", "s": false, "n": 55}, {"t": "open", "q": "What is the logical design?", "a": "The part of the design phase in which all functional features of the system chosen for development in analysis are described independently of any computer platform.", "s": false, "n": 56}, {"t": "open", "q": "What is the physical design?", "a": "The part of the design phase in which the logical specifications of the system are transformed into technology-specific details from which all programming and system construction can be accomplished.", "s": false, "n": 57}, {"t": "open", "q": "What is the difference between logical and physical design?", "a": "Logical design describes the functional features of the system independently of any computer platform. Physical design transforms those logical specifications into technology-specific details (programming language, database system, hardware platform) from which programming and system construction can be done.", "s": false, "n": 58}, {"t": "open", "q": "Define information systems analysis and design.", "a": "The complex organizational process whereby computer-based information systems are developed and maintained.", "s": false, "n": 59}, {"t": "open", "q": "Define application software.", "a": "Computer software designed to support organizational functions or processes. It is an important (but not the only) result of systems analysis and design.", "s": false, "n": 60}, {"t": "open", "q": "Who can be designated as a systems analyst? What is the role of a systems analyst?", "a": "The systems analyst is the organizational role most responsible for the analysis and design of information systems. The primary role is to study the problems and needs of an organization in order to determine how people, methods, and information technology can best be combined to bring about improvements in the organization.", "s": false, "n": 61}, {"t": "open", "q": "What is a deliverable?", "a": "An end product of an SDLC phase.", "s": false, "n": 62}, {"t": "open", "q": "Name some of the criticisms of the traditional waterfall SDLC.", "a": "The focus on milestone deadlines, instead of on obtaining and interpreting feedback from the development process, leads to too little focus on good analysis and design. The focus on deadlines results in systems that do not match users' needs and that require extensive maintenance, unnecessarily increasing development costs. Finding and fixing a problem after delivery is often 100 times more expensive than fixing it during analysis and design.", "s": false, "n": 63}, {"t": "open", "q": "What are some of the problems with the traditional waterfall SDLC?", "a": "Once a milestone has been reached and the new phase started, it becomes difficult to go back. The enormous effort and time needed to implement a design means changes are very expensive once the system is developed.", "s": false, "n": 64}, {"t": "open", "q": "What are examples of agile methodologies?", "a": "eXtreme Programming and Scrum.", "s": false, "n": 65}, {"t": "open", "q": "What are the principles of agile methodologies?", "a": "(1) A focus on adaptive rather than predictive methodologies. (2) A focus on people rather than roles. (3) A focus on self-adaptive processes.", "s": false, "n": 66}, {"t": "open", "q": "When is it a good time to use agile methods?", "a": "If a project is high risk, highly complex, and has a development team of hundreds of people, more traditional methods apply. Less risky, smaller, and simpler development efforts lend themselves more to agile methods.", "s": false, "n": 67}, {"t": "open", "q": "What is eXtreme Programming?", "a": "An approach to software development put together by Beck and Andres, with short incremental development cycles, automated tests, two-person programming teams, and coding and testing operating together. All phases converge into coding, testing, listening, and designing.", "s": false, "n": 68}, {"t": "open", "q": "What is Scrum?", "a": "The most common framework for agile development. Work is broken down into sprints (typically two weeks to a month), with daily meetings. A Scrum team has three roles: product owner, development team, and Scrum master.", "s": false, "n": 69}, {"t": "open", "q": "What is the Rational Unified Process (RUP)?", "a": "An object-oriented systems development methodology. RUP establishes four phases of development: inception, elaboration, construction, and transition. Each phase is organized into a number of separate iterations.", "s": false, "n": 70}, {"t": "open", "q": "What is object-oriented analysis and design (OOAD)?", "a": "Systems development methodologies and techniques based on objects rather than data or processes.", "s": false, "n": 71}, {"t": "open", "q": "Define object, object class, and inheritance.", "a": "Object: a structure that encapsulates (packages) attributes and methods that operate on those attributes. Object class: a logical grouping of objects that have the same or similar attributes and behaviors. Inheritance: the property that occurs when object classes are arranged in a hierarchy and each class assumes the attributes and methods of its ancestors.", "s": false, "n": 72}, {"t": "open", "q": "What is the purpose of using CASE tools?", "a": "CASE (computer-aided software engineering) tools are software tools that provide automated support for some portion of the systems development process. They make developers' work easier and more consistent.", "s": false, "n": 73}, {"t": "open", "q": "What are code generators used for in CASE tools?", "a": "They enable automatic generation of program and database definition code directly from the design documents, diagrams, forms, and reports.", "s": false, "n": 74}, {"t": "open", "q": "What are computer display and report generators?", "a": "CASE tools that help prototype how systems look and feel. They make it easier for the analyst to identify data requirements and relationships.", "s": false, "n": 75}, {"t": "open", "q": "What are diagramming tools?", "a": "Tools that enable system process, data, and control structures to be represented graphically.", "s": false, "n": 76}, {"t": "open", "q": "What are documentation generators for?", "a": "They help produce technical and user documentation in standard formats.", "s": false, "n": 77}, {"t": "open", "q": "What do analysis tools do?", "a": "They automatically check for incomplete, inconsistent, or incorrect specifications in diagrams, forms, and reports.", "s": false, "n": 78}, {"t": "open", "q": "What is a central repository for?", "a": "It enables the integrated storage of specifications, diagrams, reports, and project management information. Part C", "s": false, "n": 79}, {"t": "open", "q": "What are the six sources of software?", "a": "IT services firms, packaged software producers, enterprise-wide solution (ERP) vendors, cloud computing, open-source software, and in-house development.", "s": false, "n": 80}, {"t": "open", "q": "In which scenario do you prefer in-house development and open-source software, respectively?", "a": "Open-source software: when the supported task is generic but cost is an issue. In- house developers: when resources and staff are available and the system must be built from scratch.", "s": false, "n": 81}, {"t": "open", "q": "What is outsourcing?", "a": "The practice of turning over responsibility for some or all of an organization's information systems applications and operations to an outside firm.", "s": false, "n": 82}, {"t": "open", "q": "Why choose outsourcing?", "a": "Freeing up internal resources, increasing the revenue potential of the organization, reducing time to market, increasing process efficiencies, and outsourcing noncore activities.", "s": false, "n": 83}, {"t": "open", "q": "What is a turnkey system?", "a": "An off-the-shelf software system that cannot be modified to meet the specific, individual needs of a particular organization.", "s": false, "n": 84}, {"t": "open", "q": "What is a request for proposal (RFP)?", "a": "A document provided to vendors that asks them to propose hardware and system software that will meet the requirements of a new system.", "s": false, "n": 85}, {"t": "open", "q": "What is cloud computing and why do we need it?", "a": "The provision of applications or related services over the Internet, where customers do not have to invest in the hardware and software resources needed to run and maintain them. It covers SaaS, PaaS, and IaaS.", "s": false, "n": 86}, {"t": "open", "q": "What is an ERP system?", "a": "A system that integrates individual traditional business functions into a series of modules so that a single transaction occurs seamlessly within a single information system rather than several separate systems.", "s": false, "n": 87}, {"t": "open", "q": "What is the idea behind Service Oriented Architecture (SOA)?", "a": "An approach to systems development based on building complete systems by assembling software components, each of which models a generic business function.", "s": false, "n": 88}, {"t": "open", "q": "How do you choose off-the-shelf software (what criteria are used)?", "a": "Cost, functionality, vendor support, viability of vendor, flexibility, documentation, response time, and ease of installation.", "s": false, "n": 89}, {"t": "open", "q": "How do you determine cost for off-the-shelf software?", "a": "Compare the cost of developing the same system in-house with the cost of purchasing or licensing the software package.", "s": false, "n": 90}, {"t": "open", "q": "How do you define functionality?", "a": "The tasks the software can perform and the mandatory, essential, and desired features.", "s": false, "n": 91}, {"t": "open", "q": "How do you define vendor support?", "a": "Whether and how much support the vendor can provide: help installing the software, training user and systems staff, and helping with problems after installation.", "s": false, "n": 92}, {"t": "open", "q": "What is vendor viability?", "a": "You do not want to get stuck with software from a vendor that might go out of business soon.", "s": false, "n": 93}, {"t": "open", "q": "What is flexibility?", "a": "How easy it is for you or the vendor to customize the software.", "s": false, "n": 94}, {"t": "open", "q": "What does documentation refer to for off-the-shelf software?", "a": "The user's manual and technical documentation: how understandable and up to date it is, and the cost of multiple copies.", "s": false, "n": 95}, {"t": "open", "q": "How do you define response time?", "a": "How long the software package takes to respond to a user's request in an interactive session, or how long it takes to complete running a job.", "s": false, "n": 96}, {"t": "open", "q": "What is ease of installation?", "a": "A measure of the difficulty of loading the software and making it operational.", "s": false, "n": 97}, {"t": "open", "q": "What is reuse?", "a": "The use of previously written software resources, especially objects and components, in new applications.", "s": false, "n": 98}, {"t": "open", "q": "What is the purpose of reusing software?", "a": "It increases programmer productivity (more work in the same time), decreases development time and schedule overruns because existing software is already tested, and results in higher-quality software with lower defect rates, decreasing maintenance costs.", "s": false, "n": 99}, {"t": "open", "q": "What are the three steps of software reuse?", "a": "Abstraction (design of a reusable piece of software), storage (making assets available and properly cataloged for others), and recontextualization (making the asset understandable to developers who want to use it).", "s": false, "n": 100}, {"t": "open", "q": "What are the four approaches to reuse? The source file listed these as multiple-choice questions but printed only the correct answer, so they are written here as open questions.", "a": "Ad hoc, facilitated, managed, and designed. Part D", "s": false, "n": 101}, {"t": "open", "q": "What is delivered after the completion of the implementation phase?", "a": "Code, documentation, training procedures, and support capabilities.", "s": false, "n": 102}, {"t": "open", "q": "Which element is NOT a part of the Evolutionary model of the SDLC process?", "a": "Procedure.", "s": false, "n": 103}, {"t": "open", "q": "What is one of the three key principles shared by the Agile methodologies?", "a": "A focus on self-adaptive processes (the three principles are: adaptive rather than predictive methodologies, people rather than roles, and self-adaptive processes).", "s": false, "n": 104}, {"t": "open", "q": "In the agile-vs-traditional comparison, what does the critical factor \"Dynamism\" refer to?", "a": "Simple design and continuous refactoring are excellent for highly dynamic environments but a source of potentially expensive rework for highly stable environments.", "s": false, "n": 105}, {"t": "open", "q": "In the agile-vs-traditional comparison, what is the critical factor \"Personnel\" related to?", "a": "It requires the continuous presence of a critical mass of scarce experts.", "s": false, "n": 106}, {"t": "mcq", "q": "Under eXtreme Programming, ________ and ________ are intimately related parts of the same process.", "o": ["Design; coding", "Coding; testing", "Planning; testing", "Analysis; design "], "a": 1, "e": "In XP coding and testing are intimately related; tests are written along with the code.", "s": false, "n": 107}, {"t": "open", "q": "Which is the fourth phase in an SDLC cycle?", "a": "Implementation.", "s": false, "n": 108}, {"t": "open", "q": "What is delivered after the completion of the analysis phase?", "a": "A description of the current system and where problems and opportunities are, with a general recommendation on how to fix, enhance, or replace the current system.", "s": false, "n": 109}, {"t": "open", "q": "How does an organization rank criteria for choosing off-the-shelf software?", "a": "Their importance depends on the organization's requirements.", "s": false, "n": 110}, {"t": "open", "q": "What is the practice of US firms contracting with countries in Latin America called?", "a": "Nearshoring.", "s": false, "n": 111}, {"t": "open", "q": "What is the primary concern of IT managers as it relates to cloud computing?", "a": "Security.", "s": false, "n": 112}, {"t": "open", "q": "When considering off-the-shelf software, which choice is one of the most important criteria?", "a": "Vendor support.", "s": false, "n": 113}, {"t": "open", "q": "When resources and staff are available and the system must be built from scratch, which source should a company consider?", "a": "In-house developers.", "s": false, "n": 114}, {"t": "open", "q": "What is a function of an IT service firm?", "a": "Run applications for customers.", "s": false, "n": 115}, {"t": "open", "q": "What do you call an organization that hosts and runs computer applications for other companies, typically on a per-use or license basis?", "a": "A cloud computing application provider.", "s": false, "n": 116}, {"t": "open", "q": "Which step is NOT part of securing applications that an organization is migrating to the cloud?", "a": "Conducting a security background check of the cloud computing organization.", "s": false, "n": 117}, {"t": "open", "q": "Which issue should be addressed when considering reuse?", "a": "The analyst's ability in using objects.", "s": false, "n": 118}, {"t": "open", "q": "Which software evaluation criterion refers to the ease with which you or the vendor can customize the software?", "a": "Flexibility.", "s": false, "n": 119}, {"t": "open", "q": "Which solution enables a firm to integrate all parts of a business process into a unified information system?", "a": "Enterprise software solutions (ERP).", "s": false, "n": 120}, {"t": "open", "q": "Why is open-source software different from the other types of software?", "a": "The source code is free. Answer key – Part E (added from the main file) 122–131: 122-A · 123-D · 124-B · 125-D · 126-A · 127-B · 128-A · 129-A · 130-A · 131-B 132–141: 132-B · 133-B · 134-C · 135-A · 136-C · 137-B (False) · 138-A (True) · 139-A · 140-B · 141-B 142–151: 142-A · 143-C · 144-A · 145-B · 146-A · 147-B · 148-A · 149-A · 150-A · 151-B Questions 124 and 125 test the same idea (the SDLC is a structured approach to building information systems) in different words; both appeared in the final exam.", "s": false, "n": 121}, {"t": "mcq", "q": "________ were developed to make systems developers' work easier and more consistent.", "o": ["Computer-aided software engineering (CASE) tools", "Turnkey systems", "Request for proposal", "Application software "], "a": 0, "e": "CASE tools were developed to make developers' work easier and more consistent.", "s": false, "n": 122}, {"t": "mcq", "q": "In which phase of the SDLC is the information system coded, tested, installed, and supported in the organization?", "o": ["Planning", "Analysis", "Design", "Implementation "], "a": 3, "e": "Implementation is where the system is coded, tested, installed and supported.", "s": false, "n": 123}, {"t": "mcq", "q": "The SDLC provides a framework for:", "o": ["Marketing software products", "Structuring the development of information systems", "Training end users", "Repairing hardware "], "a": 1, "e": "The SDLC is a framework for structuring the development of information systems.", "s": false, "n": 124}, {"t": "mcq", "q": "Which of the following best describes the purpose of the SDLC?", "o": ["To replace programmers", "To reduce hardware costs", "To eliminate the need for maintenance", "To offer a structured approach for building information systems "], "a": 3, "e": "The SDLC offers a structured approach for building information systems.", "s": false, "n": 125}, {"t": "mcq", "q": "Why is the implementation phase considered expensive?", "o": ["Due to the many people involved in the process", "Because requirements are costly to collect", "Because planning takes a long time ", "Because hardware is rare "], "a": 0, "e": "Implementation is expensive because many people are involved for a long time.", "s": false, "n": 126}, {"t": "mcq", "q": "Which of the following best describes Extreme Programming?", "o": ["A sequential method with long, separate phases", "An agile method using short, incremental cycles, pair programming, and continuous testing", "A cloud service model", "A document-driven waterfall approach "], "a": 1, "e": "XP is an agile method with short incremental cycles, pair programming and testing.", "s": false, "n": 127}, {"t": "mcq", "q": "________ is a model that enables users to access applications and services over the Internet without needing to invest in the underlying hardware and software infrastructure.", "o": ["Cloud computing", "Local hosting", "On-premises solutions", "Virtual private network "], "a": 0, "e": "Cloud computing lets users use applications and services over the Internet without owning the infrastructure.", "s": false, "n": 128}, {"t": "mcq", "q": "What is the main focus of systems analysis and design?", "o": ["Developing computer-based information systems", "Marketing software products", "Training IT personnel", "Enhancing the physical components of computers "], "a": 0, "e": "Systems analysis and design focuses on developing computer-based information systems.", "s": false, "n": 129}, {"t": "mcq", "q": "Systems analysis and design is concerned with:", "o": ["Developing and maintaining information systems", "Selling software", "Network security only", "Hardware repair "], "a": 0, "e": "It is about developing and maintaining information systems.", "s": false, "n": 130}, {"t": "mcq", "q": "Which approach focuses on systems development methodologies based on objects rather than data or processes?", "o": ["Traditional Waterfall Method", "Object-Oriented Analysis and Design", "Prototyping", "Structured Analysis "], "a": 1, "e": "Object-oriented analysis and design builds methodologies around objects rather than data or processes.", "s": false, "n": 131}, {"t": "mcq", "q": "The implementation phase includes:", "o": ["Budget planning", "Coding and testing ", "Requirement gathering", "Feasibility study "], "a": 1, "e": "Implementation includes coding and testing (plus installation).", "s": false, "n": 132}, {"t": "mcq", "q": "The maintenance phase includes:", "o": ["Project approval", "Correcting errors and updating the system", "Writing the feasibility report", "Designing hardware "], "a": 1, "e": "Maintenance includes correcting errors and updating the system.", "s": false, "n": 133}, {"t": "mcq", "q": "Which of the following is NOT an activity of software implementation?", "o": ["Coding", "Testing", "Requirements gathering", "Installation "], "a": 2, "e": "Requirements gathering belongs to analysis, not implementation.", "s": false, "n": 134}, {"t": "mcq", "q": "Outsourcing refers to:", "o": ["Hiring an external firm to manage the system", "Cloud storage", "Using open-source software", "Internal development "], "a": 0, "e": "Outsourcing means hiring an external firm to manage the system or function.", "s": false, "n": 135}, {"t": "mcq", "q": "Open-source software is characterized by:", "o": ["Paid license only", "Hidden code", "Freely available source code", "No updates allowed "], "a": 2, "e": "Open-source software has freely available source code.", "s": false, "n": 136}, {"t": "mcq", "q": "Packaged software is selected when the organization has experts in software development.", "o": ["True", "False "], "a": 1, "e": "False: packaged software is chosen when the organization lacks development expertise or wants a quick, cheaper solution.", "s": false, "n": 137}, {"t": "mcq", "q": "The systems development life cycle (SDLC) is the common methodology used to develop, maintain, and replace information systems.", "o": ["True", "False "], "a": 0, "e": "True: the SDLC is the common methodology to develop, maintain and replace information systems.", "s": false, "n": 138}, {"t": "mcq", "q": "A family of development methodologies characterized by short iterative cycles, extensive testing, active user involvement, and small teams of talented, experienced programmers is called ________.", "o": ["Agile methodologies", "Rational Unified Process", "Traditional waterfall", "Prototyping "], "a": 0, "e": "Agile methodologies stress short iterative cycles, extensive testing and active user involvement.", "s": false, "n": 139}, {"t": "mcq", "q": "The property that occurs when object classes are arranged in a hierarchy and each class assumes the attributes and methods of its ancestors is ________.", "o": ["Encapsulation", "Inheritance", "Abstraction", "Normalization "], "a": 1, "e": "Inheritance: a subclass takes on the attributes and methods of its parent class.", "s": false, "n": 140}, {"t": "mcq", "q": "A structure that encapsulates (packages) attributes and methods that operate on those attributes is called a(n) ________.", "o": ["Object class", "Object", "Component", "Entity "], "a": 1, "e": "An object encapsulates attributes and the methods that operate on them.", "s": false, "n": 141}, {"t": "mcq", "q": "A logical grouping of objects that have the same or similar attributes and behaviors is called a(n) ________.", "o": ["Object class", "Object", "Inheritance", "Method "], "a": 0, "e": "An object class groups objects with similar attributes and behaviors.", "s": false, "n": 142}, {"t": "mcq", "q": "The object-oriented systems development methodology that establishes four phases (inception, elaboration, construction, and transition) is ________.", "o": ["Scrum", "eXtreme Programming", "Rational Unified Process (RUP)", "Traditional waterfall "], "a": 2, "e": "RUP has four phases: inception, elaboration, construction and transition.", "s": false, "n": 143}, {"t": "mcq", "q": "The most common framework for agile development, in which work is broken down into sprints with daily meetings, is ________.", "o": ["Scrum", "eXtreme Programming", "Rational Unified Process ", "Prototyping "], "a": 0, "e": "Scrum breaks work into sprints with daily scrum meetings.", "s": false, "n": 144}, {"t": "mcq", "q": "A standard process followed in an organization to conduct all the steps necessary to analyze, design, implement, and maintain information systems is a ________.", "o": ["System development life cycle", "Systems development methodology", "CASE tool", "Request for proposal "], "a": 1, "e": "A systems development methodology is a standard process used to carry out all development steps.", "s": false, "n": 145}, {"t": "mcq", "q": "Software that is freely available, including its source code, and is developed by a community of interested people is called ________.", "o": ["Open-source software", "Turnkey systems", "Packaged software", "ERP "], "a": 0, "e": "Open-source software is freely available with its code and built by a community.", "s": false, "n": 146}, {"t": "mcq", "q": "If sufficient expertise exists, some or all of the system can be developed by the organization's own staff. This is ________.", "o": ["Outsourcing", "In-house development", "Cloud computing", "Reuse "], "a": 1, "e": "If sufficient expertise exists, the organization develops the system in-house.", "s": false, "n": 147}, {"t": "mcq", "q": "Components that can be single objects or functional groupings of objects are the basis of ________.", "o": ["Component-based development", "Object-oriented development", "Software reuse", "Open-source software "], "a": 0, "e": "Component-based development builds systems from reusable components (single objects or groups).", "s": false, "n": 148}, {"t": "mcq", "q": "Which SDLC approach has each phase begin when the previous one completes, with little backtracking and looping?", "o": ["Traditional waterfall SDLC", "eXtreme Programming", "Scrum", "Rational Unified Process "], "a": 0, "e": "Waterfall has each phase begin when the previous one completes, with little backtracking.", "s": false, "n": 149}, {"t": "mcq", "q": "The provision of applications or related services over the Internet, where customers do not have to invest in the hardware and software needed to run and maintain them, is ________.", "o": ["Cloud computing", "Outsourcing", "Turnkey systems", "ERP "], "a": 0, "e": "Cloud computing delivers applications or services over the Internet without customer ownership.", "s": false, "n": 150}, {"t": "mcq", "q": "The complex organizational process whereby computer-based information systems are developed and maintained is ________.", "o": ["System development life cycle", "Information systems analysis and design", "Systems development methodology", "CASE "], "a": 1, "e": "Information systems analysis and design is the organizational process for developing and maintaining IS.", "s": false, "n": 151}], "2": [{"t": "mcq", "q": "The amount of time that an activity can be delayed without delaying the project is known as ________.", "o": ["Slack time", "Critical path", "Estimated time", "Expected time "], "a": 0, "e": "Slack time is how long an activity can be delayed without delaying the whole project.", "s": false, "n": 1}, {"t": "mcq", "q": "________ is an important aspect of development. Its focus is to ensure that systems development projects meet customer expectations and are delivered within budget and time constraints.", "o": ["Project analyst", "Feasibility study", "Project charter", "Project management "], "a": 3, "e": "Project management ensures projects are completed on time, within budget and to the required quality.", "s": false, "n": 2}, {"t": "mcq", "q": "________ is a standard form for requesting or proposing systems development work within an organization.", "o": ["System Service Request", "System Request Development", "Date Development Document", "Standard System Document "], "a": 0, "e": "A System Service Request (SSR) is the standard form for requesting or proposing development work.", "s": false, "n": 3}, {"t": "mcq", "q": "To calculate the expected time for the completion of a task, you can use PERT: ET = (o + 4r + p) / 6. If o = 2 and r = 5, p can be ________.", "o": ["7", "5", "3", "1 "], "a": 0, "e": "p must be at least as large as r (pessimistic ≥ realistic), so only 7 fits among the options (ET = (2+20+7)/6).", "s": false, "n": 4}, {"t": "mcq", "q": "The network diagram shows estimated times to complete each activity (Task A = 3 days, Task D = 3 days, Task E = 3 days on the top path; Task B = 2 days, Task C = 4 days on the bottom path; critical path = 9 days). Activities A, D and E are on the critical path. What is the slack time in activity D if activity A is completed in three days?", "o": ["9 days", "6 days", "Zero", "3 days "], "a": 2, "e": "Activities on the critical path have zero slack: any delay delays the whole project.", "s": false, "n": 5}, {"t": "mcq", "q": "Unlike Gantt charts, network diagrams ________.", "o": ["help calculate the economic feasibility", "do NOT show which tasks could be done in parallel", "show the sequence dependencies between tasks", "visually show the time overlap of tasks "], "a": 2, "e": "Network diagrams show sequence dependencies between tasks; Gantt charts show durations and time overlap.", "s": false, "n": 6}, {"t": "mcq", "q": "The first project planning activity is ________.", "o": ["Creation of the Gantt chart and network diagram", "Developing the project charter", "Describing project scope, alternatives, and feasibility", "Establishing the project management environment and project workbook "], "a": 2, "e": "Planning starts by describing the project scope, alternatives and feasibility.", "s": false, "n": 7}, {"t": "mcq", "q": "Which one of the following represents one of the project execution activities?", "o": ["Developing the project charter", "Monitoring project progress against the Baseline Project Plan", "Estimating resources and creating a resource plan", "Conducting post-project reviews "], "a": 1, "e": "Execution includes monitoring progress against the baseline project plan.", "s": false, "n": 8}, {"t": "mcq", "q": "________ is a planned undertaking of related activities to reach an objective that has a beginning and an end.", "o": ["Project", "Conflict management", "Project management", "Project manager "], "a": 0, "e": "A project is a planned set of related activities with a beginning and an end that reaches an objective.", "s": false, "n": 9}, {"t": "mcq", "q": "________ is a graphical representation of a project that shows each task as a horizontal bar.", "o": ["PERT", "Gantt chart ", "Network diagram", "Work breakdown structure "], "a": 1, "e": "A Gantt chart shows each task as a horizontal bar whose length is its duration.", "s": false, "n": 10}, {"t": "m
